unting helps as well, though it stops describing reality in some cases, such as a shrinking business.","co":[]},"t1n9":{"id":"t1n9","theme":"t1","tags":"UCSB 2003","units":["ucsb2003"],"lead":"Don't worship what can be counted.","text":"Almost everyone overweighs what can be numbered and neglects what cannot.","co":[]},"t1n10":{"id":"t1n10","theme":"t1","tags":"UCSB 2003","units":["ucsb2003"],"lead":"Physics envy.","text":"Hoping that economics will behave with the precision of physics gets clever people into terrible trouble.","co":[]},"t1n11":{"id":"t1n11","theme":"t1","tags":"UCSB 2003","units":["ucsb2003"],"lead":"And then what?","text":"Economics pays too little attention to second- and higher-order effects. Follow consequences further than the first step.","co":[]},"t2n1":{"id":"t2n1","theme":"t2","tags":"HS 1986","units":["hs1986"],"lead":"A graduation speech about misery.","text":"Asked to advise school leavers, he listed sure routes to a miserable life, adding his own to three that Johnny Carson had given years before. Avoiding them is most of the work.","co":[]},"t2n2":{"id":"t2n2","theme":"t2","tags":"HS 1986","units":["hs1986"],"lead":"The rustic's question.","text":"A countryman wished he knew where he was going to die, so he would never go there. Munger treats the joke as a serious method.","co":[]},"t2n3":{"id":"t2n3","theme":"t2","tags":"HS 1986","units":["hs1986"],"lead":"Jacobi's rule.","text":"The mathematician Carl Jacobi advised turning problems around. Munger points to Darwin and Einstein, who made breakthroughs by thinking in reverse.","co":[]},"t2n4":{"id":"t2n4","theme":"t2","tags":"Stanford 1996","units":["stanford1996"],"lead":"Forward and backward.","text":"Get the needed models into your head, then think each problem through both forward and backward.","co":[]},"t2n5":{"id":"t2n5","theme":"t2","tags":"Practical 1996","units":["practical1996"],"lead":"Decide the no-brainers first.","text":"Settle the big, obvious questions first. With those fixed, the rest of a problem often becomes simple.","co":[]},"t2n6":{"id":"t2n6","theme":"t2","tags":"Practical 1996","units":["practical1996"],"lead":"Think in reverse.","text":"When you cannot see how to reach a goal, ask what would make it impossible, and remove that.","co":[]},"t2n7":{"id":"t2n7","theme":"t2","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Twenty-one years later.","text":"He told law graduates the same thing: turn a problem around and you often think better.","co":[]},"t2n8":{"id":"t2n8","theme":"t2","tags":"Almanack","units":["almanack"],"lead":"What to avoid comes first.","text":"He usually decided what not to do before choosing what to do. Avoiding large errors beats occasional flashes of brilliance.","co":[]},"t2n9":{"id":"t2n9","theme":"t2","tags":"Almanack","units":["almanack"],"lead":"Three baskets.","text":"For investments he kept three baskets: yes, no, and too tough to understand. The third basket is large, and he felt no duty to empty it.","co":[]},"t3n1":{"id":"t3n1","theme":"t3","tags":"PHM 2005","units":["phm2005"],"lead":"The first tendency.","text":"People respond to rewards and punishments far more strongly than they expect, and their beliefs drift to fit what pays.","co":[]},"t3n2":{"id":"t3n2","theme":"t3","tags":"PHM 2005","units":["phm2005"],"lead":"Incentive-caused bias.","text":"Decent people reach conclusions that serve their own income, often without knowing it. Take special care with advice from anyone paid by the action they recommend.","co":[]},"t3n3":{"id":"t3n3","theme":"t3","tags":"PHM 2005","units":["phm2005"],"lead":"Pay for the result.","text":"His example: a delivery company's night shift ran slow until workers were paid per shift and could go home once all the planes were loaded. Pay for time and you get time.","co":[]},"t3n4":{"id":"t3n4","theme":"t3","tags":"PHM 2005","units":["phm2005"],"lead":"Controls are a kindness.","text":"He called the cash register a great moral instrument. Systems that make cheating hard keep honest people honest.","co":[]},"t3n5":{"id":"t3n5","theme":"t3","tags":"Stanford 1996","units":["stanford1996"],"lead":"Stop slop early.","text":"Small dishonesty that is tolerated spreads, and becomes very hard to reverse. Stop it at the start.","co":[]},"t3n6":{"id":"t3n6","theme":"t3","tags":"PHM 2005","units":["phm2005"],"lead":"Granny's rule.","text":"Make the pleasant thing the reward for doing the unpleasant thing first.","co":[]},"t3n7":{"id":"t3n7","theme":"t3","tags":"Foundations 1998","units":["foundations1998"],"lead":"Keep advisers working for you.","text":"Whoever pays the fees must control the advisers. Layers of consultants bring perverse incentives.","co":[]},"t3n8":{"id":"t3n8","theme":"t3","tags":"PHM 2005","units":["phm2005"],"lead":"Reasons work.","text":"People comply more when given reasons, even weak ones. Give real reasons, and test the reasons you are given.","co":[]},"t3n9":{"id":"t3n9","theme":"t3","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Choose your system.","text":"Avoid perverse incentive systems, and avoid working directly under someone you do not admire and do not want to be like.","co":[]},"t3n10":{"id":"t3n10","theme":"t3","tags":"Scandal 2000","units":["scandal2000"],"lead":"Systems before villains.","text":"He traced much corporate misconduct to standard incentive systems working on people below conscious awareness. Wrongdoing that is rewarded dies hard.","co":[]},"t4n1":{"id":"t4n1","theme":"t4","tags":"PHM 2005","units":["phm2005"],"lead":"Three talks became one.","text":"Talks given in 1992, 1994 and 1995 became one. He rewrote it for the book in 2005, at 81, from memory and without fresh research.","co":[]},"t4n2":{"id":"t4n2","theme":"t4","tags":"PHM 2005","units":["phm2005"],"lead":"Use it as a checklist.","text":"He ran through his own list, tendency by tendency, to explain events that puzzled him. Do the same before an important decision.","co":[]},"t4n3":{"id":"t4n3","theme":"t4","tags":"PHM 2005","units":["phm2005"],"lead":"Lollapalooza.","text":"Extreme outcomes come from several tendencies pushing the same way. One of his examples is an airliner evacuation test, run in a darkened hangar with older volunteers, that ended in many injuries.","co":[]},"t4n4":{"id":"t4n4","theme":"t4","tags":"PHM 2005","units":["phm2005"],"lead":"Authority can be fatal.","text":"People defer to whoever is in charge, even when that person is plainly wrong. In one of his examples, that deference ended in a plane crash.","co":[]},"t4n5":{"id":"t4n5","theme":"t4","tags":"Stanford 1996","units":["stanford1996"],"lead":"Know it; don't abuse it.","text":"Not everything you know about psychology should be used to manipulate people. Anyone who sees through it will hate you for it.","co":[]},"t4n6":{"id":"t4n6","theme":"t4","tags":"Roundtable 2000","units":["roundtable2000"],"lead":"Crowd folly.","text":"Under some conditions people behave like lemmings. He said this explains much foolish thinking, in markets as elsewhere.","co":[]},"t4n7":{"id":"t4n7","theme":"t4","tags":"Roundtable 2000","units":["roundtable2000"],"lead":"Priced like paintings.","text":"He described shares being valued partly like Rembrandt paintings: bought mostly because their prices had already risen so far.","co":[]},"t5n1":{"id":"t5n1","theme":"t5","tags":"HS 1986","units":["hs1986"],"lead":"Three from Carson.","text":"He began with Johnny Carson's prescriptions for misery: mood-altering chemicals, envy and resentment.","co":[]},"t5n2":{"id":"t5n2","theme":"t5","tags":"HS 1986","units":["hs1986"],"lead":"Resentment costs the carrier.","text":"He cites Disraeli, who learned to give up revenge as a motive, though he kept an outlet for resentment. A grudge mostly harms the person who carries it.","co":[]},"t5n3":{"id":"t5n3","theme":"t5","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Four to refuse.","text":"Envy, resentment, revenge and self-pity: he named them together as disastrous ways of thinking.","co":[]},"t5n4":{"id":"t5n4","theme":"t5","tags":"PHM 2005","units":["phm2005"],"lead":"Envy is everywhere.","text":"He said envy and jealousy are extreme in modern life. Expect them in others, and watch for them in yourself.","co":[]},"t5n5":{"id":"t5n5","theme":"t5","tags":"PHM 2005","units":["phm2005"],"lead":"Defer the reaction.","text":"The standard cure for overactive hostility is to train yourself to delay your response.","co":[]},"t5n6":{"id":"t5n6","theme":"t5","tags":"PHM 2005","units":["phm2005"],"lead":"Denial.","text":"The mind bends facts that are too painful to accept. Notice when you are doing it.","co":[]},"t5n7":{"id":"t5n7","theme":"t5","tags":"PHM 2005","units":["phm2005"],"lead":"Light stress, heavy stress.","text":"Light stress can slightly improve performance; heavy stress causes dysfunction. Make big decisions when calm.","co":[]},"t5n8":{"id":"t5n8","theme":"t5","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Being right can cost you.","text":"You can cause great offence by being right in a way that makes someone lose face in front of others.","co":[]},"t5n9":{"id":"t5n9","theme":"t5","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Avoid intense ideology.","text":"He warned that extremely intense ideology clouds the mind.","co":[]},"t5n10":{"id":"t5n10","theme":"t5","tags":"Stanford 1996","units":["stanford1996"],"lead":"How to bear hard times.","text":"Have low expectations, keep a sense of humour, and surround yourself with the love of friends and family.","co":[]},"t6n1":{"id":"t6n1","theme":"t6","tags":"HS 1986","units":["hs1986"],"lead":"Be reliable.","text":"First on his own list of routes to misery was being unreliable: not faithfully doing what you have promised. He said it can outweigh all your other virtues combined.","co":[]},"t6n2":{"id":"t6n2","theme":"t6","tags":"HS 1986","units":["hs1986"],"lead":"Learnable by almost anyone.","text":"In a 2006 note he repeated that reliability is essential for progress in life, and that almost anyone can learn it to great advantage.","co":[]},"t6n3":{"id":"t6n3","theme":"t6","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Deserve what you want.","text":"The safest way to try to get what you want is to try to deserve it.","co":[]},"t6n4":{"id":"t6n4","theme":"t6","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Admiration-based love.","text":"He thought no love is so right as love grounded in admiration, and that it should extend to the instructive dead.","co":[]},"t6n5":{"id":"t6n5","theme":"t6","tags":"Stanford 1996","units":["stanford1996"],"lead":"Three rules for a career.","text":"Sell only what you would buy yourself. Work only for people you respect and admire. Work only with people you enjoy.","co":[]},"t6n6":{"id":"t6n6","theme":"t6","tags":"USC Law 2007","units":["usclaw2007"],"lead":"A seamless web of deserved trust.","text":"In your own life, what you want to maximise is trust that has been earned, all the way round.","co":[]},"t6n7":{"id":"t6n7","theme":"t6","tags":"Almanack","units":["almanack"],"lead":"Choose clients like friends.","text":"A rule from his years as a lawyer, and one that applies to partners, managers and investments too.","co":[]},"t6n8":{"id":"t6n8","theme":"t6","tags":"PHM 2005","units":["phm2005"],"lead":"Liking distorts.","text":"We overlook the faults of people and things we love. Love admirable people, and still check their work.","co":[]},"t6n9":{"id":"t6n9","theme":"t6","tags":"PHM 2005","units":["phm2005"],"lead":"Records over impressions.","text":"A face-to-face meeting carries too much weight. Underweigh the impression and overweigh the past record.","co":[]},"t6n10":{"id":"t6n10","theme":"t6","tags":"PHM 2005","units":["phm2005"],"lead":"Fairness matters.","text":"People react strongly when they are treated unfairly. Arrangements that feel unfair breed resentment that outlasts the gain.","co":[]},"t7n1":{"id":"t7n1","theme":"t7","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Learning machines.","text":"He kept seeing people rise who were not always the smartest, but who kept learning. They went to bed each night a little wiser than they were that morning.","co":[]},"t7n2":{"id":"t7n2","theme":"t7","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Wisdom is a moral duty.","text":"He held that acquiring wisdom is an obligation, not a hobby.","co":[]},"t7n3":{"id":"t7n3","theme":"t7","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Skills expire.","text":"Without lifetime learning you will not do well. Berkshire's skills from one decade would not have carried it through the next.","co":["Berkshire Hathaway"]},"t7n4":{"id":"t7n4","theme":"t7","tags":"HS 1986","units":["hs1986"],"lead":"Learn from other people's mistakes.","text":"Learning everything from your own experience was on his list of routes to misery. The errors of others are cheaper teachers.","co":[]},"t7n5":{"id":"t7n5","theme":"t7","tags":"USC Law 2007","units":["usclaw2007"],"lead":"The instructive dead.","text":"Admire and learn from the great minds of the past. He counted them among the right objects of love.","co":[]},"t7n6":{"id":"t7n6","theme":"t7","tags":"PHM 2005","units":["phm2005"],"lead":"Keep curiosity alive.","text":"Curiosity drives learning and protects against many other errors.","co":[]},"t7n7":{"id":"t7n7","theme":"t7","tags":"PHM 2005","units":["phm2005"],"lead":"Use it or lose it.","text":"Skills fade without practice. Skills practised to fluency last much longer.","co":[]},"t7n8":{"id":"t7n8","theme":"t7","tags":"PHM 2005","units":["phm2005"],"lead":"Learning gets harder with age.","text":"Ageing makes new, complex skills harder to acquire. Keep learning and practising, and learn the difficult things while you can.","co":[]},"t7n9":{"id":"t7n9","theme":"t7","tags":"PHM 2005","units":["phm2005"],"lead":"Hunt for disconfirming evidence.","text":"Darwin trained himself early to weigh seriously any evidence against his own hypotheses. Do the same with your beliefs.","co":[]},"t7n10":{"id":"t7n10","theme":"t7","tags":"HLS 1998","units":["hls1998"],"lead":"Maintain what you know.","text":"Pilots are made to practise in simulators so skills do not decay. Schedule your own refreshers.","co":[]},"t8n1":{"id":"t8n1","theme":"t8","tags":"USC 1994","units":["usc1994"],"lead":"Circle of competence.","text":"Everyone has a circle of competence. Play where you have an edge, and stay out of games where others clearly have it.","co":[]},"t8n2":{"id":"t8n2","theme":"t8","tags":"Stanford 1996","units":["stanford1996"],"lead":"Know what you don't know.","text":"Know what you know and what you do not. When you lack competence, say so.","co":[]},"t8n3":{"id":"t8n3","theme":"t8","tags":"Stanford 1996","units":["stanford1996"],"lead":"Use your advantages.","text":"Work out where your talents lie and use them. Berkshire avoided high technology partly because it had no edge there.","co":["Berkshire Hathaway"]},"t8n4":{"id":"t8n4","theme":"t8","tags":"Stanford 1996","units":["stanford1996"],"lead":"Change your mind.","text":"He said he and Buffett were very good at changing their prior conclusions.","co":[]},"t8n5":{"id":"t8n5","theme":"t8","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Earn the right to an opinion.","text":"He did not feel entitled to an opinion until he could state the arguments against it better than its supporters could.","co":[]},"t8n6":{"id":"t8n6","theme":"t8","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Self-serving bias.","text":"It is in everyone. Use routines and checklists to keep yourself objective.","co":[]},"t8n7":{"id":"t8n7","theme":"t8","tags":"Foundations 1998","units":["foundations1998"],"lead":"Don't fool yourself.","text":"He quoted Feynman: the first principle is not to fool yourself, and you are the easiest person to fool.","co":[]},"t8n8":{"id":"t8n8","theme":"t8","tags":"PHM 2005","units":["phm2005"],"lead":"Don't rush to decide.","text":"Uncertainty is uncomfortable, so the mind grabs an answer early. Slow down before a big decision.","co":[]},"t8n9":{"id":"t8n9","theme":"t8","tags":"PHM 2005","units":["phm2005"],"lead":"Overoptimism.","text":"People expect better outcomes than the odds support. The antidote is habitual use of simple probability.","co":[]},"t8n10":{"id":"t8n10","theme":"t8","tags":"PHM 2005","units":["phm2005"],"lead":"Vivid is not important.","text":"What comes to mind easily gets too much weight. Look for the evidence that is dull but large.","co":[]},"t8n11":{"id":"t8n11","theme":"t8","tags":"PHM 2005","units":["phm2005"],"lead":"Crowds and authority.","text":"People copy others and defer to authority, most of all when confused or rushed. Those are the moments to slow down.","co":[]},"t9n1":{"id":"t9n1","theme":"t9","tags":"USC 1994","units":["usc1994"],"lead":"The great businesses did it.","text":"He said the great bulk of their money came from the great businesses.","co":[]},"t9n2":{"id":"t9n2","theme":"t9","tags":"USC 1994","units":["usc1994"],"lead":"Bet heavily when the odds are clear.","text":"The wise ones bet heavily when the world offers them the opportunity. The rest of the time, they wait.","co":[]},"t9n3":{"id":"t9n3","theme":"t9","tags":"USC 1994","units":["usc1994"],"lead":"Twenty punches.","text":"Imagine a ticket with only 20 slots for every investment you will ever make. You would think hard and bet big on each one.","co":[]},"t9n4":{"id":"t9n4","theme":"t9","tags":"USC 1994","units":["usc1994"],"lead":"Quality compounds.","text":"Over long periods a share earns roughly what the business earns. A business earning 18% on capital for 20 or 30 years gives a fine result even bought at an expensive-looking price.","co":[]},"t9n5":{"id":"t9n5","theme":"t9","tags":"USC 1994","units":["usc1994"],"lead":"Taxes favour sitting.","text":"The way income tax works alone gives a large edge to holding for a long time.","co":[]},"t9n6":{"id":"t9n6","theme":"t9","tags":"USC 1994","units":["usc1994"],"lead":"The industry adds nothing, net.","text":"The investment management business as a whole adds no value for all its clients combined. A select few managers can.","co":[]},"t9n7":{"id":"t9n7","theme":"t9","tags":"Almanack","units":["almanack"],"lead":"Opportunity cost.","text":"Judge every use of money against the next-best use available.","co":[]},"t9n8":{"id":"t9n8","theme":"t9","tags":"Almanack","units":["almanack"],"lead":"Resist the urge to act.","text":"Patience means resisting the natural human bias to do something.","co":[]},"t9n9":{"id":"t9n9","theme":"t9","tags":"Foundations 1998","units":["foundations1998"],"lead":"Concentration can be rational.","text":"Someone with nearly all their wealth held long-term in three fine companies is securely rich. Heavy concentration can be a rational choice.","co":[]},"t9n10":{"id":"t9n10","theme":"t9","tags":"Wesco 1996","units":["wesco1996"],"lead":"Lumpy results are the price.","text":"In super-cat reinsurance, huge swings in annual results, including some very unpleasant years, are inevitable. Judge it over many years.","co":[]},"t9n11":{"id":"t9n11","theme":"t9","tags":"USC 1994","units":["usc1994"],"lead":"Need less.","text":"In a 2006 note he worried about institutions imitating Harvard and Yale's investing out of envy, and favoured reducing one's perceived needs over taking more risk.","co":["Harvard and Yale endowments"]},"t9n12":{"id":"t9n12","theme":"t9","tags":"BRK 2014","units":["brk2014"],"lead":"Omissions cost most.","text":"Among Berkshire's mistakes he named the failure to buy Walmart early.","co":["Walmart","Berkshire Hathaway"]},"t10n1":{"id":"t10n1","theme":"t10","tags":"USC 1994","units":["usc1994"],"lead":"Scale isn't enough.","text":"Sears's advantages of scale did not stop it losing heavily to Walmart. Bureaucracy did Sears terrible damage.","co":["Sears","Walmart"]},"t10n2":{"id":"t10n2","theme":"t10","tags":"USC 1994","units":["usc1994"],"lead":"Who keeps the gain?","text":"In a commodity business, the advantages of great improvements flow through to customers, not to owners.","co":[]},"t10n3":{"id":"t10n3","theme":"t10","tags":"USC 1994","units":["usc1994"],"lead":"Razor and blades.","text":"Gillette began selling blades in multiple packages, with the razor handle a one-time purchase. Repeat purchases built the business.","co":["Gillette"]},"t10n4":{"id":"t10n4","theme":"t10","tags":"USC 1994","units":["usc1994"],"lead":"A gem under the mess.","text":"GEICO had a magnificent business submerged in a mess, but still working. Clearing the mess released its value.","co":["GEICO"]},"t10n5":{"id":"t10n5","theme":"t10","tags":"Practical 1996","units":["practical1996"],"lead":"Coca-Cola from scratch.","text":"It is 1884 in Atlanta. You have $2 million and must build a business worth $2 trillion. How would you do it?","co":["Coca-Cola"]},"t10n6":{"id":"t10n6","theme":"t10","tags":"Practical 1996","units":["practical1996"],"lead":"Start from the arithmetic.","text":"He set the target first: 2.92 trillion eight-ounce servings in 2034. Netting 4¢ a serving would earn $117 billion. The numbers show what the business must become.","co":[]},"t10n7":{"id":"t10n7","theme":"t10","tags":"Practical 1996","units":["practical1996"],"lead":"Many factors at once.","text":"A strong trademark, Pavlovian conditioning, social proof and being always available, all working together.","co":[]},"t10n8":{"id":"t10n8","theme":"t10","tags":"Practical 1996","units":["practical1996"],"lead":"Owners can wreck a brand.","text":"With New Coke, the company's own executives came to the brink of destroying the most valuable trademark in the world.","co":["Coca-Cola"]},"t10n9":{"id":"t10n9","theme":"t10","tags":"Blue Chip 1982","units":["bluechip1982"],"lead":"Inflation sorts businesses.","text":"Some businesses produce little cash even when volume holds steady. Borrowing short and lending long, the savings and loan model, can stop working and go into reverse.","co":["Savings and loans"]},"t10n10":{"id":"t10n10","theme":"t10","tags":"Wesco 1985","units":["wesco1985"],"lead":"No jewel.","text":"He told owners plainly that his savings and loan, as it then had to be run, was no jewel. Careful operators in that business earned very modest returns.","co":["Savings and loans"]},"t10n11":{"id":"t10n11","theme":"t10","tags":"Wesco 1985","units":["wesco1985"],"lead":"Owners and managers.","text":"In that industry, managers were mostly not owners, and their rewards were tied to size and recent numbers.","co":[]},"t10n12":{"id":"t10n12","theme":"t10","tags":"Wesco 2006","units":["wesco2006"],"lead":"A weaker vehicle, said plainly.","text":"Each dollar of Wesco's book value, he wrote, gave much less intrinsic value than a dollar at Berkshire.","co":["Berkshire Hathaway","Wesco Financial"]},"t10n13":{"id":"t10n13","theme":"t10","tags":"PHM 2005","units":["phm2005"],"lead":"Respect rivals you dislike.","text":"People underrate both the competence and the morals of competitors they dislike.","co":[]},"t11n1":{"id":"t11n1","theme":"t11","tags":"Foundations 1998","units":["foundations1998"],"lead":"Layers of consultants.","text":"Large institutions hired consultants to choose managers, adding layers with perverse incentives and little clear benefit.","co":[]},"t11n2":{"id":"t11n2","theme":"t11","tags":"Foundations 1998","units":["foundations1998"],"lead":"Three per cent a year.","text":"Counting every layer, total investment costs could easily reach 3% of a foundation's net worth each year.","co":[]},"t11n3":{"id":"t11n3","theme":"t11","tags":"Foundations 1998","units":["foundations1998"],"lead":"Half must be below the median.","text":"After the croupiers' take, exactly half of investors get a below-median result. Yet nearly every expert says he is above average.","co":[]},"t11n4":{"id":"t11n4","theme":"t11","tags":"Foundations 1998","units":["foundations1998"],"lead":"Leverage plus overconfidence.","text":"Long-Term Capital Management collapsed through overconfidence in its highly leveraged methods.","co":["Long-Term Capital Management"]},"t11n5":{"id":"t11n5","theme":"t11","tags":"Foundations 1998","units":["foundations1998"],"lead":"Indexing for the average foundation.","text":"He judged indexing a wiser choice for the average foundation than what it was doing.","co":[]},"t11n6":{"id":"t11n6","theme":"t11","tags":"Roundtable 2000","units":["roundtable2000"],"lead":"Febezzle.","text":"The economist J. K. Galbraith wrote of the 'bezzle', wealth that has been embezzled but not yet missed. Munger coined 'febezzle' for wealth quietly lost to wasteful investment fees.","co":[]},"t11n7":{"id":"t11n7","theme":"t11","tags":"Roundtable 2000","units":["roundtable2000"],"lead":"Switching is expensive.","text":"Constantly pulling money from lagging managers is folly. He put investors' real performance lag at over 5% of assets a year.","co":[]},"t11n8":{"id":"t11n8","theme":"t11","tags":"Roundtable 2000","units":["roundtable2000"],"lead":"Wealth effects.","text":"Rising share prices make people feel and spend as if richer, which he warned could produce much mischief.","co":[]},"t12n1":{"id":"t12n1","theme":"t12","tags":"Scandal 2000","units":["scandal2000"],"lead":"A parable written in 2000.","text":"He imagined Quant Tech, a prosperous company whose founder died in 1982, and traced how the managers who followed him ruined it by chasing reported earnings.","co":["Quant Tech (fictional)"]},"t12n2":{"id":"t12n2","theme":"t12","tags":"Scandal 2000","units":["scandal2000"],"lead":"Options counted as free.","text":"Because share options were not counted as a cost, managers could add phony earnings to real ones.","co":[]},"t12n3":{"id":"t12n3","theme":"t12","tags":"Scandal 2000","units":["scandal2000"],"lead":"Dollops.","text":"A moderate dollop of phony earnings each year is less likely to be noticed than one large one.","co":[]},"t12n4":{"id":"t12n4","theme":"t12","tags":"Scandal 2000","units":["scandal2000"],"lead":"A chain letter inside.","text":"Inflated earnings brought a Ponzi or chain-letter effect into the share price, rewarding present holders at later buyers' expense.","co":[]},"t12n5":{"id":"t12n5","theme":"t12","tags":"Scandal 2000","units":["scandal2000"],"lead":"Professions pay the bill.","text":"After the scandal, the public turned hard against the professions that had made it possible.","co":[]},"t12n6":{"id":"t12n6","theme":"t12","tags":"Blue Chip 1982","units":["bluechip1982"],"lead":"Write for the absent owner.","text":"Each year they tried to tell shareholders what they would want to be told if the roles were reversed.","co":[]},"t12n7":{"id":"t12n7","theme":"t12","tags":"Blue Chip 1982","units":["bluechip1982"],"lead":"Repeat what matters.","text":"Repetition is right where facts stay true and analytically important over many years.","co":[]},"t12n8":{"id":"t12n8","theme":"t12","tags":"Wesco 1985","units":["wesco1985"],"lead":"Flag the unusual.","text":"He labelled a large gain as highly unusual and not likely to recur.","co":[]},"t12n9":{"id":"t12n9","theme":"t12","tags":"Wesco 1996","units":["wesco1996"],"lead":"Book profit when it is earned.","text":"Super-cat underwriting profit was recognised only after the contracts expired.","co":[]},"t12n10":{"id":"t12n10","theme":"t12","tags":"Wesco 2006","units":["wesco2006"],"lead":"Ignore the windfall.","text":"He told owners to ignore a large non-cash investment gain when judging the year's earnings.","co":[]},"t13n1":{"id":"t13n1","theme":"t13","tags":"HS 1986","units":["hs1986"],"lead":"Don't stay down.","text":"Staying down after a setback was on his list of routes to misery.","co":[]},"t13n2":{"id":"t13n2","theme":"t13","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Unfair blows will come.","text":"Life is very likely to deliver terrible, unfair blows. Some people recover and others do not. He cited Epictetus on using each setback well.","co":[]},"t13n3":{"id":"t13n3","theme":"t13","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Assiduity.","text":"He liked the word because it meant sitting down and staying there until the job is done.","co":[]},"t13n4":{"id":"t13n4","theme":"t13","tags":"PHM 2005","units":["phm2005"],"lead":"Losses bite harder.","text":"Losses and near misses provoke outsized reactions. The most addictive forms of gambling are built on near misses.","co":[]},"t13n5":{"id":"t13n5","theme":"t13","tags":"PHM 2005","units":["phm2005"],"lead":"Small steps go unnoticed.","text":"Change that arrives in small steps escapes notice, because each step is a small contrast with the last.","co":[]},"t14n1":{"id":"t14n1","theme":"t14","tags":"BRK 2014","units":["brk2014"],"lead":"Four causes.","text":"He credited the constructive peculiarities of Buffett, the constructive peculiarities of the Berkshire system, good luck, and the intense devotion of some shareholders and admirers.","co":["Berkshire Hathaway"]},"t14n2":{"id":"t14n2","theme":"t14","tags":"BRK 2014","units":["brk2014"],"lead":"Focus, kept for 50 years.","text":"Buffett's decision to limit himself to a few kinds of activity, and keep at them for 50 years, worked like a lollapalooza. Munger compared it to Roger Federer's tennis.","co":[]},"t14n3":{"id":"t14n3","theme":"t14","tags":"BRK 2014","units":["brk2014"],"lead":"Each company keeps its own systems.","text":"There is no group-wide personnel, stock option, incentive or retirement system. Subsidiaries run their own.","co":[]},"t14n4":{"id":"t14n4","theme":"t14","tags":"BRK 2014","units":["brk2014"],"lead":"Keep head office small.","text":"Buffett set out to minimise the bad effects that almost always come from a large bureaucracy at headquarters.","co":[]},"t14n5":{"id":"t14n5","theme":"t14","tags":"BRK 2014","units":["brk2014"],"lead":"Win/win.","text":"He wanted win/win results everywhere, for instance gaining loyalty by giving it.","co":[]},"t14n6":{"id":"t14n6","theme":"t14","tags":"BRK 2014","units":["brk2014"],"lead":"A narrow job at the top.","text":"The chairman keeps few tasks: managing nearly all the security investments, writing a long, useful letter as he would want it as a passive shareholder, answering questions for hours, and admiring what others achieve.","co":[]},"t14n7":{"id":"t14n7","theme":"t14","tags":"BRK 2014","units":["brk2014"],"lead":"Rare elsewhere.","text":"No other large company he knew had half these elements. Most have heavy bureaucracy and chief executives who arrive at about 59 and are soon retired by an age limit.","co":[]},"t14n8":{"id":"t14n8","theme":"t14","tags":"BRK 2014","units":["brk2014"],"lead":"Successors.","text":"He named Ajit Jain and Greg Abel as proven performers.","co":[]}},"quotes":[{"id":"q-usc1994","unit":"usc1994","label":"USC 1994","text":"To the man with only a hammer, every problem looks like a nail.","theme":"t1"},{"id":"q-hls1998","unit":"hls1998","label":"HLS 1998","text":"Broadscale problems, by definition, cross many academic disciplines.","theme":"t1"},{"id":"q-hs1986","unit":"hs1986","label":"HS 1986, quoting Jacobi","text":"Invert, always invert.","theme":"t2"},{"id":"q-phm2005","unit":"phm2005","label":"PHM 2005","text":"Incentives are superpowers.","theme":"t3"},{"id":"q-usclaw2007","unit":"usclaw2007","label":"USC Law 2007","text":"Generally speaking, envy, resentment, revenge, and self-pity are disastrous modes of thought.","theme":"t5"},{"id":"q-stanford1996","unit":"stanford1996","label":"Stanford 1996","text":"Don't sell anything you wouldn't buy yourself.","theme":"t6"},{"id":"q-ucsb2003","unit":"ucsb2003","label":"UCSB 2003, explaining why, with no economics training, he would lecture economists","text":"The answer is I have a black belt in chutzpah.","theme":"t8"},{"id":"q-foundations1998","unit":"foundations1998","label":"Foundations 1998, on the view that wide diversification is a must","text":"I think the orthodox view is grossly mistaken.","theme":"t9"},{"id":"q-wesco1996","unit":"wesco1996","label":"Wesco 1996","text":"super-cat reinsurance is not for the faint of heart","theme":"t9"},{"id":"q-scandal2000","unit":"scandal2000","label":"Scandal 2000, the old saying he applies to compliant accountants","text":"Whose bread I eat, his song I sing.","theme":"t12"},{"id":"q-bluechip1982","unit":"bluechip1982","label":"Blue Chip 1982","text":"if the roles were reversed and we were passive investors","theme":"t12"},{"id":"q-brk2014","unit":"brk2014","label":"BRK 2014","text":"the weirdly intense, contagious devotion of some shareholders","theme":"t14"}],"mistakes":[],"tendencies":[{"n":1,"name":"Reward- and punishment-superresponse","what":"Incentives move people more than they expect.","guard":"Get incentives right; distrust paid advice."},{"n":2,"name":"Liking/loving","what":"We favour those we like and overlook their faults.","guard":"Admire the right people; see them clearly."},{"n":3,"name":"Disliking/hating","what":"We ignore the merits of those we dislike.","guard":"Judge disliked rivals fairly."},{"n":4,"name":"Doubt-avoidance","what":"We rush to any answer to end uncertainty.","guard":"Slow down; hear both sides."},{"n":5,"name":"Inconsistency-avoidance","what":"We cling to past conclusions and habits.","guard":"Seek evidence against yourself; stop bad habits early."},{"n":6,"name":"Curiosity","what":"The urge to know, mostly a help.","guard":"Feed it for life."},{"n":7,"name":"Kantian fairness","what":"We expect fair treatment and resent its absence.","guard":"Design arrangements that feel fair."},{"n":8,"name":"Envy/jealousy","what":"Others' gains provoke conflict.","guard":"Name it in yourself; allow for it in others."},{"n":9,"name":"Reciprocation","what":"We return favours and hostility automatically.","guard":"Delay angry replies; refuse gifts that buy judgment."},{"n":10,"name":"Influence-from-mere-association","what":"We credit or blame whatever sits near an outcome.","guard":"Check past wins for luck; welcome bad news."},{"n":11,"name":"Simple, pain-avoiding psychological denial","what":"We bend facts that hurt.","guard":"Face reality; avoid habits that feed denial."},{"n":12,"name":"Excessive self-regard","what":"We overrate ourselves and what is ours.","guard":"Trust records over impressions."},{"n":13,"name":"Overoptimism","what":"We expect better than the odds.","guard":"Use simple probability."},{"n":14,"name":"Deprival-superreaction","what":"Losses and near misses hurt far more than gains please.","guard":"Watch for irrational fights over small losses."},{"n":15,"name":"Social-proof","what":"We copy others, most of all when confused.","guard":"Be wary when everyone agrees and you are rushed."},{"n":16,"name":"Contrast-misreaction","what":"We judge by nearby comparisons.","guard":"Measure against absolute worth."},{"n":17,"name":"Stress-influence","what":"Heavy stress distorts thinking.","guard":"Decide big things when calm."},{"n":18,"name":"Availability-misweighing","what":"Vivid, recent facts get too much weight.","guard":"Use a checklist; seek the dull, large facts."},{"n":19,"name":"Use-it-or-lose-it","what":"Unpractised skills fade.","guard":"Practise to fluency."},{"n":20,"name":"Drug-misinfluence","what":"Chemicals distort judgment.","guard":"Avoid them."},{"n":21,"name":"Senescence-misinfluence","what":"Age makes new complex skills harder.","guard":"Keep learning; learn hard things early."},{"n":22,"name":"Authority-misinfluence","what":"We obey authority even when it is wrong.","guard":"Choose leaders carefully; question orders."},{"n":23,"name":"Twaddle","what":"Empty talk crowds out real work.","guard":"Keep it away from serious tasks."},{"n":24,"name":"Reason-respecting","what":"We comply when given reasons, even weak ones.","guard":"Give real reasons; test the reasons you are given."},{"n":25,"name":"Lollapalooza","what":"Several tendencies acting together cause extreme results.","guard":"Look for confluences, the source of most disasters."}],"plan":[{"n":1,"label":"Latticework","themes":["t1"],"units":["usc1994"],"extra":""},{"n":2,"label":"Invert","themes":["t2"],"units":["hs1986"],"extra":""},{"n":3,"label":"Incentives","themes":["t3"],"units":["phm2005"],"extra":"In the misjudgment talk, read tendencies 1 to 12."},{"n":4,"label":"Misjudgment","themes":["t4"],"units":["phm2005"],"extra":"In the misjudgment talk, read tendencies 13 to 25."},{"n":5,"label":"The inner life","themes":["t5"],"units":["usclaw2007"],"extra":""},{"n":6,"label":"Reliability and trust","themes":["t6"],"units":["stanford1996"],"extra":""},{"n":7,"label":"Learning for life","themes":["t7"],"units":["hls1998"],"extra":""},{"n":8,"label":"Objectivity","themes":["t8"],"units":["ucsb2003"],"extra":""},{"n":9,"label":"Investing","themes":["t9"],"units":["almanack","wesco1996"],"extra":""},{"n":10,"label":"Business models","themes":["t10"],"units":["practical1996","bluechip1982","wesco1985"],"extra":""},{"n":11,"label":"Costs and accounting","themes":["t11","t12"],"units":["foundations1998","roundtable2000","scandal2000"],"extra":""},{"n":12,"label":"Adversity; Berkshire","themes":["t13","t14"],"units":["brk2014","wesco2006"],"extra":""}],"selftest":["Explain the latticework idea to a teenager, with one example.","Use inversion on a real problem: list how to fail, then the plan.","Name five of the 25 tendencies and give a recent example of each.","What is lollapalooza, and why is it the most dangerous tendency?","Which four modes of thought did he call disastrous, and why?","State his three rules for a career.","Why do learning machines overtake cleverer people?","What is the twenty-slot ticket, and what does it change?","Why do improvements in a commodity business often fail to help its owners?","What is febezzlement? Give an example from your own costs.","What made Berkshire's system work, in his four causes?","Write one page, in his blunt style, of advice to your younger self."],"sourcesNote":"The talks are read from Poor Charlie's Almanack, the collection of Munger's talks edited by Peter D. Kaufman, in the Stripe Press edition, which the publisher has put online in full. The Wesco letters and the 1982 Blue Chip Stamps letter are read from published copies of the original annual letters. His 2014 essay appears in Berkshire Hathaway's 2014 annual report. Items tagged Almanack come from the book's own account of his methods. Every exact phrase and every date and figure was checked a second time against these sources. The many Munger quotations that circulate online were not used unless they appear in them. The wording is the compiler's own, apart from the short phrases marked as his, one per source.","disclaimer":["For educational purposes only. This is an independent study guide prepared solely for learning and general information. It is not investment, financial, legal, tax, medical or psychological advice, and it is not a recommendation or solicitation to buy, sell or hold any security.","No reliance. Nothing here takes account of any reader's objectives, finances or circumstances. Investing involves risk, including loss of capital. Past results, including any figures quoted here, do not guarantee future results. Consult a qualified, registered professional before making any financial or personal decision.","No warranty. The content is a paraphrase and interpretation of published talks and letters and may contain errors or omissions. It is provided as is, without warranty of any kind, express or implied, as to accuracy, completeness or fitness for any purpose. Readers should verify everything against the original sources.","No liability. To the fullest extent permitted by law, the compiler and any distributor accept no liability for any loss or damage, direct or indirect, arising from use of or reliance on this material.","No affiliation. This material is not published, endorsed, sponsored or reviewed by the estate of Charles T. Munger, Berkshire Hathaway Inc., Wesco Financial, Stripe Press, the editor of Poor Charlie's Almanack, or any person or company mentioned. All names and trademarks belong to their owners. The talks and letters are the copyright of their authors and publishers; short phrases are quoted for purposes of study, criticism and review, with attribution, and readers are encouraged to read the originals.","Distribution. This material is free and may not be sold."],"big":{"map":[["Before you decide","Run the checklist of models. Invert: how would this fail? Which tendencies are acting on you right now?"],["When you invest","Few, great, mispriced. Bet heavily when the odds are clear. Then sit, and keep costs and taxes low."],["With other people","Look at incentives first. Be reliable. Deserve what you want. Choose people you admire."],["Inside your head","Refuse envy, resentment, revenge and self-pity. Hunt for evidence against your own views."],["Every day","Learn something. Go to bed a little wiser. Keep the habit for life."]],"timeline":[[1982,"Blue Chip"],[1985,"Wesco"],[1986,"Harvard School"],[1994,"USC"],[1996,"Stanford"],[1996,"Coca-Cola"],[1996,"Wesco"],[1998,"Harvard Law"],[1998,"Foundations"],[2000,"Roundtable"],[2000,"Scandal parable"],[2003,"UCSB"],[2005,"Misjudgment"],[2006,"Wesco"],[2007,"USC Law"],[2014,"Berkshire"]],"reading":["Ron Chernow, Titan: The Life of John D. Rockefeller, Sr.","Robert B. Cialdini, Influence: The Psychology of Persuasion","Richard Dawkins, The Selfish Gene","Jared Diamond, Guns, Germs, and Steel; The Third Chimpanzee","Harvey S. Firestone and Samuel Crowther, Men and Rubber","Roger Fisher, William Ury and Bruce Patton, Getting to Yes","Benjamin Franklin, The Autobiography of Benjamin Franklin","John Gribbin, Deep Simplicity; with Mary Gribbin, Ice Age","Andrew S. Grove, Only the Paranoid Survive","Robert G. Hagstrom, The Warren Buffett Portfolio","Garrett Hardin, Living Within Limits","Arthur Herman, How the Scots Invented the Modern World","David S. Landes, The Wealth and Poverty of Nations","Frank Partnoy, Fiasco","Matt Ridley, Genome","Les Schwab, Pride in Performance","Gino Segre, A Matter of Degrees","Herbert A. Simon, Models of My Life","Irving Stone, Men to Match My Mountains","Joseph Frazier Wall, Andrew Carnegie","Robert Wright, Three Scientists and Their Gods"]},"about":"Only Charlie Munger's own talks and letters: the eleven talks in Poor Charlie's Almanack, his letters to Wesco Financial and Blue Chip Stamps shareholders, and his 2014 essay in Berkshire's annual report.","handbookTitle":"Charlie Munger's talks and letters: a study handbook"},"lynch":{"id":"lynch","name":"Peter Lynch","short":"Lynch","mono":"PL","ready":true,"crumb":"Peter Lynch · Books & talks 1989–2023","what":"His books, talks and interviews on finding good stocks as an ordinary investor","unitTab":"Books & talks","unitWord":"source","unitRoute":"source","unitsRoute":"sources","unitsTitle":"His books, talks and interviews","unitsLede":"Each source: what it is most worth reading for, its one short line, the ideas it contributes, and your own notes.","scope":"Lynch wrote three books, all with John Rothchild. One Up on Wall Street is split here into its three parts plus the new introduction of 2000. Three recorded talks and interviews add his own spoken words. Magazine columns and paraphrased quotes found online are left out.","readHow":"The books are in print; borrow or buy them. The 1996 interview transcript is free at PBS and the 2023 interview at Yahoo Finance.","start":{"lede":"Peter Lynch ran Fidelity's Magellan Fund from 1977 to 1990, averaging 29.2% a year, about double the S&P 500. He retired at 46 and spent the following decades teaching ordinary people to pick stocks the way he did: look around, sort, check, explain, then own.","para":"This section covers his three books, a 1994 talk, a 1996 TV interview and a 2023 interview. Expect about an hour a week for twelve weeks: one step of his method here, then the chapter or talk it comes from.","steps":[["Walk his five-step path","<a href=\"#lynch-themes\">The stock-picker's path<\/a>: from spotting a company to owning it."],["Play the six-kinds game","<a href=\"#lynch-tool-sorter\">Sort twelve invented companies<\/a> into his six kinds of stock."],["Read your first source","<a href=\"#lynch-source-pbs1996\">His 1996 interview<\/a> is free online and full of stories and figures."],["Write a two-minute drill","<a href=\"#lynch-tool-drill\">Explain one company<\/a> you know, against the clock."]]},"glossary":[["Ten-bagger","A stock that rises tenfold. His baseball term: two home runs and a double."],["Slow grower","A large, mature company growing about as fast as the economy, owned for its dividend."],["Stalwart","A big, established company growing earnings about 10 to 12% a year."],["Fast grower","A small, aggressive company growing 20 to 25% a year. His favourite kind."],["Cyclical","A company whose profits rise and fall with the economy."],["Turnaround","A battered company that might recover."],["Asset play","A company sitting on something valuable that the market has missed."],["PEG ratio","The P/E divided by the earnings growth rate. Around 1 is fair; well below 1 may be a bargain."],["Diworseification","His word for a profitable company buying unrelated businesses and making itself worse."],["Two-minute drill","A short spoken case for a stock: why you like it, what must happen, what could go wrong."]],"units":[{"key":"oneup1","chip":"1989 One Up I","tag":"1989 One Up I","title":"One Up on Wall Street, Part 1: Preparing to invest","date":"Simon & Schuster, 1989 (millennium edition 2000)","summary":"Why an ordinary person has an edge over the professionals, whether stocks are gambling, and the temperament it takes.","year":1989,"link":"https://www.simonandschuster.com/books/One-Up-On-Wall-Street/Peter-Lynch/9780743200400","linkLabel":"The book at the publisher","nuggets":["t1n1","t1n2","t1n3","t2n2","t3n5","t11n6"],"mistakes":[],"quote":null},{"key":"oneup2","chip":"1989 One Up II","tag":"1989 One Up II","title":"One Up on Wall Street, Part 2: Picking winners","date":"Simon & Schuster, 1989","summary":"The heart of his method: the six kinds of stock, the perfect stock and the ones to avoid, the two-minute drill and the famous numbers.","year":1989,"link":"https://www.simonandschuster.com/books/One-Up-On-Wall-Street/Peter-Lynch/9780743200400","linkLabel":"The book at the publisher","nuggets":["t4n1","t4n2","t4n3","t4n4","t4n5","t4n6","t4n7","t4n8","t5n1","t5n2","t5n3","t5n4","t5n5","t5n6","t5n7","t5n8","t6n2","t7n1","t7n2","t7n3","t7n4","t7n5","t9n1","t9n4","t12n3"],"mistakes":[],"quote":"q-oneup2"},{"key":"oneup3","chip":"1989 One Up III","tag":"1989 One Up III","title":"One Up on Wall Street, Part 3: The long-term view","date":"Simon & Schuster, 1989","summary":"Building a portfolio, when to buy and sell, and the silliest things people say about stock prices.","year":1989,"link":"https://www.simonandschuster.com/books/One-Up-On-Wall-Street/Peter-Lynch/9780743200400","linkLabel":"The book at the publisher","nuggets":["t6n3","t7n7","t10n4","t10n7","t12n4"],"mistakes":[],"quote":null},{"key":"oneup2000","chip":"2000 New intro","tag":"2000 New intro","title":"One Up on Wall Street: Introduction to the millennium edition","date":"Simon & Schuster, 2000","summary":"His view of the dot-com boom: do the homework, do the arithmetic, and remember few buyers get the full ride.","year":2000,"link":"https://www.simonandschuster.com/books/One-Up-On-Wall-Street/Peter-Lynch/9780743200400","linkLabel":"The book at the publisher","nuggets":["t1n4","t7n6","t8n5","t12n7"],"mistakes":[],"quote":"q-oneup2000"},{"key":"bts","chip":"1993 Beating the Street","tag":"1993 Beating the Street","title":"Beating the Street","date":"Simon & Schuster, 1993","summary":"His Magellan years, a class of seventh graders who picked stocks, 21 Peter's Principles and 25 golden rules.","year":1993,"link":"https://www.simonandschuster.com/books/Beating-the-Street/Peter-Lynch/9780671891633","linkLabel":"The book at the publisher","nuggets":["t1n3","t2n1","t2n4","t3n1","t3n2","t3n3","t5n9","t6n1","t6n4","t8n1","t8n3","t8n6","t9n3","t10n2","t10n6","t11n7","t12n6","t12n8"],"mistakes":[],"quote":"q-bts"},{"key":"npc1994","chip":"1994 Press Club","tag":"1994 Press Club","title":"Talk at the National Press Club","date":"Washington, 7 October 1994","summary":"Know what you own, explain it in two minutes, ignore forecasts, and expect the market to fall.","year":1994,"link":"https://novelinvestor.com/peter-lynch-single-important-thing/","linkLabel":"Excerpt and video (third-party page)","nuggets":["t1n5","t6n6","t9n2","t9n6","t11n5","t11n8"],"mistakes":[],"quote":"q-npc1994"},{"key":"learn","chip":"1995 Learn to Earn","tag":"1995 Learn to Earn","title":"Learn to Earn","date":"Fireside, 1995","summary":"A beginner's guide, for anyone of high-school age or older, to capitalism, companies and the basics of investing.","year":1995,"link":"https://www.simonandschuster.ca/books/Learn-to-Earn/Peter-Lynch/9780684811635","linkLabel":"The book at the publisher","nuggets":["t2n8","t8n4","t12n2"],"mistakes":[],"quote":"q-learn"},{"key":"pbs1996","chip":"1996 PBS interview","tag":"1996 PBS interview","title":"Interview for PBS Frontline, “Betting on the Market”","date":"Recorded 1996, aired January 1997","summary":"His life story in his own words: caddying, his first ten-bagger, Magellan, 1987, and why timing the market doesn't pay.","year":1996,"link":"https://www.pbs.org/wgbh/pages/frontline/shows/betting/pros/lynch.html","linkLabel":"Full transcript at PBS","nuggets":["t2n2","t2n3","t2n5","t2n6","t3n6","t3n7","t4n6","t6n5","t10n1","t10n2","t10n3","t10n5","t11n1","t11n2","t11n3","t11n4"],"mistakes":[],"quote":"q-pbs1996"},{"key":"yahoo2023","chip":"2023 Interview","tag":"2023 Interview","title":"Interview with Yahoo Finance","date":"Published 8 July 2023","summary":"Thirty-four years after his first book: balance sheets, company stages, regrets, and why cheap trading isn't investing.","year":2023,"link":"https://ca.finance.yahoo.com/news/fidelity-legend-peter-lynch-i-never-said-to-invest-in-the-stock-market-120755736.html","linkLabel":"The interview at Yahoo Finance","nuggets":["t1n6","t2n7","t3n4","t8n2","t8n3","t9n5","t10n3","t12n1","t12n2","t12n5"],"mistakes":[],"quote":"q-yahoo2023"}],"themes":[{"id":"t1","num":1,"title":"The amateur's edge","idea":"An ordinary person who keeps their eyes open often spots a good company years before the professionals do.","nuggets":["t1n1","t1n2","t1n3","t1n4","t1n5","t1n6"],"ask":["Which three companies do you know better than most analysts, because of your work or daily life?","For one of them, what would you still need to check before buying?"],"table":null,"tool":null,"stage":"ready","stories":[{"t":"From caddie to Fidelity","x":"He started caddying at 11 at a golf club where members talked about stocks. He caddied for Fidelity's president for years, which, he said, made his job interview a formality.","src":"1996 PBS interview"}],"diagram":"lag","after":3,"caption":"Illustrative. The order in which a good small company tends to get noticed: by customers and staff first, by Wall Street last."},{"id":"t2","num":2,"title":"Is it gambling? Stocks and your stomach","idea":"Stocks reward patient owners of good companies; the real test is your stomach, not your brain.","nuggets":["t2n1","t2n2","t2n3","t2n4","t2n5","t2n6","t2n7","t2n8"],"ask":["If your portfolio fell 25% next month, what would you actually do?","Which of your money will you not need for at least five years?"],"table":null,"tool":null,"stage":"ready","stories":[{"t":"The 1987 crash, from Ireland","x":"He was on his first holiday in years when the market fell 508 points in a day, and he flew home. He later said 1987 didn't frighten him much, because his companies were still doing well; 1990 was far scarier.","src":"1996 PBS interview"}],"diagram":"declines","after":5,"caption":"Each dot is one market decline of 10% or more in 95 years, as he counted them in 1996. The 15 darker dots were falls of 25% or more."},{"id":"t3","num":3,"title":"Look in your own backyard","idea":"The best leads come from everyday life: the store you like, the product people keep buying, the trend at your job.","nuggets":["t3n1","t3n2","t3n3","t3n4","t3n5","t3n6","t3n7"],"ask":["Name a product you or your family keep buying again. Who makes it, and is that company listed?","Which trend at your job could you understand before Wall Street does?"],"table":null,"tool":null,"stage":"find","stories":[{"t":"The pantyhose in the shopping bag","x":"His wife Carolyn brought home L'eggs pantyhose, sold in supermarkets. He found good hosiery was then sold mainly in department stores, and when a rival appeared he bought 48 pairs to compare. Hanes became one of his biggest holdings.","src":"1996 PBS interview"},{"t":"The burrito","x":"Taco Bell was one of his early picks; he was impressed by the burrito on a trip to California.","src":"1989 One Up I"}],"diagram":"backyard","after":3,"caption":"Illustrative. Where his best leads came from, and the step every lead still needs."},{"id":"t4","num":4,"title":"The six kinds of stock","idea":"Before buying, decide which of six kinds of stock you are looking at; that tells you what to expect and when to sell.","nuggets":["t4n1","t4n2","t4n3","t4n4","t4n5","t4n6","t4n7","t4n8"],"ask":["Pick a company you know. Which of the six kinds is it, and what does that tell you to expect?","What would make it move into a different kind?"],"table":null,"tool":"sorter","stage":"find","stories":[{"t":"Chrysler on television","x":"In October 1982, on Wall Street Week, he recommended Chrysler, then his biggest holding, at about $10 a share. Friends thought it was headed for bankruptcy.","src":"1996 PBS interview"}],"diagram":"kinds","after":1,"caption":"His three growth bands, plus three kinds defined by their situation. Growth rates are his rough guides."},{"id":"t5","num":5,"title":"The perfect stock, and the ones to avoid","idea":"He looked for dull, overlooked companies in boring niches, and stayed away from the hottest story in town.","nuggets":["t5n1","t5n2","t5n3","t5n4","t5n5","t5n6","t5n7","t5n8","t5n9"],"ask":["How many of the 13 traits does a company you like actually have?","Is anything you own “the hottest stock in the hottest industry”?"],"table":null,"tool":"perfect","stage":"check","stories":[],"diagram":null,"after":0,"caption":""},{"id":"t6","num":6,"title":"Earnings are the engine","idea":"Over months the price can do anything; over years it follows the company's earnings.","nuggets":["t6n1","t6n2","t6n3","t6n4","t6n5","t6n6"],"ask":["What, specifically, will make your company's earnings grow over the next five years?","Have you ever judged a decision only by the price? What did you miss?"],"table":null,"tool":null,"stage":"check","stories":[],"diagram":"earnings","after":2,"caption":"Illustrative. Over months the price wanders above and below the company's earnings; over years it follows them."},{"id":"t7","num":7,"title":"The famous numbers","idea":"A few simple numbers tell you whether a good company is also a good price.","nuggets":["t7n1","t7n2","t7n3","t7n4","t7n5","t7n6","t7n7"],"ask":["Work out the P/E-to-growth figure for one company you follow. What does it say?","Where did the growth rate come from, and how sure are you of it?"],"table":null,"tool":"peg","stage":"check","stories":[],"diagram":"peg","after":3,"caption":"His rule of thumb for the P/E compared with the growth rate. A guide, not a formula."},{"id":"t8","num":8,"title":"Balance sheet first","idea":"The biggest losses come from weak balance sheets; know a company's finances before you risk money on it.","nuggets":["t8n1","t8n2","t8n3","t8n4","t8n5","t8n6"],"ask":["Which company you like could survive two bad years without raising money?","Find one number on a balance sheet you have never checked before. What does it tell you?"],"table":null,"tool":null,"stage":"check","stories":[],"diagram":"debtcash","after":2,"caption":"His 2023 example: two companies both losing money. Only one can wait out the bad patch."},{"id":"t9","num":9,"title":"The two-minute drill","idea":"If you can't explain why you own a stock in two minutes, simply enough for a child, you don't know enough to own it.","nuggets":["t9n1","t9n2","t9n3","t9n4","t9n5","t9n6"],"ask":["Give your two-minute drill for one company, out loud. Where did you get stuck?","What has to happen for it to succeed, and what could stop it?"],"table":null,"tool":"drill","stage":"tell","stories":[{"t":"The seventh graders","x":"Beating the Street opens with a class of seventh graders at St. Agnes School in Massachusetts, who built a stock portfolio from companies they understood. Their lessons led him to the crayon test.","src":"1993 Beating the Street"}],"diagram":"clock","after":1,"caption":"The three parts of his two-minute monologue."},{"id":"t10","num":10,"title":"Ten-baggers: let the winners run","idea":"You only need a few big winners in a lifetime, so let them run and don't cut the flowers to water the weeds.","nuggets":["t10n1","t10n2","t10n3","t10n4","t10n5","t10n6","t10n7"],"ask":["Have you ever sold a winner early to “lock in” a gain? What happened next?","Which holding is your weed, and why are you still watering it?"],"table":null,"tool":"tenbag","stage":"own","stories":[{"t":"His first ten-bagger","x":"In college he put about $1,000 into Flying Tiger, an air-cargo company, because he thought air freight would grow. It rose about tenfold and helped pay for graduate school.","src":"1996 PBS interview"}],"diagram":"asym","after":4,"caption":"The most you can lose on a stock is 100%. A ten-bagger gains 900%."},{"id":"t11","num":11,"title":"Don't time the market","idea":"Nobody can predict the economy or the next fall; study companies, not forecasts.","nuggets":["t11n1","t11n2","t11n3","t11n4","t11n5","t11n6","t11n7","t11n8"],"ask":["When did a forecast last change one of your decisions? Was it right?","What will you do the next time the market falls 10%?"],"table":null,"tool":"cocktail","stage":"own","stories":[],"diagram":"highlow","after":4,"caption":"His 1996 example, 1965 to 1995: putting money in at each year's high still earned almost as much as at each year's low."},{"id":"t12","num":12,"title":"Keep checking the story","idea":"Hold as long as the story holds; recheck it every few months, and sell when the story, not the price, changes.","nuggets":["t12n1","t12n2","t12n3","t12n4","t12n5","t12n6","t12n7","t12n8"],"ask":["For each company you own: has the story changed since you bought it?","Which holding are you keeping only out of boredom, or only because it hasn't come back yet?"],"table":null,"tool":"silly","stage":"own","stories":[{"t":"The one that got away","x":"In 2023 he said his biggest regret was not buying Apple when the shares were around $9 with no debt and $4 to $5 a share in cash.","src":"2023 Interview"}],"diagram":"stages","after":2,"caption":"Illustrative. A company's life: the right question is always which stage it is in now."}],"nuggets":{"t1n1":{"id":"t1n1","theme":"t1","tags":"1989 One Up I","units":["oneup1"],"lead":"You start ahead.","text":"He argued that any normal person can pick stocks as well as the average Wall Street expert, using what they already see at work and in the shops.","co":[]},"t1n2":{"id":"t1n2","theme":"t1","tags":"1989 One Up I","units":["oneup1"],"lead":"Professionals play it safe.","text":"Many fund managers fear looking bad more than they want to win, so they avoid small, unknown companies until everyone already knows them.","co":[]},"t1n3":{"id":"t1n3","theme":"t1","tags":"1989 One Up I · 1993 Beating the Street","units":["oneup1","bts"],"lead":"Your edge is where you work and shop.","text":"Your job, your industry and the products you use every day can show you which companies are winning before the numbers reach Wall Street.","co":[]},"t1n4":{"id":"t1n4","theme":"t1","tags":"2000 New intro","units":["oneup2000"],"lead":"Spotting is only the start.","text":"He never said to buy a stock just because you like the product or the store. You still have to study the company's earnings, finances and competition.","co":[]},"t1n5":{"id":"t1n5","theme":"t1","tags":"1994 Press Club","units":["npc1994"],"lead":"Know what you own.","text":"He called this the single most important thing, and reckoned about 80% of people own stocks they couldn't explain.","co":[]},"t1n6":{"id":"t1n6","theme":"t1","tags":"2023 Interview","units":["yahoo2023"],"lead":"Step one, then step two.","text":"In 2023 he repeated that he never told people simply to put money into the market. Knowing a company is step one; reading its balance sheet is step two.","co":[]},"t2n1":{"id":"t2n1","theme":"t2","tags":"1993 Beating the Street","units":["bts"],"lead":"Owning, not betting.","text":"Stocks are a gamble only if you pick them like lottery tickets. Behind every stock is a business, and businesses that earn more become worth more.","co":[]},"t2n2":{"id":"t2n2","theme":"t2","tags":"1989 One Up I · 1996 PBS interview","units":["oneup1","pbs1996"],"lead":"Why stocks beat bonds.","text":"With a bond, the best you can hope for is your money back plus interest. Over the long run, stocks with dividends returned about 11% a year, against 5 to 6% for bonds.","co":[]},"t2n3":{"id":"t2n3","theme":"t2","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Profits are the engine.","text":"Company profits have grown about 8% a year over time, which is why stocks rise in the long run, even after flat decades.","co":[]},"t2n4":{"id":"t2n4","theme":"t2","tags":"1993 Beating the Street","units":["bts"],"lead":"Bad picks are worse than cash.","text":"Over the long run, a portfolio of poorly chosen stocks won't beat money left under the mattress.","co":[]},"t2n5":{"id":"t2n5","theme":"t2","tags":"1996 PBS interview","units":["pbs1996"],"lead":"The stomach decides.","text":"Markets fall often: he counted 53 declines of 10% or more in 95 years, 15 of them of 25% or more. If you can't sit through that, don't own stocks.","co":[]},"t2n6":{"id":"t2n6","theme":"t2","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Only money you won't need.","text":"Buy, hold and add when the market falls, but only with money you won't need soon.","co":[]},"t2n7":{"id":"t2n7","theme":"t2","tags":"2023 Interview","units":["yahoo2023"],"lead":"Temperament as much as homework.","text":"If a sharp drop would keep you awake at night, he said in 2023, you shouldn't be investing in stocks.","co":[]},"t2n8":{"id":"t2n8","theme":"t2","tags":"1995 Learn to Earn","units":["learn"],"lead":"Start with how the world works.","text":"His beginner's book opens with the history of companies and capitalism, because investing makes sense only once you see what a company is.","co":[]},"t3n1":{"id":"t3n1","theme":"t3","tags":"1993 Beating the Street","units":["bts"],"lead":"Start close to home.","text":"He believed the best place to start looking for the next winner is your own backyard: home, work and the shops.","co":[]},"t3n2":{"id":"t3n2","theme":"t3","tags":"1993 Beating the Street","units":["bts"],"lead":"Watch what people keep buying.","text":"A product that friends, family or colleagues keep coming back to is a clue worth following up.","co":[]},"t3n3":{"id":"t3n3","theme":"t3","tags":"1993 Beating the Street","units":["bts"],"lead":"If you like the store…","text":"One of his principles: if you like the store, chances are you'll love the stock. Then check the numbers.","co":[]},"t3n4":{"id":"t3n4","theme":"t3","tags":"2023 Interview","units":["yahoo2023"],"lead":"Small companies, big gains.","text":"His biggest wins often came from small companies with room to grow. In 2023 he cited Au Bon Pain, which bought St. Louis Bread for $23 million in 1993; it later sold for $7.5 billion.","co":[]},"t3n5":{"id":"t3n5","theme":"t3","tags":"1989 One Up I","units":["oneup1"],"lead":"A hit product is not enough.","text":"The Cabbage Patch doll was a huge hit, but it couldn't save a mediocre company with a bad balance sheet.","co":[]},"t3n6":{"id":"t3n6","theme":"t3","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Turn over more rocks.","text":"The more companies you look at, the more bargains you find. His early winners came from industries others ignored.","co":[]},"t3n7":{"id":"t3n7","theme":"t3","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Know a few well.","text":"An individual can do well by knowing three to five companies thoroughly and buying when one becomes attractive.","co":[]},"t4n1":{"id":"t4n1","theme":"t4","tags":"1989 One Up II","units":["oneup2"],"lead":"Sort before you buy.","text":"Every company fits one of six kinds: slow growers, stalwarts, fast growers, cyclicals, turnarounds and asset plays.","co":[]},"t4n2":{"id":"t4n2","theme":"t4","tags":"1989 One Up II","units":["oneup2"],"lead":"Slow growers.","text":"Large, ageing companies growing about as fast as the economy. You own them mainly for the dividend: low risk, low gain.","co":[]},"t4n3":{"id":"t4n3","theme":"t4","tags":"1989 One Up II","units":["oneup2"],"lead":"Stalwarts.","text":"Big, established companies growing earnings about 10 to 12% a year: low risk, moderate gain. He expected perhaps 30 to 50% from them, and liked them for protection in recessions.","co":[]},"t4n4":{"id":"t4n4","theme":"t4","tags":"1989 One Up II","units":["oneup2"],"lead":"Fast growers.","text":"Small, aggressive companies growing 20 to 25% a year. His favourites and the land of ten- to forty-baggers, but the riskiest when growth stops.","co":[]},"t4n5":{"id":"t4n5","theme":"t4","tags":"1989 One Up II","units":["oneup2"],"lead":"Cyclicals.","text":"Companies whose profits rise and fall with the economy. With these, timing matters more than anywhere else.","co":[]},"t4n6":{"id":"t4n6","theme":"t4","tags":"1989 One Up II · 1996 PBS interview","units":["oneup2","pbs1996"],"lead":"Turnarounds.","text":"Battered companies that might recover. They can make big gains, as Chrysler did in the early 1980s, but many never come back.","co":[]},"t4n7":{"id":"t4n7","theme":"t4","tags":"1989 One Up II","units":["oneup2"],"lead":"Asset plays.","text":"Companies sitting on something valuable the market has missed, such as property, cash or a business inside the business.","co":[]},"t4n8":{"id":"t4n8","theme":"t4","tags":"1989 One Up II","units":["oneup2"],"lead":"Kinds change.","text":"Fast growers eventually slow down and become stalwarts or slow growers, so check the label again from time to time.","co":[]},"t5n1":{"id":"t5n1","theme":"t5","tags":"1989 One Up II","units":["oneup2"],"lead":"Dull is beautiful.","text":"The perfect company has a boring, even ridiculous name and does something dull or disagreeable, so the crowd ignores it.","co":[]},"t5n2":{"id":"t5n2","theme":"t5","tags":"1989 One Up II","units":["oneup2"],"lead":"Overlooked is better.","text":"Big institutions don't own it and analysts don't follow it. A spinoff, or a company with a depressing or rumour-ridden image, often qualifies.","co":[]},"t5n3":{"id":"t5n3","theme":"t5","tags":"1989 One Up II","units":["oneup2"],"lead":"Niche and repeat buyers.","text":"A no-growth industry, a protected niche and a product people have to keep buying are all good signs.","co":[]},"t5n4":{"id":"t5n4","theme":"t5","tags":"1989 One Up II","units":["oneup2"],"lead":"Insiders and buybacks.","text":"When insiders buy their own shares, or the company buys back stock, management is showing confidence. Heavy insider buying makes a near-term bankruptcy very unlikely.","co":[]},"t5n5":{"id":"t5n5","theme":"t5","tags":"1989 One Up II","units":["oneup2"],"lead":"Use technology, don't sell it.","text":"He preferred companies that use technology to cut their costs over companies racing to sell it.","co":[]},"t5n6":{"id":"t5n6","theme":"t5","tags":"1989 One Up II","units":["oneup2"],"lead":"Avoid the hottest stock.","text":"The hottest stock in the hottest industry, the one everyone talks about, is the one he would avoid most.","co":[]},"t5n7":{"id":"t5n7","theme":"t5","tags":"1989 One Up II","units":["oneup2"],"lead":"Beware “the next” and diworseification.","text":"Stocks touted as the next big name rarely are, and profitable companies that buy unrelated businesses usually make themselves worse.","co":[]},"t5n8":{"id":"t5n8","theme":"t5","tags":"1989 One Up II","units":["oneup2"],"lead":"Beware whispers and exciting names.","text":"Long shots with thrilling stories and no earnings, and companies with exciting names in hot fields, attract buyers for the wrong reasons.","co":[]},"t5n9":{"id":"t5n9","theme":"t5","tags":"1993 Beating the Street","units":["bts"],"lead":"Fewer colour photos.","text":"Half joking: all else equal, invest in the company with the fewest colour photographs in its annual report.","co":[]},"t6n1":{"id":"t6n1","theme":"t6","tags":"1993 Beating the Street","units":["bts"],"lead":"Short term, no link; long term, a full link.","text":"Over months or even years there is often no connection between how a company does and how its stock does. Over the long term, the connection is complete.","co":[]},"t6n2":{"id":"t6n2","theme":"t6","tags":"1989 One Up II","units":["oneup2"],"lead":"Find what drives the profits.","text":"Something has to keep the profits growing; the more you know about that something, the better.","co":[]},"t6n3":{"id":"t6n3","theme":"t6","tags":"1989 One Up III","units":["oneup3"],"lead":"Price is not proof.","text":"A rising price doesn't mean you were right, and a falling one doesn't mean you were wrong. Only the business can tell you that.","co":[]},"t6n4":{"id":"t6n4","theme":"t6","tags":"1993 Beating the Street","units":["bts"],"lead":"Time favours good companies.","text":"Time is on your side when you own shares of superior companies, and against you when you own options.","co":[]},"t6n5":{"id":"t6n5","theme":"t6","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Even ten years late can be early.","text":"Investors who bought Wal-Mart ten years after its 1970 listing could still have made about 30 times their money by following its expansion.","co":[]},"t6n6":{"id":"t6n6","theme":"t6","tags":"1994 Press Club","units":["npc1994"],"lead":"The stock doesn't know you own it.","text":"Don't fall in love with a share. Stay while the company's fundamentals hold, and leave if they break.","co":[]},"t7n1":{"id":"t7n1","theme":"t7","tags":"1989 One Up II","units":["oneup2"],"lead":"P/E equal to growth is fair.","text":"A fairly priced company's P/E roughly equals its earnings growth rate. A P/E well below the growth rate may be a bargain; well above it, a warning.","co":[]},"t7n2":{"id":"t7n2","theme":"t7","tags":"1989 One Up II","units":["oneup2"],"lead":"Half is attractive, double is dear.","text":"A P/E around half the growth rate looked very attractive to him; around twice the growth rate, very unattractive.","co":[]},"t7n3":{"id":"t7n3","theme":"t7","tags":"1989 One Up II","units":["oneup2"],"lead":"Add the dividend.","text":"For dividend payers, add the yield to the growth rate and divide by the P/E. Below 1 is poor, about 1.5 is okay, and 2 or better is what you want.","co":[]},"t7n4":{"id":"t7n4","theme":"t7","tags":"1989 One Up II","units":["oneup2"],"lead":"Cash minus debt.","text":"Check how much cash the company holds against its long-term debt. Plenty of net cash cushions the bad years.","co":[]},"t7n5":{"id":"t7n5","theme":"t7","tags":"1989 One Up II","units":["oneup2"],"lead":"Who owns it?","text":"The fewer institutions own it and the fewer analysts follow it, the more room there is for discovery.","co":[]},"t7n6":{"id":"t7n6","theme":"t7","tags":"2000 New intro","units":["oneup2000"],"lead":"Do the arithmetic, even without earnings.","text":"For a company with no profits yet, work out what it would need to earn later to justify today's price.","co":[]},"t7n7":{"id":"t7n7","theme":"t7","tags":"1989 One Up III","units":["oneup3"],"lead":"Cheap is not safe.","text":"A $3 stock can go to zero just like a $50 one. A lousy cheap stock is as risky as a lousy expensive one.","co":[]},"t8n1":{"id":"t8n1","theme":"t8","tags":"1993 Beating the Street","units":["bts"],"lead":"Finances before faith.","text":"Never invest in a company without understanding its finances. The biggest losses come from companies with poor balance sheets.","co":[]},"t8n2":{"id":"t8n2","theme":"t8","tags":"2023 Interview","units":["yahoo2023"],"lead":"Two losers, one bargain.","text":"In 2023 he compared two loss-making companies: one with $300 million of debt, one with no debt and $200 million in cash.","co":[]},"t8n3":{"id":"t8n3","theme":"t8","tags":"1993 Beating the Street · 2023 Interview","units":["bts","yahoo2023"],"lead":"Debt decides who survives.","text":"In a downturn, a company with little debt can wait; one with heavy debt may not. That matters most for turnarounds and cyclicals.","co":[]},"t8n4":{"id":"t8n4","theme":"t8","tags":"1995 Learn to Earn","units":["learn"],"lead":"Read the numbers yourself.","text":"His beginner's book teaches how to read a stock table, an annual report and a balance sheet, before trusting anyone else's summary.","co":[]},"t8n5":{"id":"t8n5","theme":"t8","tags":"2000 New intro","units":["oneup2000"],"lead":"The homework list.","text":"Before buying, check the earnings prospects, financial condition, competitive position and plans for expansion.","co":[]},"t8n6":{"id":"t8n6","theme":"t8","tags":"1993 Beating the Street","units":["bts"],"lead":"Fancy offices are a warning.","text":"A lavish head office can signal managers who care more about themselves than about shareholders.","co":[]},"t9n1":{"id":"t9n1","theme":"t9","tags":"1989 One Up II","units":["oneup2"],"lead":"Give the monologue.","text":"Before buying, he talked himself through why he was interested, what had to happen for the company to succeed, and what could get in the way.","co":[]},"t9n2":{"id":"t9n2","theme":"t9","tags":"1994 Press Club","units":["npc1994"],"lead":"Simple enough for a child.","text":"If you can't explain to a ten-year-old, in two minutes or less, why you own a stock, he said, you shouldn't own it.","co":[]},"t9n3":{"id":"t9n3","theme":"t9","tags":"1993 Beating the Street","units":["bts"],"lead":"The crayon test.","text":"If you couldn't draw the idea with a crayon, he wouldn't invest in it.","co":[]},"t9n4":{"id":"t9n4","theme":"t9","tags":"1989 One Up II","units":["oneup2"],"lead":"Each kind has its own story.","text":"For a slow grower the story is the dividend; for a fast grower, where it can still expand; for a turnaround, how it will fix itself; for an asset play, what the assets are worth.","co":[]},"t9n5":{"id":"t9n5","theme":"t9","tags":"2023 Interview","units":["yahoo2023"],"lead":"Write it down.","text":"For beginners in 2023 he suggested a paper portfolio of at least ten stocks, a few written reasons for each, reviewed every three months.","co":[]},"t9n6":{"id":"t9n6","theme":"t9","tags":"1994 Press Club","units":["npc1994"],"lead":"“It's going up” is not a reason.","text":"Pressed, many owners admit their real reason is that the stock is rising, which is no reason at all.","co":[]},"t10n1":{"id":"t10n1","theme":"t10","tags":"1996 PBS interview","units":["pbs1996"],"lead":"A ten-bagger.","text":"His baseball term for a stock that goes up tenfold: two home runs and a double.","co":[]},"t10n2":{"id":"t10n2","theme":"t10","tags":"1996 PBS interview · 1993 Beating the Street","units":["pbs1996","bts"],"lead":"A few are enough.","text":"You don't need many. A handful of tenfold winners in a lifetime makes investing worthwhile.","co":[]},"t10n3":{"id":"t10n3","theme":"t10","tags":"1996 PBS interview · 2023 Interview","units":["pbs1996","yahoo2023"],"lead":"Right six times in ten.","text":"A good stock picker is right about six times in ten, so the winners must be allowed to outgrow the losers.","co":[]},"t10n4":{"id":"t10n4","theme":"t10","tags":"1989 One Up III","units":["oneup3"],"lead":"Flowers and weeds.","text":"Selling your winners and keeping your losers is like pulling out the flowers and watering the weeds. Buffett liked the image enough to use it in his 1988 letter.","co":[]},"t10n5":{"id":"t10n5","theme":"t10","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Add to the winners.","text":"He did well by owning many stocks, letting winners run and adding to them, even though Magellan missed more than a hundred ten-baggers.","co":[]},"t10n6":{"id":"t10n6","theme":"t10","tags":"1993 Beating the Street","units":["bts"],"lead":"Look at what you own first.","text":"The best stock to buy may be one you already own; check it before hunting for something new.","co":[]},"t10n7":{"id":"t10n7","theme":"t10","tags":"1989 One Up III","units":["oneup3"],"lead":"Lose 100%, gain 900%.","text":"Whatever you pay, picking the wrong stock costs at most the same 100%. A ten-bagger gains 900%.","co":[]},"t11n1":{"id":"t11n1","theme":"t11","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Thirteen minutes.","text":"Spend little time on economic forecasts: he joked that 13 minutes a year on economics wastes ten of them.","co":[]},"t11n2":{"id":"t11n2","theme":"t11","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Facts, not forecasts.","text":"Watch the facts in the industries you own, such as used-car prices for carmakers or new hotel building for hotel chains.","co":[]},"t11n3":{"id":"t11n3","theme":"t11","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Nobody saw 1982 coming.","text":"In 1982 inflation was 14%, the prime rate 20% and over half his companies were losing money. The great bull market began that year.","co":[]},"t11n4":{"id":"t11n4","theme":"t11","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Timing barely matters.","text":"Investing every year at the year's high from 1965 to 1995 earned about 10.6% a year; at the year's low, about 11.7%.","co":[]},"t11n5":{"id":"t11n5","theme":"t11","tags":"1994 Press Club","units":["npc1994"],"lead":"Declines are normal.","text":"Falls happen and no one knows when. People who say they predicted one predicted many others too.","co":[]},"t11n6":{"id":"t11n6","theme":"t11","tags":"1989 One Up I","units":["oneup1"],"lead":"The cocktail party.","text":"Half joking, he described four stages of a market, from guests avoiding him at parties to everyone giving him tips. He did not use it to predict.","co":[]},"t11n7":{"id":"t11n7","theme":"t11","tags":"1993 Beating the Street","units":["bts"],"lead":"Pessimism rarely pays.","text":"Unless you sell short for a living, it rarely pays to be a pessimist about the long run.","co":[]},"t11n8":{"id":"t11n8","theme":"t11","tags":"1994 Press Club","units":["npc1994"],"lead":"History says: markets fall.","text":"Study history to learn that markets go down, and decide in advance that a fall is a chance to buy, not a reason to run.","co":[]},"t12n1":{"id":"t12n1","theme":"t12","tags":"2023 Interview","units":["yahoo2023"],"lead":"Check the story regularly.","text":"Even a long-term owner has to keep following the company. Stories end, for example when a business saturates its market.","co":[]},"t12n2":{"id":"t12n2","theme":"t12","tags":"2023 Interview · 1995 Learn to Earn","units":["yahoo2023","learn"],"lead":"Know the stage.","text":"Companies pass through stages, from start-up to fast growth to maturity. The key question is which stage yours is in.","co":[]},"t12n3":{"id":"t12n3","theme":"t12","tags":"1989 One Up II","units":["oneup2"],"lead":"Sell by kind.","text":"The right exit depends on the kind of stock: a stalwart after a solid rise, a fast grower when its room to expand runs out, a turnaround once it has turned around.","co":[]},"t12n4":{"id":"t12n4","theme":"t12","tags":"1989 One Up III","units":["oneup3"],"lead":"Boredom is expensive.","text":"Give up on a stock because nothing is happening and, all too often, things start to happen the day after you sell.","co":[]},"t12n5":{"id":"t12n5","theme":"t12","tags":"2023 Interview","units":["yahoo2023"],"lead":"Don't be a trader.","text":"Cheap comm
