ha. It ends in the crash of 1929.","where":{"M":"A small boy in Omaha.","B":"Not yet born.","L":"Not yet born."}},{"n":2,"a":1930,"b":1941,"title":"Depression childhoods","tag":"Hard times teach thrift","intro":"Banks fail, a quarter of workers lose their jobs and stocks lose most of their value. Washington answers with the New Deal and the SEC. Warren Buffett is born ten months after the crash. The decade ends with a world at war.","where":{"M":"An Omaha schoolboy, then a maths student in Michigan.","B":"An Omaha boy already selling things for profit.","L":"Not yet born."}},{"n":3,"a":1942,"b":1949,"title":"War and first trades","tag":"Uniforms, paper routes, a birth","intro":"America fights and wins a world war, then builds the post-war order. Buffett buys his first stock at 11, Munger forecasts weather for the Army and talks his way into Harvard Law, and Peter Lynch is born near Boston.","where":{"M":"Army weatherman, Harvard Law, then a young Los Angeles lawyer.","B":"A teenage businessman in Washington, then Wharton.","L":"A baby, then a small boy in Newton, Massachusetts."}},{"n":4,"a":1950,"b":1959,"title":"Students of Graham","tag":"A teacher, a stock, a meeting","intro":"A booming, confident America; the Dow finally regains its 1929 peak in 1954. Buffett learns from Benjamin Graham, works for him, then starts his own partnership. Lynch loses his father and starts caddying. In 1959 Buffett and Munger meet.","where":{"M":"A Los Angeles lawyer through a hard decade at home.","B":"Columbia, Omaha broker, Graham-Newman, then his own partnership.","L":"A boy caddying at a Boston-area golf club."}},{"n":5,"a":1960,"b":1969,"title":"The go-go years","tag":"Partnerships and a textile mill","intro":"Kennedy, Vietnam, civil rights and the Moon. Wall Street falls for fast-trading 'go-go' funds. Buffett buys a struggling textile mill called Berkshire Hathaway; Munger starts his own firm and fund; Lynch goes from college to Fidelity.","where":{"M":"Founds his law firm and runs his own investment partnership.","B":"Runs his partnership; takes control of Berkshire in 1965; closes the partnership in 1969.","L":"Boston College, a Fidelity internship, Wharton and the Army."}},{"n":6,"a":1970,"b":1979,"title":"The lost decade","tag":"Inflation, oil and bargains","intro":"Watergate, oil shocks and inflation. Stocks go nowhere for a decade and crash in 1973-74. Buffett buys See's Candies, the Washington Post and GEICO at bargain prices; Munger's fund is battered, then recovers; Lynch takes over a tiny fund called Magellan.","where":{"M":"Rides out a brutal 1973-74, winds up his fund and joins Berkshire as vice chairman in 1978.","B":"Runs Berkshire and buys great businesses cheaply.","L":"Fidelity analyst, research director, then Magellan's manager from 1977."}},{"n":7,"a":1980,"b":1989,"title":"The great bull begins","tag":"Volcker, Magellan, Black Monday","intro":"Paul Volcker breaks inflation with sky-high rates, and a great bull market begins in 1982. Magellan becomes the most famous fund in America. Berkshire buys Nebraska Furniture Mart and Coca-Cola. Black Monday tests everyone in 1987.","where":{"M":"Berkshire's vice chairman; also runs Wesco from 1984.","B":"Turns Berkshire into a conglomerate of great businesses.","L":"Builds Magellan from about $100 million to about $10 billion."}},{"n":8,"a":1990,"b":1999,"title":"The bubble decade","tag":"Retirement, rescue and a mania","intro":"The Cold War ends, the web arrives and tech stocks soar. Lynch quits at the top at 46. Buffett rescues Salomon and buys GEICO and General Re. Munger gives his most famous talks. By 1999 critics call Buffett out of touch.","where":{"M":"Gives his landmark talks on worldly wisdom and human misjudgment.","B":"Builds Berkshire's insurance empire and refuses to chase tech.","L":"Retires from Magellan, writes two more books and turns to giving."}},{"n":9,"a":2000,"b":2009,"title":"Bust, war and crisis","tag":"Two crashes in ten years","intro":"The dot-com bubble bursts, terrorists strike on 9/11, and in 2008 the financial system nearly collapses. Buffett warns about derivatives, pledges his fortune to charity and invests boldly in the panic, with Munger's China idea in the mix.","where":{"M":"Vice chairman and sage; his sayings become a best-selling book.","B":"Warns early, then invests heavily in the 2008 panic.","L":"Vice chairman at Fidelity and a full-time philanthropist."}},{"n":10,"a":2010,"b":2019,"title":"The long recovery","tag":"Giving, Apple and succession","intro":"A slow recovery, then a long bull market led by technology. Buffett launches the Giving Pledge, receives the Medal of Freedom, buys Apple and wins his famous bet against hedge funds. Berkshire starts preparing for life after its founders.","where":{"M":"In his 80s and 90s, still at Buffett's side and still giving big gifts.","B":"Buys huge businesses and Apple; names vice chairmen.","L":"Gives away money through the Lynch Foundation; loses his wife in 2015."}},{"n":11,"a":2020,"b":2026,"title":"Pandemic, AI and farewells","tag":"The end of an era","intro":"A pandemic crash, artificial intelligence, war and new tariffs. Munger dies in 2023, 34 days short of 100. Buffett hands the CEO job to Greg Abel and then the chair to his son Howard. Lynch, in his 80s, is still at Fidelity.","where":{"M":"Works into his late 90s; dies in November 2023.","B":"Steps back: CEO until 2025, chairman until September 2026.","L":"In his 80s, still meeting Fidelity's young analysts."}}],"years":{"1924":{"M":[{"t":"Born in Omaha, Nebraska. His father is a lawyer; his grandfather is a federal judge.","m":"Jan 1","b":1,"s":"wiki"}],"B":[],"L":[],"W":[{"t":"The first modern American mutual fund, Massachusetts Investors Trust, opens in Boston.","m":"Mar","b":1,"k":"mkt"},{"t":"Calvin Coolidge wins the presidential election.","m":"Nov","k":"pol"}]},"1925":{"M":[],"B":[],"L":[],"W":[{"t":"F. Scott Fitzgerald publishes The Great Gatsby.","m":"Apr","k":"cul"},{"t":"The Scopes trial in Tennessee puts the teaching of evolution on trial.","m":"Jul","k":"pol"}]},"1926":{"M":[],"B":[],"L":[],"W":[{"t":"NBC, the first national radio network, goes on the air.","m":"Nov","k":"tech"}]},"1927":{"M":[],"B":[],"L":[],"W":[{"t":"Charles Lindbergh flies solo and non-stop from New York to Paris.","m":"May","b":1,"k":"world"},{"t":"The Jazz Singer brings talking pictures to cinemas.","m":"Oct","k":"cul"}]},"1928":{"M":[],"B":[],"L":[],"W":[{"t":"Alexander Fleming discovers penicillin in London.","m":"Sep","k":"tech"},{"t":"Herbert Hoover is elected president. The same month, Mickey Mouse appears in Steamboat Willie.","m":"Nov","k":"pol"}]},"1929":{"M":[],"B":[],"L":[],"W":[{"t":"The Dow Jones Industrial Average peaks at about 381.","m":"Sep 3","k":"mkt"},{"t":"Wall Street crashes: Black Thursday, Black Monday and Black Tuesday (Oct 24-29). The Great Depression begins.","m":"Oct","b":1,"k":"mkt"}]},"1930":{"M":[],"B":[{"t":"Born in Omaha, Nebraska, ten months after the crash.","m":"Aug 30","b":1,"s":"wiki"}],"L":[],"W":[{"t":"The Smoot-Hawley Act raises tariffs on thousands of imports; other countries hit back.","m":"Jun","k":"pol"},{"t":"The Bank of United States fails as bank runs spread.","m":"Dec","k":"mkt"}]},"1931":{"M":[],"B":[{"t":"The bank where his father works fails. Howard Buffett starts his own small brokerage.","m":"Aug","s":"snow"}],"L":[],"W":[{"t":"The Empire State Building opens in New York.","m":"May","k":"cul"},{"t":"Stocks lose about 44% in the year, the worst calendar year on record.","k":"mkt"}]},"1932":{"M":[],"B":[],"L":[],"W":[{"t":"The Dow bottoms at 41, down 89% from its 1929 peak.","m":"Jul 8","b":1,"k":"mkt"},{"t":"Franklin D. Roosevelt wins the presidency in a landslide.","m":"Nov","k":"pol"}]},"1933":{"M":[],"B":[],"L":[],"W":[{"t":"Adolf Hitler becomes chancellor of Germany.","m":"Jan","k":"world"},{"t":"Roosevelt takes office, closes the banks for a 'bank holiday' and launches the New Deal.","m":"Mar","b":1,"k":"pol"},{"t":"The Securities Act and the Glass-Steagall Act pass; bank deposits become federally insured.","m":"May-Jun","k":"mkt"}]},"1934":{"M":[],"B":[],"L":[],"W":[{"t":"The Securities Exchange Act creates the SEC to police Wall Street. Joseph Kennedy is its first chairman.","m":"Jun","b":1,"k":"mkt"},{"t":"Benjamin Graham and David Dodd publish Security Analysis, the founding text of value investing.","b":1,"k":"mkt"}]},"1935":{"M":[],"B":[],"L":[],"W":[{"t":"The Social Security Act becomes law.","m":"Aug","k":"pol"}]},"1936":{"M":[],"B":[{"t":"At six, buys six-packs of Coca-Cola and resells the bottles one by one at a profit.","s":"snow"}],"L":[],"W":[{"t":"Jesse Owens wins four gold medals at the Berlin Olympics.","m":"Aug","k":"cul"},{"t":"Roosevelt wins a second term.","m":"Nov","k":"pol"}]},"1937":{"M":[],"B":[],"L":[],"W":[{"t":"The Golden Gate Bridge opens in San Francisco.","m":"May","k":"cul"},{"t":"A sharp new recession: stocks lose about 35% in the year.","k":"mkt"},{"t":"Disney's Snow White, the first full-length cel-animated feature, premieres.","m":"Dec","k":"cul"}]},"1938":{"M":[],"B":[],"L":[],"W":[{"t":"The Fair Labor Standards Act sets the first federal minimum wage.","m":"Jun","k":"pol"},{"t":"Orson Welles's War of the Worlds radio drama alarms listeners.","m":"Oct","k":"cul"}]},"1939":{"M":[],"B":[],"L":[],"W":[{"t":"Germany invades Poland. World War II begins in Europe.","m":"Sep 1","b":1,"k":"world"},{"t":"Gone with the Wind and The Wizard of Oz reach cinemas.","k":"cul"}]},"1940":{"M":[],"B":[{"t":"At 10, visits New York with his father and tours the New York Stock Exchange.","s":"wiki"},{"t":"As a boy he often chalks stock prices onto the blackboard at his father's brokerage office.","s":"bio"}],"L":[],"W":[{"t":"The Investment Company Act sets the rules for mutual funds.","k":"mkt"},{"t":"Roosevelt wins a third term.","m":"Nov","k":"pol"}]},"1941":{"M":[{"t":"Leaves Omaha for the University of Michigan to study mathematics.","b":1,"s":"bi"}],"B":[],"L":[],"W":[{"t":"Citizen Kane premieres.","m":"May","k":"cul"},{"t":"Japan attacks Pearl Harbor. The United States enters World War II.","m":"Dec 7","b":1,"k":"world"}]},"1942":{"M":[],"B":[{"t":"At 11, buys his first stock: three shares of Cities Service preferred at $38 (and three for his sister). They fall to $27; he sells at $40, then watches them climb past $200.","m":"Mar 11","b":1,"s":"time15"},{"t":"His father, Howard Buffett, is elected to Congress.","m":"Nov","s":"wiki"}],"L":[],"W":[{"t":"The Manhattan Project to build an atomic bomb begins.","k":"tech"},{"t":"Casablanca premieres.","m":"Nov","k":"cul"}]},"1943":{"M":[{"t":"A few days after turning 19, leaves college for the Army Air Corps. He trains as a weather forecaster and later serves in Nome, Alaska.","m":"Jan","b":1,"s":"wiki"}],"B":[{"t":"The family moves to Washington, D.C. He takes on several newspaper routes.","s":"wiki"}],"L":[],"W":[{"t":"Oklahoma! opens on Broadway.","m":"Mar","k":"cul"}]},"1944":{"M":[],"B":[{"t":"At 13, files his first tax return and deducts his bicycle and watch as business expenses: $35.","s":"wiki"}],"L":[{"t":"Peter Spencer Lynch is born in Newton, Massachusetts, near Boston.","m":"Jan 19","b":1,"s":"wiki"}],"W":[{"t":"D-Day: Allied troops land in Normandy.","m":"Jun 6","b":1,"k":"world"},{"t":"The Bretton Woods conference designs the post-war money system and creates the IMF and World Bank.","m":"Jul","k":"mkt"}]},"1945":{"M":[{"t":"Marries Nancy Huggins while training in California.","s":"wiki"}],"B":[{"t":"At 14, buys a 40-acre Nebraska farm with $1,200 of savings. With a friend, puts a $25 used pinball machine in a barbershop.","s":"wiki"}],"L":[],"W":[{"t":"Roosevelt dies. Harry Truman becomes president.","m":"Apr 12","k":"pol"},{"t":"Germany surrenders in May. After atomic bombs fall on Hiroshima and Nagasaki, Japan surrenders and World War II ends.","m":"May-Sep","b":1,"k":"world"},{"t":"The United Nations is founded.","m":"Oct","k":"world"}]},"1946":{"M":[{"t":"Out of the Army, talks his way into Harvard Law School without a college degree, helped by family friend Roscoe Pound, the former dean.","b":1,"s":"lowe"}],"B":[{"t":"At 15, earns more than $175 a month from his paper routes.","s":"wiki"}],"L":[],"W":[{"t":"ENIAC, an early electronic computer, is unveiled.","m":"Feb","k":"tech"},{"t":"It's a Wonderful Life premieres.","m":"Dec","k":"cul"}]},"1947":{"M":[],"B":[{"t":"Graduates from high school at 16, sells the pinball business for $1,200 and enters Wharton.","m":"Jun","s":"wiki"}],"L":[],"W":[{"t":"Jackie Robinson breaks baseball's colour line with the Brooklyn Dodgers.","m":"Apr","k":"cul"},{"t":"The Marshall Plan to rebuild Europe is announced.","m":"Jun","k":"pol"},{"t":"Bell Labs invents the transistor.","m":"Dec","b":1,"k":"tech"}]},"1948":{"M":[{"t":"Graduates from Harvard Law magna cum laude, one of 12 in a class of 335, and moves to Los Angeles to practise law.","b":1,"s":"lowe"}],"B":[],"L":[],"W":[{"t":"Truman upsets Thomas Dewey in the presidential election.","m":"Nov","k":"pol"}]},"1949":{"M":[],"B":[{"t":"Leaves Wharton after two years for the University of Nebraska.","s":"wiki"}],"L":[],"W":[{"t":"Benjamin Graham publishes The Intelligent Investor.","b":1,"k":"mkt"},{"t":"NATO is founded.","m":"Apr","k":"pol"},{"t":"Mao Zedong proclaims the People's Republic of China.","m":"Oct","k":"world"}]},"1950":{"M":[],"B":[{"t":"At 19, reads The Intelligent Investor, which he later calls by far the best investing book ever written.","b":1,"s":"brk"},{"t":"Graduates from Nebraska. Turned down by Harvard Business School, he enrols at Columbia to learn from Graham and Dodd.","s":"wiki"}],"L":[],"W":[{"t":"North Korea invades the South. The Korean War begins.","m":"Jun","k":"world"}]},"1951":{"M":[],"B":[{"t":"Knocks on GEICO's door in Washington on a Saturday. Lorimer Davidson spends hours explaining insurance to him, and Buffett buys GEICO shares.","m":"Jan","b":1,"s":"wiki"},{"t":"Earns his master's degree at Columbia, then sells securities at his father's Omaha firm, Buffett-Falk & Co.","s":"wiki"}],"L":[],"W":[{"t":"William McChesney Martin becomes Fed chairman; he will serve almost 19 years.","m":"Apr","k":"mkt"},{"t":"I Love Lucy debuts on television.","m":"Oct","k":"cul"}]},"1952":{"M":[],"B":[{"t":"Marries Susan Thompson.","m":"Apr","s":"wiki"}],"L":[],"W":[{"t":"Dwight Eisenhower is elected president.","m":"Nov","k":"pol"}]},"1953":{"M":[{"t":"His first marriage ends in divorce.","s":"wiki"}],"B":[],"L":[],"W":[{"t":"Watson and Crick publish the double-helix structure of DNA.","m":"Apr","k":"tech"},{"t":"An armistice ends the fighting in Korea.","m":"Jul","k":"world"}]},"1954":{"M":[],"B":[{"t":"Joins Graham's firm, Graham-Newman, in New York at $12,000 a year.","m":"Aug","b":1,"s":"wiki"}],"L":[{"t":"His father, a former Boston College maths professor, dies of brain cancer. Peter is 10.","b":1,"s":"si"}],"W":[{"t":"Brown v. Board of Education outlaws segregated public schools.","m":"May 17","b":1,"k":"pol"},{"t":"The Dow closes above its 1929 peak for the first time, 25 years later.","m":"Nov 23","b":1,"k":"mkt"}]},"1955":{"M":[{"t":"His son Teddy dies of leukemia, aged nine.","s":"lowe"}],"B":[],"L":[{"t":"At 11, starts caddying at Brae Burn Country Club, where he hears golfers talk about their stocks.","b":1,"s":"fortune"}],"W":[{"t":"Disneyland opens in California.","m":"Jul","k":"cul"},{"t":"Rosa Parks refuses to give up her bus seat in Montgomery, Alabama.","m":"Dec","k":"pol"}]},"1956":{"M":[{"t":"Marries Nancy Barry Borthwick.","s":"wiki"}],"B":[{"t":"Graham retires. Buffett returns to Omaha and, at 25, starts a partnership with $105,100 from seven family members and friends. His own stake: $100.","m":"May","b":1,"s":"bpl"}],"L":[],"W":[{"t":"The Interstate Highway Act funds a national road network.","m":"Jun","k":"pol"},{"t":"Eisenhower is re-elected.","m":"Nov","k":"pol"}]},"1957":{"M":[],"B":[{"t":"An Omaha doctor, Edwin Davis, invests $100,000 with him because Buffett reminds him of someone named Charlie Munger.","b":1,"s":"cnbc"}],"L":[],"W":[{"t":"Standard & Poor's launches the S&P 500 index.","m":"Mar 4","b":1,"k":"mkt"},{"t":"The Soviet Union launches Sputnik. The space race begins.","m":"Oct 4","b":1,"k":"world"}]},"1958":{"M":[],"B":[{"t":"Buys a house on Farnam Street in Omaha for $31,500. He still lives there decades later.","s":"wiki"}],"L":[],"W":[{"t":"NASA is created.","m":"Jul","k":"tech"},{"t":"American Express launches its charge card.","m":"Oct","k":"mkt"}]},"1959":{"M":[{"t":"Back in Omaha after his father's death, he meets Warren Buffett at a dinner arranged by the Davis family. They hit it off at once.","b":1,"s":"cnbc"}],"B":[{"t":"Meets Charlie Munger. He knows straight away that this is someone he will learn from.","b":1,"s":"cnbc"}],"L":[],"W":[{"t":"Alaska and Hawaii become the 49th and 50th states.","m":"Jan-Aug","k":"pol"},{"t":"Ben-Hur premieres; it wins a record 11 Oscars.","m":"Nov","k":"cul"}]},"1960":{"M":[{"t":"Around now Buffett tells him that law is fine as a hobby, but he could do better.","b":1,"s":"super"}],"B":[{"t":"Takes a large stake in Sanborn Map, whose investments are worth more than its share price, and joins its board.","s":"snow"}],"L":[],"W":[{"t":"Kennedy and Nixon hold the first televised presidential debate.","m":"Sep","k":"pol"},{"t":"John F. Kennedy is elected president.","m":"Nov","k":"pol"}]},"1961":{"M":[],"B":[{"t":"Takes control of Dempster Mill, a Nebraska windmill and pump maker.","s":"snow"}],"L":[{"t":"Enters Boston College on a caddie scholarship.","s":"si"}],"W":[{"t":"Yuri Gagarin becomes the first human in space; the Bay of Pigs invasion of Cuba fails.","m":"Apr","k":"world"}]},"1962":{"M":[{"t":"Founds the law firm now called Munger, Tolles & Olson and starts his own fund, Wheeler, Munger & Co. First year: +30.1% while the Dow falls 7.6%.","b":1,"s":"super"}],"B":[{"t":"Merges his funds into Buffett Partnership, Ltd. and becomes a millionaire. Starts buying a struggling New England textile maker: Berkshire Hathaway.","b":1,"s":"wiki"}],"L":[],"W":[{"t":"The 'Kennedy Slide': a one-day crash caps a sharp fall in stocks.","m":"May 28","k":"mkt"},{"t":"Sam Walton opens the first Walmart, in Arkansas.","m":"Jul","k":"mkt"},{"t":"The Cuban Missile Crisis brings the superpowers to the brink of nuclear war.","m":"Oct","b":1,"k":"world"}]},"1963":{"M":[],"B":[{"t":"The 'salad oil' fraud hammers American Express shares. Buffett checks Omaha restaurants and shops, finds people still using the card, and buys heavily.","m":"Nov","b":1,"s":"snow"}],"L":[{"t":"As a sophomore, buys Flying Tiger, an air-freight company, at about $7 a share. He sells in stages as it climbs, the last near $80, and the profits help pay for graduate school.","b":1,"s":"lynch89"}],"W":[{"t":"Martin Luther King Jr. gives his 'I Have a Dream' speech.","m":"Aug 28","k":"pol"},{"t":"President Kennedy is assassinated in Dallas. Lyndon Johnson takes over.","m":"Nov 22","b":1,"k":"pol"}]},"1964":{"M":[],"B":[{"t":"Berkshire's boss, Seabury Stanton, offers slightly less for Buffett's shares than they had agreed. Angry, Buffett decides to buy control instead.","b":1,"s":"brk"}],"L":[],"W":[{"t":"The Beatles appear on The Ed Sullivan Show.","m":"Feb","k":"cul"},{"t":"The Civil Rights Act becomes law.","m":"Jul 2","b":1,"k":"pol"}]},"1965":{"M":[{"t":"Stops practising law to concentrate on investing.","s":"cnn"}],"B":[{"t":"Takes control of Berkshire Hathaway. Ken Chace runs the mills; Buffett runs the money.","m":"May","b":1,"s":"brk"}],"L":[{"t":"Graduates from Boston College, having studied history, psychology and philosophy rather than business.","b":1,"s":"wiki"}],"W":[{"t":"US combat troops land in Vietnam.","m":"Mar","k":"world"},{"t":"Medicare and Medicaid are created.","m":"Jul","k":"pol"}]},"1966":{"M":[{"t":"With Buffett and Sandy Gottesman, buys a Baltimore department store, Hochschild, Kohn, through a new company, Diversified Retailing. Buffett later calls it a mistake.","s":"brk"}],"B":[{"t":"Closes the partnership to new money. Buys about 5% of Walt Disney Productions and meets Walt Disney himself.","s":"wiki"}],"L":[{"t":"Wins a summer job at Fidelity, one of three picked from about 75 applicants. He had caddied for Fidelity's president, D. George Sullivan.","b":1,"s":"fortune"}],"W":[{"t":"The Dow nears 1,000, then stalls. It will not stay above 1,000 until 1982.","m":"Feb","k":"mkt"}]},"1967":{"M":[],"B":[{"t":"Berkshire buys National Indemnity, an Omaha insurer, for $8.6 million. Its 'float' becomes the engine of Berkshire's investing.","m":"Mar","b":1,"s":"brk"}],"L":[],"W":[{"t":"The first Super Bowl is played.","m":"Jan","k":"cul"},{"t":"Muriel Siebert becomes the first woman to own a seat on the New York Stock Exchange.","m":"Dec","k":"mkt"}]},"1968":{"M":[],"B":[{"t":"The partnership's best year ever: +58.8% against +7.7% for the Dow.","b":1,"s":"bpl"}],"L":[{"t":"Earns his MBA at Wharton and marries Carolyn Hoff. Then two years in the Army, in Texas and Korea.","b":1,"s":"lynch89"}],"W":[{"t":"Martin Luther King Jr. is assassinated. Robert Kennedy is killed in June.","m":"Apr 4","k":"pol"},{"t":"A paperwork crisis closes the New York Stock Exchange on Wednesdays.","m":"Jun-Dec","k":"mkt"},{"t":"Richard Nixon is elected president.","m":"Nov","k":"pol"}]},"1969":{"M":[],"B":[{"t":"Tells partners he will close the partnership: the market is too speculative and bargains too scarce. They can take cash or Berkshire shares.","m":"May","b":1,"s":"bpl"}],"L":[{"t":"Joins Fidelity full time as an analyst covering textiles, metals, mining and chemicals.","b":1,"s":"time"}],"W":[{"t":"Apollo 11: Neil Armstrong walks on the Moon.","m":"Jul 20","b":1,"k":"world"},{"t":"The Woodstock festival.","m":"Aug","k":"cul"},{"t":"The first message travels over ARPANET, the internet's ancestor.","m":"Oct","k":"tech"}]},"1970":{"M":[],"B":[{"t":"Becomes chairman of Berkshire Hathaway, at a salary of $50,000 a year."," :[{"t":"Nixon resigns over Watergate. Gerald Ford becomes president.","m":"Aug 9","b":1,"k":"pol"},{"t":"The Dow bottoms near 578, down about 45% from its 1973 peak.","m":"Dec","k":"mkt"},{"t":"ERISA sets rules for private pension plans.","m":"Sep","k":"mkt"}]},"1975":{"M":[{"t":"His partnership rebounds 73.2%. Over 1962-75 it compounded 19.8% a year, against 5.0% for the Dow.","b":1,"s":"super"}],"B":[],"L":[],"W":[{"t":"'May Day': fixed brokerage commissions end and trading costs fall.","m":"May 1","k":"mkt"},{"t":"John Bogle founds Vanguard.","m":"May","b":1,"k":"mkt"},{"t":"Bill Gates and Paul Allen found Microsoft. Saigon falls on April 30.","m":"Apr","k":"tech"},{"t":"Jaws invents the summer blockbuster.","m":"Jun","k":"cul"}]},"1976":{"M":[{"t":"Winds up Wheeler, Munger & Co.","s":"wiki"}],"B":[{"t":"GEICO nears collapse. Buffett backs its new boss, Jack Byrne, and Berkshire buys a big stake, helping to rescue it.","b":1,"s":"brk"}],"L":[],"W":[{"t":"Steve Jobs and Steve Wozniak found Apple.","m":"Apr 1","k":"tech"},{"t":"America celebrates its 200th birthday.","m":"Jul 4","b":1,"k":"pol"},{"t":"Vanguard launches the first index fund for ordinary investors.","m":"Aug 31","b":1,"k":"mkt"},{"t":"Jimmy Carter is elected president.","m":"Nov","k":"pol"}]},"1977":{"M":[{"t":"Begins 45 years as chairman of Daily Journal Corp., the Los Angeles legal newspaper he bought into.","b":1,"s":"reuters"}],"B":[{"t":"Berkshire buys the Buffalo Evening News for $32.5 million. His 1977 letter is the first in Berkshire's online archive.","m":"Apr","s":"brk"}],"L":[{"t":"At 33, takes over Fidelity's small Magellan Fund, then about $18 million.","m":"May","b":1,"s":"wiki"}],"W":[{"t":"Star Wars premieres.","m":"May 25","b":1,"k":"cul"},{"t":"The Apple II goes on sale.","m":"Jun","k":"tech"}]},"1978":{"M":[{"t":"Becomes vice chairman of Berkshire Hathaway: the start of 45 years at Buffett's side.","b":1,"s":"reuters"},{"t":"In his 50s, a failed cataract operation costs him the sight of his left eye; the eye is later removed.","s":"inman"}],"B":[],"L":[],"W":[{"t":"The Revenue Act of 1978 creates the 401(k) retirement plan.","m":"Nov","k":"mkt"},{"t":"The Camp David Accords between Egypt and Israel.","m":"Sep","k":"world"}]},"1979":{"M":[],"B":[{"t":"Writes in Forbes that pension funds shunning stocks are paying a very high price for a cheery consensus. Berkshire's shares more than double this year.","m":"Aug","s":"forbes"}],"L":[],"W":[{"t":"Paul Volcker becomes Fed chairman to fight inflation.","m":"Aug","b":1,"k":"mkt"},{"t":"BusinessWeek's cover declares 'The Death of Equities'.","m":"Aug 13","b":1,"k":"mkt"},{"t":"The Three Mile Island nuclear accident.","m":"Mar","k":"world"},{"t":"The Iran hostage crisis begins.","m":"Nov","k":"world"}]},"1980":{"M":[],"B":[],"L":[],"W":[{"t":"Inflation peaks near 15%. By December the prime rate reaches 21.5%.","m":"Mar","k":"mkt"},{"t":"CNN launches 24-hour news.","m":"Jun","k":"cul"},{"t":"Ronald Reagan is elected president.","m":"Nov","k":"pol"}]},"1981":{"M":[],"B":[],"L":[{"t":"Magellan opens to the public for the first time since 1965. Money starts to pour in.","m":"Jul","b":1,"s":"fidelity"}],"W":[{"t":"Reagan takes office; the Iran hostages are freed.","m":"Jan 20","k":"pol"},{"t":"IBM launches its personal computer.","m":"Aug","k":"tech"},{"t":"MTV launches.","m":"Aug","k":"cul"}]},"1982":{"M":[],"B":[{"t":"Appears on the first Forbes 400 list of the richest Americans.","s":"forbes"}],"L":[{"t":"Magellan has the best five-year record of any fund, and the press takes notice.","b":1,"s":"pbs96"}],"W":[{"t":"The great bull market begins, with the Dow near 777.","m":"Aug 12","b":1,"k":"mkt"},{"t":"E.T. the Extra-Terrestrial premieres.","m":"Jun","k":"cul"}]},"1983":{"M":[],"B":[{"t":"On his 53rd birthday, buys 90% of Nebraska Furniture Mart from Rose 'Mrs. B' Blumkin, 89, for about $55 million, on a handshake and a one-page contract.","m":"Aug 30","b":1,"s":"brk"},{"t":"Blue Chip Stamps merges into Berkshire.","s":"brk"}],"L":[{"t":"Magellan passes $1 billion.","m":"Apr","b":1,"s":"fidelity"}],"W":[{"t":"ARPANET switches to TCP/IP, often called the internet's birthday.","m":"Jan 1","k":"tech"},{"t":"Return of the Jedi premieres.","m":"May","k":"cul"}]},"1984":{"M":[{"t":"Becomes chairman of Wesco Financial, a post he holds until 2011.","s":"reuters"}],"B":[{"t":"At Columbia, gives 'The Superinvestors of Graham-and-Doddsville': Graham's students beat the market again and again. Munger's record is one of his examples.","m":"May 17","b":1,"s":"super"}],"L":[],"W":[{"t":"Apple launches the Macintosh.","m":"Jan","k":"tech"},{"t":"AT&T is broken up.","m":"Jan 1","k":"mkt"},{"t":"Los Angeles hosts the Olympics.","m":"Jul","k":"cul"}]},"1985":{"M":[],"B":[{"t":"Agrees to put up $517 million to help Capital Cities buy ABC. Later in the year, closes Berkshire's last textile mills.","m":"Mar","b":1,"s":"brk"}],"L":[],"W":[{"t":"New Coke flops, and Coca-Cola brings back the original formula.","m":"Apr-Jul","k":"mkt"},{"t":"Back to the Future premieres.","m":"Jul","k":"cul"},{"t":"The Plaza Accord pushes the dollar down.","m":"Sep","k":"mkt"}]},"1986":{"M":[{"t":"At a Los Angeles school graduation, explains how to guarantee a miserable life: turn the question upside down.","m":"Jun 13","b":1,"s":"pca"}],"B":[{"t":"Berkshire buys Scott Fetzer, maker of Kirby vacuums and World Book, for about $315 million.","m":"Jan","s":"brk"}],"L":[{"t":"Magellan takes in $2.3 billion of new money in one year, more than half its size at the start of the year.","s":"cbs"}],"W":[{"t":"The space shuttle Challenger explodes.","m":"Jan 28","k":"world"},{"t":"Microsoft goes public.","m":"Mar 13","k":"mkt"},{"t":"Ivan Boesky is charged with insider trading.","m":"Nov","k":"mkt"}]},"1987":{"M":[],"B":[{"t":"Berkshire invests $700 million in Salomon Inc. preferred stock.","m":"Sep","s":"wiki"},{"t":"In the crash, Berkshire's shares fall from about $3,890 to $3,170 within days. Berkshire still ends the year up 4.6%.","m":"Oct","s":"brk"}],"L":[{"t":"On Black Monday he is in Ireland, on his first trip there. Magellan loses about a third of its value in two days, and he cuts the trip short.","m":"Oct","b":1,"s":"novel"}],"W":[{"t":"Black Monday: the Dow falls 22.6% in a single day, still its worst day ever.","m":"Oct 19","b":1,"k":"mkt"},{"t":"Alan Greenspan becomes Fed chairman, two months before the crash.","m":"Aug","k":"mkt"},{"t":"The film Wall Street premieres.","m":"Dec","k":"cul"}]},"1988":{"M":[],"B":[{"t":"Begins buying Coca-Cola: about $1 billion of shares by early 1989. Berkshire lists on the New York Stock Exchange.","b":1,"s":"wiki"}],"L":[],"W":[{"t":"George H. W. Bush is elected president.","m":"Nov","k":"pol"},{"t":"KKR wins RJR Nabisco for $25 billion, the 'Barbarians at the Gate' buyout.","m":"Dec","k":"mkt"}]},"1989":{"M":[],"B":[{"t":"Quotes Lynch's line about selling winners being like pulling out the flowers and watering the weeds. Reveals Berkshire owns about 7% of Coca-Cola.","m":"Feb","s":"qi"}],"L":[{"t":"Publishes One Up on Wall Street with John Rothchild: ordinary people can beat the professionals by investing in what they know. It sells more than a million copies.","b":1,"s":"wiki"},{"t":"Warren Buffett calls him at home, out of the blue, to ask if he may quote a line from the book in Berkshire's annual letter.","s":"qi"}],"W":[{"t":"The Exxon Valdez oil spill.","m":"Mar","k":"world"},{"t":"The Berlin Wall falls.","m":"Nov 9","b":1,"k":"world"},{"t":"Japan's Nikkei peaks. It will take 34 years to regain that level.","m":"Dec 29","k":"mkt"}]},"1990":{"M":[],"B":[{"t":"Buys about 10% of Wells Fargo during a banking scare.","s":"brk"}],"L":[{"t":"Quits Magellan at 46, at the top, to spend more time with his family. The fund has grown from $18 million to about $14 billion; $1,000 invested in 1977 is worth about $28,000.","m":"May","b":1,"s":"time"}],"W":[{"t":"Drexel Burnham Lambert, the junk-bond firm, goes bankrupt.","m":"Feb","k":"mkt"},{"t":"Iraq invades Kuwait.","m":"Aug 2","k":"world"},{"t":"The Hubble Space Telescope is launched.","m":"Apr","k":"tech"}]},"1991":{"M":[],"B":[{"t":"A trading scandal threatens Salomon. Buffett steps in as interim chairman and tells Congress: \"lose a shred of reputation for the firm, and I will be ruthless.\"","m":"Aug","b":1,"s":"brk"}],"L":[{"t":"Elected to the American Academy of Arts and Sciences.","s":"amacad"}],"W":[{"t":"Operation Desert Storm drives Iraq out of Kuwait.","m":"Jan","k":"world"},{"t":"The World Wide Web goes public.","m":"Aug","k":"tech"},{"t":"The Soviet Union dissolves.","m":"Dec 26","b":1,"k":"world"}]},"1992":{"M":[],"B":[],"L":[],"W":[{"t":"'Black Wednesday': George Soros profits as Britain is forced out of Europe's exchange-rate system.","m":"Sep 16","k":"mkt"},{"t":"Bill Clinton is elected president.","m":"Nov","k":"pol"}]},"1993":{"M":[],"B":[{"t":"Buys Dexter Shoe with Berkshire shares, a deal he later ranks among his worst. Forbes names him the richest American.","s":"brk"}],"L":[{"t":"Publishes Beating the Street, telling how he picked stocks at Magellan.","b":1,"s":"wiki"}],"W":[{"t":"The first US exchange-traded fund, the S&P 500 'Spider' (SPY), launches.","m":"Jan","b":1,"k":"mkt"},{"t":"A truck bomb explodes under the World Trade Center.","m":"Feb","k":"world"},{"t":"Jurassic Park premieres; Schindler's List follows in December.","m":"Jun","k":"cul"}]},"1994":{"M":[{"t":"At USC's business school, gives 'A Lesson on Elementary Worldly Wisdom': think with a latticework of models from many fields.","m":"Apr","b":1,"s":"pca"}],"B":[],"L":[{"t":"Writes the foreword to Robert Hagstrom's The Warren Buffett Way.","s":"wiley"}],"W":[{"t":"The Fed starts a run of surprise rate rises; bond prices tumble.","m":"Feb","k":"mkt"},{"t":"Jeff Bezos founds Amazon.","m":"Jul","k":"tech"},{"t":"Forrest Gump and The Shawshank Redemption reach cinemas.","k":"cul"}]},"1995":{"M":[{"t":"At Harvard, gives 'The Psychology of Human Misjudgment', hi  to tighten corporate accounting.","m":"Jul","k":"mkt"},{"t":"The bear market hits bottom: the S&P 500 is down about half from its 2000 peak.","m":"Oct 9","b":1,"k":"mkt"},{"t":"Euro notes and coins go into circulation.","m":"Jan","k":"world"}]},"2003":{"M":[{"t":"At UC Santa Barbara, takes academic economics to task for ignoring psychology and other fields.","m":"Oct","s":"pca"}],"B":[{"t":"In his letter for 2002, calls derivatives \"financial weapons of mass destruction.\" Buys Clayton Homes and McLane.","m":"Mar","b":1,"s":"brk"}],"L":[],"W":[{"t":"The Iraq War begins.","m":"Mar 20","k":"world"},{"t":"The space shuttle Columbia breaks up on re-entry.","m":"Feb 1","k":"world"},{"t":"The Human Genome Project is completed.","m":"Apr","k":"tech"}]},"2004":{"M":[{"t":"Gives Stanford Berkshire shares worth $43.5 million for graduate housing.","s":"wiki"}],"B":[{"t":"His wife, Susan Thompson Buffett, dies.","m":"Jul 29","b":1,"s":"wiki"}],"L":[],"W":[{"t":"Facebook is founded at Harvard.","m":"Feb","k":"tech"},{"t":"Google goes public.","m":"Aug 19","k":"mkt"},{"t":"The Indian Ocean tsunami kills about 230,000 people.","m":"Dec 26","k":"world"}]},"2005":{"M":[{"t":"Peter Kaufman publishes Poor Charlie's Almanack, a collection of his talks and wit.","b":1,"s":"caltech"}],"B":[],"L":[],"W":[{"t":"Hurricane Katrina devastates New Orleans.","m":"Aug","k":"world"},{"t":"YouTube is founded.","m":"Feb","k":"tech"}]},"2006":{"M":[],"B":[{"t":"Pledges most of his fortune to charity, mainly to the Bill & Melinda Gates Foundation, the biggest gift in history at the time.","m":"Jun 26","b":1,"s":"wiki"},{"t":"Marries Astrid Menks on his 76th birthday. Earlier, buys 80% of Israeli toolmaker Iscar for $4 billion.","m":"Aug 30","s":"wiki"}],"L":[],"W":[{"t":"Ben Bernanke becomes Fed chairman.","m":"Feb","k":"mkt"},{"t":"US house prices peak.","k":"mkt"},{"t":"Twitter is launched.","m":"Mar","k":"tech"}]},"2007":{"M":[],"B":[{"t":"Sells PetroChina for about $4 billion, builds a stake in the railroad Burlington Northern and agrees to buy Marmon. Takes up a $1 million bet that an S&P 500 index fund will beat a group of hedge funds over the 10 years from 2008.","s":"brk"}],"L":[],"W":[{"t":"Steve Jobs unveils the iPhone.","m":"Jan 9","b":1,"k":"tech"},{"t":"A French bank freezes funds holding US subprime loans; the credit crunch begins.","m":"Aug 9","k":"mkt"},{"t":"The Dow peaks above 14,000.","m":"Oct 9","k":"mkt"}]},"2008":{"M":[{"t":"His idea: Berkshire buys about 10% of Chinese carmaker and battery maker BYD for about $230 million.","m":"Sep","b":1,"s":"cnbc"}],"B":[{"t":"As Wall Street panics, invests $5 billion in Goldman Sachs and $3 billion in General Electric, then writes in The New York Times: \"Buy American. I Am.\"","m":"Sep-Oct","b":1,"s":"nyt"},{"t":"Forbes ranks him the richest person in the world.","m":"Mar","s":"forbes"}],"L":[],"W":[{"t":"JPMorgan rescues Bear Stearns.","m":"Mar","k":"mkt"},{"t":"Lehman Brothers goes bankrupt; the government rescues AIG.","m":"Sep 15","b":1,"k":"mkt"},{"t":"Congress passes the $700 billion TARP bailout.","m":"Oct 3","k":"mkt"},{"t":"Barack Obama is elected president.","m":"Nov 4","b":1,"k":"pol"},{"t":"Bernie Madoff is arrested.","m":"Dec 11","k":"mkt"}]},"2009":{"M":[{"t":"Near the market bottom, Daily Journal, which he chairs, buys shares in big US banks.","s":"dj"}],"B":[{"t":"Agrees to buy the rest of Burlington Northern Santa Fe, calling it an all-in bet on the US economy. The deal values the railroad at about $44 billion including debt.","m":"Nov 3","b":1,"s":"brk"}],"L":[],"W":[{"t":"The S&P 500 bottoms at 677, down about 57% from its 2007 peak.","m":"Mar 9","b":1,"k":"mkt"},{"t":"General Motors goes bankrupt.","m":"Jun 1","k":"mkt"},{"t":"Avatar premieres; it becomes the highest-grossing film ever.","m":"Dec","k":"cul"}]},"2010":{"M":[{"t":"His wife, Nancy, dies at 86.","m":"Feb 6","s":"wiki"}],"B":[{"t":"With Bill and Melinda Gates, launches the Giving Pledge, asking the very rich to give away most of their wealth.","m":"Jun","b":1,"s":"wiki"},{"t":"The Burlington Northern purchase closes; hires investment manager Todd Combs.","s":"brk"}],"L":[{"t":"The Lynch Foundation gives $20 million to create a leadership academy at Boston College.","s":"wiki"}],"W":[{"t":"The 'Flash Crash' knocks nearly 1,000 points off the Dow in minutes.","m":"May 6","k":"mkt"},{"t":"The Dodd-Frank Act reshapes financial regulation.","m":"Jul 21","k":"mkt"},{"t":"The Deepwater Horizon oil spill in the Gulf of Mexico.","m":"Apr 20","k":"world"}]},"2011":{"M":[{"t":"Wesco merges into Berkshire, ending his annual Wesco meetings in Pasadena.","s":"wiki"}],"B":[{"t":"Receives the Presidential Medal of Freedom from President Obama.","m":"Feb 15","b":1,"s":"wiki"},{"t":"Buys Lubrizol for about $9 billion and invests $5 billion in Bank of America. In The New York Times, argues that the super-rich should pay more tax.","m":"Mar-Aug","s":"brk"}],"L":[],"W":[{"t":"An earthquake and tsunami in Japan cause the Fukushima nuclear disaster.","m":"Mar 11","k":"world"},{"t":"S&P strips the United States of its AAA credit rating.","m":"Aug 5","b":1,"k":"mkt"},{"t":"Steve Jobs dies.","m":"Oct 5","k":"tech"}]},"2012":{"M":[],"B":[{"t":"Announces he has early-stage prostate cancer; he finishes radiation treatment that year.","m":"Apr","s":"wiki"}],"L":[],"W":[{"t":"Facebook goes public.","m":"May 18","k":"mkt"},{"t":"A software glitch costs Knight Capital $440 million in 45 minutes.","m":"Aug 1","k":"mkt"},{"t":"Hurricane Sandy shuts the stock market for two days.","m":"Oct 29-30","k":"mkt"},{"t":"Obama is re-elected.","m":"Nov","k":"pol"}]},"2013":{"M":[{"t":"Announces a $110 million gift to the University of Michigan.","m":"Apr","s":"wiki"}],"B":[{"t":"Teams up with 3G Capital to buy Heinz for about $23 billion.","m":"Feb","s":"brk"}],"L":[{"t":"The New York Times profiles him: once a money manager, now a full-time giver.","m":"Nov","s":"nyt13"}],"W":[{"t":"The S&P 500 closes at a record, finally above its 2007 peak.","m":"Mar 28","k":"mkt"},{"t":"The Wolf of Wall Street premieres.","m":"Dec","k":"cul"}]},"2014":{"M":[{"t":"Pledges $65 million to UC Santa Barbara's Kavli Institute for physics.","m":"Oct","s":"wiki"}],"B":[{"t":"Swaps Berkshire's Procter & Gamble shares for the Duracell battery business.","m":"Nov","s":"brk"}],"L":[],"W":[{"t":"Janet Yellen becomes the first woman to chair the Fed.","m":"Feb","k":"mkt"},{"t":"Alibaba raises $25 billion in the biggest share sale yet.","m":"Sep 19","k":"mkt"}]},"2015":{"M":[{"t":"For Berkshire's 50th anniversary, writes his own letter to shareholders for the first time, next to Buffett's.","m":"Feb","b":1,"s":"fortune"}],"B":[{"t":"Looks back on 50 years in his anniversary letter. Later, Kraft merges with Heinz and Berkshire agrees to buy Precision Castparts, one of its biggest deals ever.","m":"Feb","b":1,"s":"brk"}],"L":[{"t":"His wife, Carolyn, co-founder of the Lynch Foundation, dies at 69.","m":"Oct","s":"wiki"}],"W":[{"t":"China's stock market crashes.","m":"Jun-Aug","k":"mkt"},{"t":"The Fed raises rates for the first time since 2006.","m":"Dec 16","k":"mkt"},{"t":"The Big Short brings the 2008 crisis to cinemas.","m":"Dec","k":"cul"}]},"2016":{"M":[{"t":"Pledges $200 million to UC Santa Barbara for a huge student dormitory he designs himself.","m":"Mar","s":"wiki"}],"B":[{"t":"Berkshire reveals its first Apple shares. Apple later becomes its biggest stock holding.","m":"May","s":"brk"}],"L":[],"W":[{"t":"Donald Trump is elected president.","m":"Nov 8","b":1,"k":"pol"},{"t":"Britain votes to leave the European Union.","m":"Jun 23","k":"world"},{"t":"Google's AlphaGo beats Go champion Lee Sedol.","m":"Mar","k":"tech"}]},"2017":{"M":[],"B":[{"t":"Wins his 10-year, $1 million bet: the S&P 500 index fund beats the hand-picked hedge funds by a wide margin.","m":"Dec 31","b":1,"s":"brk"}],"L":[],"W":[{"t":"Bitcoin nears $20,000.","m":"Dec","k":"mkt"},{"t":"The Tax Cuts and Jobs Act cuts the corporate tax rate to 21%.","m":"Dec 22","k":"mkt"}]},"2018":{"M":[],"B":[{"t":"Makes Greg Abel and Ajit Jain vice chairmen, a clear step towards succession.","m":"Jan","s":"reuters"}],"L":[],"W":[{"t":"The Dow falls 1,175 points, its biggest point drop to that date.","m":"Feb 5","k":"mkt"},{"t":"Apple becomes the first US company worth $1 trillion.","m":"Aug 2","b":1,"k":"mkt"},{"t":"A Christmas Eve sell-off caps the worst December since 1931.","m":"Dec","k":"mkt"}]},"2019":{"M":[],"B":[{"t":"Admits Berkshire overpaid for Kraft Heinz after a $15.4 billion write-down. Commits $10 billion to help Occidental Petroleum buy Anadarko.","m":"Feb-Apr","s":"brk"}],"L":[],"W":[{"t":"Avengers: Endgame passes Avatar as the highest-grossing film.","m":"Jul","k":"cul"},{"t":"Saudi Aramco's share sale is the largest ever.","m":"Dec","k":"mkt"}]},"2020":{"M":[],"B":[{"t":"Holds the annual meeting in an empty arena, with Greg Abel beside him; Munger stays home in Los Angeles. Reveals Berkshire has sold all its airline shares.","m":"May 2","s":"cnbc"},{"t":"On his 90th birthday, reveals stakes of about 5% in each of five Japanese trading houses.","m":"Aug 30","b":1,"s":"cnbc"}],"L":[],"W":[{"t":"COVID-19: the S&P 500 falls 34% in 33 days, the fastest bear market ever. Trading halts four times in March.","m":"Feb-Mar","b":1,"k":"mkt"},{"t":"The $2.2 trillion CARES Act.","m":"Mar 27","k":"mkt"},{"t":"Joe Biden is elected president.","m":"Nov","k":"pol"}]},"2021":{"M":[{"t":"At the annual meeting, lets slip that Greg Abel will keep Berkshire's culture. Days later Buffett confirms Abel as his successor.","m":"May 1","b":1,"s":"cnbc"},{"t":"His windowless design for the Munger Hall dormitory sparks a public row.","m":"Oct","s":"wiki"}],"B":[],"L":[{"t":"At an MIT conference, calls Buffett the greatest investor of all time.","m":"Mar","s":"ritholtz"}],"W":[{"t":"Rioters storm the US Capitol.","m":"Jan 6","k":"pol"},{"t":"The GameStop short squeeze.","m":"Jan","k":"mkt"}]},"2022":{"M":[{"t":"Steps down as chairman of Daily Journal after 45 years, at 98.","m":"Mar","s":"reuters"}],"B":[{"t":"Buys big stakes in Occidental and Chevron and agrees to buy Alleghany for $11.6 billion. Berkshire's shares rise 4.0% while the S&P 500 falls 18.1%.","s":"brk"}],"L":[],"W":[{"t":"Russia invades Ukraine.","m":"Feb 24","b":1,"k":"world"},{"t":"The Fed starts its fastest rate rises since the 1980s.","m":"Mar","k":"mkt"},{"t":"The FTX crypto exchange collapses.","m":"Nov","k":"mkt"},{"t":"ChatGPT is released.","m":"Nov 30","b":1,"k":"tech"}]},"2023":{"M":[{"t":"Dies at 99 in a Santa Barbara hospital, 34 days before his 100th birthday. Buffett says Berkshire could not have been built without him.","m":"Nov 28","b":1,"s":"ap"}],"B":[{"t":"Visits Japan and raises Berkshire's stakes in the trading houses.","m":"Apr","s":"cnbc"}],"L":[{"t":"In interviews, talks about his biggest misses, like Apple, and says of rapid trading: \"That's not investing. That's gambling.\"","s":"yahoo23"}],"W":[{"t":"Silicon Valley Bank fails.","m":"Mar 10","k":"mkt"},{"t":"Nvidia passes $1 trillion in market value.","m":"May 30","k":"mkt"},{"t":"Oppenheimer and Barbie open on the same day.","m":"Jul","k":"cul"}]},"2024":{"M":[],"B":[{"t":"Opens his annual letter with a tribute: 'Charlie Munger - The Architect of Berkshire Hathaway'.","m":"Feb 24","b":1,"s":"brk"},{"t":"Berkshire becomes the first US company outside technology worth $1 trillion. During the year it sells much of its Apple stake.","m":"Aug 28","b":1,"s":"cnbc"}],"L":[{"t":"Turns 80.","m":"Jan 19"}],"W":[{"t":"US regulators approve spot bitcoin ETFs.","m":"Jan 10","k":"mkt"},{"t":"Japan's Nikkei finally passes its 1989 peak.","m":"Feb","k":"mkt"},{"t":"Donald Trump wins a second term.","m":"Nov 5","k":"pol"}]},"2025":{"M":[],"B":[{"t":"At his 60th annual meeting as CEO, warns that trade should not be used as a weapon, then surprises everyone: Greg Abel will become CEO at year-end. The board agrees the next day.","m":"May 3","b":1,"s":"ap"},{"t":"Berkshire agrees to buy OxyChem for $9.7 billion, probably his last big deal as CEO.","m":"Oct 2","s":"bloomberg"},{"t":"In a Thanksgiving letter, says he is \"going quiet\" and will no longer write the annual letter.","m":"Nov 10","b":1,"s":"fortune"}],"L":[{"t":"The Museum of American Finance gives him its Lifetime Achievement Award.","s":"moaf"}],"W":[{"t":"Trump begins his second term.","m":"Jan 20","k":"pol"},{"t":"A cheap Chinese AI model, DeepSeek, knocks about $590 billion off Nvidia in a day.","m":"Jan 27","k":"mkt"},{"t":"'Liberation Day' tariffs: the S&P 500 drops 10.5% in two days and nearly 20% from its peak before most tariffs are paused.","m":"Apr 2-9","b":1,"k":"mkt"},{"t":"Leo XIV becomes the first American pope.","m":"May 8","k":"world"},{"t":"Nvidia becomes the first company worth $5 trillion.","m":"Oct 29","k":"mkt"},{"t":"The longest government shutdown in US history: 43 days.","m":"Oct-Nov","k":"pol"}]},"2026":{"M":[{"t":"At the meeting, Berkshire retires a jersey for him too, with the number 45: his years as vice chairman.","m":"May 2","s":"fortune26"}],"B":[{"t":"Greg Abel becomes CEO. Buffett, 95, stays chairman and still comes to the office five days a week.","m":"Jan 1","b":1,"s":"yahoo26"},{"t":"For the first time in 60 years, the annual letter is not his: Abel writes it.","m":"Feb 28","s":"ap"},{"t":"Watches the annual meeting from the front row while Abel runs it. Berkshire retires a jersey for him with the number 60, his years as CEO.","m":"May 2","b":1,"s":"fortune26"},{"t":"At 96, steps down as chairman and becomes chairman emeritus. His son Howard, a director since 1993, becomes chairman.","m":"Sep 18","b":1,"s":"ap"},{"t":"In his Thanksgiving letter, gives about $5.5 billion of Berkshire shares to four family foundations and writes that kindness compounds.","m":"Nov 16","s":"fox"}],"L":[{"t":"Turns 82. Still vice chairman of Fidelity Management & Research, meeting its young analysts several times a year.","m":"Jan 19","s":"moaf"}],"W":[{"t":"The United States and Israel strike Iran. Oil heads towards $120 as the Strait of Hormuz closes.","m":"Feb 28","b":1,"k":"world"},{"t":"After a wobble, the S&P 500 hits new records, led by AI companies.","m":"Apr","k":"mkt"},{"t":"Kevin Warsh succeeds Jerome Powell as Fed chairman.","m":"May 22","k":"mkt"},{"t":"America turns 250.","m":"Jul 4","b":1,"k":"pol"},{"t":"The United States, Canada and Mexico host the FIFA World Cup.","m":"Jun-Jul","k":"cul"},{"t":"Americans vote in the midterm elections.","m":"Nov 3","k":"pol"}]}},"threads":{"1924":"The mutual fund is born in Boston the year Munger is born. Twenty years later Lynch is born near Boston; one day he will run the biggest fund of its kind.","1930":"Tariffs then and now: Smoot-Hawley deepened the slump. In 2025, new tariffs sent stocks down nearly 20%, and Buffett, born in 1930, warned against using trade as a weapon.","1934":"Graham and Dodd's book appears when Buffett is four. Sixteen years later he enrols at Columbia to learn from them in person.","1949":"The Intelligent Investor comes out. Within a year it changes Buffett's life.","1957":"The S&P 500 is born in the first full year of Buffett's partnership.","1959":"Lynch, 15, is carrying golf bags near Boston the year Buffett and Munger meet in Omaha.","1966":"Lynch walks into Fidelity as a summer intern the year Buffett closes his partnership to new money.","1972":"See's Candies is bought in January; in November the Dow passes 1,000. Lynch is a 28-year-old analyst.","1977":"Lynch takes over Magellan; Munger starts chairing Daily Journal; Buffett writes the first letter in Berkshire's online archive. All in one year.","1987":"All three in one storm: Buffett had just bought into Salomon, Munger was his vice chairman, and Lynch was on a golf trip in Ireland.","1990":"Lynch retires at 46. At 46, Buffett was rescuing GEICO and Munger was running his own fund.","2000":"The index fund overtakes Magellan, the fund Lynch built, just as the dot-com bubble bursts.","2008":"Munger's idea (BYD) and Buffett's nerve (Goldman Sachs, GE) in the same autumn.","2023":"Munger dies 34 days short of 100, after 64 years of friendship with Buffett.","2026":"For the first time since 1970, Buffett is neither CEO nor chairman of Berkshire."},"crossings":[{"y":1938,"who":"MB","lab":"1930s","t":"Same grocery, different years","d":"As a teenager Munger worked at Buffett & Son, the Omaha grocery owned by Warren's grandfather. Warren worked there too, later. They did not meet."},{"y":1957,"who":"MB","lab":"1957","t":"A doctor's hunch","d":"Dr. Edwin Davis invests $100,000 with Buffett because he reminds him of Charlie Munger. The Davises are determined to introduce them."},{"y":1959,"who":"MB","lab":"1959","t":"First meeting","d":"Back in Omaha after his father's death, Munger meets Buffett at a dinner arranged by the Davis family. Buffett knows at once he has found someone to learn from."},{"y":1960,"who":"MB","lab":"c. 1960","t":"Law as a hobby","d":"Buffett tells Munger that law is fine as a hobby, but he could do better. Two years later Munger starts his own fund."},{"y":1966,"who":"MB","lab":"1966","t":"Partners in a store","d":"With Sandy Gottesman they buy the Baltimore department store Hochschild, Kohn. It is a mistake, and an early lesson for both."},{"y":1972,"who":"MB","lab":"1972","t":"See's Candies","d":"Munger persuades Buffett to pay up for a great business. See's becomes the model for Berkshire's later buys."},{"y":1978,"who":"MB","lab":"1978","t":"Vice chairman","d":"Munger formally joins Berkshire as vice chairman: the start of 45 years side by side."},{"y":1984,"who":"MB","lab":"1984","t":"Superinvestors","d":"Buffett's famous Columbia talk uses Munger's partnership record as proof that Graham's way works."},{"y":1989,"who":"BL","lab":"1989","t":"The phone call","d":"Buffett phones Lynch at home to ask if he may quote One Up on Wall Street in his annual letter. Lynch's daughter takes the call."},{"y":1994,"who":"BL","lab":"1994","t":"The foreword","d":"Lynch writes the foreword to The Warren Buffett Way."},{"y":2008,"who":"MB","lab":"2008","t":"BYD","d":"Munger champions the Chinese carmaker BYD, and Berkshire buys about 10% of it."},{"y":2015,"who":"MB","lab":"2015","t":"Two letters","d":"For Berkshire's 50th anniversary each writes his own letter to shareholders, side by side."},{"y":2021,"who":"BL","lab":"2021","t":"The greatest","d":"Lynch calls Buffett the greatest investor of all time."},{"y":2021,"who":"MB","lab":"2021","t":"The slip","d":"Munger lets slip at the annual meeting that Greg Abel will keep the culture. Buffett confirms Abel as his successor."},{"y":2023,"who":"MB","lab":"2023","t":"Goodbye, Charlie","d":"Munger dies at 99. Buffett says Berkshire could not have been built to what it is without him."},{"y":2026,"who":"MB","lab":"2026","t":"Two jerseys","d":"Berkshire retires a '60' jersey for Buffett and a '45' jersey for Munger at the first meeting run by Greg Abel."}],"storms":[{"id":"1929","name":"The Great Crash","years":[1929,1932],"when":"Sep 1929 to Jul 1932","drop":89,"index":"Dow","what":"Wall Street crashes in October 1929 and keeps falling for almost three years. Banks fail and a quarter of workers lose their jobs.","M":"Aged 5 to 8 in Omaha.","B":"Born in August 1930, in the middle of it. In 1931 the bank where his father works fails.","L":"Not yet born."},{"id":"1937","name":"The 1937 relapse","years":[1937,1938],"when":"1937 to 1938","drop":null,"index":"","what":"Just as the economy recovers, a new recession hits. Stocks lose about 35% in 1937 alone.","M":"A 13-year-old in Omaha.","B":"Six or seven, already selling things for a profit.","L":"Not yet born."},{"id":"1962","name":"The Kennedy Slide","years":[1962,1962],"when":"Dec 1961 to Jun 1962","drop":null,"index":"","what":"A sharp fall in the first half of 1962, with a one-day crash on May 28.","M":"Starts his own fund this year and makes +30.1% while the Dow falls 7.6%.","B":"His partnership makes +13.9% against -7.6% for the Dow.","L":"18, at Boston College."},{"id":"1973","name":"The 1973-74 crash","years":[1973,1974],"when":"Jan 1973 to Oct 1974","drop":48,"index":"S&P 500","what":"Oil shock, inflation and Watergate. The 'Nifty Fifty' favourites collapse and the S&P 500 loses nearly half its value.","M":"His fund loses 31.9% and then 31.5%. He holds on, and in 1975 it rebounds 73.2%.","B":"Buys a stake in the Washington Post in 1973. Berkshire's shares fall 48.7% in 1974, yet he tells Forbes: \"Now is the time to invest and get rich.\"","L":"Becomes Fidelity's director of research in 1974."},{"id":"1980","name":"The Volcker squeeze","years":[1980,1982],"when":"1980 to Aug 1982","drop":null,"index":"","what":"The Fed pushes interest rates to record highs to kill inflation. Two recessions follow, then a great bull market starts in August 1982.","M":"Berkshire's vice chairman.","B":"Berkshire's shares rise 31.8% in 1981 while the S&P 500 falls 5%.","L":"Magellan opens to the public in 1981. Later he says: \"Nobody called me to tell me about the recession in 1980 and 1981.\""},{"id":"1987","name":"Black Monday","years":[1987,1987],"when":"19 Oct 1987","drop":23,"index":"Dow, one day","what":"The Dow falls 22.6% in a single day, still its worst day ever. Yet the S&P 500 ends the year slightly up.","M":"Berkshire's vice chairman. Berkshire ends 1987 up 4.6%.","B":"Had just invested $700 million in Salomon. Berkshire's shares drop from about $3,890 to $3,170 within days.","L":"On a golf trip in Ireland. Magellan loses about a third in two days; he cuts the trip short."},{"id":"1998","name":"LTCM and Russia","years":[1998,1998],"when":"Jul to Oct 1998","drop":19,"index":"S&P 500","what":"Russia defaults and the giant hedge fund Long-Term Capital Management nearly collapses. The Fed organises a rescue by Wall Street banks.","M":"Berkshire's vice chairman.","B":"Offers, with AIG and Goldman Sachs, to buy LTCM. The offer is turned down.","L":"Retired from fund management since 1990."},{"id":"2000","name":"The dot-com bust","years":[2000,2002],"when":"Mar 2000 to Oct 2002","drop":49,"index":"S&P 500 (Nasdaq -78%)","what":"The internet bubble bursts. The Nasdaq loses 78% and the S&P 500 about half.","M":"With Buffett, refuses to buy tech stocks he cannot value.","B":"Mocked in 1999 when Berkshire falls 19.9%; proved right in 2000 when it rises 26.6% as the market falls.","L":"Warns in a new edition of his book that very few dot-com investors \"benefit from the full ride.\""},{"id":"2008","name":"The financial crisis","years":[2007,2009],"when":"Oct 2007 to Mar 2009","drop":57,"index":"S&P 500","what":"Subprime loans go bad, Lehman Brothers fails and the financial system nearly freezes.","M":"Champions BYD; near the bottom, Daily Journal buys big-bank shares.","B":"Invests in Goldman Sachs and GE, writes \"Buy American. I Am.\" and agrees to buy Burlington Northern.","L":"Long retired from fund management; in his 60s, at Fidelity."},{"id":"2020","name":"The COVID crash","years":[2020,2020],"when":"19 Feb to 23 Mar 2020","drop":34,"index":"S&P 500","what":"A pandemic shuts the world. The fastest bear market ever, then a fast recovery.","M":"At 96, stays home from Berkshire's empty-arena meeting.","B":"Sells all of Berkshire's airline shares; later buys into five Japanese trading houses.","L":"In his 70s, at Fidelity."},{"id":"2022","name":"The inflation bear","years":[2022,2022],"when":"Jan to Oct 2022","drop":25,"index":"S&P 500","what":"Inflation returns and the Fed raises rates faster than at any time since the 1980s.","M":"Steps down as Daily Journal chairman at 98.","B":"Buys Occidental, Chevron and Alleghany. Berkshire's shares rise 4.0% as the S&P 500 falls 18.1%.","L":"Still at Fidelity, in his late 70s."},{"id":"2025","name":"The tariff shock","years":[2025,2025],"when":"19 Feb to 8 Apr 2025","drop":19,"index":"S&P 500","what":"Sweeping new tariffs send stocks down 10.5% in two days. Most are paused on April 9 and the market recovers to new records.","M":"Died in 2023.","B":"At his last meeting as CEO, says trade can be an act of war, then announces he will step down.","L":"Receives a lifetime achievement award at 81."}],"agePresets":[[11,"At 11, Buffett buys his first stock and Lynch starts carrying golf bags. Munger is an Omaha schoolboy."],[19,"At 19, Buffett reads The Intelligent Investor, Lynch buys Flying Tiger and Munger leaves college for the Army."],[25,"At 25, Buffett starts his partnership and Lynch joins Fidelity full time. Munger is a young Los Angeles lawyer."],[33,"At 33, Lynch takes over Magellan and Buffett buys into American Express after the salad-oil scandal."],[35,"At 35, Munger meets Buffett. In the year he turns 35, Buffett takes control of Berkshire."],[38,"At 38, Munger starts his own fund. In the year he turns 38, Buffett has his best partnership year."],[46,"At 46, Lynch retires. In the year he turns 46, Buffett rescues GEICO."],[54,"At 54, Munger becomes Berkshire's vice chairman. In the year he turns 54, Buffett gives his Superinvestors talk."],[78,"In the year he turns 78, Buffett invests through the 2008 panic."],[95,"In the year he turns 95, Buffett announces he will step down as CEO."],[99,"At 99, Munger dies, still working."]],"quiz":[{"q":"Who was born first?","o":["Warren Buffett","Charlie Munger","Peter Lynch"],"a":1,"x":"Munger was born on 1 January 1924, Buffett in August 1930 and Lynch in January 1944."},{"q":"Which came first?","o":["Buffett buys his first stock","Lynch is born"],"a":0,"x":"Buffett bought his first stock in 1942, aged 11. Lynch was born in January 1944."},{"q":"How old was Lynch when Buffett and Munger first met in 1959?","o":["5","15","25"],"a":1,"x":"He was 15, caddying at a golf club near Boston."},{"q":"Who chaired the Fed on Black Monday, 19 October 1987?","o":["Paul Volcker","Alan Greenspan","Ben Bernanke"],"a":1,"x":"Greenspan had taken over just two months earlier."},{"q":"Which film came out the year Lynch took ov ecial Situations","d":"Runs Fidelity Special Situations from December 1979 to December 2007: about 19.5% a year."},{"a":2008,"b":2009,"l":"Mentor and author","d":"Steps back from running money to mentor younger managers at Fidelity, and writes his own book."},{"a":2010,"b":2014,"l":"China","d":"Moves to Hong Kong in April 2010 to run Fidelity China Special Situations, which he manages until April 2014."},{"a":2014,"b":2026,"l":"Retired, composing","d":"Retires from fund management and composes music, including an opera about Alexander Litvinenko, premiered in 2021."}],"L":[{"a":1953,"b":1974,"l":"East London and Cardiff","d":"Grows up in East London, goes to Stratford Grammar School, then reads history at University College Cardiff, graduating with a First in 1974."},{"a":1974,"b":1983,"l":"Barclays","d":"Works for Barclays Bank, running a branch and then in its finance department. MBA from Henley in 1979."},{"a":1984,"b":1989,"l":"Bank analyst","d":"Banking analyst at W. Greenwell and then BZW, rated the top bank analyst in London."},{"a":1990,"b":1992,"l":"UBS Phillips & Drew","d":"Head of UK company research, until he is sacked in 1992 over Accounting for Growth."},{"a":1992,"b":2009,"l":"Broker boss","d":"Collins Stewart (chief executive from 2000), then Tullett Prebon, one of the biggest brokers between banks."},{"a":2010,"b":2026,"l":"Fundsmith","d":"Founds Fundsmith in 2010 and runs its Equity fund; leaves Tullett Prebon in 2014 to focus on it."}]},"presidents":[{"a":[1880,4],"b":[1885,6],"n":"William Gladstone","s":"Gladstone"},{"a":[1885,6],"b":[1886,2],"n":"Lord Salisbury","s":"Salisbury"},{"a":[1886,2],"b":[1886,7],"n":"William Gladstone","s":"Gladstone"},{"a":[1886,7],"b":[1892,8],"n":"Lord Salisbury","s":"Salisbury"},{"a":[1892,8],"b":[1894,3],"n":"William Gladstone","s":"Gladstone"},{"a":[1894,3],"b":[1895,6],"n":"Lord Rosebery","s":"Rosebery"},{"a":[1895,6],"b":[1902,7],"n":"Lord Salisbury","s":"Salisbury"},{"a":[1902,7],"b":[1905,12],"n":"Arthur Balf ince."}],"longRun":[["14.4%","Keynes's King's fund a year compounded, 1922-46 (UK shares 9.0%)"],["19.5%","Bolton's Special Situations a year, 1979-2007 (UK market about 13.5%)"],["13.8%","Fundsmith Equity a year, Nov 2010-2025 (world shares 12.1%)"],["8.7%","UK shares a year with dividends, 1900-2025"]],"eras":[{"n":1,"a":1883,"b":1901,"title":"Victorian sunset","tag":"An empire at its height","intro":"Britain runs the largest empire in history and London is the world's money market. Keynes is born in Cambridge in 1883. Gold is found in South Africa, the vote widens, and the reign of Queen Victoria ends in 1901.","where":{"M":"A Cambridge boy, then a scholar at Eton.","B":"Not yet born.","L":"Not yet born."}},{"n":2,"a":1902,"b":1913,"title":"The Edwardian years","tag":"Reforms, Dreadnoughts and a young don","intro":"Liberal governments bring old-age pensions and national insurance and curb the House of Lords. Keynes studies at King's, works at the India Office, and returns to Cambridge to teach economics.","where":{"M":"King's College, the India Office, then a Cambridge lecturer and editor.","B":"Not yet born.","L":"Not yet born."}},{"n":3,"a":1914,"b":1918,"title":"The Great War","tag":"The exchange shuts, the Treasury calls","intro":"War closes the London Stock Exchange for five months. Britain borrows heavily to fight. Keynes joins the Treasury and helps run the country's wartime finance.","where":{"M":"A senior Treasury official in his thirties.","B":"Not yet born.","L":"Not yet born."}},{"n":4,"a":1919,"b":1929,"title":"Peace, gold and speculation","tag":"A famous book, a fund and a crash","intro":"Keynes quits the peace talks in protest, and his book about them makes him famous. He speculates, is wiped out, recovers, and starts running money for King's. Britain goes back to gold in 1925; the decade ends in crashes in London and New York.","where":{"M":"Bursar of King's, investor and famous critic of the peace.","B":"Not yet born.","L":"Not yet born."}},{"n":5,"a":1930,"b":1939,"title":"Slump and a new theory","tag":"Off gold, a new method, a war","intro":"The slump bites, Britain leaves the gold standard in 1931 and money becomes cheap. Keynes changes from forecasting the market to picking a few undervalued shares, writes The General Theory, survives a heart attack and a 1937-38 fall, and sets down his three principles.","where":{"M":"At the peak of his fame and his fortune, then ill.","B":"Not yet born.","L":"Not yet born."}},{"n":6,"a":1940,"b":1949,"title":"War and a new order","tag":"Bretton Woods, a death, the NHS","intro":"Britain stands alone in 1940, then wins the war with its allies. Keynes, now a peer, designs much of the post-war money system and dies in 1946. Labour builds the welfare state; the pound is devalued in 1949.","where":{"M":"Treasury adviser and negotiator; dies in April 1946.","B":"Not yet born.","L":"Not yet born."}},{"n":7,"a":1950,"b":1969,"title":"Never had it so good","tag":"Two births and a booming market","intro":"Rationing ends, a new queen is crowned and shares boom in the 1950s. The pound is devalued again in 1967. Anthony Bolton is born in 1950 and Terry Smith in 1953.","where":{"M":"Died in 1946.","B":"A boy, then a pupil at Stowe and a Cambridge student.","L":"A boy in East London."}},{"n":8,"a":1970,"b":1979,"title":"The troubled seventies","tag":"Strikes, inflation and the worst crash","intro":"Decimal money, Europe, oil shocks, strikes and inflation above 25%. UK shares lose half their value in 1974, then more than double in 1975. The decade ends with Margaret Thatcher and the end of exchange controls.","where":{"M":"Died in 1946.","B":"Learns the trade at Keyser Ullman and Schlesinger; joins Fidelity in December 1979.","L":"Cardiff, then Barclays and an MBA."}},{"n":9,"a":1980,"b":1999,"title":"Big Bang and the long boom","tag":"Privatisation, a crash, a scandal","intro":"Privatisations, Big Bang in the City and a long bull market, interrupted by Black Monday in 1987 and the pound's exit from the ERM in 1992. The Bank of England becomes independent in 1997.","where":{"M":"Died in 1946.","B":"Builds Special Situations into the UK's best-known fund.","L":"Top bank analyst, then sacked for Accounting for Growth; builds Collins Stewart."}},{"n":10,"a":2000,"b":2009,"title":"Bust and crisis","tag":"Two crashes in nine years","intro":"The dot-com bubble bursts, then the first British bank run in over a century and the financial crisis. The FTSE 100 halves twice.","where":{"M":"Died in 1946.","B":"Proved right on technology; hands over his fund at the end of 2007.","L":"Floats Collins Stewart and builds Tullett Prebon."}},{"n":11,"a":2010,"b":2026,"title":"New funds, new shocks","tag":"Fundsmith, China, Brexit, COVID","intro":"Austerity, the Brexit vote, a pandemic, a gilt crisis and seven prime ministers in ten years. Smith founds Fundsmith; Bolton runs a China fund, then retires to compose. In January 2026 the FTSE 100 closes above 10,000 for the first time.","where":{"M":"Died in 1946.","B":"Runs a China fund until 2014, then composes music.","L":"Runs Fundsmith: years well ahead of the market, then five behind."}}],"years":{"1883":{"M":[{"t":"Born at 6 Harvey Road, Cambridge. His father is a Cambridge don; his mother is a writer and social reformer.","m":"Jun 5","b":1,"s":"dnb"}],"B":[],"L":[],"W":[{"t":"The volcano Krakatoa erupts in the Dutch East Indies; its ash colours sunsets around the world.","m":"Aug","k":"world"}]},"1884":{"M":[],"B":[],"L":[],"W":[{"t":"An international conference chooses Greenwich as the prime meridian, the starting line for the world's time zones.","m":"Oct","k":"world"},{"t":"The Third Reform Act gives the vote to many more working men in the countryside.","m":"Dec","k":"pol"}]},"1885":{"M":[],"B":[],"L":[],"W":[{"t":"Khartoum falls and General Gordon is killed.","m":"Jan","k":"world"},{"t":"Karl Benz builds his first motor car in Germany.","k":"tech"}]},"1886":{"M":[],"B":[],"L":[],"W":[{"t":"Gold is discovered than double: +152%.","1979":"Exchange controls are abolished in October; in December Bolton launches Special Situations.","1992":"Smith is sacked for exposing accounting tricks the year the Cadbury Report sets new rules on how companies are run.","2007":"Bolton hands over his fund at the end of the year Northern Rock's run starts the financial crisis.","2010":"Two launches in one year: Bolton's China trust in April, Smith's Fundsmith Equity in November.","2014":"Bolton retires in April; in September Smith leaves Tullett Prebon to focus on Fundsmith.","2026":"The FTSE 100 closes above 10,000 for the first time, on 5 January."},"crossings":[{"y":2007,"who":"MB","lab":"2007","t":"Bolton quotes Keynes","d":"Stepping back from his fund, Bolton sets out his lessons in The Spectator under a headline invoking the wisdom of Keynes and Mark Twain."},{"y":2010,"who":"BL","lab":"2010","t":"Two launches","d":"Bolton launches Fidelity China Special Situations in April; Smith launches Fundsmith Equity on 1 November."},{"y":2014,"who":"BL","lab":"2014","t":"Two exits","d":"Bolton retires from running money in April; Smith leaves Tullett Prebon in September to focus on Fundsmith."}],"storms":[{"id":"1914","name":"The exchange shuts","years":[1914,1914],"when":"31 Jul 1914 to 4 Jan 1915","drop":null,"index":"","what":"As war approaches, the London Stock Exchange closes on 31 July 1914 and stays shut for five months.","M":"Aged 31, a Cambridge economist. He writes an account of the City's crisis and joins the Treasury in January 1915.","B":"Not yet born.","L":"Not yet born."},{"id":"1920","name":"The post-war slump","years":[1920,1921],"when":"1920 to 1921","drop":null,"index":"","what":"The post-war boom collapses. UK shares lose 9.3% in 1920 and unemployment soars.","M":"Speculating in currencies with borrowed money, he is wiped out by May 1920. By the end of 1922 he has cleared his debts.","B":"Not yet born.","L":"Not yet born."},{"id":"1929","name":"The Great Crash","years":[1929,1931],"when":"1929 to 1931","drop":null,"index":"","what":"The Hatry fraud shakes London in September 1929, Wall Street crashes in October and the slump spreads. UK shares fall three years running; Britain leaves the gold standard in 1931.","M":"Commodity losses cut his own net worth to under £8,000. His King's fund falls 14.2% and 11.5% in the years to August 1930 and 1931, less than the market.","B":"Not yet born.","L":"Not yet born."},{"id":"1937","name":"The 1937-38 fall","years":[1937,1938],"when":"1937 to 1938","drop":null,"index":"","what":"Recession, rearmament and the road to war. UK shares lose 15.7% in 1937 and 9.2% in 1938.","M":"His fortune falls from over £500,000 to under £200,000 and his King's fund loses 22.6% in the year to August 1938. He stays invested and explains why in his May 1938 memo.","B":"Not yet born.","L":"Not yet born."},{"id":"1940","name":"Britain alone","years":[1939,1940],"when":"Sep 1939 to 1940","drop":null,"index":"","what":"War, Dunkirk and the Battle of Britain. UK shares lose 6.8% in 1940.","M":"Joins the Treasury as an adviser in August 1940. His King's fund loses 5.9% in the year to August 1940, while the index loses 18.8%.","B":"Not yet born.","L":"Not yet born."},{"id":"1973","name":"The 1973-74 crash","years":[1973,1974],"when":"1973 to 1974","drop":null,"index":"","what":"An oil shock, a secondary banking crisis, the three-day week and soaring inflation. UK shares lose 28.7% in 1973 and 51.8% in 1974, then gain 152.1% in 1975.","M":"Died in 1946.","B":"In his early twenties at the merchant bank Keyser Ullman, learning the trade in the worst market since at least 1900.","L":"Graduates from Cardiff with a First in 1974 and starts his career at Barclays."},{"id":"1987","name":"Black Monday","years":[1987,1987],"when":"19-20 Oct 1987","drop":36,"index":"FTSE 100, to 9 Nov","what":"Days after the Great Storm hits southern England, markets crash around the world. The FTSE 100 falls more than a fifth in two days, yet UK shares still end the year up 8.4%.","M":"Died in 1946.","B":"Eight years into running Special Situations.","L":"Rated the top banking analyst in London."},{"id":"2000","name":"The dot-com bust","years":[2000,2003],"when":"Dec 1999 to Mar 2003","drop":53,"index":"FTSE 100","what":"The internet bubble bursts. The FTSE 100 halves from its peak at the end of 1999 to March 2003.","M":"Died in 1946.","B":"Had refused internet shares and lagged the market by almost 20% in the boom. The bust proves him right.","L":"Floats Collins Stewart on the stock market in 2000, as chief executive."},{"id":"2008","name":"The financial crisis","years":[2007,2009],"when":"Sep 2007 to Mar 2009","drop":49,"index":"FTSE 100, to 3 Mar 2009","what":"Northern Rock suffers the first run on a British bank in over a century. In 2008 Lehman Brothers fails and the government rescues the big banks.","M":"Died in 1946.","B":"Hands over his fund at the end of 2007 and moves to mentoring.","L":"Chief executive of Tullett Prebon, a broker between banks."},{"id":"2020","name":"The COVID crash","years":[2020,2020],"when":"Feb to Mar 2020","drop":37,"index":"FTSE 100, to 23 Mar","what":"Lockdown. UK shares fall 36% in 46 trading days and end the year down 9.8%.","M":"Died in 1946.","B":"Retired from fund management since 2014.","L":"Fundsmith Equity gains 18.3% in the year, against 12.3% for world shares."},{"id":"2022","name":"The gilt crisis","years":[2022,2022],"when":"Sep to Oct 2022","drop":null,"index":"","what":"Inflation tops 10%, and September's mini-budget sends gilt yields soaring until the Bank of England steps in. UK shares end the year up 0.3%.","M":"Died in 1946.","B":"Retired.","L":"Fundsmith Equity loses 13.8%, against a 7.8% fall for world shares."}],"agePresets":[[21,"At 21, Bolton starts in the City and Smith graduates from Cardiff. Keynes, at 21, is a Cambridge undergraduate."],[23,"At 23, Keynes starts at the India Office."],[26,"At 26, Smith completes his MBA. Keynes, at 26, becomes a Fello nes died in 1946?","o":["Winston Churchill","Clement Attlee","Anthony Eden"],"a":1,"x":"Attlee's Labour government had won a landslide in July 1945."},{"q":"In which year did UK shares have their worst year since 1900?","o":["1931","1974","2008"],"a":1,"x":"They lost 51.8% in 1974. 2008 was -29.9%, 1931 -19.2%."},{"q":"What did UK shares do in 1975?","o":["Fell again","Rose about 15%","Rose about 150%"],"a":2,"x":"+152.1%, the year after the worst fall."},{"q":"What happened in Britain two months before Bolton launched Special Situations?","o":["Exchange controls were abolished","The FTSE 100 was launched","Big Bang"],"a":0,"x":"Exchange controls ended in October 1979. The FTSE 100 started in 1984 and Big Bang came in 1986."},{"q":"How much did £1,000 in Bolton's fund grow to over his 28 years?","o":["£14,700","£147,000","£1.47 million"],"a":1,"x":"About £147,000: roughly 19.5% a year."},{"q":"Why was Terry Smith sacked in 1992?","o":["He refused to withdraw his book on accounting tricks","He lost money on a trade","He joined a rival firm"],"a":0,"x":"UBS Phillips & Drew asked him to withdraw Accounting for Growth. He refused."},{"q":"Which book did Accounting for Growth knock off the top of the bestseller list?","o":["A Brief History of Time","The General Theory","One Up on Wall Street"],"a":0,"x":"Stephen Hawking's book, according to Wikipedia's account; Smith's sold over 100,000 copies."},{"q":"When was Fundsmith Equity launched?","o":["1 November 2000","1 November 2010","1 November 2015"],"a":1,"x":"1 November 2010."},{"q":"Which Fundsmith trust became the biggest UK investment trust launch ever?","o":["Smithson","Fundsmith Emerging Equities","Fundsmith Sustainable"],"a":0,"x":"Smithson raised £822.5 million in October 2018."},{"q":"In which year did the FTSE 100 first close above 10,000?","o":["2020","2024","2026"],"a":2,"x":"On 5 January 2026."}],"sources":{"dnb":{"l":"Oxford Dictionary of National Biography: Keynes, by Alec Cairncross","u":"https://mathshisto function normalise(){ const p=S.progress; p.weeks=p.weeks||{}; p.letters=p.letters||{}; p.path=p.path||{}; p.packs=p.packs||{}; S.notes=S.notes||{}; S.bookmarks=S.bookmarks||{}; S.cards=S.cards||{}; S.rules=S.rules||[]; }
const local = lsGet(); if(local) S = Object.assign(DEFAULT(), local); normalise();

let UI = {scale:1, theme:"auto", welcomed:false};
try{ const u=localStorage.getItem("bls-ui"); if(u) UI=Object.assign(UI, JSON.parse(u)); }catch(e){}
function saveUI(){ try{ localStorage.setItem("bls-ui", JSON.stringify(UI)); }catch(e){} }
function applyUI(){
  document.documentElement.style.setProperty("--scale", UI.scale);
  if(UI.theme==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", UI.theme);
  
}
applyUI();

const pending = {}, writing = {};
function touch(doc){ lsSet(); setSave("Saving…"); clearTimeout(pending[doc]); pending[doc]=setTimeout(()=>flush(doc), 1200); }
async function flush(doc){
  if(!store.db || !store.uid){ setSave("Saved on this device"); return; }
  if(writing[doc]){ pending[doc]=setTimeout(()=>flush(doc), 600); return; }
  writing[doc]=true;
  try{ await store.db.doc("data/users/"+store.uid+"/"+doc).set({v:JSON.stringify(S[doc]), at:Date.now()}); setSave("Saved to your account"); }
  catch(e){
    if(e && e.code==="unavailable") setTimeout(()=>flush(doc), 1500);
    else if(e && e.code==="quota_exceeded") setSave("Account storage full — saved on this device only");
    else { store.db=null; setSave("Saved on this device"); }
  } finally { writing[doc]=false; }
}
function setSave(t){ const el=document.getElementById("saveState"); if(el) el.textContent=t; }
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const db = await window.claude.use("db"); const user = await window.claude.use("user");
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    store = {db, uid, mode:"account"};
    let found=false;
    for(const doc of DOCS){
      const snap = await db.doc("data/users/"+uid+"/"+doc).get();
      if(snap.exists){ found=true; try{ S[doc]=JSON.parse(snap.data().v); }catch(e){} }
    }
    normalise();
    if(!found){ for(const doc of DOCS) await flush(doc); }
    lsSet(); setSave(store.db?"Saved to your account":"Saved on this device"); render();
  }catch(e){ setSave("Saved on this device"); }
}

function NK(k){ return CUR==="buffett" ? k : CUR+":"+k; }
function BK(id){ return CUR==="buffett" ? id : CUR+":"+id; }
function CK(id){ return CUR==="buffett" ? "c-"+id : CUR+":c-"+id; }
function inPack(cardId){ return CUR==="buffett" ? cardId.startsWith("c-") : cardId.startsWith(CUR+":"); }
function R(view){ return "#" + (CUR==="buffett" ? "" : CUR+"-") + view; }
function unitHref(key){ return R(P().unitRoute+"-"+key); }
function themeHref(num){ return R("theme-"+num); }
const IDX = {};
function idx(){ if(IDX[CUR]) return IDX[CUR]; const p=P();
  const o = {theme:Object.fromEntries(p.themes.map(t=>[t.id,t])), quote:Object.fromEntries(p.quotes.map(q=>[q.id,q])),

const sgn = v => (v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(1)+"%";
const mns = v => (v<0?"−":"")+Math.abs(v);
const IC_J = {
  story:'<svg viewBox="0 0 24 24"><path d="M4 19V5a1 1 0 0 1 1-1h10l5 5v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M14 4v5h5M8 13h8M8 17h5"/></svg>',
  nums:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
