issions are no reason to trade. Buying three stocks a day and selling them on Friday is gambling, not investing.","co":[]},"t12n6":{"id":"t12n6","theme":"t12","tags":"1993 Beating the Street","units":["bts"],"lead":"Few holdings for part-timers.","text":"A part-time picker can follow eight to twelve companies, with no more than five in the portfolio at any one time.","co":[]},"t12n7":{"id":"t12n7","theme":"t12","tags":"2000 New intro","units":["oneup2000"],"lead":"Beware buying after the leap.","text":"In 2000 he warned that few dot-com buyers get the full ride, because the early gains happen before most people can buy.","co":[]},"t12n8":{"id":"t12n8","theme":"t12","tags":"1993 Beating the Street","units":["bts"],"lead":"Stocks are like children.","text":"Don't take on more than you can handle.","co":[]}},"quotes":[{"id":"q-oneup2","unit":"oneup2","label":"One Up on Wall Street, 1989","text":"The p/e ratio of any company that's fairly priced will equal its growth rate.","theme":"t7"},{"id":"q-bts","unit":"bts","label":"Beating the Street, 1993","text":"Never invest in any idea you can't illustrate with a crayon.","theme":"t9"},{"id":"q-npc1994","unit":"npc1994","label":"National Press Club, 1994","text":"the single most important thing … is to know what you own","theme":"t1"},{"id":"q-pbs1996","unit":"pbs1996","label":"PBS interview, 1996","text":"if you spend 13 minutes a year on economics, you've wasted 10 minutes.","theme":"t11"},{"id":"q-yahoo2023","unit":"yahoo2023","label":"Yahoo Finance interview, 2023, on frequent trading","text":"That's not investing. That's gambling.","theme":"t12"},{"id":"q-oneup2000","unit":"oneup2000","label":"One Up on Wall Street, introduction to the 2000 edition","text":"very few dot.com investors benefit from the full ride","theme":"t12"},{"id":"q-learn","unit":"learn","label":"Learn to Earn, 1995","text":"Capitalism happens when people make things and sell them for money.","theme":"t2"}],"mistakes":[],"tendencies":[],"plan":[{"n":1,"label":"The amateur's edge","themes":["t1"],"units":["oneup1","npc1994"],"extra":""},{"n":2,"label":"Is it gambling? Stocks and your stomach","themes":["t2"],"units":["oneup1","pbs1996"],"extra":""},{"n":3,"label":"Look in your own backyard","themes":["t3"],"units":["bts","pbs1996"],"extra":""},{"n":4,"label":"The six kinds of stock","themes":["t4"],"units":["oneup2"],"extra":"In Part 2, read the chapter on the six categories."},{"n":5,"label":"The perfect stock, and the ones to avoid","themes":["t5"],"units":["oneup2"],"extra":"In Part 2, read the chapters on the perfect stock and the stocks to avoid."},{"n":6,"label":"Earnings are the engine","themes":["t6"],"units":["bts","oneup2"],"extra":""},{"n":7,"label":"The famous numbers","themes":["t7"],"units":["oneup2","oneup2000"],"extra":"In Part 2, read the chapter on the famous numbers."},{"n":8,"label":"Balance sheet first","themes":["t8"],"units":["bts","yahoo2023","learn"],"extra":""},{"n":9,"label":"The two-minute drill","themes":["t9"],"units":["oneup2","npc1994"],"extra":"In Part 2, read the chapter on the two-minute drill."},{"n":10,"label":"Ten-baggers: let the winners run","themes":["t10"],"units":["pbs1996","oneup3"],"extra":""},{"n":11,"label":"Don't time the market","themes":["t11"],"units":["pbs1996","npc1994"],"extra":""},{"n":12,"label":"Keep checking the story","themes":["t12"],"units":["yahoo2023","oneup2000","oneup3"],"extra":""}],"selftest":["Name his six kinds of stock, and one thing you would expect from each.","Why did he think an amateur can have an edge over a professional?","What three things go into a two-minute drill?","What does a P/E equal to the growth rate tell you, in his rule of thumb?","Why did he say “the stomach is the key organ”?","What is a ten-bagger, and why do you need only a few?","Give three traits of his perfect stock, and two kinds of stock he avoided.","Why is a $3 stock not safer than a $50 one?","What did his 1965 to 1995 high-versus-low example show?","When does he say you should sell, if not when the price changes?","Why did he warn about trading just because it is cheap?","What did Buffett borrow from him for a shareholder letter, and why?"],"sourcesNote":"Only Peter Lynch's own words: his three books (written with John Rothchild), his 1994 National Press Club talk, his 1996 PBS interview and his 2023 Yahoo Finance interview. Ideas are summarised in our own words. Each source gives at most one short exact line, checked against the original text or a published copy. Magellan's record is as reported by Fidelity and repeated by Lynch; it covers his 13 years only, and fund size includes new money from investors, not just gains. The sorting game uses invented companies. Facts were checked against at least two sources.","disclaimer":["For education only. Nothing here is investment, financial, legal or tax advice, or a recommendation to buy, sell or hold any security.","The tools (sorting game, price check, checklist, ten-bagger maths) are teaching aids built from his published rules of thumb. They are not valuation models and must not be used as the basis for a decision.","Accuracy is not guaranteed and errors are possible; treat the original sources as correct. No liability is accepted for any loss arising from use of this material. Past results do not predict future ones.","Independent and unaffiliated: not endorsed by Peter Lynch, Fidelity Investments, Simon & Schuster, PBS, Yahoo or any company named. All trademarks and copyrights belong to their owners."],"big":{"timeline":[[1944,"Born, 19 January"],[1955,"Starts caddying at 11; hears golfers talk about stocks"],[1965,"Graduates from Boston College"],[1966,"Summer job at Fidelity"],[1968,"Wharton MBA (he also served two years in the Army)"],[1969,"Joins Fidelity as an analyst covering textiles and metals"],[1974,"Becomes Fidelity's director of research"],[1977,"Takes over Magellan in May, with about $18–20 million"],[1982,"Recommends Chrysler on Wall Street Week"],[1983,"Magellan passes $1 billion in April"],[1987,"The October crash, during his holiday in Ireland"],[1989,"One Up on Wall Street"],[1990,"Retires from Magellan on 31 May, at 46; the fund holds about $14 billion"],[1993,"Beating the Street"],[1994,"Talk at the National Press Club; foreword to The Warren Buffett Way"],[1995,"Learn to Earn"],[2000,"Millennium edition of One Up, with a new introduction on dot-coms"],[2023,"Interview with Yahoo Finance at 79"]],"reading":["One Up on Wall Street (1989; millennium edition 2000)","Beating the Street (1993)","Learn to Earn (1995)","Foreword to Robert Hagstrom's The Warren Buffett Way (1994)","All three of his books were written with John Rothchild"]},"about":"Only Peter Lynch's own books, his 1994 National Press Club talk, his 1996 PBS interview and his 2023 Yahoo Finance interview. Unlike Buffett and Munger, he was a public fund manager who wrote for ordinary investors, so this section is built around doing: a five-step path, hands-on tools and stories from his notebook.","handbookTitle":"Peter Lynch's books and talks: a study handbook","stages":[{"id":"ready","name":"Get ready","verb":"Know yourself","blurb":"Your edge, and whether you have the stomach for it.","themes":[1,2]},{"id":"find","name":"Find it","verb":"Look around","blurb":"Spot companies in daily life, then sort them into his six kinds.","themes":[3,4]},{"id":"check","name":"Check it","verb":"Do the homework","blurb":"Traits, earnings, the famous numbers and the balance sheet.","themes":[5,6,7,8]},{"id":"tell","name":"Tell it","verb":"Explain it","blurb":"The two-minute drill: if you can't explain it, don't own it.","themes":[9]},{"id":"own","name":"Own it","verb":"Hold and recheck","blurb":"Let winners run, ignore forecasts, and keep checking the story.","themes":[10,11,12]}],"kinds":[{"id":"slow","name":"Slow grower","band":"About as fast as the economy","expect":"Dividends, low risk, low gain","sell":"When the dividend or the business weakens"},{"id":"stalwart","name":"Stalwart","band":"Earnings up about 10–12% a year","expect":"Moderate gains; protection in recessions","sell":"After a solid rise, often 30–50%"},{"id":"fast","name":"Fast grower","band":"Earnings up about 20–25% a year","expect":"The big multi-baggers, and the biggest risks","sell":"When its room to expand runs out"},{"id":"cyclical","name":"Cyclical","band":"Profits swing with the economy","expect":"Big moves, if the timing is right","sell":"When the cycle tops out"},{"id":"turnaround","name":"Turnaround","band":"Battered, might recover","expect":"Big gains when it works; many never do","sell":"Once it has turned around"},{"id":"asset","name":"Asset play","band":"Sits on something overlooked","expect":"Gains when the market notices the asset","sell":"When the asset's value is recognised"}],"scenarios":[{"text":"A century-old electricity utility. Earnings rise about 3% a year and it has raised its dividend for decades.","ans":"slow","why":"Growth about in line with the economy, owned for the dividend."},{"text":"A giant soft-drink maker, known worldwide, growing earnings about 11% a year.","ans":"stalwart","why":"Big, steady and growing in the low teens: a classic stalwart."},{"text":"A young restaurant chain with 60 outlets in one region, adding 20 a year, earnings up 25% a year.","ans":"fast","why":"Small, aggressive and growing 20–25%, with plenty of room to expand."},{"text":"A steelmaker whose profits soared last year and collapsed in the recession before that.","ans":"cyclical","why":"Profits follow the economy up and down."},{"text":"An airline that lost money for three years, has a new boss, and has cut costs and debt.","ans":"turnaround","why":"A battered company trying to recover."},{"text":"A sleepy department store whose shares are worth less than the city-centre land it owns.","ans":"asset","why":"The land is the hidden value the market has missed."},{"text":"A carmaker whose sales jump when the economy booms and slump in recessions.","ans":"cyclical","why":"Car sales rise and fall with the economy."},{"text":"A household-products giant: toothpaste and soap, earnings up about 10% a year.","ans":"stalwart","why":"Large and dependable, growing about 10–12%."},{"text":"A railroad that dominated its region for 80 years; growth now matches the economy.","ans":"slow","why":"Once a fast grower, now mature."},{"text":"A software firm with a single hit product, growing 30% a year from a small base.","ans":"fast","why":"Rapid growth from a small base, the land of the ten-baggers."},{"text":"A firm that emerged from bankruptcy with a slimmer business and no debt.","ans":"turnaround","why":"Recovering after a near-death experience."},{"text":"A small conglomerate holding cash worth two-thirds of its share price, plus a profitable side business.","ans":"asset","why":"Cash and a business inside the business: an asset play."}],"traits":["It sounds dull, or even ridiculous","It does something dull","It does something disagreeable","It's a spinoff","Institutions don't own it and analysts don't follow it","Rumours surround it","There's something depressing about it","It's in a no-growth industry","It has a niche","People have to keep buying it","It uses technology rather than selling it","Insiders are buying its shares","The company is buying back its shares"],"avoid":["The hottest stock in the hottest industry","Touted as “the next” famous company","Profits spent on unrelated businesses (diworseification)","A whispered long shot with a great story and no earnings","An exciting name in a hot field"],"silly":[{"text":"If it's gone down this much already, it can't go much lower.","ok":false,"why":"Stocks can always fall further. He called this one of the silliest things people say."},{"text":"You can always tell when a stock has hit bottom.","ok":false,"why":"Bottom-fishing usually hooks the fisherman."},{"text":"If it's gone this high already, how can it possibly go higher?","ok":false,"why":"A growing company can keep rising; height alone tells you nothing."},{"text":"It's only $3 a share: what can I lose?","ok":false,"why":"A $3 stock can go to zero just like a $50 one."},{"text":"Eventually they always come back.","ok":false,"why":"Plenty never do; the business has to recover first."},{"text":"It's always darkest before the dawn.","ok":false,"why":"Sometimes, as he put it, it is darkest just before it goes pitch black."},{"text":"When it rebounds to what I paid, I'll sell.","ok":false,"why":"The price you paid means nothing to the stock."},{"text":"Conservative stocks don't fluctuate much, so why worry?","ok":false,"why":"Even dull, safe companies can fall hard."},{"text":"It's taking too long for anything to happen.","ok":false,"why":"Selling out of boredom often comes the day before things start to happen."},{"text":"Look at all the money I lost by not buying it!","ok":false,"why":"Money you didn't make isn't money you lost."},{"text":"I missed that one; I'll catch the next one.","ok":false,"why":"Chasing a copy of a missed winner usually means buying a worse company."},{"text":"The stock's gone up, so I must be right.","ok":false,"why":"Price isn't proof: only the business tells you whether you were right."},{"text":"Behind every stock is a company; find out what it's doing.","ok":true,"why":"Sensible: one of his own rules, in our words."},{"text":"The best stock to buy may be one you already own.","ok":true,"why":"Sensible: one of his own rules, in our words."},{"text":"When even the analysts are bored, it may be time to look.","ok":true,"why":"Sensible: one of his own rules, in our words."},{"text":"Know what you own, and why you own it.","ok":true,"why":"Sensible: one of his own rules, in our words."},{"text":"Check the balance sheet before you buy.","ok":true,"why":"Sensible: one of his own rules, in our words."},{"text":"A falling price doesn't by itself mean you were wrong.","ok":true,"why":"Sensible: one of his own rules, in our words."}],"cocktail":[["Stage one","0%","Guests drift away when he says he runs a stock fund, and talk about the weather or their dentist instead.","Nobody expects the market to rise."],["Stage two","+15%","People linger a little longer, mostly to say stocks are risky. Talk is still about anything but stocks.","The market is up from stage one, but few have noticed."],["Stage three","+30%","Guests crowd around him to ask which stocks to buy. Even the dentist wants his picks.","Most have put money in by now."],["Stage four","?","Guests crowd around again, but now to give him tips. The dentist has several.","His half-joking sign that the market may be near a top."]],"record":[["13 years","May 1977 to May 1990"],["29.2%","average a year, about double the S&P 500"],["$18M → $14B","fund size when he started and left"],["$1,000 → $28,000","what $1,000 became over his tenure"]],"magellan":[[1977,0.018,"May 1977: about $18–20 million"],[1983,1.0,"April 1983: $1 billion"],[1990,14.0,"May 1990: about $14 billion"]],"extraCards":[{"id":"kind-slow","theme":"t4","front":"Which kind of stock: about as fast as the economy?","hint":"One of his six kinds","back":"Slow grower. Expect: dividends, low risk, low gain. Sell: when the dividend or the business weakens.","kind":"Six kinds"},{"id":"kind-stalwart","theme":"t4","front":"Which kind of stock: earnings up about 10–12% a year?","hint":"One of his six kinds","back":"Stalwart. Expect: moderate gains; protection in recessions. Sell: after a solid rise, often 30–50%.","kind":"Six kinds"},{"id":"kind-fast","theme":"t4","front":"Which kind of stock: earnings up about 20–25% a year?","hint":"One of his six kinds","back":"Fast grower. Expect: the big multi-baggers, and the biggest risks. Sell: when its room to expand runs out.","kind":"Six kinds"},{"id":"kind-cyclical","theme":"t4","front":"Which kind of stock: profits swing with the economy?","hint":"One of his six kinds","back":"Cyclical. Expect: big moves, if the timing is right. Sell: when the cycle tops out.","kind":"Six kinds"}, second-hand. The Spectator article, the MoneyWeek interview and the 2025 podcast are free online.","sourcesNote":"Sources: his book (2009), Jonathan Davis's study with his own lessons chapter (2004), his Spectator article (2007), interviews with MoneyWeek and Norges Bank's In Good Company podcast (2025), and press coverage of his China fund. Lessons are in our own words; exact quotes are short and checked.","start":{"lede":"Anthony Bolton ran Fidelity Special Situations from December 1979 to December 2007, about 19.5% a year, well ahead of the UK market. His method: buy good companies the crowd has given up on, write down why you own each one, meet the managers, and sell when the reason breaks.","para":"This page draws on his book Investing Against the Tide, a study of his methods by Jonathan Davis, his own Spectator article, and interviews up to 2025. About an hour a week for ten weeks: one idea here, then the source it comes from.","steps":[]},"glossary":[["Contrarian","An investor who deliberately goes against the crowd: buying what is unloved and selling what is loved."],["Investment thesis","The short written reason for owning a share."],["Counter-thesis","The written case against your own idea: what would make it a bad investment."],["Recovery share","A company in trouble whose shares are priced as if it will never recover."],["Company value to cash profits (EV/EBITDA)","The value of a whole company, shares plus debt minus cash, divided by profits before interest, tax and depreciation."],["Free cash flow yield","Cash a company has left after investing, as a percentage of its value."],["Technical analysis","Studying price charts and trading patterns, rather than the business itself."],["Special situations","Companies going through change: recovery, takeover, restructuring or neglect."],["Gearing","Borrowing money to invest more than you have. It magnifies both gains and losses."]],"units":[{"key":"tide","chip":"Book, 2009","tag":"Book, 2009","title":"Investing "mistakes":[],"quote":null}],"themes":[{"id":"t1","num":1,"title":"The contrarian's edge","idea":"The best bargains are usually in companies the crowd has given up on. The hard part is buying when it feels uncomfortable.","nuggets":["t1n1","t1n2","t1n3","t1n4","t1n5"],"ask":["Which company do most people around you dislike right now? Do they have a good reason?","Could you hold a share for two years while everyone says you are wrong?"],"table":null,"tool":null,"stories":[],"diagram":"contrarian","after":0,"caption":"He bought as the mood bottomed out and sold as it became euphoric, never on mood alone."},{"id":"t2","num":2,"title":"Write down why you own it","idea":"Every share you own needs a reason you can write in a few lines, and a written case against it.","nuggets":["t2n1","t2n2","t2n3","t2n4","t2n5"],"ask":["Can you write in three lines why you own each of your shares?","What would have to happen for you to admit you were wrong?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t3","num":3,"title":"What is already in the price","idea":"Look for a gap between price and value, measured in several ways, then give it time to close.","nuggets":["t3n1","t3n2","t3n3","t3n4","t3n5"],"ask":["Which two measures would you use to value a business you know well?","How long are you prepared to wait for a cheap share to be noticed?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t4","num":4,"title":"Meet the managers","idea":"He learnt most by meeting the people who run companies, again and again, and writing everything down.","nuggets":["t4n1","t4n2","t4n3","t4n4","t4n5"],"ask":["What would you most want to ask the boss of a company you own?","How would you tell whether a manager is being candid?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t5","num":5,"title":"What makes a good company","idea":"Start with the quality of the business, then ask whether it will be worth more in ten years.","nuggets":["t5n1","t5n2","t5n3","t5n4"],"ask":["Which company you know will clearly be worth more in ten years? Why?","What could take a company's destiny out of its own hands?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t6","num":6,"title":"Where the analysts are not","idea":"Medium and smaller companies, and those analysts have given up on, are where mispricing lives.","nuggets":["t6n1","t6n2","t6n3","t6n4"],"ask":["Name a company you know that almost nobody writes about.","Why might a small company be priced less efficiently than a giant one?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t7","num":7,"title":"Charts as a second opinion","idea":"Research comes first. He used price charts to confirm it and to time his buying and selling, never on their own.","nuggets":["t7n1","t7n2","t7n3","t7n4"],"ask":["What could a ten-year chart tell you that a one-year chart hides?","When might relying on charts alone mislead you?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t8","num":8,"title":"When to sell","idea":"Sell when the reason for owning breaks, when the price reaches your target, or when you find something better.","nuggets":["t8n1","t8n2","t8n3","t8n4"],"ask":["Which of your holdings would you sell today if you were starting from cash?","Have you ever held a share only to get back to even?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t9","num":9,"title":"Know yourself","idea":"Temperament matters more than intelligence. Find an approach that fits your nature, then stick with it.","nuggets":["t9n1","t9n2","t9n3","t9n4"],"ask":["Are you calm or anxious when your shares fall? What does that tell you about your style?","What kind of investing would you actually stick with for ten years?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t10","num":10,"title":"Even legends stumble","idea":"His China fund went badly at first. How he explained it teaches as much as his years of success.","nuggets":["t10n1","t10n2","t10n3","t10n4"],"ask":["What would you check more carefully before investing in a country you don't know?","Why might borrowing to invest turn a bad year into a terrible one?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""}],"nuggets":{"t1n1":{"id":"t1n1","theme":"t1","tags":"Podcast, 2025 · Morningstar","units":["nbim","ms"],"lead":"Popular means pricey.","text":"When everyone likes a share, the good news is already in the price. When everyone hates it, a little good news can lift it a lot.","co":[]},"t1n2":{"id":"t1n2","theme":"t1","tags":"Morningstar","units":["ms"],"lead":"Discomfort is a signal.","text":"He bought recovery shares before all the information was in, a place he called the discomfort zone.","co":[]},"t1n3":{"id":"t1n3","theme":"t1","tags":"Morningstar","units":["ms"],"lead":"But don't rush.","text":"He warned that buying too early is a common mistake. Be patient with your entry, and add more only when conviction is high.","co":[]},"t1n4":{"id":"t1n4","theme":"t1","tags":"Morningstar","units":["ms"],"lead":"The tech bubble test.","text":"In the late 1990s he refused internet shares. His fund lagged the market by almost 20% before the bubble burst and proved him right.","co":[]},"t1n5":{"id":"t1n5","theme":"t1","tags":"Book, 2009","units":["tide"],"lead":"Unloved is not enough.","text":"Going against the crowd only pays when you know why the crowd is wrong. A share can be unpopular for good reasons.","co":[]},"t2n1":{"id":"t2n1","theme":"t2","tags":"Morningstar · Book, 2009","units":["ms","tide"],"lead":"A reason for every holding.","text":"Know what you own and why, in words simple enough to explain to a friend.","co":[]},"t2n2":{"id":"t2n2","theme":"t2","tags":"Morningstar","units":["ms"],"lead":"Retest it.","text":"He went back to each thesis at regular intervals to check that it still held.","co":[]},"t2n3":{"id":"t2n3","theme":"t2","tags":"Morningstar","units":["ms"],"lead":"Write the counter-thesis.","text":"He also wrote down what could make the share a bad investment, and worked out why he disagreed with the doubters.","co":[]},"t2n4":{"id":"t2n4","theme":"t2","tags":"Podcast, 2025","units":["nbim"],"lead":"Seek out the other side.","text":"He made a point of listening to people with the opposite view, to stress-test his own.","co":[]},"t2n5":{"id":"t2n5","theme":"t2","tags":"Book, 2009","units":["tide"],"lead":"Forget what you paid.","text":"The price you paid says nothing about what a share is worth today.","co":[]},"t3n1":{"id":"t3n1","theme":"t3","tags":"Morningstar","units":["ms"],"lead":"Hunt for anomalies.","text":"He bought where the price looked out of line with what the company was worth, then waited for the gap to close.","co":[]},"t3n2":{"id":"t3n2","theme":"t3","tags":"Morningstar","units":["ms"],"lead":"Several measures, no favourite.","text":"Price to earnings, company value to cash profits, free cash flow yield, price to sales and cash returns on investment, each against history and against other companies.","co":[]},"t3n3":{"id":"t3n3","theme":"t3","tags":"Morningstar","units":["ms"],"lead":"The right tool for the job.","text":"For housebuilders he thought price to earnings nearly useless, because one-off land sales distort profits. Price to adjusted book value worked better.","co":[]},"t3n4":{"id":"t3n4","theme":"t3","tags":"Morningstar","units":["ms"],"lead":"Spotting beats timing.","text":"Seeing a mispricing is easier than knowing when it will correct. Some ideas took one year, some several.","co":[]},"t3n5":{"id":"t3n5","theme":"t3","tags":"Morningstar","units":["ms"],"lead":"Stand firm through noise.","text":"Share prices and profits can drift apart for a year or two. Keep testing the idea rather than giving up on it.","co":[]},"t4n1":{"id":"t4n1","theme":"t4","tags":"Article, 2007","units":["spec"],"lead":"Two or three a day.","text":"He met two or three companies every working day and valued hearing from managers directly.","co":[]},"t4n2":{"id":"t4n2","theme":"t4","tags":"Article, 2007","units":["spec"],"lead":"Keep the notes.","text":"He handwrote notes in every meeting and kept them all from the late 1980s onwards.","co":[]},"t4n3":{"id":"t4n3","theme":"t4","tags":"Article, 2007","units":["spec"],"lead":"Candour counts.","text":"He looked for managers who were candid and consistent. Like Buffett, he believed a boss who misleads shareholders may end up misleading himself.","co":[]},"t4n4":{"id":"t4n4","theme":"t4","tags":"MoneyWeek","units":["mw"],"lead":"The second meeting matters.","text":"Repeated follow-up meetings, not first impressions, uncovered the occasional gem.","co":[]},"t4n5":{"id":"t4n5","theme":"t4","tags":"Morningstar","units":["ms"],"lead":"Owners have a voice.","text":"In the 2003 Carlton–Granada merger he pressed for an independent chairman. The press nicknamed him the Quiet Assassin, a name he disliked.","co":[]},"t5n1":{"id":"t5n1","theme":"t5","tags":"Book, 2009","units":["tide"],"lead":"Franchise first.","text":"Begin by judging how strong the business franchise is.","co":[]},"t5n2":{"id":"t5n2","theme":"t5","tags":"Book, 2009","units":["tide"],"lead":"Ten years from now.","text":"Ask whether the company will still be here in ten years, and be more valuable.","co":[]},"t5n3":{"id":"t5n3","theme":"t5","tags":"Book, 2009","units":["tide"],"lead":"Master of its own fate.","text":"Prefer companies in control of their own destiny, rather than at the mercy of others.","co":[]},"t5n4":{"id":"t5n4","theme":"t5","tags":"Book, 2009","units":["tide"],"lead":"Managers who know the detail.","text":"Check that the people in charge understand the business strategically, operationally and financially.","co":[]},"t6n1":{"id":"t6n1","theme":"t6","tags":"Book, 2004","units":["davis"],"lead":"Less crowded corners.","text":"He leaned towards medium and smaller companies, which fewer analysts followed.","co":[]},"t6n2":{"id":"t6n2","theme":"t6","tags":"Morningstar","units":["ms"],"lead":"No forecasts, no fans.","text":"He liked companies that analysts had given up on, with few or no profit forecasts.","co":[]},"t6n3":{"id":"t6n3","theme":"t6","tags":"Book, 2009","units":["tide"],"lead":"Takeovers as a bonus.","text":"Owning many cheap, mid-sized companies meant some would be bid for. His book has a whole chapter on why it is good to have your shares bought out.","co":[]},"t6n4":{"id":"t6n4","theme":"t6","tags":"Book, 2009","units":["tide"],"lead":"Information is everywhere.","text":"His book has chapters on where to find information and on the value of good brokers: do the reading others skip.","co":[]},"t7n1":{"id":"t7n1","theme":"t7","tags":"MoneyWeek","units":["mw"],"lead":"Fundamentals first.","text":"He used charts to confirm his research, not to replace it.","co":[]},"t7n2":{"id":"t7n2","theme":"t7","tags":"MoneyWeek","units":["mw"],"lead":"Mostly for timing.","text":"He found charts most useful on bigger companies, to time buying and selling once the research was done.","co":[]},"t7n3":{"id":"t7n3","theme":"t7","tags":"MoneyWeek","units":["mw"],"lead":"A health check.","text":"He compared checking a chart to a visit to the doctor: being too early in a share can be costly.","co":[]},"t7n4":{"id":"t7n4","theme":"t7","tags":"Podcast, 2025","units":["nbim"],"lead":"Reading the crowd.","text":"Charts, shareholder lists and directors' dealings all helped him judge where the crowd already stood.","co":[]},"t8n1":{"id":"t8n1","theme":"t8","tags":"Morningstar","units":["ms"],"lead":"Three reasons to sell.","text":"Something breaks the thesis; the share reaches his valuation target; or he finds a better idea.","co":[]},"t8n2":{"id":"t8n2","theme":"t8","tags":"Morningstar","units":["ms"],"lead":"Don't chase your losses.","text":"Holding a loser just to win back what you lost, or to prove the original idea right, is dangerous.","co":[]},"t8n3":{"id":"t8n3","theme":"t8","tags":"Morningstar","units":["ms"],"lead":"A broken thesis means sell.","text":"Even if the share now looks cheap, a broken reason is a reason to go.","co":[]},"t8n4":{"id":"t8n4","theme":"t8","tags":"Podcast, 2025","units":["nbim"],"lead":"Popularity is risk.","text":"When a share becomes everyone's favourite, the risk has risen even if the story has not changed.","co":[]},"t9n1":{"id":"t9n1","theme":"t9","tags":"Morningstar","units":["ms"],"lead":"Temperament over IQ.","text":"He believed emotional people do not make good investors, however clever they are.","co":[]},"t9n2":{"id":"t9n2","theme":"t9","tags":"Morningstar","units":["ms"],"lead":"Your own style.","text":"Find an approach that suits your personality, and keep to it through good and bad years.","co":[]},"t9n3":{"id":"t9n3","theme":"t9","tags":"Book, 2004","units":["davis"],"lead":"Ignore the benchmark.","text":"He ran the fund on his own judgement rather than hugging the index, which is why it could look so different from the market.","co":[]},"t9n4":{"id":"t9n4","theme":"t9","tags":"Morningstar","units":["ms"],"lead":"Decide alone.","text":"He drew on the widest possible range of facts and opinions, but the final call was always his own judgement.","co":[]},"t10n1":{"id":"t10n1","theme":"t10","tags":"interactive investor","units":["chinaii"],"lead":"The comeback.","text":"In 2010 he came out of retirement to launch a China fund, a market he had not invested in before.","co":[]},"t10n2":{"id":"t10n2","theme":"t10","tags":"Trustnet, 2012","units":["chinatn"],"lead":"What went wrong.","text":"He blamed a focus on smaller companies, too much weight in consumer shares, and borrowing to invest, all of which hurt in a falling market.","co":[]},"t10n3":{"id":"t10n3","theme":"t10","tags":"Trustnet, 2012","units":["chinatn"],"lead":"New market, new rules.","text":"Accounting scandals at some Chinese companies listed in the US also hurt. Familiar methods need new checks in an unfamiliar market.","co":[]},"t10n4":{"id":"t10n4","theme":"t10","tags":"interactive investor","units":["chinaii"],"lead":"He said sorry.","text":"He apologised to investors for poor results. By the time he retired in 2014 the trust had just about turned a profit.","co":[]}},"quotes":[{"id":"q-spec","unit":"spec","label":"The Spectator, 2007","text":"I value very highly hearing directly from management","theme":"t4"},{"id":"q-mw","unit":"mw","label":"MoneyWeek interview","text":"I've found charts very useful, particularly on bigger companies, especially for timing.","theme":"t7"},{"id":"q-ms","unit":"ms","label":"as quoted by Morningstar","text":"easier to spot an anomaly than knowing exactly when it is going to correct","theme":"t3"}],"mistakes":[],"tendencies":[],"plan":[{"n":1,"label":"The contrarian's edge","themes":["t1"],"units":["nbim"],"extra":""},{"n":2,"label":"Write down why you own it","themes":["t2"],"units":["ms"],"extra":""},{"n":3,"label":"What is already in the price","themes":["t3"],"units":["ms"],"extra":""},{"n":4,"label":"Meet the managers","themes":["t4"],"units":["spec"],"extra":""},{"n":5,"label":"What makes a good company","themes":["t5"],"units":["tide"],"extra":""},{"n":6,"label":"Where the analysts are not","themes":["t6"],"units":["davis"],"extra":""},{"n":7,"label":"Charts as a second opinion","themes":["t7"],"units":["mw"],"extra":""},{"n":8,"label":"When to sell","themes":["t8"],"units":["tide"],"extra":""},{"n":9,"label":"Know yourself","themes":["t9"],"units":["davis"],"extra":""},{"n":10,"label":"Even legends stumble","themes":["t10"],"units":["chinatn","chinaii"],"extra":""}],"selftest":["Why can an unpopular share be a better buy than a popular one?","What is an investment thesis, and what is a counter-thesis?","Name three valuation measures he used, and one industry where price to earnings misleads.","Why did he meet managers again and again?","What were his three reasons to sell?","How did he use charts, and how did he not use them?","What happened to his fund during the late-1990s tech boom, and what does it teach?","Why did he prefer medium and smaller companies?","What went wrong with his China fund?","Which matters more for an investor, temperament or intelligence? Why?"],"disclaimer":["For education only. Nothing here is investment, financial, legal or tax advice, or a recommendation to buy, sell or hold any security.","Records and figures come from the published sources named on this page and may be revised; check the originals before relying on them.","Accuracy is not guaranteed and errors are possible; treat the original sources as correct. No liability is accepted for any loss arising from use of this material. Past results do not predict future ones.","Independent and unaffiliated: not endorsed by Anthony Bolton, Fidelity International, the publishers, the Spectator, MoneyWeek, Morningstar, Norges Bank or any company named. All trademarks and copyrights belong to their owners."],"big":{"timeline":[[1950,"Born"],[1979,"Joins Fidelity on 17 December, the day its first UK funds launch, and starts Special Situations aged 29"],["1999–2000","Refuses internet shares; lags the market by almost 20%, then is proved right"],[2003,"Presses for an independent chairman in the Carlton–Granada merger; the press calls him the Quiet Assassin"],[2004,"Investing with Anthony Bolton published for the fund's 25th anniversary"],[2006,"The fund, about £6bn, is split into UK and Global funds"],[2007,"Hands over the UK fund at the end of the year"],[2009,"Publishes Investing Against the Tide"],[2010,"Returns from retirement to launch a China fund"],[2014,"Retires from managing money in April; keeps mentoring younger managers"],[2025,"Long interview on contrarian thinking with Norges Bank's Nicolai Tangen"]],"map":[["Go against the crowd, with a reason","He bought what others disliked, but only once he understood why the gloom was overdone."],["Write down why you own it","Every holding had a short thesis, retested often, and a counter-thesis: what would make it a bad investment."],["Know what is already in the price","He looked for a gap between price and value using several measures, never one favourite ratio."],["Meet the people","He met two or three companies a day and kept handwritten notes of every meeting."],["Know yourself","Temperament matters more than IQ. Find a style that suits you and stick with it."],["Sell when the reason breaks","Even at a loss. Never hold on just to get back to even."]]},"record":[["19.5% a year","Fidelity Special Situations, Dec 1979 to Dec 2007"],["£1,000 → £147,000","over his 28 years, dividends reinvested"],["about 13.5% a year","the UK stock market over the same 28 years"],["£6bn","the fund's size when it was split in two, 2006"]],"special":"checklist"},"smith":{"id":"smith","name":"Terry Smith","short":"Smith","mono":"TS","country":"uk","ready":true,"what":"His letters, rules and books on owning the best companies and doing nothing","crumb":"Terry Smith · 5 sources","handbookTitle":"Terry Smith: a study handbook","unitTab":"Sources","unitWord":"source","unitRoute":"source","unitsRoute":"sources","scope":"Smith writes plainly and often. The Owner's Manual and the annual letters are free on Fundsmith's website; his Financial Times columns and letters to 2020 are collected in Investing for Growth. Accounting for Growth (1992) is out of print but easy to find second-hand.","readHow":"Start with the Owner's Manual (about twenty pages) and the latest annual letter. Both are free.","sourcesNote":"Sources: the Fundsmith Owner's Manual (2010), the annual letters (2010 to 2025, figures from the 2025 letter), 'Ten golden rules of investment' (Financial Times, 2013), Accounting for Growth (1992) and Investing for Growth (2020). Lessons are in our own words; exact quotes are short and checked.","start":{"lede":"Terry Smith exposed creative accounting in 1992 and was sacked for refusing to withdraw his book. In 2010 he founded Fundsmith on three rules: buy good companies, don't overpay, do nothing. Since launch it has returned 13.8% a year against 12.1% for world shares, though it trailed the market every year from 2021 to 2025.","para":"This page draws on the Fundsmith Owner's Manual, his sixteen annual letters, his ten golden rules and his two books. About an hour a week for ten weeks: one idea here, then the letter or chapter it comes from.","steps":[]},"glossary":[["Return on capital employed (ROCE)","Operating profit as a percentage of the money tied up in a business. His main test of quality."],["Gross margin","Sales minus the direct cost of making them, as a percentage of sales."],["Operating margin","Profit after running costs, before interest and tax, as a percentage of sales."],["Cash conversion","How much of the reported profit actually arrives as cash."],["Interest cover","How many times profits cover the interest bill."],["Free cash flow yield","The cash a company produces after investment, as a percentage of its value."],["Turnover","The share of a portfolio bought and sold in a year."],["Total cost of investment","All the costs of owning a fund, including dealing costs, not just the headline charge."],["Index fund","A fund that simply buys a whole market index rather than choosing companies."],["Creative accounting","Legal but misleading ways of making profits look bigger or smoother than they are."]],"units":[{"key":"om","chip":"Owner's Manual","tag":"Owner's Manual","title":"Fundsmith Equity Fund Owner's Manual","date":"Fundsmith, first published 2010 and essentially unchanged since.","summary":"The rulebook: what the fund buys, what it never does, and why the biggest risk to your returns is you.","year":2010,"link":"https://www.fundsmith.co.uk/media/mv3abv1h/owners-manual.pdf","linkLabel":"Read it free (PDF)","nuggets":["t1n1","t1n2","t1n3","t1n4","t1n5","t6n1","t6n2","t8n3","t9n3","t10n5"],"mistakes":[],"quote":"q-om"},{"key":"letters","chip":"Annual letters","tag":"Annual letters","title":"Annual letters to fund owners","date":"Sixteen letters, January each year. Figures on this page are from the 2025 letter.","summary":"Each letter gives the results, the portfolio's quality numbers, the biggest winners and losers, and plain explanations when things go wrong.","year":2025,"link":"https://www.fundsmith.co.uk/media/4hcfd1pg/2025-fef-annual-letter-web.pdf","linkLabel":"Read the 2025 letter (PDF)","nuggets":["t2n1","t2n2","t2n3","t2n4","t2n5","t3n1","t4n2","t7n2","t8n2","t10n1","t10n2","t10n3","t10n4"],"mistakes":[],"quote":"q-letters"},{"key":"rules","chip":"FT article, 2013","tag":"FT article, 2013","title":"Ten golden rules of investment","date":"Financial Times, 15 February 2013, republished by Fundsmith.","summary":"His ten rules for private investors, from 'if you don't understand it, don't invest' to 'switch off the screen'.","year":2013,"link":"https://www.fundsmith.co.uk/news/2013/2070-financial-times-ten-golden-rules-of-investment/","linkLabel":"Read the article","nuggets":["t3n2","t4n1","t4n3","t4n4","t6n3","t6n4","t7n1","t8n1","t9n1","t9n2"],"mistakes":[],"quote":"q-rules"},{"key":"afg","chip":"Book, 1992","tag":"Book, 1992","title":"Accounting for Growth","date":"Century Business, 1992; second edition 1996.","summary":"The book that exposed how British companies of the 1980s flattered their profits, and cost him his job.","year":1992,"link":"https://www.worldofbooks.com/en-au/books/terry-smith/accounting-for-growth/9780712657648","linkLabel":"Find the book","nuggets":["t5n1","t5n2","t5n3","t5n4","t5n5"],"mistakes":[],"quote":null},{"key":"ifg","chip":"Book, 2020","tag":"Book, 2020","title":"Investing for Growth","date":"Harriman House, 2020: his letters and newspaper columns from 2010 to 2020.","summary":"Ten years of his writing in one place, including the golden rules and his case for buying only the best companies.","year":2020,"link":"https://www.panmacmillan.com/authors/terry-smith/investing-for-growth/9780857199010","linkLabel":"The book at the publisher","nuggets":["t3n3","t7n3"],"mistakes":[],"quote":null}],"themes":[{"id":"t1","num":1,"title":"Buy good companies","idea":"A good company earns a high return on the money tied up in it, in cash, and keeps doing so for decades.","nuggets":["t1n1","t1n2","t1n3","t1n4","t1n5"],"ask":["Which company you use every day earns its money from many small, repeated purchases?","Could a well-funded rival copy that company in five years?"],"table":null,"tool":null,"stories":[],"diagram":"threesteps","after":0,"caption":"His whole method in three steps, with the 2025 numbers behind each."},{"id":"t2","num":2,"title":"The numbers that show quality","idea":"Every year he publishes the same few measures for his companies beside the market's. Quality shows up in the numbers.","nuggets":["t2n1","t2n2","t2n3","t2n4","t2n5"],"ask":["Find the return on capital of a company you know. Is it above 17%?","Why might a company founded a century ago still be a good investment?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t3","num":3,"title":"Don't overpay","idea":"Even the best company can be a bad investment at the wrong price. He checks how much cash you get for what you pay.","nuggets":["t3n1","t3n2","t3n3"],"ask":["What would make you refuse to buy even a wonderful company?","Why is 'someone will pay more later' a weak reason to buy?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t4","num":4,"title":"Do nothing","idea":"Once you own good companies at sensible prices, the hardest and best thing is to leave them alone.","nuggets":["t4n1","t4n2","t4n3","t4n4"],"ask":["How often do you check share prices? What would happen if you checked once a quarter?","Which of your past trades would you undo?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t5","num":5,"title":"Read the accounts","idea":"His first fame came from showing how companies dressed up their profits. Reported profit can mislead; cash is harder to fake.","nuggets":["t5n1","t5n2","t5n3","t5n4","t5n5"],"ask":["Where in a company's accounts would you look to check that profits turn into cash?","Why might managers want profits to look smoother than they are?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t6","num":6,"title":"You are the biggest risk","idea":"Most damage to investors' returns is self-inflicted: chasing fashion, trading too much, buying what they don't understand.","nuggets":["t6n1","t6n2","t6n3","t6n4"],"ask":["What investment have you bought mainly because others were buying it?","Can you explain each of your investments in two sentences?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t7","num":7,"title":"Costs come out of your pocket","idea":"Fees, charges and dealing costs are certain; returns are not. Keep the certain losses small.","nuggets":["t7n1","t7n2","t7n3"],"ask":["Do you know the total yearly cost of every fund you own?","How much would 1% a year cost you over 30 years?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t8","num":8,"title":"Don't over-diversify","idea":"Twenty or so well-chosen companies give most of the safety of spreading out. More than that, and you know each one less well.","nuggets":["t8n1","t8n2","t8n3"],"ask":["How many companies could you follow properly in a year?","When does spreading money out stop reducing risk?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t9","num":9,"title":"Avoid poor businesses and star bosses","idea":"Stay away from companies that earn poor returns, and from companies that only work with a genius in charge.","nuggets":["t9n1","t9n2","t9n3"],"ask":["Which company you know would struggle if its founder left tomorrow?","Why might predictable everyday purchases make a business easier to value?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t10","num":10,"title":"When it doesn't work","idea":"From 2021 to 2025 his fund trailed the market five years running. How he explained it is a lesson in honesty and patience.","nuggets":["t10n1","t10n2","t10n3","t10n4","t10n5"],"ask":["How many years of trailing the market would you tolerate from a fund manager?","What is the difference between bad luck and a broken strategy?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""}],"nuggets":{"t1n1":{"id":"t1n1","theme":"t1","tags":"Owner's Manual","units":["om"],"lead":"Return on capital is the test.","text":"A good business makes a high return on the capital it uses, in cash, and can sustain it.","co":[]},"t1n2":{"id":"t1n2","theme":"t1","tags":"Owner's Manual","units":["om"],"lead":"Hard to copy.","text":"Its advantages should be difficult for rivals to replicate.","co":[]},"t1n3":{"id":"t1n3","theme":"t1","tags":"Owner's Manual","units":["om"],"lead":"Little debt needed.","text":"It should not need heavy borrowing to earn its returns.","co":[]},"t1n4":{"id":"t1n4","theme":"t1","tags":"Owner's Manual","units":["om"],"lead":"Room to reinvest.","text":"It should be able to reinvest its cash at high rates, so growth compounds.","co":[]},"t1n5":{"id":"t1n5","theme":"t1","tags":"Owner's Manual","units":["om"],"lead":"Built to last.","text":"It should be resilient to change, especially technological change.","co":[]},"t2n1":{"id":"t2n1","theme":"t2","tags":"Annual letters","units":["letters"],"lead":"Returns.","text":"In 2025 his companies averaged a 31% return on capital, against 17% for both the S&P 500 and the FTSE 100.","co":[]},"t2n2":{"id":"t2n2","theme":"t2","tags":"Annual letters","units":["letters"],"lead":"Margins.","text":"Gross margin 62% against 45% and 43%; operating margin 28% against 18% and 17%.","co":[]},"t2n3":{"id":"t2n3","theme":"t2","tags":"Annual letters","units":["letters"],"lead":"Cash.","text":"They turned 94% of their profits into cash.","co":[]},"t2n4":{"id":"t2n4","theme":"t2","tags":"Annual letters","units":["letters"],"lead":"Safety.","text":"Median interest cover was 29 times, against 9 and 8: profits dwarf interest bills.","co":[]},"t2n5":{"id":"t2n5","theme":"t2","tags":"Annual letters","units":["letters"],"lead":"Durability.","text":"The average company in the fund was founded in 1919.","co":[]},"t3n1":{"id":"t3n1","theme":"t3","tags":"Annual letters","units":["letters"],"lead":"Cash for your money.","text":"He tracks free cash flow yield, the cash a company produces against its price. At the end of 2025 his portfolio's was 3.7%, against 2.8% for the S&P 500.","co":[]},"t3n2":{"id":"t3n2","theme":"t3","tags":"FT article, 2013","units":["rules"],"lead":"No greater fools.","text":"Buy only what you would happily own at a price you accept. Profits that depend on someone paying more later rely on a greater fool.","co":[]},"t3n3":{"id":"t3n3","theme":"t3","tags":"Book, 2020","units":["ifg"],"lead":"Quality earns its price.","text":"He argues that the market tends to underestimate how long great companies keep compounding, so paying up for them can still work.","co":[]},"t4n1":{"id":"t4n1","theme":"t4","tags":"FT article, 2013","units":["rules"],"lead":"Deal rarely.","text":"Frequent trading adds costs that steadily eat into returns.","co":[]},"t4n2":{"id":"t4n2","theme":"t4","tags":"Annual letters","units":["letters"],"lead":"Low turnover.","text":"In 2025 the fund's turnover was 12.7%, and voluntary dealing cost 0.008% of the fund.","co":[]},"t4n3":{"id":"t4n3","theme":"t4","tags":"FT article, 2013","units":["rules"],"lead":"Don't time the market.","text":"Most people buy after rises and sell after falls. Guessing the turns rarely works.","co":[]},"t4n4":{"id":"t4n4","theme":"t4","tags":"FT article, 2013","units":["rules"],"lead":"Switch off the screen.","text":"If you own good companies at sensible prices and dislike what the price is doing, stop looking.","co":[]},"t5n1":{"id":"t5n1","theme":"t5","tags":"Book, 1992","units":["afg"],"lead":"Profits that weren't.","text":"In 1990 several big British companies went bust while reporting healthy profits. Their real problem was cash.","co":[]},"t5n2":{"id":"t5n2","theme":"t5","tags":"Book, 1992","units":["afg"],"lead":"The book that cost his job.","text":"In 1992 he expanded his research into a book. His employer, UBS Phillips & Drew, asked him to withdraw it; he refused and was sacked.","co":[]},"t5n3":{"id":"t5n3","theme":"t5","tags":"Book, 1992","units":["afg"],"lead":"The usual tricks.","text":"Acquisition accounting, deferred payments, exceptional items, off-balance-sheet debt, hidden liabilities, brand values, changed depreciation, capitalised costs and currency mismatches.","co":[]},"t5n4":{"id":"t5n4","theme":"t5","tags":"Book, 1992","units":["afg"],"lead":"It changed the rules.","text":"Many of the practices he exposed were later curbed or stopped.","co":[]},"t5n5":{"id":"t5n5","theme":"t5","tags":"Book, 1992","units":["afg"],"lead":"Habits stick.","text":"Managers who flatter their earnings rarely change, so treat it as a lasting warning sign.","co":[]},"t6n1":{"id":"t6n1","theme":"t6","tags":"Owner's Manual","units":["om"],"lead":"Look in the mirror.","text":"His Owner's Manual warns that the greatest threat to your returns is your own behaviour.","co":[]},"t6n2":{"id":"t6n2","theme":"t6","tags":"Owner's Manual","units":["om"],"lead":"Not because it's fashionable.","text":"The fund will not own something because it is in fashion and might go up, because eventually it goes down, usually by a lot.","co":[]},"t6n3":{"id":"t6n3","theme":"t6","tags":"FT article, 2013","units":["rules"],"lead":"Understand it or skip it.","text":"If you can't explain how an investment works, don't buy it. Complexity often hides risk.","co":[]},"t6n4":{"id":"t6n4","theme":"t6","tags":"FT article, 2013","units":["rules"],"lead":"Tax is not a reason.","text":"Never invest just to avoid tax. Tax-driven schemes often carry high fees and weak returns.","co":[]},"t7n1":{"id":"t7n1","theme":"t7","tags":"FT article, 2013","units":["rules"],"lead":"Minimise fees.","text":"Charges from advisers, platforms and funds can swallow most of an investment's income.","co":[]},"t7n2":{"id":"t7n2","theme":"t7","tags":"Annual letters","units":["letters"],"lead":"Show the full bill.","text":"Fundsmith reports a total cost of investment that includes dealing costs: 1.06% a year for its main share class in 2025.","co":[]},"t7n3":{"id":"t7n3","theme":"t7","tags":"Book, 2020","units":["ifg"],"lead":"Small numbers compound.","text":"A cost of 1% a year sounds small, but over decades it takes a large share of the final pot.","co":[]},"t8n1":{"id":"t8n1","theme":"t8","tags":"FT article, 2013","units":["rules"],"lead":"About twenty is enough.","text":"Around 20 well-chosen shares capture most of the benefit of diversification.","co":[]},"t8n2":{"id":"t8n2","theme":"t8","tags":"Annual letters","units":["letters"],"lead":"A concentrated fund.","text":"At the end of 2025 Fundsmith Equity held 29 companies.","co":[]},"t8n3":{"id":"t8n3","theme":"t8","tags":"Owner's Manual","units":["om"],"lead":"The 80th company.","text":"His Owner's Manual asks how much a manager can really know about the 80th company in a portfolio.","co":[]},"t9n1":{"id":"t9n1","theme":"t9","tags":"FT article, 2013","units":["rules"],"lead":"Never own poor quality.","text":"Companies that earn weak returns on their capital destroy value over time; strong ones compound it.","co":[]},"t9n2":{"id":"t9n2","theme":"t9","tags":"FT article, 2013","units":["rules"],"lead":"A business an idiot could run.","text":"Avoid companies that depend on one brilliant or charismatic leader who may not stay.","co":[]},"t9n3":{"id":"t9n3","theme":"t9","tags":"Owner's Manual","units":["om"],"lead":"Everyday, repeated sales.","text":"He favours businesses built on many small, predictable purchases, such as household goods and medical supplies.","co":[]},"t10n1":{"id":"t10n1","theme":"t10","tags":"Annual letters","units":["letters"],"lead":"Five years behind.","text":"The fund lagged world shares in every calendar year from 2021 to 2025.","co":[]},"t10n2":{"id":"t10n2","theme":"t10","tags":"Annual letters","units":["letters"],"lead":"A weak 2025.","text":"It returned 0.8% while world shares rose 12.8%; even cash did better.","co":[]},"t10n3":{"id":"t10n3","theme":"t10","tags":"Annual letters","units":["letters"],"lead":"His explanation.","text":"A market led by a handful of giant technology shares, money pouring into index funds, and a weak dollar. His biggest single drag was Novo Nordisk, which cost the fund about 3 points.","co":[]},"t10n4":{"id":"t10n4","theme":"t10","tags":"Annual letters","units":["letters"],"lead":"Still ahead since launch.","text":"Over 15 years the fund remains ahead: 13.8% a year against 12.1%.","co":[]},"t10n5":{"id":"t10n5","theme":"t10","tags":"Owner's Manual","units":["om"],"lead":"Judge over decades.","text":"A sound approach can trail for years. Decide in advance how long you will give a strategy, and judge it honestly.","co":[]}},"quotes":[{"id":"q-om","unit":"om","label":"Fundsmith Owner's Manual","text":"The greatest threat you face to your investment performance is from you.","theme":"t6"},{"id":"q-letters","unit":"letters","label":"Annual letter, 2025","text":"Buy good companies. Don't overpay. Do nothing.","theme":"t1"},{"id":"q-rules","unit":"rules","label":"Ten golden rules, Financial Times, 2013","text":"If you don't fully understand it, don't invest","theme":"t6"}],"mistakes":[],"tendencies":[],"plan":[{"n":1,"label":"Buy good companies","themes":["t1"],"units":["om"],"extra":""},{"n":2,"label":"The numbers that show quality","themes":["t2"],"units":["letters"],"extra":""},{"n":3,"label":"Don't overpay","themes":["t3"],"units":["letters"],"extra":""},{"n":4,"label":"Do nothing","themes":["t4"],"units":["rules"],"extra":""},{"n":5,"label":"Read the accounts","themes":["t5"],"units":["afg"],"extra":""},{"n":6,"label":"You are the biggest risk","themes":["t6"],"units":["om"],"extra":""},{"n":7,"label":"Costs come out of your pocket","themes":["t7"],"units":["rules"],"extra":""},{"n":8,"label":"Don't over-diversify","themes":["t8"],"units":["rules"],"extra":""},{"n":9,"label":"Avoid poor businesses and star bosses","themes":["t9"],"units":["ifg"],"extra":""},{"n":10,"label":"When it doesn't work","themes":["t10"],"units":["letters"],"extra":""}],"selftest":["What are his three steps, in his own words?","Which single measure does he treat as the test of a good company?","Name three of the quality numbers he publishes each year, and roughly how his companies compare with the market.","Why did UBS Phillips & Drew sack him in 1992?","Name four accounting tricks his first book exposed.","What does 'do nothing' mean in practice, and what was the fund's turnover in 2025?","Why does he say about twenty shares is enough?","What is a 'business an idiot could run', and why prefer one?","Why did his fund trail the market from 2021 to 2025, in his own explanation?","Why does he say the biggest risk to your returns is you?"],"disclaimer":["For education only. Nothing here is investment, financial, legal or tax advice, or a recommendation to buy, sell or hold any security.","Records and figures come from the published sources named on this page and may be revised; check the originals before relying on them.","Accuracy is not guaranteed and errors are possible; treat the original sources as correct. No liability is accepted for any loss arising from use of this material. Past results do not predict future ones.","Independent and unaffiliated: not endorsed by Terry Smith, Fundsmith LLP, the Financial Times, the publishers or any company named. All trademarks and copyrights belong to their owners."],"big":{"timeline":[[1953,"Born in London"],[1984,"Joins the stockbroker W. Greenwell; top-rated bank analyst in London until 1989"],[1990,"Head of UK company research at UBS Phillips & Drew"],[1992,"Publishes Accounting for Growth; sacked after refusing to withdraw it; joins Collins Stewart"],[2000,"Chief executive of Collins Stewart, which floats on the stock market"],[2010,"Founds Fundsmith; its Equity fund launches on 1 November"],[2010,"The statue of Sir Keith Park he campaigned for and largely paid for is unveiled in London"],[2012,"Made a Member of the New Zealand Order of Merit for that work"],[2014,"Retires from the broker Tullett Prebon to focus on Fundsmith"],[2020,"Publishes Investing for Growth"],[2025,"Weakest year: +0.8%, against +12.8% for world shares"]],"map":[["Buy good companies","Companies that earn high returns on their capital, in cash, year after year, without much debt."],["Don't overpay","A great company bought at a silly price is a poor investment."],["Do nothing","Trade rarely. In 2025 the fund replaced only about an eighth of its holdings."],["Read the accounts","Reported profits can be dressed up. His first fame came from showing how."],["You are the biggest risk","Investors hurt themselves most by chasing fashion, timing the market and trading too often."],["Keep costs low","Every fee and dealing cost comes straight out of your return."]]},"record":[["13.8% a year","Fundsmith Equity, Nov 2010 to Dec 2025"],["12.1% a year","world shares (MSCI World) over the same years"],["+613%","total gain since launch, against +468% for world shares"],["+0.8%","in 2025: his weakest year, and the fifth in a row behind the index"]],"special":"quality","quality":{"year":2025,"rows":[["Return on capital","roce",31,17,17,"%"],["Gross margin","gm",62,45,43,"%"],["Operating margin","om",28,18,17,"%"],["Cash conversion","cc",94,89,99,"%"],["Interest cover (median)","ic",29,9,8,"x"]]},"tricks":["Acquisition accounting: writing down a bought company's assets before the deal, so later profits look bigger","Deferred payments for acquisitions, which push the true cost into later years","Extraordinary and exceptional items, used to keep bad news out of headline profit","Off-balance-sheet finance: debts kept out of sight","Contingent liabilities: promises that may cost money later","Putting a value on brands as assets","Changing depreciation rules to lift profit","Capitalising costs: treating everyday spending as an investment","Currency mismatching: borrowing where interest is low and depositing where it is high"],"rules10":["Only invest in what you fully understand","Don't try to guess the market's turns","Keep fees as low as you can","Trade as rarely as possible","About twenty shares is enough: don't over-diversify","Never invest just to save tax","Never own poor-quality companies","Prefer a business that doesn't need a genius to run it","Don't buy hoping a greater fool will pay more later","If the price upsets you, switch off the screen"]},"keynes":{"id":"keynes","name":"John Maynard Keynes","short":"Keynes","mono":"JK","country":"uk","ready":true,"what":"His memos, letters and books on markets, and his record running King's College's money","crumb":"John Maynard Keynes · 9 sources","handbookTitle":"John Maynard Keynes: a study handbook","unitTab":"Sources","unitWord":"source","unitRoute":"source","unitsRoute":"sources","scope":"Keynes left no book on investing. His views come from his memos and letters (printed in his Collected Writings), from The General Theory, and from the King's College archives studied by David Chambers and Elroy Dimson. Famous lines often credited to him that he never wrote are flagged.","readHow":"Chapter 12 of The General Theory is free online. The 1934 letter is reproduced in Warren Buffett's 1991 letter. The research summaries are free on the Cambridge Judge Business School and CFA Institute websites.","sourcesNote":"Sources: his May 1938 memo to the King's College Estates Committee, his letter to F. C. Scott of 15 August 1934, The General Theory (1936), research by Chambers, Dimson and Foo (Cambridge, 2013–14), a study of his currency trading (2016), King's College and Quote Investigator. Lessons are in our own words; exact quotes are short and checked.","start":{"lede":"John Maynard Keynes was the most famous economist of the 20th century. He also ran King's College, Cambridge's investments for 25 years. He failed as a market forecaster in the 1920s, changed his method, and from 1922 to 1946 his fund averaged about 16% a year against 10.4% for the UK market.","para":"This page draws on his 1938 investment memo to King's College, his 1934 letter to F. C. Scott, chapter 12 of The General Theory, and Cambridge research that rebuilt his record from the college archives. About an hour a week for ten weeks.","steps":[]},"glossary":[["Bursar","The college officer in charge of its money and property."],["Endowment","A fund given to an institution, invested so that it can pay for its work for ever."],["Discretionary fund","Money the manager may invest freely, without fixed rules on what to buy."],["Credit cycle policy","His 1920s attempt to buy shares in slumps and sell them in booms: market timing."],["Intrinsic value","What a business is really worth, judged from what it will earn, as opposed to its price."],["Turnover","The share of a portfolio bought and sold in a year."],["Beauty contest","His picture of a market where people guess what others will think, not what is good."],["Animal spirits","The spontaneous urge to act, rather than calculation, that drives much investment."],["Shilling","An old British coin worth one twentieth of a pound; 15 shillings was 75p."],["Liquidity","How easily something can be sold for cash at a fair price."]],"units":[{"key":"memo","chip":"Memo, 1938","tag":"Memo, 1938","title":"Post-mortem memo to the King's College Estates Committee","date":"May 1938. Printed in his Collected Writings, volume XII.","summary":"His own review of his record: why timing the market failed, and the three principles that replaced it.","year":1938,"link":"https://novelinvestor.com/john-maynard-keyness-investment-policy/","linkLabel":"Read the key passage","nuggets":["t1n1","t1n2","t1n3","t2n3","t2n4","t3n1","t3n2","t3n3","t3n4","t8n4","t9n1","t10n3"],"mistakes":[],"quote":"q-memo"},{"key":"scott","chip":"Letter, 1934","tag":"Letter, 1934","title":"Letter to F. C. Scott","date":"15 August 1934. Warren Buffett reproduced it in his 1991 letter to Berkshire shareholders.","summary":"Why he preferred a few large holdings in businesses he understood, run by people he trusted.","year":1934,"link":"https://www.berkshirehathaway.com/letters/1991.html","linkLabel":"Read it in Buffett's 1991 letter","nuggets":["t4n1","t4n2","t10n3"],"mistakes":[],"quote":"q-scott"},{"key":"gt","chip":"General Theory, 1936","tag":"General Theory, 1936","title":"The General Theory, chapter 12","date":"The General Theory of Employment, Interest and Money, 1936. Chapter 12: The State of Long-Term Expectation.","summary":"The most quoted pages ever written about stock markets: convention, the beauty contest, animal spirits, speculation and enterprise.","year":1936,"link":"https://www.marxists.org/reference/subject/economics/keynes/general-theory/ch12.htm","linkLabel":"Read chapter 12 (free)","nuggets":["t6n1","t6n2","t6n3","t7n1","t7n2","t7n3","t8n1","t8n2","t8n3","t10n3"],"mistakes":[],"quote":"q-gt"},{"key":"cd","chip":"Chambers & Dimson","tag":"Chambers & Dimson","title":"Keynes the stock market investor","date":"David Chambers and Elroy Dimson, Cambridge Judge Business School, 2013 (with Justin Foo, 2014).","summary":"His record rebuilt from the King's archives: what he owned, how it did, and how he changed his method.","year":2013,"link":"https://www.jbs.cam.ac.uk/insight/2013/investing-in-2013-ask-john-maynard-keynes","linkLabel":"Read the summary","nuggets":["t1n4","t2n1","t2n2","t5n1","t7n4","t9n2","t9n4"],"mistakes":[],"quote":null},{"key":"cfa","chip":"CFA Institute, 2014","tag":"CFA Institute, 2014","title":"Keynes the investor: lessons to be learned","date":"CFA Institute, October 2014: Elroy Dimson's talk.","summary":"The numbers behind his record and eight lessons for investors today.","year":2014,"link":"https://blogs.cfainstitute.org/eic/2014/10/20/keynes-the-investor-lessons-to-be-learned/","linkLabel":"Read the article","nuggets":["t4n3","t4n4","t5n2","t5n3","t5n4","t6n4","t9n3"],"mistakes":[],"quote":null},{"key":"fx","chip":"Currency study, 2016","tag":"Currency study, 2016","title":"If you're so smart: Keynes and currency speculation","date":"Olivier Accominotti and David Chambers, 2016.","summary":"A study of his 354 currency trades from 1919 to 1939: usually right on direction, poor on timing.","year":2016,"link":"https://www.jbs.cam.ac.uk/2016/if-youre-so-smart/","linkLabel":"Read the summary","nuggets":["t1n5"],"mistakes":[],"quote":null},{"key":"kings","chip":"King's College","tag":"King's College","title":"Maynard Keynes in King's College","date":"King's College, Cambridge.","summary":"His life at the college: student, Fellow, Bursar from 1919 and First Bursar from 1924 to 1946.","year":null,"link":"https://www.kings.cam.ac.uk/node/16149","linkLabel":"The college's page","nuggets":[],"mistakes":[],"quote":null},{"key":"qi","chip":"Quote Investigator","tag":"Quote Investigator","title":"The market can remain irrational…: who said it?","date":"Quote Investigator, 2011.","summary":"Why the most famous 'Keynes' line about markets probably isn't his.","year":null,"link":"https://quoteinvestigator.com/2011/08/09/remain-solvent/","linkLabel":"Read the investigation","nuggets":["t10n1","t10n2","t10n4"],"mistakes":[],"quote":null},{"key":"eug","chip":"Journal article","tag":"Journal article","title":"Keynesian eugenics and the goodness of the world","date":"Journal of British Studies (Cambridge University Press).","summary":"Research on Keynes's long involvement with eugenics, including as director of the Eugenics Society.","year":null,"link":"https://www.cambridge.org/core/product/1D1FE14255DA18E1DA28ED94E9680198","linkLabel":"The article","nuggets":[],"mistakes":[],"quote":null}],"themes":[{"id":"t1","num":1,"title":"The forecaster who failed","idea":"In the 1920s he tried to profit from the ups and downs of the economy. Even he could not time them.","nuggets":["t1n1","t1n2","t1n3","t1n4","t1n5"],"ask":["If one of the world's best-informed economists couldn't time markets, why might you?","What would buying too late and selling too late look like in your own history?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t2","num":2,"title":"From forecaster to stock picker","idea":"In the early 1930s he stopped forecasting the market and started choosing individual companies. His results improved dramatically.","nuggets":["t2n1","t2n2","t2n3","t2n4"],"ask":["What belief about investing have you changed in the last five years?","Why might fewer trades lead to better results?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t3","num":3,"title":"His three principles","idea":"In May 1938 he summed up successful investment in three principles: careful selection, steadfast holding, balance.","nuggets":["t3n1","t3n2","t3n3","t3n4"],"ask":["Which of the three principles do you find hardest?","What does the £1 note story tell you about selling cheap shares to buy them back cheaper?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t4","num":4,"title":"A few big bets you understand","idea":"He thought spreading money across many things you know little about was a mistake. Better a few large holdings you understand.","nuggets":["t4n1","t4n2","t4n3","t4n4"],"ask":["How many companies do you understand well enough to bet big on?","What is the risk of concentration, and how did his third principle answer it?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t5","num":5,"title":"Shares over bonds, for the long run","idea":"He moved a centuries-old college endowment from land and bonds into shares, decades before other institutions.","nuggets":["t5n1","t5n2","t5n3","t5n4"],"ask":["Why might a fund that must last for centuries prefer shares to bonds?","What does buying below break-up value protect you from?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t6","num":6,"title":"The beauty contest","idea":"He compared the stock market to a newspaper contest where you win by guessing what others will pick, not what you think is best.","nuggets":["t6n1","t6n2","t6n3","t6n4"],"ask":["When did you last buy something because you thought others would want it?","How could the beauty contest create bargains for a patient investor?"],"table":null,"tool":null,"stories":[],"diagram":"beauty","after":0,"caption":"In a market, many players stop asking what is good and start guessing what others will think."},{"id":"t7","num":7,"title":"Convention and reputation","idea":"Most people assume tomorrow will look like today, and most professionals would rather be wrong with the crowd than right alone.","nuggets":["t7n1","t7n2","t7n3","t7n4"],"ask":["Would you rather be wrong with the crowd or right alone? Be honest.","Who would need to trust you for you to invest unconventionally?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t8","num":8,"title":"Animal spirits","idea":"Much of what drives business and markets is not calculation but a spontaneous urge to act, which can switch off suddenly.","nuggets":["t8n1","t8n2","t8n3","t8n4"],"ask":["Where do you see animal spirits running high right now?","How would you tell a casino from an enterprise in today's market?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t9","num":9,"title":"Holding through the falls","idea":"Long-term investing means sitting through sharp falls. He did, and it cost him a chairmanship.","nuggets":["t9n1","t9n2","t9n3","t9n4"],"ask":["How would you feel watching your portfolio fall 25% in a few months?","What would you need to have decided in advance to hold on?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t10","num":10,"title":"Words he never said","idea":"Keynes is the most misquoted investor of all. Checking who really said what is a good habit for every investor.","nuggets":["t10n1","t10n2","t10n3","t10n4"],"ask":["Which famous investing quote have you shared without checking it?","Where would you look to check who really said something?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""}],"nuggets":{"t1n1":{"id":"t1n1","theme":"t1","tags":"Memo, 1938","units":["memo"],"lead":"The plan.","text":"At first he believed profit could be made by holding shares in slumps and selling them in booms, which he called a credit cycle policy.","co":[]},"t1n2":{"id":"t1n2","theme":"t1","tags":"Memo, 1938","units":["memo"],"lead":"The result.","text":"Looking back in 1938, he admitted the fund had not managed to profit from moving in and out of shares as a whole.","co":[]},"t1n3":{"id":"t1n3","theme":"t1","tags":"Memo, 1938","units":["memo"],"lead":"Why it fails.","text":"He found that people who try usually move after the turn, both in and out, and trade too often, which piles up costs and makes them jumpy.","co":[]},"t1n4":{"id":"t1n4","theme":"t1","tags":"Chambers & Dimson","units":["cd"],"lead":"After the 1929 crash.","text":"Having suffered heavy losses, he sold a fifth of his UK shares and moved into government bonds, the conventional response.","co":[]},"t1n5":{"id":"t1n5","theme":"t1","tags":"Currency study, 2016","units":["fx"],"lead":"Currencies too.","text":"In 354 currency trades he was usually right about direction but struggled with timing.","co":[]},"t2n1":{"id":"t2n1","theme":"t2","tags":"Chambers & Dimson","units":["cd"],"lead":"The switch.","text":"From the early 1930s he moved from top-down market timing to bottom-up stock picking.","co":[]},"t2n2":{"id":"t2n2","theme":"t2","tags":"Chambers & Dimson","units":["cd"],"lead":"Less trading.","text":"His yearly turnover fell from about 55% in the 1920s to 30% in the 1930s and 14% in the 1940s.","co":[]},"t2n3":{"id":"t2n3","theme":"t2","tags":"Memo, 1938","units":["memo"],"lead":"What did work.","text":"Even in his 1938 review, buying particular shares when their prices were greatly depressed had done well.","co":[]},"t2n4":{"id":"t2n4","theme":"t2","tags":"Memo, 1938","units":["memo"],"lead":"He changed his mind in writing.","text":"His 1938 memo openly drew the opposite lesson from the one he had set out to prove. Admitting it is the first step.","co":[]},"t3n1":{"id":"t3n1","theme":"t3","tags":"Memo, 1938","units":["memo"],"lead":"1. Careful selection.","text":"A few investments, picked because they are cheap compared with what they are likely to be worth over the next few years, and compared with the alternatives.","co":[]},"t3n2":{"id":"t3n2","theme":"t3","tags":"Memo, 1938","units":["memo"],"lead":"2. Steadfast holding.","text":"Own them in size and refuse to be shaken out, for years if needed, until they deliver or you can see you were wrong.","co":[]},"t3n3":{"id":"t3n3","theme":"t3","tags":"Memo, 1938","units":["memo"],"lead":"3. Balance.","text":"Mix your risks even though each holding is big, ideally with some that tend to move the other way, as gold-mining shares often did against other shares.","co":[]},"t3n4":{"id":"t3n4","theme":"t3","tags":"Memo, 1938","units":["memo"],"lead":"The £1 note.","text":"Selling something worth £1 for 15 shillings (75p), hoping to buy it back for 12s 6d (about 62p), is a poor trade. So is refusing to buy it at 15 shillings because it looks too good to be true.","co":[]},"t4n1":{"id":"t4n1","theme":"t4","tags":"Letter, 1934","units":["scott"],"lead":"Know the business.","text":"In 1934 he told a colleague it is better to invest decent amounts in a few businesses you understand and whose managers you believe in.","co":[]},"t4n2":{"id":"t4n2","theme":"t4","tags":"Letter, 1934","units":["scott"],"lead":"Two or three at a time.","text":"He reckoned that at any one moment only two or three companies earned his complete confidence.","co":[]},"t4n3":{"id":"t4n3","theme":"t4","tags":"CFA Institute, 2014","units":["cfa"],"lead":"Concentrated in practice.","text":"His holdings grew from about 20 to over 60, yet at times more than half the fund sat in five shares.","co":[]},"t4n4":{"id":"t4n4","theme":"t4","tags":"CFA Institute, 2014","units":["cfa"],"lead":"A bold position.","text":"In 1936, 66% of the fund was in mining shares.","co":[]},"t5n1":{"id":"t5n1","theme":"t5","tags":"Chambers & Dimson","units":["cd"],"lead":"Ahead of his time.","text":"He moved King's into shares while most institutions still relied on bonds and property.","co":[]},"t5n2":{"id":"t5n2","theme":"t5","tags":"CFA Institute, 2014","units":["cfa"],"lead":"Shares for the long run.","text":"For investors with very long horizons, he favoured shares over bonds.","co":[]},"t5n3":{"id":"t5n3","theme":"t5","tags":"CFA Institute, 2014","units":["cfa"],"lead":"Look abroad.","text":"By the late 1930s his fund held less in Britain than in the US or Africa.","co":[]},"t5n4":{"id":"t5n4","theme":"t5","tags":"CFA Institute, 2014","units":["cfa"],"lead":"Value and dividends.","text":"He leaned towards cheap shares with high dividend yields. One famous buy, the mining group Union Corporation, cost 30% less than its estimated break-up value.","co":[]},"t6n1":{"id":"t6n1","theme":"t6","tags":"General Theory, 1936","units":["gt"],"lead":"The contest.","text":"Readers had to pick the six prettiest faces from a hundred photographs. The prize went to whoever picked closest to the average choice.","co":[]},"t6n2":{"id":"t6n2","theme":"t6","tags":"General Theory, 1936","units":["gt"],"lead":"Second and third guesses.","text":"So each player picks not the face he finds prettiest, but the one he thinks others will pick, and some go further still.","co":[]},"t6n3":{"id":"t6n3","theme":"t6","tags":"General Theory, 1936","units":["gt"],"lead":"Professionals do the same.","text":"Many professional investors focus on guessing how market opinion will shift in the coming months, not on a business's long-run worth.","co":[]},"t6n4":{"id":"t6n4","theme":"t6","tags":"CFA Institute, 2014","units":["cfa"],"lead":"Your edge.","text":"Prices can drift far from value for a long time. Thinking about the business, not the crowd, is what lets you profit when they meet again.","co":[]},"t7n1":{"id":"t7n1","theme":"t7","tags":"General Theory, 1936","units":["gt"],"lead":"The convention.","text":"Lacking real knowledge of the far future, we assume the present will continue unless we have a specific reason to expect change.","co":[]},"t7n2":{"id":"t7n2","theme":"t7","tags":"General Theory, 1936","units":["gt"],"lead":"Safety in numbers.","text":"He saw that for a professional's reputation, failing with everyone else is safer than succeeding alone.","co":[]},"t7n3":{"id":"t7n3","theme":"t7","tags":"General Theory, 1936","units":["gt"],"lead":"Liquid but jumpy.","text":"Because shares can be sold at any moment, their prices are revalued daily, letting short-term mood dominate.","co":[]},"t7n4":{"id":"t7n4","theme":"t7","tags":"Chambers & Dimson","units":["cd"],"lead":"Someone must back you.","text":"He could be unconventional because the Fellows of King's trusted him. Long-term investing needs patient backers.","co":[]},"t8n1":{"id":"t8n1","theme":"t8","tags":"General Theory, 1936","units":["gt"],"lead":"Not just arithmetic.","text":"Many decisions to invest rest on spontaneous optimism, which he called animal spirits, rather than on careful calculation.","co":[]},"t8n2":{"id":"t8n2","theme":"t8","tags":"General Theory, 1936","units":["gt"],"lead":"When spirits fade.","text":"If optimism dims, investment can collapse even with no new facts.","co":[]},"t8n3":{"id":"t8n3","theme":"t8","tags":"General Theory, 1936","units":["gt
