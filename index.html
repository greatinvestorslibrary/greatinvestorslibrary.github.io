"],"lead":"Speculation and enterprise.","text":"He warned that when a nation's investment is driven by casino-like speculation, the job is likely to be done badly.","co":[]},"t8n4":{"id":"t8n4","theme":"t8","tags":"Memo, 1938","units":["memo"],"lead":"Use the mood, don't share it.","text":"His own best buys came when prices were greatly depressed: when animal spirits were at their lowest.","co":[]},"t9n1":{"id":"t9n1","theme":"t9","tags":"Memo, 1938","units":["memo"],"lead":"Two big falls.","text":"In nine years his whole share portfolio had twice fallen 20 to 25% within a few months, and he could not escape either fall.","co":[]},"t9n2":{"id":"t9n2","theme":"t9","tags":"Chambers & Dimson","units":["cd"],"lead":"1937–38.","text":"When London shares fell sharply he stayed invested, and resigned as chairman of an insurance company whose board would not stick with his strategy.","co":[]},"t9n3":{"id":"t9n3","theme":"t9","tags":"CFA Institute, 2014","units":["cfa"],"lead":"Half an hour a day.","text":"He spent no more than about half an hour each morning on it, usually before getting out of bed. You don't need to watch every price.","co":[]},"t9n4":{"id":"t9n4","theme":"t9","tags":"Chambers & Dimson","units":["cd"],"lead":"The reward.","text":"By his death, King's had drawn level with Trinity, the wealthiest college in Cambridge.","co":[]},"t10n1":{"id":"t10n1","theme":"t10","tags":"Quote Investigator","units":["qi"],"lead":"Not his line.","text":"\"The market can remain irrational longer than you can remain solvent\" has no solid source in Keynes's writings. The earliest record found is the American adviser Gary Shilling, in 1986.","co":[]},"t10n2":{"id":"t10n2","theme":"t10","tags":"Quote Investigator","units":["qi"],"lead":"Nor this one.","text":"\"When the facts change, I change my mind\" is also widely credited to him, but scholars of his papers have found no primary source.","co":[]},"t10n3":{"id":"t10n3","theme":"t10","tags":"General Theory, 1936 · Memo, 1938 · Letter, 1934","units":["gt","memo","scott"],"lead":"What he did write.","text":"His real words, in chapter 12 of The General Theory, the 1938 memo and the 1934 letter, are sharper than the invented ones. Read them.","co":[]},"t10n4":{"id":"t10n4","theme":"t10","tags":"Quote Investigator","units":["qi"],"lead":"Check before you share.","text":"If a quote is too perfect and has no date or source, it is probably not genuine.","co":[]}},"quotes":[{"id":"q-gt","unit":"gt","label":"The General Theory, 1936","text":"it is better for reputation to fail conventionally than to succeed unconventionally","theme":"t7"},{"id":"q-memo","unit":"memo","label":"Memo to King's College, 1938","text":"a steadfast holding of these in fairly large units through thick and thin","theme":"t3"},{"id":"q-scott","unit":"scott","label":"Letter to F. C. Scott, 1934","text":"put fairly large sums into enterprises which one thinks one knows something about","theme":"t4"}],"mistakes":[],"tendencies":[],"plan":[{"n":1,"label":"The forecaster who failed","themes":["t1"],"units":["memo"],"extra":""},{"n":2,"label":"From forecaster to stock picker","themes":["t2"],"units":["cd"],"extra":""},{"n":3,"label":"His three principles","themes":["t3"],"units":["memo"],"extra":""},{"n":4,"label":"A few big bets you understand","themes":["t4"],"units":["scott"],"extra":""},{"n":5,"label":"Shares over bonds, for the long run","themes":["t5"],"units":["cfa"],"extra":""},{"n":6,"label":"The beauty contest","themes":["t6"],"units":["gt"],"extra":""},{"n":7,"label":"Convention and reputation","themes":["t7"],"units":["gt"],"extra":""},{"n":8,"label":"Animal spirits","themes":["t8"],"units":["gt"],"extra":""},{"n":9,"label":"Holding through the falls","themes":["t9"],"units":["cd"],"extra":""},{"n":10,"label":"Words he never said","themes":["t10"],"units":["qi"],"extra":""}],"selftest":["What was his 'credit cycle policy', and why did it fail?","What changed in his method in the early 1930s, and what happened to his turnover?","State his three principles from 1938 in your own words.","Explain the £1 note example.","Why did he prefer a few large holdings? What did he say in his 1934 letter?","Describe the beauty contest and what it says about markets.","What does 'it is better for reputation to fail conventionally' tell you about professional investors?","What are animal spirits?","How did he behave in the 1937–38 fall, and what did it cost him?","Name one famous line wrongly credited to him, and who more likely said it."],"disclaimer":["For education only. Nothing here is investment, financial, legal or tax advice, or a recommendation to buy, sell or hold any security.","Records and figures come from the published sources named on this page and may be revised; check the originals before relying on them.","Accuracy is not guaranteed and errors are possible; treat the original sources as correct. No liability is accepted for any loss arising from use of this material. Past results do not predict future ones.","Independent and unaffiliated: not endorsed by King's College, Cambridge, the Keynes estate, Cambridge University Press, the researchers cited, Berkshire Hathaway or any organisation named. All trademarks and copyrights belong to their owners."],"big":{"timeline":[[1883,"Born in Cambridge on 5 June"],[1902,"Undergraduate at King's College, Cambridge; a Fellow from 1909"],[1919,"Quits the Paris peace talks and writes The Economic Consequences of the Peace; becomes Bursar of King's; starts trading currencies"],[1921,"Persuades King's to give him a fund of its own to invest freely"],[1924,"First Bursar of King's, until his death"],[1929,"Wall Street Crash: heavy losses"],["early 1930s","Switches from market timing to picking individual shares"],[1934,"Letter to F. C. Scott on concentrated investing"],[1936,"The General Theory; opens the Cambridge Arts Theatre, which he largely paid for"],["1937–44","Director of the Eugenics Society (see the honest note below)"],[1938,"Writes his investment post-mortem memo for King's"],[1942,"Made a peer; chairs the wartime arts council that became the Arts Council"],[1944,"Leads Britain's team at the Bretton Woods conference"],[1946,"Dies on 21 April; leaves his art and rare books to King's"]],"map":[["He failed first","In the 1920s he tried to forecast the business cycle and time the market. It did not work."],["Then he changed","From the early 1930s he picked a few undervalued shares and held them. Results improved dramatically."],["Three principles","In 1938: choose a few cheap investments carefully, hold them steadfastly, and balance the risks."],["Markets are a beauty contest","Many investors guess what others will think rather than what a business is worth. That creates both danger and opportunity."],["Bet big where you know","He preferred large holdings in businesses he understood to many small bets."],["Hold through the falls","His fund fell 20 to 25% twice in nine years. He did not escape, and he held on."]]},"record":[["16.0% a year","his King's fund's average yearly return, 1922 to 1946"],["10.4% a year","the UK stock market's average over the same years"],["+8 points","a year ahead on his UK shares (Chambers & Dimson)"],["½ hour","a day on it, usually in bed each morning"]],"special":"keynes","honest":"Keynes was a supporter of eugenics throughout his life and director of the Eugenics Society from 1937 to 1944. These views, held by many of his era, are now widely condemned. We include him for his investing, where the record is strong and well documented, and state this plainly so you can judge for yourself.","phases":[["Approach","Forecast the economy; move in and out of the market","Pick a few cheap companies; hold them"],["Turnover","About 55% a year in the 1920s","30% in the 1930s, 14% in the 1940s"],["After big falls","Sold a fifth of UK shares after the 1929 crash","Stayed invested through 1937–38"],["Results","Disappointing; he struggled","Dramatically better"]]},"lilu":{"id":"lilu","name":"Li Lu","short":"Li Lu","mono":"LL","country":"china","ready":true,"what":"His interview, lectures and foreword on value investing, in China and the world","crumb":"Li Lu · 7 sources","handbookTitle":"Li Lu: a study handbook","unitTab":"Sources","unitWord":"source","unitRoute":"source","unitsRoute":"sources","scope":"Li Lu writes no yearly letters. His thinking is in a handful of speeches, one long interview and a foreword, most of them free on Himalaya Capital's website, plus a book in Chinese (2020). Some talks were given in Chinese; where we rely on a translation, the source says whose. He has published no fund figures since 2009.","readHow":"Start with the 2013 Columbia interview and the 2015 Peking University lecture. Both are free in English.","sourcesNote":"Sources: his foreword to the Chinese edition of Poor Charlie's Almanack (2010), the Graham & Doddsville interview (2013), his Peking University lectures (2015 and 2019), his book (2020, in Chinese), his conversation at Columbia's Graham & Dodd luncheon (2026), and news reports on BYD. Lessons are in our own words; exact quotes are short and checked.","start":{"lede":"Li Lu reached the United States in 1989 with little money and less English, heard Warren Buffett speak at Columbia in 1993, and founded Himalaya Capital in 1997. Charlie Munger later called him the only outside manager he had ever invested with. His method: treat a share as part of a business, know exactly where your knowledge ends, buy with a margin of safety, and wait for the rare great bet.","para":"This page draws on his foreword to Poor Charlie's Almanack, a long interview with Columbia students, two lectures at Peking University, his book, and a 2026 talk at Columbia. About an hour a week for ten weeks: one idea here, then the source it comes from.","steps":[]},"glossary":[["Value investing","Buying a share for less than the business is worth, and holding it while the business grows."],["Circle of competence","The area where you genuinely understand businesses well enough to value them."],["Margin of safety","The gap between a cautious estimate of value and the price you pay."],["Mr Market","Benjamin Graham's picture of the market as a moody partner offering prices you may take or ignore."],["Short selling","Borrowing shares to sell them, hoping to buy them back later at a lower price."],["Long-only fund","A fund that only owns shares and never bets on prices falling."],["Lock-up","A period during which investors agree not to withdraw their money."],["Intrinsic value","What a business is really worth, judged from the cash it will produce."],["Fiduciary","Someone trusted to act in another person's interest, before their own."]],"units":[{"key":"pca","chip":"Foreword, 2010","tag":"Foreword, 2010","title":"Foreword to the Chinese edition of Poor Charlie's Almanack","date":"May 2010. English translation by volunteers, published on Himalaya Capital's website.","summary":"His own story: hearing Buffett, his first shares, a bad first year, meeting Munger, and how Munger changed his fund. Also what he learned from Munger about inversion, reading and character.","year":2010,"link":"https://uploads-ssl.webflow.com/5ef3c7300432b40ed865991a/5ef3c7300432b4440a659983_Li%20Lu%20-%20Foreword%20to%20Chinese%20Edition%20of%20PCA%20(English%20translation).pdf","linkLabel":"Read the foreword (PDF)","nuggets":["t1n2","t1n3","t2n5","t6n1","t6n2","t6n4","t8n1","t8n2","t10n1"],"mistakes":[],"quote":null},{"key":"gd13","chip":"Interview, 2013","tag":"Interview, 2013","title":"Know what you don't know","date":"Graham & Doddsville, Columbia Business School student newsletter, Spring 2013.","summary":"A long interview in English: how he started, how he finds ideas, why he gave up short selling, and his early investment in BYD.","year":2013,"link":"https://business.columbia.edu/sites/default/files-efs/imce-uploads/Graham%20%26%20Doddsville%20-%20Issue%2018%20-%20Spring%202013_0.pdf","linkLabel":"Read the interview (PDF, page 24)","nuggets":["t1n2","t1n5","t4n4","t5n4","t5n5","t6n1","t6n2","t6n3","t6n4","t6n5","t7n5","t10n2","t10n3"],"mistakes":[],"quote":"q-gd13"},{"key":"pku15","chip":"Lecture, 2015","tag":"Lecture, 2015","title":"The prospects for value investing in China","date":"Peking University, Guanghua School of Management, 28 October 2015. Given in Chinese; Himalaya Capital publishes an English translation.","summary":"His fullest statement of the four core ideas, the qualities of a good investor, two centuries of returns, and whether value investing can work in China.","year":2015,"link":"https://www.himcap.com/publications","linkLabel":"Himalaya's page of his speeches","nuggets":["t1n1","t2n1","t2n2","t2n3","t2n4","t3n1","t3n3","t3n4","t7n3","t8n3","t8n4","t9n3","t9n4","t9n5"],"mistakes":[],"quote":null},{"key":"pku19","chip":"Lecture, 2019","tag":"Lecture, 2019","title":"The practice of value investing","date":"Peking University, 29 November 2019. Given in Chinese; English translation by Graham Rhodes for LongRiver.","summary":"The practical side: his first investment as a student, how he researches a company like an owner, and why patience and decisiveness must go together.","year":2019,"link":"https://www.longriverinv.com/thought/the-practice-of-value-investing-by-li-lu","linkLabel":"Read the translation","nuggets":["t1n1","t1n4","t2n3","t2n4","t3n4","t4n1","t4n2","t4n3","t4n5","t5n1","t5n2","t5n3","t7n1","t7n2","t7n4","t10n5"],"mistakes":[],"quote":null},{"key":"book","chip":"Book, 2020","tag":"Book, 2020","title":"Civilization, Modernization, Value Investing and China","date":"CITIC Press, 2020, in Chinese (文明、现代化、价值投资与中国). Collects his main speeches and essays.","summary":"His view of history in stages, why modern economies let businesses compound, and how value investing fits China.","year":2020,"link":"https://www.himcap.com/publications","linkLabel":"Listed on Himalaya's website","nuggets":["t9n4"],"mistakes":[],"quote":null},{"key":"gd26","chip":"Talk, 2026","tag":"Talk, 2026","title":"Fireside chat at the Graham & Dodd luncheon","date":"Columbia Business School, 5 October 2026. English transcript published by Columbia.","summary":"His six principles, why you cannot want both value investing and good results every quarter, AI, China, and advice to young investors.","year":2026,"link":"https://business.columbia.edu/sites/default/files-efs/imce-uploads/36th%20Annual%20Graham%20%26%20Dodd%20Luncheon%20Transcript%20(20261005)%20CBS.pdf","linkLabel":"Read the transcript (PDF)","nuggets":["t1n5","t2n1","t3n1","t3n2","t8n5","t9n1","t9n2","t10n4","t10n5"],"mistakes":[],"quote":"q-gd26"},{"key":"byd","chip":"News, 2025","tag":"News, 2025","title":"Berkshire exits BYD after 17 years","date":"Reuters report, via RTÉ, 22 September 2025.","summary":"How Berkshire's 2008 purchase of 10% of BYD for about $230m grew more than twentyfold before it sold out.","year":2025,"link":"https://www.rte.ie/news/business/2025/0922/1534663-berkshire-hathaway-exits-byd","linkLabel":"Read the report","nuggets":["t7n5"],"mistakes":[],"quote":null}],"themes":[{"id":"t1","num":1,"title":"A share is a piece of a business","idea":"Value investing rests on four ideas. The first is that a share is part-ownership of a real business, so your return comes from the business growing.","nuggets":["t1n1","t1n2","t1n3","t1n4","t1n5"],"ask":["Pick a company you own or know. How exactly does it earn its money?","Would you still want to own it if no price were quoted for five years?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t2","num":2,"title":"Know where your circle ends","idea":"Your circle of competence should be small and clearly drawn. The skill is knowing where it ends, and what would prove you wrong.","nuggets":["t2n1","t2n2","t2n3","t2n4","t2n5"],"ask":["Name one industry where you are truly inside your circle, and one where you only feel you are.","What single fact would prove your favourite investment idea wrong?"],"table":null,"tool":null,"stories":[],"diagram":"edge","after":0,"caption":"What matters is not how big the circle is, but knowing exactly where it ends."},{"id":"t3","num":3,"title":"The market serves you","idea":"Prices are there to use when they suit you. The market cannot tell you what a company is worth, and it punishes anyone who forgets that.","nuggets":["t3n1","t3n2","t3n3","t3n4"],"ask":["When did a falling price last change your opinion of a business? Should it have?","What results would you need every quarter to feel calm? Is that realistic?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t4","num":4,"title":"Margin of safety","idea":"Because the future is uncertain, buy at a price far below your cautious estimate of value. He started with very cheap shares and moved, over time, to great businesses at fair prices.","nuggets":["t4n1","t4n2","t4n3","t4n4","t4n5"],"ask":["What is your cautious estimate of value for one company you know, and how far below it is the price?","When would you sell a share that has risen to its value?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t5","num":5,"title":"Research like an owner","idea":"Study a company as if you had just inherited it and had to run it. Talk to everyone, from the boss to the security guard.","nuggets":["t5n1","t5n2","t5n3","t5n4","t5n5"],"ask":["If you inherited a company you own shares in, what would you want to know first?","Who, besides the boss, could tell you the truth about a company?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t6","num":6,"title":"Why he gave up short selling","idea":"He calls short selling one of his worst mistakes. The maths, the frauds and the distraction all work against you.","nuggets":["t6n1","t6n2","t6n3","t6n4","t6n5"],"ask":["Why might a short seller lose money even when right about a company?","What else in your investing eats attention without adding much?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t7","num":7,"title":"Patient, then decisive","idea":"Great opportunities are rare. Wait calmly while nothing happens, then act firmly when one appears.","nuggets":["t7n1","t7n2","t7n3","t7n4","t7n5"],"ask":["How many truly great opportunities do you think you will see in the next ten years?","What would you need to see to act in size?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t8","num":8,"title":"A different road from Wall Street","idea":"Munger told him his problems were Wall Street's problems. He rebuilt his fund around long-term partners and a sense of duty to their savings.","nuggets":["t8n1","t8n2","t8n3","t8n4","t8n5"],"ask":["If someone managed your parents' savings, what would you want them never to do?","Why might a smaller fund with patient partners do better than a bigger one?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t9","num":9,"title":"Own a slice of the world","idea":"Real wealth is your share of the world's buying power. Over two centuries, owning businesses beat cash, gold and bonds by a vast margin.","nuggets":["t9n1","t9n2","t9n3","t9n4","t9n5"],"ask":["What share of your wealth sits in cash or gold? What has inflation done to it?","Which market or industry near you do most investors ignore?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t10","num":10,"title":"Mistakes, luck and compounding knowledge","idea":"He had a bad first year, sold winners too early and gave up shorting the hard way. He credits luck, and says knowledge compounds like money.","nuggets":["t10n1","t10n2","t10n3","t10n4","t10n5"],"ask":["Which of your mistakes taught you the most?","What will you know in five years that you don't know now, and how will you learn it?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""}],"nuggets":{"t1n1":{"id":"t1n1","theme":"t1","tags":"Lecture, 2015 · Lecture, 2019","units":["pku15","pku19"],"lead":"Four ideas, one road.","text":"He sums up value investing as four ideas: a share is part of a business; the market is there to serve you; buy with a margin of safety; stay inside your circle of competence.","co":[]},"t1n2":{"id":"t1n2","theme":"t1","tags":"Foreword, 2010 · Interview, 2013","units":["pca","gd13"],"lead":"The lecture that changed his life.","text":"A classmate took him to hear Buffett at Columbia. He found the case clear and convincing: shares are pieces of businesses, and over time prices follow what those businesses are worth.","co":[]},"t1n3":{"id":"t1n3","theme":"t1","tags":"Foreword, 2010","units":["pca"],"lead":"Two years of reading.","text":"He then spent nearly two years reading about Buffett, Berkshire and Munger before buying his first share, while his own net worth was still below zero.","co":[]},"t1n4":{"id":"t1n4","theme":"t1","tags":"Lecture, 2019","units":["pku19"],"lead":"Owning changes how you look.","text":"Once he owned a company he became curious about every part of it, and that curiosity taught him the whole industry.","co":[]},"t1n5":{"id":"t1n5","theme":"t1","tags":"Interview, 2013 · Talk, 2026","units":["gd13","gd26"],"lead":"Win-win, not zero-sum.","text":"He likes investing in businesses because owner and company can both win. Trading against other traders is a zero-sum game.","co":[]},"t2n1":{"id":"t2n1","theme":"t2","tags":"Lecture, 2015 · Talk, 2026","units":["pku15","gd26"],"lead":"The edge matters most.","text":"What counts is not how much you know but knowing exactly where your knowledge stops.","co":[]},"t2n2":{"id":"t2n2","theme":"t2","tags":"Lecture, 2015","units":["pku15"],"lead":"Say when you would be wrong.","text":"You should be able to state the conditions under which your view of a company would fail.","co":[]},"t2n3":{"id":"t2n3","theme":"t2","tags":"Lecture, 2015 · Lecture, 2019","units":["pku15","pku19"],"lead":"Small and hard-won.","text":"A real circle is built over years and stays small. Most people cannot see five or ten years ahead for most companies.","co":[]},"t2n4":{"id":"t2n4","theme":"t2","tags":"Lecture, 2015 · Lecture, 2019","units":["pku15","pku19"],"lead":"Don't fool yourself.","text":"Intellectual honesty comes first: you are the easiest person to fool, and people tend to believe whatever suits them.","co":[]},"t2n5":{"id":"t2n5","theme":"t2","tags":"Foreword, 2010","units":["pca"],"lead":"Argue the other side first.","text":"From Munger he took the rule of holding no opinion until he can state the opposing case better than its supporters.","co":[]},"t3n1":{"id":"t3n1","theme":"t3","tags":"Lecture, 2015 · Talk, 2026","units":["pku15","gd26"],"lead":"Servant, not master.","text":"Use market prices to buy and sell when they suit you; never take them as a verdict on value.","co":[]},"t3n2":{"id":"t3n2","theme":"t3","tags":"Talk, 2026","units":["gd26"],"lead":"You cannot have both.","text":"Many investors want the benefits of value investing and good results every quarter. Chasing both pushes you into speculation.","co":[]},"t3n3":{"id":"t3n3","theme":"t3","tags":"Lecture, 2015","units":["pku15"],"lead":"The market finds your weak spots.","text":"Act outside what you understand, or let fear and greed run you, and the market will expose it sooner or later.","co":[]},"t3n4":{"id":"t3n4","theme":"t3","tags":"Lecture, 2015 · Lecture, 2019","units":["pku15","pku19"],"lead":"Few play this game.","text":"He estimates that only about one market participant in twenty invests this way. That is why the opportunity lasts.","co":[]},"t4n1":{"id":"t4n1","theme":"t4","tags":"Lecture, 2019","units":["pku19"],"lead":"Price is what you pay.","text":"Since value can only be estimated, buy at the lowest price you can, and study the parts of a business that bear on your margin of safety.","co":[]},"t4n2":{"id":"t4n2","theme":"t4","tags":"Lecture, 2019","units":["pku19"],"lead":"His first big find.","text":"As a student he bought a holding company whose stake in a large cable firm was alone worth about three times the whole company's market value.","co":[]},"t4n3":{"id":"t4n3","theme":"t4","tags":"Lecture, 2019","units":["pku19"],"lead":"Sold when the gap closed.","text":"He sold once the margin of safety had gone. The shares kept rising for years afterwards.","co":[]},"t4n4":{"id":"t4n4","theme":"t4","tags":"Interview, 2013","units":["gd13"],"lead":"From cheap to good.","text":"A beginner with little money, he first bought very cheap shares, the safest choice. In time he moved to strong businesses at reasonable prices.","co":[]},"t4n5":{"id":"t4n5","theme":"t4","tags":"Lecture, 2019","units":["pku19"],"lead":"Go and look.","text":"Early on he visited nearby companies to check that their assets were real and the business was running.","co":[]},"t5n1":{"id":"t5n1","theme":"t5","tags":"Lecture, 2019","units":["pku19"],"lead":"Imagine you inherited it.","text":"He suggests picturing that the company has just become yours and you must learn everything about it.","co":[]},"t5n2":{"id":"t5n2","theme":"t5","tags":"Lecture, 2019","units":["pku19"],"lead":"Talk to everyone.","text":"He talks to people at every level, down to security guards, and asks about hiring, pay and how staff are treated.","co":[]},"t5n3":{"id":"t5n3","theme":"t5","tags":"Lecture, 2019","units":["pku19"],"lead":"The two petrol stations.","text":"Two identical petrol stations drew very different custom, one about four times the other. The difference was an owner who ran his with care. So ask: do managers think like owners?","co":[]},"t5n4":{"id":"t5n4","theme":"t5","tags":"Interview, 2013","units":["gd13"],"lead":"Talk to operators.","text":"His ideas come from wide reading, newspapers and annual reports, and from people who run businesses, more than from other investors.","co":[]},"t5n5":{"id":"t5n5","theme":"t5","tags":"Interview, 2013","units":["gd13"],"lead":"When you can't judge the boss.","text":"Management matters but is hard to assess. When he cannot judge it, he leans on the quality of the business and the price.","co":[]},"t6n1":{"id":"t6n1","theme":"t6","tags":"Interview, 2013 · Foreword, 2010","units":["gd13","pca"],"lead":"His worst mistake.","text":"He ran a long-short fund in his early years, then stopped shorting around 2004 and calls it one of his worst mistakes.","co":[]},"t6n2":{"id":"t6n2","theme":"t6","tags":"Interview, 2013 · Foreword, 2010","units":["gd13","pca"],"lead":"Small gain, unlimited loss.","text":"A short can make at most 100% but can lose without limit, and you can be forced out before you are proved right.","co":[]},"t6n3":{"id":"t6n3","theme":"t6","tags":"Interview, 2013","units":["gd13"],"lead":"Frauds can last.","text":"The best shorts often involve fraud, and frauds can survive long enough to squeeze you out.","co":[]},"t6n4":{"id":"t6n4","theme":"t6","tags":"Foreword, 2010 · Interview, 2013","units":["pca","gd13"],"lead":"It steals your attention.","text":"Constant short-side trading left no time to study his best long-term ideas.","co":[]},"t6n5":{"id":"t6n5","theme":"t6","tags":"Interview, 2013","units":["gd13"],"lead":"Growth favours owners.","text":"Over long periods, a growing economy works for those who own businesses, not for those betting against them.","co":[]},"t7n1":{"id":"t7n1","theme":"t7","tags":"Lecture, 2019","units":["pku19"],"lead":"One idea in decades.","text":"Munger read Barron's for decades and found just one big idea in it. That is how rare the best chances are.","co":[]},"t7n2":{"id":"t7n2","theme":"t7","tags":"Lecture, 2019","units":["pku19"],"lead":"Both at once.","text":"Patience and decisiveness have to live together: wait without fidgeting, then move in size.","co":[]},"t7n3":{"id":"t7n3","theme":"t7","tags":"Lecture, 2015","units":["pku15"],"lead":"Talent takes years to show.","text":"It can take around fifteen years to tell real skill from luck; short-term results are often luck.","co":[]},"t7n4":{"id":"t7n4","theme":"t7","tags":"Lecture, 2019","units":["pku19"],"lead":"Each shot stands alone.","text":"Like golf, a good hole does not guarantee the next. Judge each decision on its own merits.","co":[]},"t7n5":{"id":"t7n5","theme":"t7","tags":"Interview, 2013 · News, 2025","units":["gd13","byd"],"lead":"BYD.","text":"He was drawn to the battery and car maker by its founder's engineering record, its rise in a fierce market, and a margin of safety. Berkshire bought 10% in 2008 for about $230m and sold out by 2025 after a more than twentyfold rise.","co":[]},"t8n1":{"id":"t8n1","theme":"t8","tags":"Foreword, 2010","units":["pca"],"lead":"Thanksgiving 2003.","text":"He took Munger through every company he owned or followed. Munger said his problems came from the way Wall Street thinks, and offered to invest if he would take a different path.","co":[]},"t8n2":{"id":"t8n2","theme":"t8","tags":"Foreword, 2010","units":["pca"],"lead":"A new structure.","text":"With Munger's help he rebuilt the fund like Buffett's early partnerships: no shorting, long lock-ups for partners who stayed, and no new investors.","co":[]},"t8n3":{"id":"t8n3","theme":"t8","tags":"Lecture, 2015","units":["pku15"],"lead":"Your parents' savings.","text":"He says a manager should treat clients' money like the lifetime savings of their own parents, and that people without that instinct should not be in the business.","co":[]},"t8n4":{"id":"t8n4","theme":"t8","tags":"Lecture, 2015","units":["pku15"],"lead":"Fees that favour managers.","text":"He criticises the common hedge fund fee of 2% a year plus 20% of profits as serving managers better than clients.","co":[]},"t8n5":{"id":"t8n5","theme":"t8","tags":"Talk, 2026","units":["gd26"],"lead":"Deserved trust.","text":"He recalls Munger's ideal: a seamless web of deserved trust. Keep partners who share your approach, rather than chasing the most money.","co":[]},"t9n1":{"id":"t9n1","theme":"t9","tags":"Talk, 2026","units":["gd26"],"lead":"Fish where the fish are.","text":"From Munger he takes the rule to look where others are not: less crowded markets, industries and countries.","co":[]},"t9n2":{"id":"t9n2","theme":"t9","tags":"Talk, 2026","units":["gd26"],"lead":"Wealth is a share of the world.","text":"He measures wealth as your percentage of global buying power, not gold, cash or any currency, and keeps it by owning great businesses in growing economies.","co":[]},"t9n3":{"id":"t9n3","theme":"t9","tags":"Lecture, 2015","units":["pku15"],"lead":"Two centuries of returns.","text":"He cites US figures from 1802: a dollar in cash lost about 95% of its value, gold roughly tripled after inflation, and shares grew about a million times, roughly 6.7% a year after inflation.","co":[]},"t9n4":{"id":"t9n4","theme":"t9","tags":"Book, 2020 · Lecture, 2015","units":["book","pku15"],"lead":"Civilisation 3.0.","text":"In his book he describes history in stages: hunting and gathering, farming, then free markets plus modern science, the stage in which businesses can compound.","co":[]},"t9n5":{"id":"t9n5","theme":"t9","tags":"Lecture, 2015","units":["pku15"],"lead":"China too.","text":"In 2015 he argued value investing could work in China: its markets had risen about fifteenfold from 1991 to 2014, while short-term trading still dominated.","co":[]},"t10n1":{"id":"t10n1","theme":"t10","tags":"Foreword, 2010","units":["pca"],"lead":"A bad start.","text":"His first year ended 19% down on paper, and a large investor left the next year.","co":[]},"t10n2":{"id":"t10n2","theme":"t10","tags":"Interview, 2013","units":["gd13"],"lead":"Sold too soon.","text":"He was an early investor in Capital IQ, the data company, and sold; it later became far more valuable.","co":[]},"t10n3":{"id":"t10n3","theme":"t10","tags":"Interview, 2013","units":["gd13"],"lead":"Every mistake teaches.","text":"He treats each mistake as a lesson, and names short selling as his biggest.","co":[]},"t10n4":{"id":"t10n4","theme":"t10","tags":"Talk, 2026","units":["gd26"],"lead":"Luck counts.","text":"He credits part of his success to luck.","co":[]},"t10n5":{"id":"t10n5","theme":"t10","tags":"Talk, 2026 · Lecture, 2019","units":["gd26","pku19"],"lead":"Knowledge compounds.","text":"Knowledge and trusted relationships compound like capital. Learning faster is how money, eventually, grows faster.","co":[]}},"quotes":[{"id":"q-gd13","unit":"gd13","label":"Graham & Doddsville interview, 2013","text":"Shorting was one of the worst mistakes I've made.","theme":"t6"},{"id":"q-gd26","unit":"gd26","label":"Graham & Dodd luncheon, Columbia, 2026","text":"the market is there to serve you, not to instruct you","theme":"t3"}],"mistakes":[],"tendencies":[],"plan":[{"n":1,"label":"A share is a piece of a business","themes":["t1"],"units":["pca"],"extra":""},{"n":2,"label":"Know where your circle ends","themes":["t2"],"units":["pku15"],"extra":""},{"n":3,"label":"The market serves you","themes":["t3"],"units":["gd26"],"extra":""},{"n":4,"label":"Margin of safety","themes":["t4"],"units":["pku19"],"extra":""},{"n":5,"label":"Research like an owner","themes":["t5"],"units":["pku19"],"extra":""},{"n":6,"label":"Why he gave up short selling","themes":["t6"],"units":["gd13"],"extra":""},{"n":7,"label":"Patient, then decisive","themes":["t7"],"units":["byd"],"extra":""},{"n":8,"label":"A different road from Wall Street","themes":["t8"],"units":["pca"],"extra":""},{"n":9,"label":"Own a slice of the world","themes":["t9"],"units":["pku15","book"],"extra":""},{"n":10,"label":"Mistakes, luck and compounding knowledge","themes":["t10"],"units":["gd13"],"extra":""}],"selftest":["What are his four core ideas of value investing?","Why does he say the edge of your circle matters more than its size?","What does 'the market serves you' mean, and why can't you want good results every quarter too?","Describe his first big investment as a student and why he sold it.","What did the two petrol stations teach him?","Give three reasons he gave up short selling.","Why must patience and decisiveness go together?","What did Munger say about his problems in 2003, and what changed in his fund?","How does he define wealth, and what did two centuries of US returns show?","Name one mistake he admits and what it taught."],"disclaimer":["For education only. Nothing here is investment, financial, legal or tax advice, or a recommendation to buy, sell or hold any security.","Records and figures come from the published sources named on this page and may be revised; check the originals before relying on them.","Accuracy is not guaranteed and errors are possible; treat the original sources as correct. No liability is accepted for any loss arising from use of this material. Past results do not predict future ones.","Independent and unaffiliated: not endorsed by Li Lu, Himalaya Capital, Columbia University, Peking University, LongRiver, CITIC Press, Berkshire Hathaway, BYD or any company named. All trademarks and copyrights belong to their owners."],"big":{"timeline":[[1966,"Born in Tangshan, northern China"],[1976,"Survives the Tangshan earthquake as a child"],[1989,"A student leader in the Tiananmen Square protests; leaves China and, by way of France, reaches the United States"],[1993,"Hears Warren Buffett speak at Columbia University, almost by chance, and starts reading everything about him"],[1996,"Graduates from Columbia with three degrees at once, in economics, law and business; first meets Charlie Munger"],[1998,"Starts his fund in January with money from a few friends; down 19% on paper in its first year"],[2003,"At Thanksgiving, takes Munger through every company he owns or follows; Munger offers to invest if he leaves Wall Street's habits behind"],[2004,"Munger becomes his partner; the fund stops short selling and asks investors for long lock-ups"],[2008,"Berkshire buys 10% of BYD, the battery and car maker Li Lu had brought to Munger"],[2010,"Helps publish Poor Charlie's Almanack in Chinese and writes its foreword"],[2015,"First lecture at Peking University's new value investing course"],[2020,"Publishes his book Civilization, Modernization, Value Investing and China, in Chinese"],[2025,"Berkshire completes its exit from BYD after 17 years"],[2026,"Fireside chat at Columbia's Graham & Dodd luncheon, aged 60"]],"map":[["A share is part of a business","Returns come from the business growing in value, not from guessing prices."],["The market serves you","Use its prices when they suit you; never let it tell you what something is worth."],["Margin of safety","The future is uncertain, so buy well below what you think a business is worth."],["Know where your circle ends","A small area you truly understand, with a clear edge, beats a large hazy one."],["Fish where the fish are","Look in less crowded markets, industries and countries."],["Own a share of the world","Real wealth is your slice of the world's buying power, held in great businesses for a long time."]]},"record":[["29%+ a year","his fund, January 1998 to 2009, after all expenses, in his own words (not independently audited)"],["36% a year","the same fund from late 2004, when Munger joined, to 2009"],["−19%","his first year, on paper; a large investor left the following year"],["10% of BYD","bought by Berkshire for about $230m in 2008, after Li Lu brought the company to Munger"]],"special":"cn","sp":[{"k":"checks","title":"Before you buy: eight questions","items":["I can say what the business does and how it earns its money","I would hold it even if no price were quoted for years","The price is well below my cautious estimate of its value","I know where my knowledge of it ends, and what would prove me wrong","I have learned about it from people who work there, buy from it or compete with it","Its managers think and act like owners","I am buying to own it, not betting against anything","Few other investors are looking at it closely"],"verdicts":["Think of one company and tick what is true of it today.","Every box ticked. Write down what would make you wrong, then decide.","Promising. Find out what the unticked boxes could cost you.","Too many gaps. He would keep studying, or wait."],"note":"Our summary of his talks, as a study aid, not a recommendation."},{"k":"ol","title":"His six principles, as he put them in 2026","items":[["A share is ownership","of part of a real business."],["The market serves you","it does not instruct you."],["Margin of safety","because the future cannot be predicted."],["Circle of competence","and above all, knowing where it ends."],["Fish where the fish are","in less crowded markets, industries and countries."],["Wealth is a share of the world's buying power","held through great businesses in growing economies, for a long time."]],"note":"The first three come from Benjamin Graham, the fourth from Buffett, the fifth from Munger; the sixth is his own."},{"k":"note","text":"Li Lu was a student leader in the 1989 Tiananmen Square protests. We mention it only as part of his life story; this site takes no political position."}]},"duan":{"id":"duan","name":"Duan Yongping","short":"Duan","mono":"DY","country":"china","ready":true,"what":"His talks, interviews and online answers on buying businesses and keeping a stop-doing list","crumb":"Duan Yongping · 8 sources","handbookTitle":"Duan Yongping: a study handbook","unitTab":"Sources","unitWord":"source","unitRoute":"source","unitsRoute":"sources","scope":"Duan writes in Chinese, mostly short answers on Xueqiu, where readers call him Da Dao. The 2025 book collects twenty years of them and is the only collection he has approved. Most sources here are in Chinese: lessons are our own English summaries, and short quotes are in the original with our translation. His investment results are personal and unaudited.","readHow":"If you read Chinese, start with the Stanford talk, which is free online, then the 2025 book. Otherwise, browser translation of the free transcripts works reasonably well.","sourcesNote":"Sources: his talk to Chinese students at Stanford (2018), his interview with Xueqiu's founder Fang Sanwen (2025), excerpts from the book of his answers (CITIC Press, 2025), his replies on Xueqiu, an AFP interview (2017), and press reports on his Buffett lunch (2006), BBK's stop-doing list and his gifts. Lessons are in our own words; short quotes are in the original language with our translation.","start":{"lede":"Duan Yongping built two electronics companies, Subor and BBK, whose offshoots grew into the phone makers OPPO and vivo. He stepped back in 2001, moved to California and turned to investing: a large bet on NetEase when it was in trouble, then Apple and Kweichow Moutai for many years. His rules: buying a stock is buying the company, buy only what you understand, never borrow, and keep a list of things you will not do.","para":"This page draws on his 2018 talk at Stanford, his 2025 interview with the founder of the investor site Xueqiu, the 2025 book of his online answers, and press interviews. About an hour a week for ten weeks: one idea here, then the source it comes from.","steps":[]},"glossary":[["Benfen (本分)","Doing what you should, honestly and without being asked; not taking advantage of others."],["A calm, ordinary mind (平常心)","Staying rational and returning to fundamentals whatever is happening around you."],["Stop-doing list (不为清单)","A written list of things a person or company will not do, whatever the short-term gain."],["Discounted cash flow","Valuing a company by adding up the cash it will produce in future, each year's cash shrunk back to today's money."],["Short squeeze","When a share that many have bet against rises fast, forcing them to buy back at high prices."],["Call option","A contract giving someone the right to buy a share at a set price. Selling one brings in cash now, but caps your gain."],["Contract manufacturing (OEM)","Making products for another company to sell under its brand."],["Opportunity cost","What you give up by choosing one use of money over the next best one."]],"units":[{"key":"stan","chip":"Talk, 2018","tag":"Talk, 2018","title":"Talk and questions at Stanford","date":"Stanford University, 30 September 2018, with Chinese students. Transcript in Chinese, edited by Huxiu.","summary":"Fifty-odd questions answered: the stop-doing list, benfen and a calm mind, never borrowing, how he picks shares, Apple, NetEase and his own mistakes.","year":2018,"link":"https://m.huxiu.com/article/265373.html","linkLabel":"Read the transcript (Chinese)","nuggets":["t2n1","t2n5","t3n1","t3n2","t3n3","t4n1","t4n2","t4n3","t4n4","t4n5","t5n1","t5n3","t5n4","t5n5","t6n1","t6n3","t6n4","t7n1","t7n2","t8n2","t10n1","t10n5"],"mistakes":[],"quote":"q-stan"},{"key":"fang","chip":"Interview, 2025","tag":"Interview, 2025","title":"Interview with Fang Sanwen","date":"Recorded in California, 16 October 2025, for Xueqiu's programme Fanglüe; full transcript published by Phoenix Finance.","summary":"His life story, why so few people really understand that buying a stock is buying a company, which companies he understands, and a frank list of mistakes.","year":2025,"link":"https://finance.ifeng.com/c/8oChp5B5WMc","linkLabel":"Read the transcript (Chinese)","nuggets":["t1n3","t1n5","t2n2","t2n3","t2n4","t3n5","t5n2","t6n2","t6n5","t7n2","t7n3","t7n4","t7n5","t8n1","t8n3","t8n4","t10n2","t10n3","t10n4"],"mistakes":[],"quote":"q-fang"},{"key":"book","chip":"Book, 2025","tag":"Book, 2025","title":"Da Dao: Duan Yongping's investing questions and answers","date":"CITIC Press, May 2025 (大道：段永平投资问答录). Selected by Zhao Liya, edited by the Munger Academy; the only collection he has approved.","summary":"Twenty years of his online answers, arranged by theme: investing, business models and culture, comments on companies, and life.","year":2025,"link":"https://m.huxiu.com/article/4292824.html","linkLabel":"Read an excerpt (Chinese)","nuggets":["t1n2"],"mistakes":[],"quote":null},{"key":"xq","chip":"Xueqiu replies","tag":"Xueqiu replies","title":"His replies on Xueqiu","date":"Replies posted under the name 大道无形我有型, here as compiled by a Xueqiu user (end of 2023).","summary":"Short, blunt answers to readers' questions, including the difference between earning what a company earns and trying to win the market's money.","year":2023,"link":"https://www.xueqiu.com/3640871106/288907057","linkLabel":"Read the compilation (Chinese)","nuggets":["t1n4"],"mistakes":[],"quote":"q-xq"},{"key":"afp","chip":"AFP, 2017","tag":"AFP, 2017","title":"China's secretive billionaire reveals how he toppled Apple","date":"AFP interview, March 2017, as published by Malay Mail.","summary":"A rare English-language interview: Subor, BBK, OPPO and vivo against Apple, NetEase, and his view of competition.","year":2017,"link":"https://www.malaymail.com/news/money/2017/03/20/chinas-secretive-billionaire-reveals-how-he-toppled-apple/1339087","linkLabel":"Read the interview","nuggets":["t8n1","t9n5"],"mistakes":[],"quote":"q-afp"},{"key":"lunch","chip":"SCMP, 2006","tag":"SCMP, 2006","title":"No shortage of tips at Buffett lunch","date":"South China Morning Post, 2006.","summary":"How a former electronics boss won the Buffett lunch auction, his background, and his plan to give most of his money away.","year":2006,"link":"https://www.scmp.com/article/556023/no-shortage-tips-buffett-lunch","linkLabel":"Read the article","nuggets":["t9n1","t9n2"],"mistakes":[],"quote":null},{"key":"cneb","chip":"Magazine, 2025","tag":"Magazine, 2025","title":"The two words that made Duan Yongping rich","date":"China Entrepreneur magazine, 16 November 2025, via 36Kr.","summary":"BBK's stop-doing list in practice, the Walmart order he refused, and how Buffett's line about buying companies changed his investing.","year":2025,"link":"https://www.36kr.com/p/3555484789095560","linkLabel":"Read the article (Chinese)","nuggets":["t1n1","t2n4","t3n3","t3n4","t3n5"],"mistakes":[],"quote":null},{"key":"ifeng","chip":"Review, 2026","tag":"Review, 2026","title":"What the book Da Dao really teaches","date":"Phoenix Finance review and profile, 2026.","summary":"His two filters for any company, his 2011 advice to Zhejiang University graduates, and his gifts of Moutai shares to education.","year":2026,"link":"https://finance.ifeng.com/c/8vOYN25Ve8V","linkLabel":"Read the review (Chinese)","nuggets":["t5n2","t6n1","t6n2","t9n3","t9n4"],"mistakes":[],"quote":null}],"themes":[{"id":"t1","num":1,"title":"Buying a stock is buying the company","idea":"One sentence from Buffett changed how he invested. A share is part of a company, and a company is worth the cash it will produce from now on.","nuggets":["t1n1","t1n2","t1n3","t1n4","t1n5"],"ask":["For one share you own, how much cash does the business produce in a year?","Are you trying to earn what a company earns, or what other traders lose?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t2","num":2,"title":"Only what you understand","idea":"Be honest about what you understand. He says he truly understands only a few companies, and his losses came when he strayed.","nuggets":["t2n1","t2n2","t2n3","t2n4","t2n5"],"ask":["Which companies could you explain to a child?","Have you ever lost money on something you didn't really understand?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t3","num":3,"title":"The stop-doing list","idea":"Doing the right thing mostly means refusing to do wrong things. Most people know what is wrong; they do it anyway for a short-term gain.","nuggets":["t3n1","t3n2","t3n3","t3n4","t3n5"],"ask":["Write down three things you will never do as an investor. Why each one?","Which of your habits do you know is wrong but keep anyway?"],"table":null,"tool":null,"stories":[],"diagram":"stopdo","after":0,"caption":"First ask whether it is the right thing. Only then ask whether it pays."},{"id":"t4","num":4,"title":"Never borrow","idea":"His companies take no interest-bearing loans, and he never borrows to invest. Debt makes you faster in both directions.","nuggets":["t4n1","t4n2","t4n3","t4n4","t4n5"],"ask":["What would happen to your portfolio if prices halved tomorrow and you had borrowed?","Which opportunity did you miss without regret?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t5","num":5,"title":"Right business, right people, right price","idea":"Look at the business model and the culture first. Price comes last.","nuggets":["t5n1","t5n2","t5n3","t5n4","t5n5"],"ask":["What is the culture of a company you own? How would you find out?","Would you buy a dull, unique business over an exciting, ordinary one?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t6","num":6,"title":"Benfen and a calm mind","idea":"Benfen means doing what you should, even when nobody asked. Add a calm, ordinary mind and, he says, you have the whole secret of BBK.","nuggets":["t6n1","t6n2","t6n3","t6n4","t6n5"],"ask":["What does doing what you should mean in your own investing?","When did staying calm last save you from a mistake?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t7","num":7,"title":"Hold great companies","idea":"Good companies rarely need selling. He sells when the business changes or something clearly better appears.","nuggets":["t7n1","t7n2","t7n3","t7n4","t7n5"],"ask":["Which of your holdings would you happily own for ten years?","Have you ever sold a great company only because its price rose?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t8","num":8,"title":"NetEase, Apple and Moutai","idea":"Three bets made him famous as an investor. Each fits his rules: a business he understood, a culture he liked, a sensible price.","nuggets":["t8n1","t8n2","t8n3","t8n4"],"ask":["What did all three companies have in common?","Which company near you holds more cash than the market thinks?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t9","num":9,"title":"The Buffett lunch and giving back","idea":"In 2006 he paid a record sum to lunch with Buffett, to charity. He plans to give most of his money away, and gives with conditions that make gifts last.","nuggets":["t9n1","t9n2","t9n3","t9n4","t9n5"],"ask":["If you gave something away, how would you make sure it lasted?","What would you ask Buffett over lunch?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t10","num":10,"title":"The mistakes he admits","idea":"He is frank about his errors. Most came when he speculated or strayed outside what he understood.","nuggets":["t10n1","t10n2","t10n3","t10n4","t10n5"],"ask":["Which of your losses came from speculating rather than investing?","What rule would have prevented your worst mistake?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""}],"nuggets":{"t1n1":{"id":"t1n1","theme":"t1","tags":"Magazine, 2025","units":["cneb"],"lead":"The sentence that clicked.","text":"In America he first tried charts and could make no sense of them, until Buffett's line that buying a stock is buying a company made everything clear.","co":[]},"t1n2":{"id":"t1n2","theme":"t1","tags":"Book, 2025","units":["book"],"lead":"Value is future cash.","text":"A company is worth all the cash it will produce from now until it ends, discounted back to today.","co":[]},"t1n3":{"id":"t1n3","theme":"t1","tags":"Interview, 2025","units":["fang"],"lead":"Fewer than one in a hundred.","text":"The idea sounds simple, he says, but perhaps fewer than 1% of investors truly understand it.","co":[]},"t1n4":{"id":"t1n4","theme":"t1","tags":"Xueqiu replies","units":["xq"],"lead":"The company's money, not the market's.","text":"Investors earn what their companies earn. People forever talking about bull and bear markets are really hoping to win other traders' money.","co":[]},"t1n5":{"id":"t1n5","theme":"t1","tags":"Interview, 2025","units":["fang"],"lead":"No forecast needed.","text":"He decides by comparing opportunities, not by predicting the economy.","co":[]},"t2n1":{"id":"t2n1","theme":"t2","tags":"Talk, 2018","units":["stan"],"lead":"Know what you know.","text":"Honesty with yourself is the heart of a circle of competence: know what you know and admit what you don't.","co":[]},"t2n2":{"id":"t2n2","theme":"t2","tags":"Interview, 2025","units":["fang"],"lead":"A short list.","text":"He says he understands Apple, Tencent and Moutai, only partly understands a few others, and avoids most of the rest.","co":[]},"t2n3":{"id":"t2n3","theme":"t2","tags":"Interview, 2025","units":["fang"],"lead":"A grey zone.","text":"He admits the line between understanding and not is blurry, which is why he keeps to the few he knows best.","co":[]},"t2n4":{"id":"t2n4","theme":"t2","tags":"Magazine, 2025 · Interview, 2025","units":["cneb","fang"],"lead":"Games he knew.","text":"He credits his NetEase success to knowing the games business from his Subor years.","co":[]},"t2n5":{"id":"t2n5","theme":"t2","tags":"Talk, 2018","units":["stan"],"lead":"Others may understand what you don't.","text":"Not understanding a company is no judgement on it; it simply isn't for you.","co":[]},"t3n1":{"id":"t3n1","theme":"t3","tags":"Talk, 2018","units":["stan"],"lead":"Not doing wrong.","text":"Most people can tell right from wrong. They do wrong things anyway because the short-term pull is strong, like smokers who know the harm.","co":[]},"t3n2":{"id":"t3n2","theme":"t3","tags":"Talk, 2018","units":["stan"],"lead":"Stop early.","text":"When you realise something is a mistake, stop at once. Stopping is cheapest at the start.","co":[]},"t3n3":{"id":"t3n3","theme":"t3","tags":"Magazine, 2025 · Talk, 2018","units":["cneb","stan"],"lead":"BBK's list.","text":"No selling on credit, no late payments to suppliers, no late wages, no haggling, no making products for others, no interest-bearing loans, no attacking rivals.","co":[]},"t3n4":{"id":"t3n4","theme":"t3","tags":"Magazine, 2025","units":["cneb"],"lead":"Saying no to Walmart.","text":"He once refused an order for a million VCD players without even discussing price: haggling would only waste everyone's time.","co":[]},"t3n5":{"id":"t3n5","theme":"t3","tags":"Interview, 2025 · Magazine, 2025","units":["fang","cneb"],"lead":"Learned the hard way.","text":"Many items on the list came from painful lessons; each rule saves them from a class of mistakes.","co":[]},"t4n1":{"id":"t4n1","theme":"t4","tags":"Talk, 2018","units":["stan"],"lead":"No loans.","text":"BBK, OPPO and vivo take no interest-bearing loans, so they cannot die from running out of cash. He cites Munger: most failures come from borrowing too much.","co":[]},"t4n2":{"id":"t4n2","theme":"t4","tags":"Talk, 2018","units":["stan"],"lead":"One soaking.","text":"Borrowing speeds up gains and losses alike. Getting your feet wet is unavoidable; getting soaked can be permanent.","co":[]},"t4n3":{"id":"t4n3","theme":"t4","tags":"Talk, 2018","units":["stan"],"lead":"Crises as chances.","text":"With ample cash, every crisis became a chance to act rather than a threat.","co":[]},"t4n4":{"id":"t4n4","theme":"t4","tags":"Talk, 2018","units":["stan"],"lead":"Missing out is fine.","text":"Missing some opportunities is acceptable, as long as you catch the right ones.","co":[]},"t4n5":{"id":"t4n5","theme":"t4","tags":"Talk, 2018","units":["stan"],"lead":"Rivals gone, BBK still here.","text":"Most of his old competitors have disappeared; he believes avoiding debt is a big part of why his companies survived.","co":[]},"t5n1":{"id":"t5n1","theme":"t5","tags":"Talk, 2018","units":["stan"],"lead":"Three things, in order.","text":"Right business, right people, right price, an order he credits to Buffett. Price matters least.","co":[]},"t5n2":{"id":"t5n2","theme":"t5","tags":"Review, 2026 · Interview, 2025","units":["ifeng","fang"],"lead":"Two filters.","text":"He looks at two things, the business model and the corporate culture. If he dislikes either, he stops looking.","co":[]},"t5n3":{"id":"t5n3","theme":"t5","tags":"Talk, 2018","units":["stan"],"lead":"Cheap, seen from ten years out.","text":"Whether a share is expensive today is a short-term question. Look back from ten years ahead.","co":[]},"t5n4":{"id":"t5n4","theme":"t5","tags":"Talk, 2018","units":["stan"],"lead":"Different, or nothing.","text":"Products no different from rivals' can only compete on price and rarely make money. He calls 'value for money' an excuse for weak products.","co":[]},"t5n5":{"id":"t5n5","theme":"t5","tags":"Talk, 2018","units":["stan"],"lead":"No cash flow, no investment.","text":"He avoids anything that produces no cash flow, such as Bitcoin.","co":[]},"t6n1":{"id":"t6n1","theme":"t6","tags":"Talk, 2018 · Review, 2026","units":["stan","ifeng"],"lead":"Their only secret.","text":"Asked whether BBK's success came from advertising or incentives, he says no: it came from benfen plus a calm mind.","co":[]},"t6n2":{"id":"t6n2","theme":"t6","tags":"Interview, 2025 · Review, 2026","units":["fang","ifeng"],"lead":"Do the right thing, and do it right.","text":"He came across Peter Drucker's line as a student; it became BBK's motto.","co":[]},"t6n3":{"id":"t6n3","theme":"t6","tags":"Talk, 2018","units":["stan"],"lead":"What great bosses share.","text":"He cites a study of top chief executives: their personalities differed in every way except one, integrity.","co":[]},"t6n4":{"id":"t6n4","theme":"t6","tags":"Talk, 2018","units":["stan"],"lead":"Every word a promise.","text":"Don't deceive customers or investors; what you say, you must do.","co":[]},"t6n5":{"id":"t6n5","theme":"t6","tags":"Interview, 2025","units":["fang"],"lead":"Trust before money.","text":"He left Subor because its owner broke promises about shares: a problem of trust, not money.","co":[]},"t7n1":{"id":"t7n1","theme":"t7","tags":"Talk, 2018","units":["stan"],"lead":"No need to sell.","text":"By 2018 he had never sold Apple, saying good companies don't need selling.","co":[]},"t7n2":{"id":"t7n2","theme":"t7","tags":"Talk, 2018 · Interview, 2025","units":["stan","fang"],"lead":"Two reasons to sell.","text":"The company's earning power changes, or a clearly better company he understands appears at a good price.","co":[]},"t7n3":{"id":"t7n3","theme":"t7","tags":"Interview, 2025","units":["fang"],"lead":"Fully invested.","text":"He calls himself a full-position investor and dislikes idle cash, since bank interest earns less than good companies.","co":[]},"t7n4":{"id":"t7n4","theme":"t7","tags":"Interview, 2025","units":["fang"],"lead":"Moutai at half price.","text":"When Moutai's shares fell by about half, he held on and kept buying.","co":[]},"t7n5":{"id":"t7n5","theme":"t7","tags":"Interview, 2025","units":["fang"],"lead":"Trimming, not trading.","text":"By 2025 he thought Apple's shares expensive and was trimming by selling call options.","co":[]},"t8n1":{"id":"t8n1","theme":"t8","tags":"Interview, 2025 · AFP, 2017","units":["fang","afp"],"lead":"NetEase.","text":"He bought heavily when the shares were in panic and the company held more cash than its market value. They rose about twentyfold in six months and more than a hundredfold in all.","co":[]},"t8n2":{"id":"t8n2","theme":"t8","tags":"Talk, 2018","units":["stan"],"lead":"Sold too early?","text":"He later sold, saying he felt uneasy holding so much, and admits the later share price suggests he sold too soon.","co":[]},"t8n3":{"id":"t8n3","theme":"t8","tags":"Interview, 2025","units":["fang"],"lead":"Apple.","text":"He began buying in 2011, seeing the shift to software and the platform, and a culture that puts users first and refuses products that add too little.","co":[]},"t8n4":{"id":"t8n4","theme":"t8","tags":"Interview, 2025","units":["fang"],"lead":"Moutai.","text":"A unique product whose taste does not change, loyal customers, and steady dividends and buybacks.","co":[]},"t9n1":{"id":"t9n1","theme":"t9","tags":"SCMP, 2006","units":["lunch"],"lead":"A record bid.","text":"In 2006 he paid $620,100 at Buffett's charity lunch auction, the first winner from mainland China.","co":[]},"t9n2":{"id":"t9n2","theme":"t9","tags":"SCMP, 2006","units":["lunch"],"lead":"Giving most away.","text":"He said he planned to follow Buffett by giving most of his money away.","co":[]},"t9n3":{"id":"t9n3","theme":"t9","tags":"Review, 2026","units":["ifeng"],"lead":"Gifts that last.","text":"In 2025 and 2026 he gave Moutai shares to education funds, on condition the shares are kept and only the dividends spent.","co":[]},"t9n4":{"id":"t9n4","theme":"t9","tags":"Review, 2026","units":["ifeng"],"lead":"Three wishes for graduates.","text":"At Zhejiang University in 2011 he told graduates: have no grand ambitions, keep a list of things you won't do, and be upright.","co":[]},"t9n5":{"id":"t9n5","theme":"t9","tags":"AFP, 2017","units":["afp"],"lead":"Improve yourself.","text":"Asked about beating Apple, he said they think about improving themselves, not about surpassing anyone.","co":[]},"t10n1":{"id":"t10n1","theme":"t10","tags":"Talk, 2018","units":["stan"],"lead":"Baidu.","text":"A speculative bet on Baidu ended in a short squeeze that cost him $100 to 200 million. He calls it speculation, not investing.","co":[]},"t10n2":{"id":"t10n2","theme":"t10","tags":"Interview, 2025","units":["fang"],"lead":"General Electric.","text":"He bought GE in 2008, sold a few years later, and says he never really grasped its business model.","co":[]},"t10n3":{"id":"t10n3","theme":"t10","tags":"Interview, 2025","units":["fang"],"lead":"Oil.","text":"About $100 million put into an oil index lost more than $10 million before he sold.","co":[]},"t10n4":{"id":"t10n4","theme":"t10","tags":"Interview, 2025","units":["fang"],"lead":"Smartphones.","text":"BBK was slow to see the shift to smartphones; losses in 2012 and 2013 drained much of its cash.","co":[]},"t10n5":{"id":"t10n5","theme":"t10","tags":"Talk, 2018","units":["stan"],"lead":"Speculation versus investing.","text":"He says his real investing mistakes were few and small; the big losses came from speculation.","co":[]}},"quotes":[{"id":"q-fang","unit":"fang","label":"On 'buying a stock is buying the company': “Perhaps fewer than 1% truly understand this.” Interview, 2025 (our translation)","text":"能真懂这句话的人，可能不到1%","theme":"t1"},{"id":"q-xq","unit":"xq","label":"“Investing earns the money the company earns.” Reply on Xueqiu, 31 December 2023 (our translation)","text":"投资赚的是公司赚的钱","theme":"t1"},{"id":"q-stan","unit":"stan","label":"“We take no loans, and we have plenty of cash flow.” Stanford talk, 2018 (our translation)","text":"我们不贷款，有充裕的现金流","theme":"t4"},{"id":"q-afp","unit":"afp","label":"AFP interview, 2017, on competing with Apple","text":"the focus instead is to improve ourselves","theme":"t9"}],"mistakes":[],"tendencies":[],"plan":[{"n":1,"label":"Buying a stock is buying the company","themes":["t1"],"units":["cneb"],"extra":""},{"n":2,"label":"Only what you understand","themes":["t2"],"units":["fang"],"extra":""},{"n":3,"label":"The stop-doing list","themes":["t3"],"units":["stan"],"extra":""},{"n":4,"label":"Never borrow","themes":["t4"],"units":["stan"],"extra":""},{"n":5,"label":"Right business, right people, right price","themes":["t5"],"units":["ifeng"],"extra":""},{"n":6,"label":"Benfen and a calm mind","themes":["t6"],"units":["stan"],"extra":""},{"n":7,"label":"Hold great companies","themes":["t7"],"units":["fang"],"extra":""},{"n":8,"label":"NetEase, Apple and Moutai","themes":["t8"],"units":["afp"],"extra":""},{"n":9,"label":"The Buffett lunch and giving back","themes":["t9"],"units":["lunch","ifeng"],"extra":""},{"n":10,"label":"The mistakes he admits","themes":["t10"],"units":["fang"],"extra":""}],"selftest":["What does 'buying a stock is buying the company' mean, and why does he think so few understand it?","Which companies does he say he truly understands, and why does he stay away from the rest?","What is a stop-doing list? Name four items on BBK's.","Why do BBK, OPPO and vivo take no interest-bearing loans?","In what order does he weigh business, people and price?","What do benfen and a calm mind mean?","Give his two reasons to sell.","What made NetEase cheap when he bought it, and why does he think he sold too early?","What advice did he give Zhejiang University graduates in 2011?","Name two mistakes he admits and what they have in common."],"disclaimer":["For education only. Nothing here is investment, financial, legal or tax advice, or a recommendation to buy, sell or hold any security.","Records and figures come from the published sources named on this page and may be revised; check the originals before relying on them.","Accuracy is not guaranteed and errors are possible; treat the original sources as correct. No liability is accepted for any loss arising from use of this material. Past results do not predict future ones.","Independent and unaffiliated: not endorsed by Duan Yongping, BBK, OPPO, vivo, Xueqiu, CITIC Press, the Munger Academy, the publications quoted or any company named. All trademarks and copyrights belong to their owners."],"big":{"timeline":[[1961,"Born in Nanchang, Jiangxi province; spends part of his childhood in the countryside"],[1982,"Graduates in radio engineering from Zhejiang University; assigned to an electron tube factory in Beijing"],[1989,"After a master's in econometrics at Renmin University, moves south to Guangdong"],["1989–95","Builds Subor in Zhongshan, famous for its video-game consoles"],[1995,"Leaves Subor after its owner breaks promises about shares, and founds BBK Electronics in Dongguan"],[2001,"Steps back from running BBK and splits it into three; they grow into OPPO, vivo and imoo"],["Early 2000s","From California, buys NetEase heavily during its crisis; it later returns about 100 times"],[2006,"Wins the Buffett charity lunch auction with a record $620,100, and takes his young friend Colin Huang, later founder of Pinduoduo"],[2011,"Begins buying Apple; tells Zhejiang University graduates to keep a list of things they won't do"],[2018,"Talks to Chinese students at Stanford about the stop-doing list, benfen and a calm mind"],[2025,"The book of his online answers appears in May; a rare long interview with Xueqiu's founder in October"],["2025–26","Gives Moutai shares to education funds, on condition the shares are kept and only dividends spent"]],"map":[["Buying a stock is buying the company","A company is worth the cash it will produce in future, discounted. Full stop."],["Only what you understand","He says he truly understands only a handful of companies."],["Right business, right people, right price","Business model and culture first; price matters least."],["Keep a stop-doing list","Most damage comes from doing things you already know are wrong."],["Never borrow","Debt speeds up both gains and losses; one bad soaking can be permanent."],["Benfen and a calm mind","Do the right thing, do it right, and stay calm when others don't."]]},"record":[["about 100×","his gain on NetEase, bought in its post-2000 crisis, by his own account (not audited)"],["$620,100","his winning bid for lunch with Buffett in 2006, a record then; the money went to charity"],["1 → 3","BBK split into three companies in 2001; they grew into OPPO, vivo and imoo"],["0","interest-bearing loans: a fixed rule at BBK, OPPO and vivo"]],"special":"cn","sp":[{"k":"checks","title":"Your own stop-doing list","items":["I never borrow money to buy shares","I never bet against a company by short selling","I never buy a business I can't explain","I never buy on a tip or a story alone","I never trade to win other traders' money","I never keep a mistake going just because stopping hurts","I never buy a company whose culture I dislike","I never pay for something that produces no cash"],"verdicts":["Which of these do you already never do? Tick the rules you keep.","Every rule kept. Add one more of your own and write down why.","A good list. Which unticked rule has cost you money before?","Pick one rule to adopt this month, and write down why."],"note":"These are our study questions, drawn from his talks and answers. They are not his words and not a recommendation."},{"k":"ol","id":"sp-bbk","title":"BBK's stop-doing list, as reported","items":[["No selling on credit.",""],["No late payments to suppliers.",""],["No late wages.",""],["No haggling:","one price for every customer."],["No making products for other brands.",""],["No interest-bearing loans.",""],["No attacking competitors.",""]],"note":"Gathered from his talks and press interviews. BBK has not published an official list, and the list grew over the years."},{"k":"note","text":"His decision test, in his own description: first ask whether something is the right thing to do. Only then ask whether it makes money."}]},"qiu":{"id":"qiu","name":"Qiu Guolu","short":"Qiu","mono":"QG","country":"china","ready":true,"what":"His two books and talks on cheap prices, pricing power and going against the crowd","crumb":"Qiu Guolu · 7 sources","handbookTitle":"Qiu Guolu: a study handbook","unitTab":"Sources","unitWord":"source","unitRoute":"source","unitsRoute":"sources","scope":"Qiu writes in Chinese. His first book gathers essays and posts written mostly before 2013; the sequel draws on Gaoyi's internal discussions. Neither has an English edition. Lessons are our own English summaries; short quotes are in Chinese with our translation. His funds report returns only to their investors, so we show none we cannot check.","readHow":"If you read Chinese, start with The Simplest Things in Investing: short chapters in plain language. Otherwise, the free articles linked below carry the core ideas, and browser translation works reasonably well.","sourcesNote":"Sources: his books (2014, updated 2020; and 2018 with Gaoyi colleagues), a 2015 newspaper profile, interviews in 2018 and 2019, a 2017 lecture at the Gaoli value investing institute, and press reports of his 2022 letter to investors. Lessons are in our own words; short quotes are in Chinese with our translation.","start":{"lede":"Qiu Guolu formed his approach during six years at Wedge Capital in the United States, ran investment at China Southern Asset Management from 2008, and in 2014 founded Gaoyi Asset Management, a home for several star managers that grew past 100 billion yuan. His bestselling book boils investing down to three questions: why is it cheap, why is it good, and why buy now?","para":"This page draws on his book The Simplest Things in Investing (2014) and its sequel (2018), a 2017 lecture, interviews and his 2022 letter to investors. About an hour a week for ten weeks: one idea here, then the source it comes from.","steps":[]},"glossary":[["A shares","Shares of Chinese companies listed in Shanghai and Shenzhen, traded in yuan."],["Price to earnings (P/E)","The share price divided by the profit per share."],["Price to book (P/B)","The share price divided by the company's net assets per share."],["Pricing power","The ability to raise prices without losing customers."],["Porter's five forces","A way to judge an industry: rivals, new entrants, substitutes, and the bargaining power of suppliers and customers."],["DuPont analysis","Splitting return on equity into profit margin, asset turnover and borrowing."],["Value trap","A share that looks cheap but stays cheap, because the business keeps getting worse."],["Contrarian","Deliberately going against the crowd."],["Private fund","A fund sold only to qualified investors, with fewer public reporting rules than a public fund."]],"units":[{"key":"book","chip":"Book, 2014","tag":"Book, 2014","title":"The Simplest Things in Investing","date":"China Renmin University Press, October 2014; updated edition 2020 (投资中最简单的事). Foreword by Zhang Lei.","summary":"His bestseller: the three questions, cheapness, pricing power, winning first, contrarian buying, value traps and the difference between luck and skill.","year":2014,"link":"https://news.cnyes.com/news/id/3568837","linkLabel":"Read an excerpt (Chinese)","nuggets":["t1n1","t1n2","t1n3","t1n4","t1n5","t2n1","t2n2","t2n3","t2n4","t3n1","t3n4","t5n1","t6n4","t7n1","t7n2","t7n3","t7n4","t7n5","t9n2"],"mistakes":[],"quote":"q-book"},{"key":"book2","chip":"Book, 2018","tag":"Book, 2018","title":"The Not-So-Simple Things in Investing","date":"Sichuan People's Publishing House, January 2018 (投资中不简单的事), with Deng Xiaofeng, Zhuo Liwei, Sun Qingrui and Feng Liu.","summary":"Gaoyi's managers on putting simple principles into practice in a noisy market.","year":2018,"link":"https://www.36kr.com/p/1722207780865","linkLabel":"Read about the book (Chinese)","nuggets":["t9n5"],"mistakes":[],"quote":null},{"key":"prof","chip":"Profile, 2015","tag":"Profile, 2015","title":"Crazy only for value","date":"Shanghai Securities News, February 2015, via Phoenix Finance.","summary":"His path from the 1992 share certificate rush to the US and back, and his years at China Southern.","year":2015,"link":"https://finance.ifeng.com/a/20150226/13514764_0.shtml","linkLabel":"Read the profile (Chinese)","nuggets":["t6n2","t9n1","t9n3","t9n4"],"mistakes":[],"quote":null},{"key":"int","chip":"Interviews, 2018–19","tag":"Interviews, 2018–19","title":"Interviews with Smart Investor","date":"Two interviews, April 2018 and April 2019, published by Gelonghui.","summary":"How Wedge Capital shaped him, why Gaoyi locks in client money, and his 2017 letter setting the firm's three priorities.","year":2019,"link":"https://m.gelonghui.com/p/266308","linkLabel":"Read the interviews (Chinese)","nuggets":["t8n1","t8n2","t8n3","t8n4","t9n6"],"mistakes":[],"quote":null},{"key":"moon","chip":"Lecture, 2017","tag":"Lecture, 2017","title":"Counting the moon","date":"Course at the Gaoli value investing institute, September 2017; edited excerpt published by Gelonghui.","summary":"Why industry structure decides pricing power, how to rank industries by their moons and stars, and how to define the sky.","year":2017,"link":"https://m.gelonghui.com/p/186330","linkLabel":"Read the excerpt (Chinese)","nuggets":["t3n2","t3n3","t4n1","t4n2","t4n3","t4n4","t4n5","t5n1"],"mistakes":[],"quote":"q-moon"},{"key":"tech","chip":"Article","tag":"Article","title":"Why fast-changing industries make poor investments","date":"Gelonghui article drawing on his book.","summary":"His examples of televisions against air conditioners and Coca-Cola, and what food scandals did to industry leaders.","year":null,"link":"https://m.gelonghui.com/p/156733","linkLabel":"Read the article (Chinese)","nuggets":["t5n2","t5n3","t5n4","t6n1"],"mistakes":[],"quote":null},{"key":"l22","chip":"Letter, 2022","tag":"Letter, 2022","title":"Letter to investors","date":"May 2022, as reported by Wallstreetcn and Cailian Press.","summary":"A frank look back at 2020–21: why he stayed out of the crowded trades, three mistakes, and what he would watch more closely.","year":2022,"link":"https://wallstreetcn.com/articles/3659973","linkLabel":"Read the report (Chinese)","nuggets":["t6n3","t10n1","t10n2","t10n3","t10n4"],"mistakes":[],"quote":"q-l22"}],"themes":[{"id":"t1","num":1,"title":"Three questions","idea":"All his analysis comes down to three questions: why is it cheap, why is it good, and why buy now?","nuggets":["t1n1","t1n2","t1n3","t1n4","t1n5"],"ask":["Answer the three questions for one company you know. Which was hardest?","How did the company make its profits over five years: margins, turnover or borrowing?"],"table":null,"tool":null,"stories":[],"diagram":"threeq","after":0,"caption":"Valuation is the easiest of the three to measure; quality is the hardest to judge."},{"id":"t2","num":2,"title":"Cheapness is the hard truth","idea":"A low price is the investor's first protection. Even an ordinary company can pay well if bought cheaply enough.","nuggets":["t2n1","t2n2","t2n3","t2n4"],"ask":["Can you name a dull company that looks cheap? Why is it cheap?","How many truly great companies can you name in your own market?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t3","num":3,"title":"Pricing power is the core advantage","idea":"A company with a real edge can raise prices without losing customers. That power comes from doing what you can repeat and others cannot copy.","nuggets":["t3n1","t3n2","t3n3","t3n4"],"ask":["Which company you buy from could raise its prices tomorrow without losing you?","What does it do that nobody else can copy?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t4","num":4,"title":"Count the moons, not the stars","idea":"Look at the whole industry, not just the company. The best skies have one bright moon; the worst are crowded with stars.","nuggets":["t4n1","t4n2","t4n3","t4n4","t4n5"],"ask":["In one industry you know, how many moons are there?","Which firms are really competing with each other, and which only look as if they are?"],"table":null,"tool":null,"stories":[],"diagram":"moons","after":0,"caption":"From best to worst: one moon; a moon with bright stars; two or three moons; a sky full of stars."},{"id":"t5","num":5,"title":"Win first, then fight","idea":"Crowded, fast-growing industries make poor hunting grounds. Wait until the battle is over and back the winner.","nuggets":["t5n1","t5n2","t5n3","t5n4"],"ask":["Name an industry where the battle is over. Who won?","Which product you use has barely changed in thirty years?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t6","num":6,"title":"Take what others discard","idea":"Go where the crowd is not, and be careful where it is packed. But cheap can stay cheap: check why the crowd left.","nuggets":["t6n1","t6n2","t6n3","t6n4"],"ask":["Which industry are fund managers crowding into now?","Why might a cheap share stay cheap for years?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t7","num":7,"title":"A lucky win is not a right bet","idea":"Judge your method, not this year's result. A sound process shows itself over five to ten years.","nuggets":["t7n1","t7n2","t7n3","t7n4","t7n5"],"ask":["Was your best result last year skill or luck? How would you tell?","How many bad years would make you abandon your method?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t8","num":8,"title":"Clients first","idea":"A fund firm must put compliance before growth, clients before itself, and results before size.","nuggets":["t8n1","t8n2","t8n3","t8n4"],"ask":["If you ran a fund, which promise to clients would you write down first?","Why might a fund do worse as it grows bigger?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t9","num":9,"title":"Value investing works in China","idea":"He has tried most methods. For most people, he concluded, only value investing can really be learned and used, in China as anywhere.","nuggets":["t9n1","t9n2","t9n3","t9n4","t9n5","t9n6"],"ask":["Which investing methods have you tried? Which could you actually keep using?","What would make a method work in one country but not another?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t10","num":10,"title":"Even legends stumble","idea":"After two hard years he wrote to investors about his mistakes, and what he would watch more closely.","nuggets":["t10n1","t10n2","t10n3","t10n4"],"ask":["What could change an industry's pricing power overnight?","When did you last add to a falling share too early?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""}],"nuggets":{"t1n1":{"id":"t1n1","theme":"t1","tags":"Book, 2014","units":["book"],"lead":"Cheap, good, now.","text":"Every analysis answers three questions: why the company is cheap, why it is good, and why now is the time to buy.","co":[]},"t1n2":{"id":"t1n2","theme":"t1","tags":"Book, 2014","units":["book"],"lead":"Valuation is the easy part.","text":"Price to earnings,
