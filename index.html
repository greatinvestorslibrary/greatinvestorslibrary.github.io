tters are the copyright of their authors and publishers; short phrases are quoted for purposes of study, criticism and review, with attribution, and readers are encouraged to read the originals.","Distribution. This material is free and may not be sold."],"big":{"map":[["Before you decide","Run the checklist of models. Invert: how would this fail? Which tendencies are acting on you right now?"],["When you invest","Few, great, mispriced. Bet heavily when the odds are clear. Then sit, and keep costs and taxes low."],["With other people","Look at incentives first. Be reliable. Deserve what you want. Choose people you admire."],["Inside your head","Refuse envy, resentment, revenge and self-pity. Hunt for evidence against your own views."],["Every day","Learn something. Go to bed a little wiser. Keep the habit for life."]],"timeline":[[1982,"Blue Chip"],[1985,"Wesco"],[1986,"Harvard School"],[1994,"USC"],[1996,"Stanford"],[1996,"Coca-Cola"],[1996,"Wesco"],[1998,"Harvard Law"],[1998,"Foundations"],[2000,"Roundtable"],[2000,"Scandal parable"],[2003,"UCSB"],[2005,"Misjudgment"],[2006,"Wesco"],[2007,"USC Law"],[2014,"Berkshire"]],"reading":["Ron Chernow, Titan: The Life of John D. Rockefeller, Sr.","Robert B. Cialdini, Influence: The Psychology of Persuasion","Richard Dawkins, The Selfish Gene","Jared Diamond, Guns, Germs, and Steel; The Third Chimpanzee","Harvey S. Firestone and Samuel Crowther, Men and Rubber","Roger Fisher, William Ury and Bruce Patton, Getting to Yes","Benjamin Franklin, The Autobiography of Benjamin Franklin","John Gribbin, Deep Simplicity; with Mary Gribbin, Ice Age","Andrew S. Grove, Only the Paranoid Survive","Robert G. Hagstrom, The Warren Buffett Portfolio","Garrett Hardin, Living Within Limits","Arthur Herman, How the Scots Invented the Modern World","David S. Landes, The Wealth and Poverty of Nations","Frank Partnoy, Fiasco","Matt Ridley, Genome","Les Schwab, Pride in Performance","Gino Segre, A Matter of Degrees","Herbert A. Simon, Models of My Life","Irving Stone, Men to Match My Mountains","Joseph Frazier Wall, Andrew Carnegie","Robert Wright, Three Scientists and Their Gods"]},"about":"Only Charlie Munger's own talks and letters: the eleven talks in Poor Charlie's Almanack, his letters to Wesco Financial and Blue Chip Stamps shareholders, and his 2014 essay in Berkshire's annual report.","handbookTitle":"Charlie Munger's talks and letters: a study handbook"},"lynch":{"id":"lynch","name":"Peter Lynch","short":"Lynch","mono":"PL","ready":true,"crumb":"Peter Lynch · Books & talks 1989–2023","what":"His books, talks and interviews on finding good stocks as an ordinary investor","unitTab":"Books & talks","unitWord":"source","unitRoute":"source","unitsRoute":"sources","unitsTitle":"His books, talks and interviews","unitsLede":"Each source: what it is most worth reading for, its one short line, the ideas it contributes, and your own notes.","scope":"Lynch wrote three books, all with John Rothchild. One Up on Wall Street is split here into its three parts plus the new introduction of 2000. Three recorded talks and interviews add his own spoken words. Magazine columns and paraphrased quotes found online are left out.","readHow":"The books are in print; borrow or buy them. The 1996 interview transcript is free at PBS and the 2023 interview at Yahoo Finance.","start":{"lede":"Peter Lynch ran Fidelity's Magellan Fund from 1977 to 1990, averaging 29.2% a year, about double the S&P 500. He retired at 46 and spent the following decades teaching ordinary people to pick stocks the way he did: look around, sort, check, explain, then own.","para":"This section covers his three books, a 1994 talk, a 1996 TV interview and a 2023 interview. Expect about an hour a week for twelve weeks: one step of his method here, then the chapter or talk it comes from.","steps":[["Walk his five-step path","<a href=\"#lynch-themes\">The stock-picker's path<\/a>: from spotting a company to owning it."],["Play the six-kinds game","<a href=\"#lynch-tool-sorter\">Sort twelve invented companies<\/a> into his six kinds of stock."],["Read your first source","<a href=\"#lynch-source-pbs1996\">His 1996 interview<\/a> is free online and full of stories and figures."],["Write a two-minute drill","<a href=\"#lynch-tool-drill\">Explain one company<\/a> you know, against the clock."]]},"glossary":[["Ten-bagger","A stock that rises tenfold. His baseball term: two home runs and a double."],["Slow grower","A large, mature company growing about as fast as the economy, owned for its dividend."],["Stalwart","A big, established company growing earnings about 10 to 12% a year."],["Fast grower","A small, aggressive company growing 20 to 25% a year. His favourite kind."],["Cyclical","A company whose profits rise and fall with the economy."],["Turnaround","A battered company that might recover."],["Asset play","A company sitting on something valuable that the market has missed."],["PEG ratio","The P/E divided by the earnings growth rate. Around 1 is fair; well below 1 may be a bargain."],["Diworseification","His word for a profitable company buying unrelated businesses and making itself worse."],["Two-minute drill","A short spoken case for a stock: why you like it, what must happen, what could go wrong."]],"units":[{"key":"oneup1","chip":"1989 One Up I","tag":"1989 One Up I","title":"One Up on Wall Street, Part 1: Preparing to invest","date":"Simon & Schuster, 1989 (millennium edition 2000)","summary":"Why an ordinary person has an edge over the professionals, whether stocks are gambling, and the temperament it takes.","year":1989,"link":"https://www.simonandschuster.com/books/One-Up-On-Wall-Street/Peter-Lynch/9780743200400","linkLabel":"The book at the publisher","nuggets":["t1n1","t1n2","t1n3","t2n2","t3n5","t11n6"],"mistakes":[],"quote":null},{"key":"oneup2","chip":"1989 One Up II","tag":"1989 One Up II","title":"One Up on Wall Street, Part 2: Picking winners","date":"Simon & Schuster, 1989","summary":"The heart of his method: the six kinds of stock, the perfect stock and the ones to avoid, the two-minute drill and the famous numbers.","year":1989,"link":"https://www.simonandschuster.com/books/One-Up-On-Wall-Street/Peter-Lynch/9780743200400","linkLabel":"The book at the publisher","nuggets":["t4n1","t4n2","t4n3","t4n4","t4n5","t4n6","t4n7","t4n8","t5n1","t5n2","t5n3","t5n4","t5n5","t5n6","t5n7","t5n8","t6n2","t7n1","t7n2","t7n3","t7n4","t7n5","t9n1","t9n4","t12n3"],"mistakes":[],"quote":"q-oneup2"},{"key":"oneup3","chip":"1989 One Up III","tag":"1989 One Up III","title":"One Up on Wall Street, Part 3: The long-term view","date":"Simon & Schuster, 1989","summary":"Building a portfolio, when to buy and sell, and the silliest things people say about stock prices.","year":1989,"link":"https://www.simonandschuster.com/books/One-Up-On-Wall-Street/Peter-Lynch/9780743200400","linkLabel":"The book at the publisher","nuggets":["t6n3","t7n7","t10n4","t10n7","t12n4"],"mistakes":[],"quote":null},{"key":"oneup2000","chip":"2000 New intro","tag":"2000 New intro","title":"One Up on Wall Street: Introduction to the millennium edition","date":"Simon & Schuster, 2000","summary":"His view of the dot-com boom: do the homework, do the arithmetic, and remember few buyers get the full ride.","year":2000,"link":"https://www.simonandschuster.com/books/One-Up-On-Wall-Street/Peter-Lynch/9780743200400","linkLabel":"The book at the publisher","nuggets":["t1n4","t7n6","t8n5","t12n7"],"mistakes":[],"quote":"q-oneup2000"},{"key":"bts","chip":"1993 Beating the Street","tag":"1993 Beating the Street","title":"Beating the Street","date":"Simon & Schuster, 1993","summary":"His Magellan years, a class of seventh graders who picked stocks, 21 Peter's Principles and 25 golden rules.","year":1993,"link":"https://www.simonandschuster.com/books/Beating-the-Street/Peter-Lynch/9780671891633","linkLabel":"The book at the publisher","nuggets":["t1n3","t2n1","t2n4","t3n1","t3n2","t3n3","t5n9","t6n1","t6n4","t8n1","t8n3","t8n6","t9n3","t10n2","t10n6","t11n7","t12n6","t12n8"],"mistakes":[],"quote":"q-bts"},{"key":"npc1994","chip":"1994 Press Club","tag":"1994 Press Club","title":"Talk at the National Press Club","date":"Washington, 7 October 1994","summary":"Know what you own, explain it in two minutes, ignore forecasts, and expect the market to fall.","year":1994,"link":"https://novelinvestor.com/peter-lynch-single-important-thing/","linkLabel":"Excerpt and video (third-party page)","nuggets":["t1n5","t6n6","t9n2","t9n6","t11n5","t11n8"],"mistakes":[],"quote":"q-npc1994"},{"key":"learn","chip":"1995 Learn to Earn","tag":"1995 Learn to Earn","title":"Learn to Earn","date":"Fireside, 1995","summary":"A beginner's guide, for anyone of high-school age or older, to capitalism, companies and the basics of investing.","year":1995,"link":"https://www.simonandschuster.ca/books/Learn-to-Earn/Peter-Lynch/9780684811635","linkLabel":"The book at the publisher","nuggets":["t2n8","t8n4","t12n2"],"mistakes":[],"quote":"q-learn"},{"key":"pbs1996","chip":"1996 PBS interview","tag":"1996 PBS interview","title":"Interview for PBS Frontline, “Betting on the Market”","date":"Recorded 1996, aired January 1997","summary":"His life story in his own words: caddying, his first ten-bagger, Magellan, 1987, and why timing the market doesn't pay.","year":1996,"link":"https://www.pbs.org/wgbh/pages/frontline/shows/betting/pros/lynch.html","linkLabel":"Full transcript at PBS","nuggets":["t2n2","t2n3","t2n5","t2n6","t3n6","t3n7","t4n6","t6n5","t10n1","t10n2","t10n3","t10n5","t11n1","t11n2","t11n3","t11n4"],"mistakes":[],"quote":"q-pbs1996"},{"key":"yahoo2023","chip":"2023 Interview","tag":"2023 Interview","title":"Interview with Yahoo Finance","date":"Published 8 July 2023","summary":"Thirty-four years after his first book: balance sheets, company stages, regrets, and why cheap trading isn't investing.","year":2023,"link":"https://ca.finance.yahoo.com/news/fidelity-legend-peter-lynch-i-never-said-to-invest-in-the-stock-market-120755736.html","linkLabel":"The interview at Yahoo Finance","nuggets":["t1n6","t2n7","t3n4","t8n2","t8n3","t9n5","t10n3","t12n1","t12n2","t12n5"],"mistakes":[],"quote":"q-yahoo2023"}],"themes":[{"id":"t1","num":1,"title":"The amateur's edge","idea":"An ordinary person who keeps their eyes open often spots a good company years before the professionals do.","nuggets":["t1n1","t1n2","t1n3","t1n4","t1n5","t1n6"],"ask":["Which three companies do you know better than most analysts, because of your work or daily life?","For one of them, what would you still need to check before buying?"],"table":null,"tool":null,"stage":"ready","stories":[{"t":"From caddie to Fidelity","x":"He started caddying at 11 at a golf club where members talked about stocks. He caddied for Fidelity's president for years, which, he said, made his job interview a formality.","src":"1996 PBS interview"}],"diagram":"lag","after":3,"caption":"Illustrative. The order in which a good small company tends to get noticed: by customers and staff first, by Wall Street last."},{"id":"t2","num":2,"title":"Is it gambling? Stocks and your stomach","idea":"Stocks reward patient owners of good companies; the real test is your stomach, not your brain.","nuggets":["t2n1","t2n2","t2n3","t2n4","t2n5","t2n6","t2n7","t2n8"],"ask":["If your portfolio fell 25% next month, what would you actually do?","Which of your money will you not need for at least five years?"],"table":null,"tool":null,"stage":"ready","stories":[{"t":"The 1987 crash, from Ireland","x":"He was on his first holiday in years when the market fell 508 points in a day, and he flew home. He later said 1987 didn't frighten him much, because his companies were still doing well; 1990 was far scarier.","src":"1996 PBS interview"}],"diagram":"declines","after":5,"caption":"Each dot is one market decline of 10% or more in 95 years, as he counted them in 1996. The 15 darker dots were falls of 25% or more."},{"id":"t3","num":3,"title":"Look in your own backyard","idea":"The best leads come from everyday life: the store you like, the product people keep buying, the trend at your job.","nuggets":["t3n1","t3n2","t3n3","t3n4","t3n5","t3n6","t3n7"],"ask":["Name a product you or your family keep buying again. Who makes it, and is that company listed?","Which trend at your job could you understand before Wall Street does?"],"table":null,"tool":null,"stage":"find","stories":[{"t":"The pantyhose in the shopping bag","x":"His wife Carolyn brought home L'eggs pantyhose, sold in supermarkets. He found good hosiery was then sold mainly in department stores, and when a rival appeared he bought 48 pairs to compare. Hanes became one of his biggest holdings.","src":"1996 PBS interview"},{"t":"The burrito","x":"Taco Bell was one of his early picks; he was impressed by the burrito on a trip to California.","src":"1989 One Up I"}],"diagram":"backyard","after":3,"caption":"Illustrative. Where his best leads came from, and the step every lead still needs."},{"id":"t4","num":4,"title":"The six kinds of stock","idea":"Before buying, decide which of six kinds of stock you are looking at; that tells you what to expect and when to sell.","nuggets":["t4n1","t4n2","t4n3","t4n4","t4n5","t4n6","t4n7","t4n8"],"ask":["Pick a company you know. Which of the six kinds is it, and what does that tell you to expect?","What would make it move into a different kind?"],"table":null,"tool":"sorter","stage":"find","stories":[{"t":"Chrysler on television","x":"In October 1982, on Wall Street Week, he recommended Chrysler, then his biggest holding, at about $10 a share. Friends thought it was headed for bankruptcy.","src":"1996 PBS interview"}],"diagram":"kinds","after":1,"caption":"His three growth bands, plus three kinds defined by their situation. Growth rates are his rough guides."},{"id":"t5","num":5,"title":"The perfect stock, and the ones to avoid","idea":"He looked for dull, overlooked companies in boring niches, and stayed away from the hottest story in town.","nuggets":["t5n1","t5n2","t5n3","t5n4","t5n5","t5n6","t5n7","t5n8","t5n9"],"ask":["How many of the 13 traits does a company you like actually have?","Is anything you own “the hottest stock in the hottest industry”?"],"table":null,"tool":"perfect","stage":"check","stories":[],"diagram":null,"after":0,"caption":""},{"id":"t6","num":6,"title":"Earnings are the engine","idea":"Over months the price can do anything; over years it follows the company's earnings.","nuggets":["t6n1","t6n2","t6n3","t6n4","t6n5","t6n6"],"ask":["What, specifically, will make your company's earnings grow over the next five years?","Have you ever judged a decision only by the price? What did you miss?"],"table":null,"tool":null,"stage":"check","stories":[],"diagram":"earnings","after":2,"caption":"Illustrative. Over months the price wanders above and below the company's earnings; over years it follows them."},{"id":"t7","num":7,"title":"The famous numbers","idea":"A few simple numbers tell you whether a good company is also a good price.","nuggets":["t7n1","t7n2","t7n3","t7n4","t7n5","t7n6","t7n7"],"ask":["Work out the P/E-to-growth figure for one company you follow. What does it say?","Where did the growth rate come from, and how sure are you of it?"],"table":null,"tool":"peg","stage":"check","stories":[],"diagram":"peg","after":3,"caption":"His rule of thumb for the P/E compared with the growth rate. A guide, not a formula."},{"id":"t8","num":8,"title":"Balance sheet first","idea":"The biggest losses come from weak balance sheets; know a company's finances before you risk money on it.","nuggets":["t8n1","t8n2","t8n3","t8n4","t8n5","t8n6"],"ask":["Which company you like could survive two bad years without raising money?","Find one number on a balance sheet you have never checked before. What does it tell you?"],"table":null,"tool":null,"stage":"check","stories":[],"diagram":"debtcash","after":2,"caption":"His 2023 example: two companies both losing money. Only one can wait out the bad patch."},{"id":"t9","num":9,"title":"The two-minute drill","idea":"If you can't explain why you own a stock in two minutes, simply enough for a child, you don't know enough to own it.","nuggets":["t9n1","t9n2","t9n3","t9n4","t9n5","t9n6"],"ask":["Give your two-minute drill for one company, out loud. Where did you get stuck?","What has to happen for it to succeed, and what could stop it?"],"table":null,"tool":"drill","stage":"tell","stories":[{"t":"The seventh graders","x":"Beating the Street opens with a class of seventh graders at St. Agnes School in Massachusetts, who built a stock portfolio from companies they understood. Their lessons led him to the crayon test.","src":"1993 Beating the Street"}],"diagram":"clock","after":1,"caption":"The three parts of his two-minute monologue."},{"id":"t10","num":10,"title":"Ten-baggers: let the winners run","idea":"You only need a few big winners in a lifetime, so let them run and don't cut the flowers to water the weeds.","nuggets":["t10n1","t10n2","t10n3","t10n4","t10n5","t10n6","t10n7"],"ask":["Have you ever sold a winner early to “lock in” a gain? What happened next?","Which holding is your weed, and why are you still watering it?"],"table":null,"tool":"tenbag","stage":"own","stories":[{"t":"His first ten-bagger","x":"In college he put about $1,000 into Flying Tiger, an air-cargo company, because he thought air freight would grow. It rose about tenfold and helped pay for graduate school.","src":"1996 PBS interview"}],"diagram":"asym","after":4,"caption":"The most you can lose on a stock is 100%. A ten-bagger gains 900%."},{"id":"t11","num":11,"title":"Don't time the market","idea":"Nobody can predict the economy or the next fall; study companies, not forecasts.","nuggets":["t11n1","t11n2","t11n3","t11n4","t11n5","t11n6","t11n7","t11n8"],"ask":["When did a forecast last change one of your decisions? Was it right?","What will you do the next time the market falls 10%?"],"table":null,"tool":"cocktail","stage":"own","stories":[],"diagram":"highlow","after":4,"caption":"His 1996 example, 1965 to 1995: putting money in at each year's high still earned almost as much as at each year's low."},{"id":"t12","num":12,"title":"Keep checking the story","idea":"Hold as long as the story holds; recheck it every few months, and sell when the story, not the price, changes.","nuggets":["t12n1","t12n2","t12n3","t12n4","t12n5","t12n6","t12n7","t12n8"],"ask":["For each company you own: has the story changed since you bought it?","Which holding are you keeping only out of boredom, or only because it hasn't come back yet?"],"table":null,"tool":"silly","stage":"own","stories":[{"t":"The one that got away","x":"In 2023 he said his biggest regret was not buying Apple when the shares were around $9 with no debt and $4 to $5 a share in cash.","src":"2023 Interview"}],"diagram":"stages","after":2,"caption":"Illustrative. A company's life: the right question is always which stage it is in now."}],"nuggets":{"t1n1":{"id":"t1n1","theme":"t1","tags":"1989 One Up I","units":["oneup1"],"lead":"You start ahead.","text":"He argued that any normal person can pick stocks as well as the average Wall Street expert, using what they already see at work and in the shops.","co":[]},"t1n2":{"id":"t1n2","theme":"t1","tags":"1989 One Up I","units":["oneup1"],"lead":"Professionals play it safe.","text":"Many fund managers fear looking bad more than they want to win, so they avoid small, unknown companies until everyone already knows them.","co":[]},"t1n3":{"id":"t1n3","theme":"t1","tags":"1989 One Up I · 1993 Beating the Street","units":["oneup1","bts"],"lead":"Your edge is where you work and shop.","text":"Your job, your industry and the products you use every day can show you which companies are winning before the numbers reach Wall Street.","co":[]},"t1n4":{"id":"t1n4","theme":"t1","tags":"2000 New intro","units":["oneup2000"],"lead":"Spotting is only the start.","text":"He never said to buy a stock just because you like the product or the store. You still have to study the company's earnings, finances and competition.","co":[]},"t1n5":{"id":"t1n5","theme":"t1","tags":"1994 Press Club","units":["npc1994"],"lead":"Know what you own.","text":"He called this the single most important thing, and reckoned about 80% of people own stocks they couldn't explain.","co":[]},"t1n6":{"id":"t1n6","theme":"t1","tags":"2023 Interview","units":["yahoo2023"],"lead":"Step one, then step two.","text":"In 2023 he repeated that he never told people simply to put money into the market. Knowing a company is step one; reading its balance sheet is step two.","co":[]},"t2n1":{"id":"t2n1","theme":"t2","tags":"1993 Beating the Street","units":["bts"],"lead":"Owning, not betting.","text":"Stocks are a gamble only if you pick them like lottery tickets. Behind every stock is a business, and businesses that earn more become worth more.","co":[]},"t2n2":{"id":"t2n2","theme":"t2","tags":"1989 One Up I · 1996 PBS interview","units":["oneup1","pbs1996"],"lead":"Why stocks beat bonds.","text":"With a bond, the best you can hope for is your money back plus interest. Over the long run, stocks with dividends returned about 11% a year, against 5 to 6% for bonds.","co":[]},"t2n3":{"id":"t2n3","theme":"t2","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Profits are the engine.","text":"Company profits have grown about 8% a year over time, which is why stocks rise in the long run, even after flat decades.","co":[]},"t2n4":{"id":"t2n4","theme":"t2","tags":"1993 Beating the Street","units":["bts"],"lead":"Bad picks are worse than cash.","text":"Over the long run, a portfolio of poorly chosen stocks won't beat money left under the mattress.","co":[]},"t2n5":{"id":"t2n5","theme":"t2","tags":"1996 PBS interview","units":["pbs1996"],"lead":"The stomach decides.","text":"Markets fall often: he counted 53 declines of 10% or more in 95 years, 15 of them of 25% or more. If you can't sit through that, don't own stocks.","co":[]},"t2n6":{"id":"t2n6","theme":"t2","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Only money you won't need.","text":"Buy, hold and add when the market falls, but only with money you won't need soon.","co":[]},"t2n7":{"id":"t2n7","theme":"t2","tags":"2023 Interview","units":["yahoo2023"],"lead":"Temperament as much as homework.","text":"If a sharp drop would keep you awake at night, he said in 2023, you shouldn't be investing in stocks.","co":[]},"t2n8":{"id":"t2n8","theme":"t2","tags":"1995 Learn to Earn","units":["learn"],"lead":"Start with how the world works.","text":"His beginner's book opens with the history of companies and capitalism, because investing makes sense only once you see what a company is.","co":[]},"t3n1":{"id":"t3n1","theme":"t3","tags":"1993 Beating the Street","units":["bts"],"lead":"Start close to home.","text":"He believed the best place to start looking for the next winner is your own backyard: home, work and the shops.","co":[]},"t3n2":{"id":"t3n2","theme":"t3","tags":"1993 Beating the Street","units":["bts"],"lead":"Watch what people keep buying.","text":"A product that friends, family or colleagues keep coming back to is a clue worth following up.","co":[]},"t3n3":{"id":"t3n3","theme":"t3","tags":"1993 Beating the Street","units":["bts"],"lead":"If you like the store…","text":"One of his principles: if you like the store, chances are you'll love the stock. Then check the numbers.","co":[]},"t3n4":{"id":"t3n4","theme":"t3","tags":"2023 Interview","units":["yahoo2023"],"lead":"Small companies, big gains.","text":"His biggest wins often came from small companies with room to grow. In 2023 he cited Au Bon Pain, which bought St. Louis Bread for $23 million in 1993; it later sold for $7.5 billion.","co":[]},"t3n5":{"id":"t3n5","theme":"t3","tags":"1989 One Up I","units":["oneup1"],"lead":"A hit product is not enough.","text":"The Cabbage Patch doll was a huge hit, but it couldn't save a mediocre company with a bad balance sheet.","co":[]},"t3n6":{"id":"t3n6","theme":"t3","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Turn over more rocks.","text":"The more companies you look at, the more bargains you find. His early winners came from industries others ignored.","co":[]},"t3n7":{"id":"t3n7","theme":"t3","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Know a few well.","text":"An individual can do well by knowing three to five companies thoroughly and buying when one becomes attractive.","co":[]},"t4n1":{"id":"t4n1","theme":"t4","tags":"1989 One Up II","units":["oneup2"],"lead":"Sort before you buy.","text":"Every company fits one of six kinds: slow growers, stalwarts, fast growers, cyclicals, turnarounds and asset plays.","co":[]},"t4n2":{"id":"t4n2","theme":"t4","tags":"1989 One Up II","units":["oneup2"],"lead":"Slow growers.","text":"Large, ageing companies growing about as fast as the economy. You own them mainly for the dividend: low risk, low gain.","co":[]},"t4n3":{"id":"t4n3","theme":"t4","tags":"1989 One Up II","units":["oneup2"],"lead":"Stalwarts.","text":"Big, established companies growing earnings about 10 to 12% a year: low risk, moderate gain. He expected perhaps 30 to 50% from them, and liked them for protection in recessions.","co":[]},"t4n4":{"id":"t4n4","theme":"t4","tags":"1989 One Up II","units":["oneup2"],"lead":"Fast growers.","text":"Small, aggressive companies growing 20 to 25% a year. His favourites and the land of ten- to forty-baggers, but the riskiest when growth stops.","co":[]},"t4n5":{"id":"t4n5","theme":"t4","tags":"1989 One Up II","units":["oneup2"],"lead":"Cyclicals.","text":"Companies whose profits rise and fall with the economy. With these, timing matters more than anywhere else.","co":[]},"t4n6":{"id":"t4n6","theme":"t4","tags":"1989 One Up II · 1996 PBS interview","units":["oneup2","pbs1996"],"lead":"Turnarounds.","text":"Battered companies that might recover. They can make big gains, as Chrysler did in the early 1980s, but many never come back.","co":[]},"t4n7":{"id":"t4n7","theme":"t4","tags":"1989 One Up II","units":["oneup2"],"lead":"Asset plays.","text":"Companies sitting on something valuable the market has missed, such as property, cash or a business inside the business.","co":[]},"t4n8":{"id":"t4n8","theme":"t4","tags":"1989 One Up II","units":["oneup2"],"lead":"Kinds change.","text":"Fast growers eventually slow down and become stalwarts or slow growers, so check the label again from time to time.","co":[]},"t5n1":{"id":"t5n1","theme":"t5","tags":"1989 One Up II","units":["oneup2"],"lead":"Dull is beautiful.","text":"The perfect company has a boring, even ridiculous name and does something dull or disagreeable, so the crowd ignores it.","co":[]},"t5n2":{"id":"t5n2","theme":"t5","tags":"1989 One Up II","units":["oneup2"],"lead":"Overlooked is better.","text":"Big institutions don't own it and analysts don't follow it. A spinoff, or a company with a depressing or rumour-ridden image, often qualifies.","co":[]},"t5n3":{"id":"t5n3","theme":"t5","tags":"1989 One Up II","units":["oneup2"],"lead":"Niche and repeat buyers.","text":"A no-growth industry, a protected niche and a product people have to keep buying are all good signs.","co":[]},"t5n4":{"id":"t5n4","theme":"t5","tags":"1989 One Up II","units":["oneup2"],"lead":"Insiders and buybacks.","text":"When insiders buy their own shares, or the company buys back stock, management is showing confidence. Heavy insider buying makes a near-term bankruptcy very unlikely.","co":[]},"t5n5":{"id":"t5n5","theme":"t5","tags":"1989 One Up II","units":["oneup2"],"lead":"Use technology, don't sell it.","text":"He preferred companies that use technology to cut their costs over companies racing to sell it.","co":[]},"t5n6":{"id":"t5n6","theme":"t5","tags":"1989 One Up II","units":["oneup2"],"lead":"Avoid the hottest stock.","text":"The hottest stock in the hottest industry, the one everyone talks about, is the one he would avoid most.","co":[]},"t5n7":{"id":"t5n7","theme":"t5","tags":"1989 One Up II","units":["oneup2"],"lead":"Beware “the next” and diworseification.","text":"Stocks touted as the next big name rarely are, and profitable companies that buy unrelated businesses usually make themselves worse.","co":[]},"t5n8":{"id":"t5n8","theme":"t5","tags":"1989 One Up II","units":["oneup2"],"lead":"Beware whispers and exciting names.","text":"Long shots with thrilling stories and no earnings, and companies with exciting names in hot fields, attract buyers for the wrong reasons.","co":[]},"t5n9":{"id":"t5n9","theme":"t5","tags":"1993 Beating the Street","units":["bts"],"lead":"Fewer colour photos.","text":"Half joking: all else equal, invest in the company with the fewest colour photographs in its annual report.","co":[]},"t6n1":{"id":"t6n1","theme":"t6","tags":"1993 Beating the Street","units":["bts"],"lead":"Short term, no link; long term, a full link.","text":"Over months or even years there is often no connection between how a company does and how its stock does. Over the long term, the connection is complete.","co":[]},"t6n2":{"id":"t6n2","theme":"t6","tags":"1989 One Up II","units":["oneup2"],"lead":"Find what drives the profits.","text":"Something has to keep the profits growing; the more you know about that something, the better.","co":[]},"t6n3":{"id":"t6n3","theme":"t6","tags":"1989 One Up III","units":["oneup3"],"lead":"Price is not proof.","text":"A rising price doesn't mean you were right, and a falling one doesn't mean you were wrong. Only the business can tell you that.","co":[]},"t6n4":{"id":"t6n4","theme":"t6","tags":"1993 Beating the Street","units":["bts"],"lead":"Time favours good companies.","text":"Time is on your side when you own shares of superior companies, and against you when you own options.","co":[]},"t6n5":{"id":"t6n5","theme":"t6","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Even ten years late can be early.","text":"Investors who bought Wal-Mart ten years after its 1970 listing could still have made about 30 times their money by following its expansion.","co":[]},"t6n6":{"id":"t6n6","theme":"t6","tags":"1994 Press Club","units":["npc1994"],"lead":"The stock doesn't know you own it.","text":"Don't fall in love with a share. Stay while the company's fundamentals hold, and leave if they break.","co":[]},"t7n1":{"id":"t7n1","theme":"t7","tags":"1989 One Up II","units":["oneup2"],"lead":"P/E equal to growth is fair.","text":"A fairly priced company's P/E roughly equals its earnings growth rate. A P/E well below the growth rate may be a bargain; well above it, a warning.","co":[]},"t7n2":{"id":"t7n2","theme":"t7","tags":"1989 One Up II","units":["oneup2"],"lead":"Half is attractive, double is dear.","text":"A P/E around half the growth rate looked very attractive to him; around twice the growth rate, very unattractive.","co":[]},"t7n3":{"id":"t7n3","theme":"t7","tags":"1989 One Up II","units":["oneup2"],"lead":"Add the dividend.","text":"For dividend payers, add the yield to the growth rate and divide by the P/E. Below 1 is poor, about 1.5 is okay, and 2 or better is what you want.","co":[]},"t7n4":{"id":"t7n4","theme":"t7","tags":"1989 One Up II","units":["oneup2"],"lead":"Cash minus debt.","text":"Check how much cash the company holds against its long-term debt. Plenty of net cash cushions the bad years.","co":[]},"t7n5":{"id":"t7n5","theme":"t7","tags":"1989 One Up II","units":["oneup2"],"lead":"Who owns it?","text":"The fewer institutions own it and the fewer analysts follow it, the more room there is for discovery.","co":[]},"t7n6":{"id":"t7n6","theme":"t7","tags":"2000 New intro","units":["oneup2000"],"lead":"Do the arithmetic, even without earnings.","text":"For a company with no profits yet, work out what it would need to earn later to justify today's price.","co":[]},"t7n7":{"id":"t7n7","theme":"t7","tags":"1989 One Up III","units":["oneup3"],"lead":"Cheap is not safe.","text":"A $3 stock can go to zero just like a $50 one. A lousy cheap stock is as risky as a lousy expensive one.","co":[]},"t8n1":{"id":"t8n1","theme":"t8","tags":"1993 Beating the Street","units":["bts"],"lead":"Finances before faith.","text":"Never invest in a company without understanding its finances. The biggest losses come from companies with poor balance sheets.","co":[]},"t8n2":{"id":"t8n2","theme":"t8","tags":"2023 Interview","units":["yahoo2023"],"lead":"Two losers, one bargain.","text":"In 2023 he compared two loss-making companies: one with $300 million of debt, one with no debt and $200 million in cash.","co":[]},"t8n3":{"id":"t8n3","theme":"t8","tags":"1993 Beating the Street · 2023 Interview","units":["bts","yahoo2023"],"lead":"Debt decides who survives.","text":"In a downturn, a company with little debt can wait; one with heavy debt may not. That matters most for turnarounds and cyclicals.","co":[]},"t8n4":{"id":"t8n4","theme":"t8","tags":"1995 Learn to Earn","units":["learn"],"lead":"Read the numbers yourself.","text":"His beginner's book teaches how to read a stock table, an annual report and a balance sheet, before trusting anyone else's summary.","co":[]},"t8n5":{"id":"t8n5","theme":"t8","tags":"2000 New intro","units":["oneup2000"],"lead":"The homework list.","text":"Before buying, check the earnings prospects, financial condition, competitive position and plans for expansion.","co":[]},"t8n6":{"id":"t8n6","theme":"t8","tags":"1993 Beating the Street","units":["bts"],"lead":"Fancy offices are a warning.","text":"A lavish head office can signal managers who care more about themselves than about shareholders.","co":[]},"t9n1":{"id":"t9n1","theme":"t9","tags":"1989 One Up II","units":["oneup2"],"lead":"Give the monologue.","text":"Before buying, he talked himself through why he was interested, what had to happen for the company to succeed, and what could get in the way.","co":[]},"t9n2":{"id":"t9n2","theme":"t9","tags":"1994 Press Club","units":["npc1994"],"lead":"Simple enough for a child.","text":"If you can't explain to a ten-year-old, in two minutes or less, why you own a stock, he said, you shouldn't own it.","co":[]},"t9n3":{"id":"t9n3","theme":"t9","tags":"1993 Beating the Street","units":["bts"],"lead":"The crayon test.","text":"If you couldn't draw the idea with a crayon, he wouldn't invest in it.","co":[]},"t9n4":{"id":"t9n4","theme":"t9","tags":"1989 One Up II","units":["oneup2"],"lead":"Each kind has its own story.","text":"For a slow grower the story is the dividend; for a fast grower, where it can still expand; for a turnaround, how it will fix itself; for an asset play, what the assets are worth.","co":[]},"t9n5":{"id":"t9n5","theme":"t9","tags":"2023 Interview","units":["yahoo2023"],"lead":"Write it down.","text":"For beginners in 2023 he suggested a paper portfolio of at least ten stocks, a few written reasons for each, reviewed every three months.","co":[]},"t9n6":{"id":"t9n6","theme":"t9","tags":"1994 Press Club","units":["npc1994"],"lead":"“It's going up” is not a reason.","text":"Pressed, many owners admit their real reason is that the stock is rising, which is no reason at all.","co":[]},"t10n1":{"id":"t10n1","theme":"t10","tags":"1996 PBS interview","units":["pbs1996"],"lead":"A ten-bagger.","text":"His baseball term for a stock that goes up tenfold: two home runs and a double.","co":[]},"t10n2":{"id":"t10n2","theme":"t10","tags":"1996 PBS interview · 1993 Beating the Street","units":["pbs1996","bts"],"lead":"A few are enough.","text":"You don't need many. A handful of tenfold winners in a lifetime makes investing worthwhile.","co":[]},"t10n3":{"id":"t10n3","theme":"t10","tags":"1996 PBS interview · 2023 Interview","units":["pbs1996","yahoo2023"],"lead":"Right six times in ten.","text":"A good stock picker is right about six times in ten, so the winners must be allowed to outgrow the losers.","co":[]},"t10n4":{"id":"t10n4","theme":"t10","tags":"1989 One Up III","units":["oneup3"],"lead":"Flowers and weeds.","text":"Selling your winners and keeping your losers is like pulling out the flowers and watering the weeds. Buffett liked the image enough to use it in his 1988 letter.","co":[]},"t10n5":{"id":"t10n5","theme":"t10","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Add to the winners.","text":"He did well by owning many stocks, letting winners run and adding to them, even though Magellan missed more than a hundred ten-baggers.","co":[]},"t10n6":{"id":"t10n6","theme":"t10","tags":"1993 Beating the Street","units":["bts"],"lead":"Look at what you own first.","text":"The best stock to buy may be one you already own; check it before hunting for something new.","co":[]},"t10n7":{"id":"t10n7","theme":"t10","tags":"1989 One Up III","units":["oneup3"],"lead":"Lose 100%, gain 900%.","text":"Whatever you pay, picking the wrong stock costs at most the same 100%. A ten-bagger gains 900%.","co":[]},"t11n1":{"id":"t11n1","theme":"t11","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Thirteen minutes.","text":"Spend little time on economic forecasts: he joked that 13 minutes a year on economics wastes ten of them.","co":[]},"t11n2":{"id":"t11n2","theme":"t11","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Facts, not forecasts.","text":"Watch the facts in the industries you own, such as used-car prices for carmakers or new hotel building for hotel chains.","co":[]},"t11n3":{"id":"t11n3","theme":"t11","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Nobody saw 1982 coming.","text":"In 1982 inflation was 14%, the prime rate 20% and over half his companies were losing money. The great bull market began that year.","co":[]},"t11n4":{"id":"t11n4","theme":"t11","tags":"1996 PBS interview","units":["pbs1996"],"lead":"Timing barely matters.","text":"Investing every year at the year's high from 1965 to 1995 earned about 10.6% a year; at the year's low, about 11.7%.","co":[]},"t11n5":{"id":"t11n5","theme":"t11","tags":"1994 Press Club","units":["npc1994"],"lead":"Declines are normal.","text":"Falls happen and no one knows when. People who say they predicted one predicted many others too.","co":[]},"t11n6":{"id":"t11n6","theme":"t11","tags":"1989 One Up I","units":["oneup1"],"lead":"The cocktail party.","text":"Half joking, he described four stages of a market, from guests avoiding him at parties to everyone giving him tips. He did not use it to predict.","co":[]},"t11n7":{"id":"t11n7","theme":"t11","tags":"1993 Beating the Street","units":["bts"],"lead":"Pessimism rarely pays.","text":"Unless you sell short for a living, it rarely pays to be a pessimist about the long run.","co":[]},"t11n8":{"id":"t11n8","theme":"t11","tags":"1994 Press Club","units":["npc1994"],"lead":"History says: markets fall.","text":"Study history to learn that markets go down, and decide in advance that a fall is a chance to buy, not a reason to run.","co":[]},"t12n1":{"id":"t12n1","theme":"t12","tags":"2023 Interview","units":["yahoo2023"],"lead":"Check the story regularly.","text":"Even a long-term owner has to keep following the company. Stories end, for example when a business saturates its market.","co":[]},"t12n2":{"id":"t12n2","theme":"t12","tags":"2023 Interview · 1995 Learn to Earn","units":["yahoo2023","learn"],"lead":"Know the stage.","text":"Companies pass through stages, from start-up to fast growth to maturity. The key question is which stage yours is in.","co":[]},"t12n3":{"id":"t12n3","theme":"t12","tags":"1989 One Up II","units":["oneup2"],"lead":"Sell by kind.","text":"The right exit depends on the kind of stock: a stalwart after a solid rise, a fast grower when its room to expand runs out, a turnaround once it has turned around.","co":[]},"t12n4":{"id":"t12n4","theme":"t12","tags":"1989 One Up III","units":["oneup3"],"lead":"Boredom is expensive.","text":"Give up on a stock because nothing is happening and, all too often, things start to happen the day after you sell.","co":[]},"t12n5":{"id":"t12n5","theme":"t12","tags":"2023 Interview","units":["yahoo2023"],"lead":"Don't be a trader.","text":"Cheap commissions are no reason to trade. Buying three stocks a day and selling them on Friday is gambling, not investing.","co":[]},"t12n6":{"id":"t12n6","theme":"t12","tags":"1993 Beating the Street","units":["bts"],"lead":"Few holdings for part-timers.","text":"A part-time picker can follow eight to twelve companies, with no more than five in the portfolio at any one time.","co":[]},"t12n7":{"id":"t12n7","theme":"t12","tags":"2000 New intro","units":["oneup2000"],"lead":"Beware buying after the leap.","text":"In 2000 he warned that few dot-com buyers get the full ride, because the early gains happen before most people can buy.","co":[]},"t12n8":{"id":"t12n8","theme":"t12","tags":"1993 Beating the Street","units":["bts"],"lead":"Stocks are like children.","text":"Don't take on more than you can handle.","co":[]}},"quotes":[{"id":"q-oneup2","unit":"oneup2","label":"One Up on Wall Street, 1989","text":"The p/e ratio of any company that's fairly priced will equal its growth rate.","theme":"t7"},{"id":"q-bts","unit":"bts","label":"Beating the Street, 1993","text":"Never invest in any idea you can't illustrate with a crayon.","theme":"t9"},{"id":"q-npc1994","unit":"npc1994","label":"National Press Club, 1994","text":"the single most important thing … is to know what you own","theme":"t1"},{"id":"q-pbs1996","unit":"pbs1996","label":"PBS interview, 1996","text":"if you spend 13 minutes a year on economics, you've wasted 10 minutes.","theme":"t11"},{"id":"q-yahoo2023","unit":"yahoo2023","label":"Yahoo Finance interview, 2023, on frequent trading","text":"That's not investing. That's gambling.","theme":"t12"},{"id":"q-oneup2000","unit":"oneup2000","label":"One Up on Wall Street, introduction to the 2000 edition","text":"very few dot.com investors benefit from the full ride","theme":"t12"},{"id":"q-learn","unit":"learn","label":"Learn to Earn, 1995","text":"Capitalism happens when people make things and sell them for money.","theme":"t2"}],"mistakes":[],"tendencies":[],"plan":[{"n":1,"label":"The amateur's edge","themes":["t1"],"units":["oneup1","npc1994"],"extra":""},{"n":2,"label":"Is it gambling? Stocks and your stomach","themes":["t2"],"units":["oneup1","pbs1996"],"extra":""},{"n":3,"label":"Look in your own backyard","themes":["t3"],"units":["bts","pbs1996"],"extra":""},{"n":4,"label":"The six kinds of stock","themes":["t4"],"units":["oneup2"],"extra":"In Part 2, read the chapter on the six categories."},{"n":5,"label":"The perfect stock, and the ones to avoid","themes":["t5"],"units":["oneup2"],"extra":"In Part 2, read the chapters on the perfect stock and the stocks to avoid."},{"n":6,"label":"Earnings are the engine","themes":["t6"],"units":["bts","oneup2"],"extra":""},{"n":7,"label":"The famous numbers","themes":["t7"],"units":["oneup2","oneup2000"],"extra":"In Part 2, read the chapter on the famous numbers."},{"n":8,"label":"Balance sheet first","themes":["t8"],"units":["bts","yahoo2023","learn"],"extra":""},{"n":9,"label":"The two-minute drill","themes":["t9"],"units":["oneup2","npc1994"],"extra":"In Part 2, read the chapter on the two-minute drill."},{"n":10,"label":"Ten-baggers: let the winners run","themes":["t10"],"units":["pbs1996","oneup3"],"extra":""},{"n":11,"label":"Don't time the market","themes":["t11"],"units":["pbs1996","npc1994"],"extra":""},{"n":12,"label":"Keep checking the story","themes":["t12"],"units":["yahoo2023","oneup2000","oneup3"],"extra":""}],"selftest":["Name his six kinds of stock, and one thing you would expect from each.","Why did he think an amateur can have an edge over a professional?","What three things go into a two-minute drill?","What does a P/E equal to the growth rate tell you, in his rule of thumb?","Why did he say “the stomach is the key organ”?","What is a ten-bagger, and why do you need only a few?","Give three traits of his perfect stock, and two kinds of stock he avoided.","Why is a $3 stock not safer than a $50 one?","What did his 1965 to 1995 high-versus-low example show?","When does he say you should sell, if not when the price changes?","Why did he warn about trading just because it is cheap?","What did Buffett borrow from him for a shareholder letter, and why?"],"sourcesNote":"Only Peter Lynch's own words: his three books (written with John Rothchild), his 1994 National Press Club talk, his 1996 PBS interview and his 2023 Yahoo Finance interview. Ideas are summarised in our own words. Each source gives at most one short exact line, checked against the original text or a published copy. Magellan's record is as reported by Fidelity and repeated by Lynch; it covers his 13 years only, and fund size includes new money from investors, not just gains. The sorting game uses invented companies. Facts were checked against at least two sources.","disclaimer":["For education only. Nothing here is investment, financial, legal or tax advice, or a recommendation to buy, sell or hold any security.","The tools (sorting game, price check, checklist, ten-bagger maths) are teaching aids built from his published rules of thumb. They are not valuation models and must not be used as the basis for a decision.","Accuracy is not guaranteed and errors are possible; treat the original sources as correct. No liability is accepted for any loss arising from use of this material. Past results do not predict future ones.","Independent and unaffiliated: not endorsed by Peter Lynch, Fidelity Investments, Simon & Schuster, PBS, Yahoo or any company named. All trademarks and copyrights belong to their owners."],"big":{"timeline":[[1944,"Born, 19 January"],[1955,"Starts caddying at 11; hears golfers talk about stocks"],[1965,"Graduates from Boston College"],[1966,"Summer job at Fidelity"],[1968,"Wharton MBA (he also served two years in the Army)"],[1969,"Joins Fidelity as an analyst covering textiles and metals"],[1974,"Becomes Fidelity's director of research"],[1977,"Takes over Magellan in May, with about $18–20 million"],[1982,"Recommends Chrysler on Wall Street Week"],[1983,"Magellan passes $1 billion in April"],[1987,"The October crash, during his holiday in Ireland"],[1989,"One Up on Wall Street"],[1990,"Retires from Magellan on 31 May, at 46; the fund holds about $14 billion"],[1993,"Beating the Street"],[1994,"Talk at the National Press Club; foreword to The Warren Buffett Way"],[1995,"Learn to Earn"],[2000,"Millennium edition of One Up, with a new introduction on dot-coms"],[2023,"Interview with Yahoo Finance at 79"]],"reading":["One Up on Wall Street (1989; millennium edition 2000)","Beating the Street (1993)","Learn to Earn (1995)","Foreword to Robert Hagstrom's The Warren Buffett Way (1994)","All three of his books were written with John Rothchild"]},"about":"Only Peter Lynch's own books, his 1994 National Press Club talk, his 1996 PBS interview and his 2023 Yahoo Finance interview. Unlike Buffett and Munger, he was a public fund manager who wrote for ordinary investors, so this section is built around doing: a five-step path, hands-on tools and stories from his notebook.","handbookTitle":"Peter Lynch's books and talks: a study handbook","stages":[{"id":"ready","name":"Get ready","verb":"Know yourself","blurb":"Your edge, and whether you have the stomach for it.","themes":[1,2]},{"id":"find","name":"Find it","verb":"Look around","blurb":"Spot companies in daily life, then sort them into his six kinds.","themes":[3,4]},{"id":"check","name":"Check it","verb":"Do the homework","blurb":"Traits, earnings, the famous numbers and the balance sheet.","themes":[5,6,7,8]},{"id":"tell","name":"Tell it","verb":"Explain it","blurb":"The two-minute drill: if you can't explain it, don't own it.","themes":[9]},{"id":"own","name":"Own it","verb":"Hold and recheck","blurb":"Let winners run, ignore forecasts, and keep checking the story.","themes":[10,11,12]}],"kinds":[{"id":"slow","name":"Slow grower","band":"About as fast as the economy","expect":"Dividends, low risk, low gain","sell":"When the dividend or the business weakens"},{"id":"stalwart","name":"Stalwart","band":"Earnings up about 10–12% a year","expect":"Moderate gains; protection in recessions","sell":"After a solid rise, often 30–50%"},{"id":"fast","name":"Fast grower","band":"Earnings up about 20–25% a year","expect":"The big multi-baggers, and the biggest risks","sell":"When its room to expand runs out"},{"id":"cyclical","name":"Cyclical","band":"Profits swing with the economy","expect":"Big moves, if the timing is right","sell":"When the cycle tops out"},{"id":"turnaround","name":"Turnaround","band":"Battered, might recover","expect":"Big gains when it works; many never do","sell":"Once it has turned around"},{"id":"asset","name":"Asset play","band":"Sits on something overlooked","expect":"Gains when the market notices the asset","sell":"When the asset's value is recognised"}],"scenarios":[{"text":"A century-old electricity utility. Earnings rise about 3% a year and it has raised its dividend for decades.","ans":"slow","why":"Growth about in line with the economy, owned for the dividend."},{"text":"A giant soft-drink maker, known worldwide, growing earnings about 11% a year.","ans":"stalwart","why":"Big, steady and growing in the low teens: a classic stalwart."},{"text":"A young restaurant chain with 60 outlets in one region, adding 20 a year, earnings up 25% a year.","ans":"fast","why":"Small, aggressive and growing 20–25%, with plenty of room to expand."},{"text":"A steelmaker whose profits soared last year and collapsed in the recession before that.","ans":"cyclical","why":"Profits follow the economy up and down."},{"text":"An airline that lost money for three years, has a new boss, and has cut costs and debt.","ans":"turnaround","why":"A battered company trying to recover."},{"text":"A sleepy department store whose shares are worth less than the city-centre land it owns.","ans":"asset","why":"The land is the hidden value the market has missed."},{"text":"A carmaker whose sales jump when the economy booms and slump in recessions.","ans":"cyclical","why":"Car sales rise and fall with the economy."},{"text":"A household-products giant: toothpaste and soap, earnings up about 10% a year.","ans":"stalwart","why":"Large and dependable, growing about 10–12%."},{"text":"A railroad that dominated its region for 80 years; growth now matches the economy.","ans":"slow","why":"Once a fast grower, now mature."},{"text":"A software firm with a single hit product, growing 30% a year from a small base.","ans":"fast","why":"Rapid growth from a small base, the land of the ten-baggers."},{"text":"A firm that emerged from bankruptcy with a slimmer business and no debt.","ans":"turnaround","why":"Recovering after a near-death experience."},{"text":"A small conglomerate holding cash worth two-thirds of its share price, plus a profitable side business.","ans":"asset","why":"Cash and a business inside the business: an asset play."}],"traits":["It sounds dull, or even ridiculous","It does something dull","It does something disagreeable","It's a spinoff","Institutions don't own it and analysts don't follow it","Rumours surround it","There's something depressing about it","It's in a no-growth industry","It has a niche","People have to keep buying it","It uses technology rather than selling it","Insiders are buying its shares","The company is buying back its shares"],"avoid":["The hottest stock in the hottest industry","Touted as “the next” famous company","Profits spent on unrelated businesses (diworseification)","A whispered long shot with a great story and no earnings","An exciting name in a hot field"],"silly":[{"text":"If it's gone down this much already, it can't go much lower.","ok":false,"why":"Stocks can always fall further. He called this one of the silliest things people say."},{"text":"You can always tell when a stock has hit bottom.","ok":false,"why":"Bottom-fishing usually hooks the fisherman."},{"text":"If it's gone this high already, how can it possibly go higher?","ok":false,"why":"A growing company can keep rising; height alone tells you nothing."},{"text":"It's only $3 a share: what can I lose?","ok":false,"why":"A $3 stock can go to zero just like a $50 one."},{"text":"Eventually they always come back.","ok":false,"why":"Plenty never do; the business has to recover first."},{"text":"It's always darkest before the dawn.","ok":false,"why":"Sometimes, as he put it, it is darkest just before it goes pitch black."},{"text":"When it rebounds to what I paid, I'll sell.","ok":false,"why":"The price you paid means nothing to the stock."},{"text":"Conservative stocks don't fluctuate much, so why worry?","ok":false,"why":"Even dull, safe companies can fall hard."},{"text":"It's taking too long for anything to happen.","ok":false,"why":"Selling out of boredom often comes the day before things start to happen."},{"text":"Look at all the money I lost by not buying it!","ok":false,"why":"Money you didn't make isn't money you lost."},{"text":"I missed that one; I'll catch the next one.","ok":false,"why":"Chasing a copy of a missed winner usually means buying a worse company."},{"text":"The stock's gone up, so I must be right.","ok":false,"why":"Price isn't proof: only the business tells you whether you were right."},{"text":"Behind every stock is a company; find out what it's doing.","ok":true,"why":"Sensible: one of his own rules, in our words."},{"text":"The best stock to buy may be one you already own.","ok":true,"why":"Sensible: one of his own rules, in our words."},{"text":"When even the analysts are bored, it may be time to look.","ok":true,"why":"Sensible: one of his own rules, in our words."},{"text":"Know what you own, and why you own it.","ok":true,"why":"Sensible: one of his own rules, in our words."},{"text":"Check the balance sheet before you buy.","ok":true,"why":"Sensible: one of his own rules, in our words."},{"text":"A falling price doesn't by itself mean you were wrong.","ok":true,"why":"Sensible: one of his own rules, in our words."}],"cocktail":[["Stage one","0%","Guests drift away when he says he runs a stock fund, and talk about the weather or their dentist instead.","Nobody expects the market to rise."],["Stage two","+15%","People linger a little longer, mostly to say stocks are risky. Talk is still about anything but stocks.","The market is up from stage one, but few have noticed."],["Stage three","+30%","Guests crowd around him to ask which stocks to buy. Even the dentist wants his picks.","Most have put money in by now."],["Stage four","?","Guests crowd around again, but now to give him tips. The dentist has several.","His half-joking sign that the market may be near a top."]],"record":[["13 years","May 1977 to May 1990"],["29.2%","average a year, about double the S&P 500"],["$18M → $14B","fund size when he started and left"],["$1,000 → $28,000","what $1,000 became over his tenure"]],"magellan":[[1977,0.018,"May 1977: about $18–20 million"],[1983,1.0,"April 1983: $1 billion"],[1990,14.0,"May 1990: about $14 billion"]],"extraCards":[{"id":"kind-slow","theme":"t4","front":"Which kind of stock: about as fast as the economy?","hint":"One of his six kinds","back":"Slow grower. Expect: dividends, low risk, low gain. Sell: when the dividend or the business weakens.","kind":"Six kinds"},{"id":"kind-stalwart","theme":"t4","front":"Which kind of stock: earnings up about 10–12% a year?","hint":"One of his six kinds","back":"Stalwart. Expect: moderate gains; protection in recessions. Sell: after a solid rise, often 30–50%.","kind":"Six kinds"},{"id":"kind-fast","theme":"t4","front":"Which kind of stock: earnings up about 20–25% a year?","hint":"One of his six kinds","back":"Fast grower. Expect: the big multi-baggers, and the biggest risks. Sell: when its room to expand runs out.","kind":"Six kinds"},{"id":"kind-cyclical","theme":"t4","front":"Which kind of stock: profits swing with the economy?","hint":"One of his six kinds","back":"Cyclical. Expect: big moves, if the timing is right. Sell: when the cycle tops out.","kind":"Six kinds"},{"id":"kind-turnaround","theme":"t4","front":"Which kind of stock: battered, might recover?","hint":"One of his six kinds","back":"Turnaround. Expect: big gains when it works; many never do. Sell: once it has turned around.","kind":"Six kinds"},{"id":"kind-asset","theme":"t4","front":"Which kind of stock: sits on something overlooked?","hint":"One of his six kinds","back":"Asset play. Expect: gains when the market notices the asset. Sell: when the asset's value is recognised.","kind":"Six kinds"},{"id":"trait1","theme":"t5","front":"Trait 1 of his perfect stock?","hint":"Thirteen traits in all","back":"It sounds dull, or even ridiculous.","kind":"Perfect stock"},{"id":"trait2","theme":"t5","front":"Trait 2 of his perfect stock?","hint":"Thirteen traits in all","back":"It does something dull.","kind":"Perfect stock"},{"id":"trait3","theme":"t5","front":"Trait 3 of his perfect stock?","hint":"Thirteen traits in all","back":"It does something disagreeable.","kind":"Perfect stock"},{"id":"trait4","theme":"t5","front":"Trait 4 of his perfect stock?","hint":"Thirteen traits in all","back":"It's a spinoff.","kind":"Perfect stock"},{"id":"trait5","theme":"t5","front":"Trait 5 of his perfect stock?","hint":"Thirteen traits in all","back":"Institutions don't own it and analysts don't follow it.","kind":"Perfect stock"},{"id":"trait6","theme":"t5","front":"Trait 6 of his perfect stock?","hint":"Thirteen traits in all","back":"Rumours surround it.","kind":"Perfect stock"},{"id":"trait7","theme":"t5","front":"Trait 7 of his perfect stock?","hint":"Thirteen traits in all","back":"There's something depressing about it.","kind":"Perfect stock"},{"id":"trait8","theme":"t5","front":"Trait 8 of his perfect stock?","hint":"Thirteen traits in all","back":"It's in a no-growth industry.","kind":"Perfect stock"},{"id":"trait9","theme":"t5","front":"Trait 9 of his perfect stock?","hint":"Thirteen traits in all","back":"It has a niche.","kind":"Perfect stock"},{"id":"trait10","theme":"t5","front":"Trait 10 of his perfect stock?","hint":"Thirteen traits in all","back":"People have to keep buying it.","kind":"Perfect stock"},{"id":"trait11","theme":"t5","front":"Trait 11 of his perfect stock?","hint":"Thirteen traits in all","back":"It uses technology rather than selling it.","kind":"Perfect stock"},{"id":"trait12","theme":"t5","front":"Trait 12 of his perfect stock?","hint":"Thirteen traits in all","back":"Insiders are buying its shares.","kind":"Perfect stock"},{"id":"trait13","theme":"t5","front":"Trait 13 of his perfect stock?","hint":"Thirteen traits in all","back":"The company is buying back its shares.","kind":"Perfect stock"},{"id":"silly0","theme":"t12","front":"“If it's gone down this much already, it can't go much lower.”","hint":"Silly or sensible, and why?","back":"Silly. Stocks can always fall further. He called this one of the silliest things people say.","kind":"Silly saying"},{"id":"silly1","theme":"t12","front":"“You can always tell when a stock has hit bottom.”","hint":"Silly or sensible, and why?","back":"Silly. Bottom-fishing usually hooks the fisherman.","kind":"Silly saying"},{"id":"silly2","theme":"t12","front":"“If it's gone this high already, how can it possibly go higher?”","hint":"Silly or sensible, and why?","back":"Silly. A growing company can keep rising; height alone tells you nothing.","kind":"Silly saying"},{"id":"silly3","theme":"t12","front":"“It's only $3 a share: what can I lose?”","hint":"Silly or sensible, and why?","back":"Silly. A $3 stock can go to zero just like a $50 one.","kind":"Silly saying"},{"id":"silly4","theme":"t12","front":"“Eventually they always come back.”","hint":"Silly or sensible, and why?","back":"Silly. Plenty never do; the business has to recover first.","kind":"Silly saying"},{"id":"silly5","theme":"t12","front":"“It's always darkest before the dawn.”","hint":"Silly or sensible, and why?","back":"Silly. Sometimes, as he put it, it is darkest just before it goes pitch black.","kind":"Silly saying"},{"id":"silly6","theme":"t12","front":"“When it rebounds to what I paid, I'll sell.”","hint":"Silly or sensible, and why?","back":"Silly. The price you paid means nothing to the stock.","kind":"Silly saying"},{"id":"silly7","theme":"t12","front":"“Conservative stocks don't fluctuate much, so why worry?”","hint":"Silly or sensible, and why?","back":"Silly. Even dull, safe companies can fall hard.","kind":"Silly saying"},{"id":"silly8","theme":"t12","front":"“It's taking too long for anything to happen.”","hint":"Silly or sensible, and why?","back":"Silly. Selling out of boredom often comes the day before things start to happen.","kind":"Silly saying"},{"id":"silly9","theme":"t12","front":"“Look at all the money I lost by not buying it!”","hint":"Silly or sensible, and why?","back":"Silly. Money you didn't make isn't money you lost.","kind":"Silly saying"},{"id":"silly10","theme":"t12","front":"“I missed that one; I'll catch the next one.”","hint":"Silly or sensible, and why?","back":"Silly. Chasing a copy of a missed winner usually means buying a worse company.","kind":"Silly saying"},{"id":"silly11","theme":"t12","front":"“The stock's gone up, so I must be right.”","hint":"Silly or sensible, and why?","back":"Silly. Price isn't proof: only the business tells you whether you were right.","kind":"Silly saying"}]}},"checklistSeed":["Has anything changed in the business, or only in the price?","Would I make this trade if the market were closed for the next three years?","Is this inside my circle? Can I state the moat in two sentences?","What is my range of value, and where is today's price within it?","What will tax and costs take out of this trade, in money terms?","What will I own instead, and is it clearly better after those costs?","Am I acting because I am bored, anxious, or reacting to someone else's gain?","Have I slept on it for at least a week?"],"journey":{"asOf":"13 Nov 2026","hero":{"title":"Thirteen years, two teachers","sub":"I built this library. This is my own record as an investor, shown only in percentages: where I followed Buffett and Munger, where I didn't, and what each choice cost or earned.","stats":[["24.1%","a year, Jul 2013 to Nov 2026"],["−40%","my worst fall, 2021 to 2025"],["4 of 11","full years I beat my yardstick fund"],["35%","of all I earned went on living costs"]]},"story":["In 2015 I left my job. Since then this portfolio has paid my living costs.","For ten years, 2015 to 2024, I earned 10.6% a year. The diversified fund I use as my yardstick earned 18.3%. Berkshire's share price earned 11.7%, in dollars.","By my own rule, I should have handed my money to that fund in 2020. I didn't.","From the 2021 high my portfolio fell 40% on returns alone, and took almost four years to recover.","Then one winner I let run changed the picture: up 64% in 2025 and 100% so far in 2026.","Today one stock is about 69% of my portfolio. That breaks my own rules, and it is my biggest risk."],"falls":[["Berkshire, 1973 to 1975",-59.1,"buffett"],["Berkshire, October 1987",-37.1,"buffett"],["Berkshire, 1998 to 2000",-48.9,"buffett"],["Berkshire, 2008 to 2009",-50.7,"buffett"],["Munger's partnership, 1973 to 1974",-53.4,"munger"],["My portfolio, 2021 to 2025",-40.1,"journey"]],"fallsNote":"Berkshire's falls are in its share price, from Buffett's 2017 letter. Munger's partnership fell 31.9% in 1973 and 31.5% in 1974, about 53% over the two years. Mine is the fall in my returns, leaving out money I took out; counting withdrawals, the portfolio's value fell 48%.","score":[["Me, whole career (cash-flow based)","Jul 2013 to Nov 2026","24.1%","journey"],["Me","2015 to 2024","10.6%","journey"],["My yardstick fund","2015 to 2024","18.3%","fund"],["Berkshire share price (US$)","2015 to 2024","11.7%","buffett"],["S&P 500 with dividends (US$)","2015 to 2024","13.1%","index"],["Berkshire share price (US$)","1965 to 2024","19.9%","buffett"],["Munger's partnership (US$, before fees)","1962 to 1975","19.8%","munger"]],"caveats":["Not a fair race. The currencies, sizes, eras and lengths differ. Munger's record runs 14 years and Berkshire's 60; mine is 13.","My figures are worked out from my own records. They are unaudited and before tax. Years before 2020 rest on year-end values, so they are rougher.","My whole-career figure counts the timing of money in and out (XIRR). The yearly figures are time-weighted, so money I took out does not count against them.","Over 2015 to 2024 even Berkshire's share price trailed the S&P 500. Most of my lead today comes from one stock, in 2025 and 2026."],"years":[[2015,31.7,9.5,false],[2016,-8.5,4.11,false],[2017,45.8,30.47,false],[2018,0.6,0.22,false],[2019,-6.9,14.93,false],[2020,46.6,33.28,true],[2021,38.7,46.76,false],[2022,-29.6,-6.29,false],[2023,23.9,37.92,false],[2024,-6.4,24.43,false],[2025,64.2,8.22,false],[2026,99.8,-0.65,false]],"first":"Jul 2013 to Dec 2014 (17 months): +98.0%. No yardstick figure for this stretch.","growth":[["2014",1,1],["2015",1.32,1.09],["2016",1.21,1.14],["2017",1.76,1.49],["2018",1.77,1.49],["2019",1.65,1.71],["2020",2.41,2.28],["2021",3.35,3.35],["2022",2.36,3.14],["2023",2.92,4.33],["2024",2.73,5.39],["2025",4.49,5.83],["Nov 2026",8.96,5.79]],"rule12":[["2017",20,14,"ahead"],["2018",10,11,"behind"],["2019",13,15,"behind"],["2020",11,15,"behind"],["2021",24,31,"behind"],["2022",16,22,"behind"],["2023",6,24,"behind"],["2024",-8,17,"behind"],["2025",23,23,"level"],["Nov 2026",46,11,"ahead"]],"facts":[["Whole career, cash-flow based","24.1% a year, Jul 2013 to Nov 2026"],["Since the April 2020 rebuild","31.8% a year"],["Best 12 months","+114.7%, to Nov 2026"],["Worst fall","−40% on returns alone; −48% in value, counting withdrawals"],["Time below the old high","47 months on returns alone; 57 in value"],["Value today plus all I took out","7.1 times the money I put in"],["Share of all earnings spent on living costs","35%"],["Stocks owned since 2020 that made money","74 of 101; gains were 8.6 times the losses"]],"lessons":[{"id":"drift","y":[2016,2019],"kind":"broke","title":"Four years that went nowhere","facts":["My returns: −8.5%, +45.8%, +0.6%, −6.9%. The fund: +4.1%, +30.5%, +0.2%, +14.9%.","In three of those years my living costs took more out than the portfolio made.","My own rule says: if my three-year return trails the fund three times in a row, hand the money to the fund. That happened at the end of 2020, and the run lasted seven windows. I didn't hand over."],"rule":{"who":"Buffett","text":"Most investors do better in a low-cost index fund than by picking stocks, and fees and activity eat returns.","pack":"buffett","theme":"t5","quote":"q2017"},"now":"I check the rule every year, and I publish it here so I can't quietly forget it.","links":[["buffett","t5"]]},{"id":"covid","y":[2020,2020],"kind":"kept","title":"Buying when others froze","facts":["I had sold down as the market fell in February and March 2020. Straight after the crash, I put almost all of the portfolio back into stocks over three days, 7 to 9 April.","2020 ended +46.6% against the fund's +33.3% (my figure is rough: there is a gap in my records from January to March)."],"rule":{"who":"Buffett","text":"Be greedy when others are fearful.","pack":"buffett","theme":"t4","quote":"q2004"},"now":"The decision my whole record rests on. When everyone freezes, I look harder, not away.","links":[["buffett","t4"],["munger","t13"]]},{"id":"churn","y":[2020,2023],"kind":"broke","title":"Trading far too much","facts":["From April 2020 to March 2023 I traded five to seven times the portfolio's value every year. My own limit is twice.","Brokerage and trading taxes since 2020 have cost about 4% of everything the portfolio earned."],"rule":{"who":"Buffett","text":"For investors as a whole, the more they move, the less they keep.","pack":"buffett","theme":"t5","quote":"q2005"},"now":"Trading at most twice the portfolio's value a year.","links":[["buffett","t5"],["munger","t11"]]},{"id":"circle","y":[2021,2022],"kind":"broke","title":"Buying a story outside my circle","facts":["In 2021 I bought a basket of hyped new listings. It was a story, not my lane of small, clean, little-followed companies.","Two of them lost money while I held them, at −19% and −83% a year."],"rule":{"who":"Buffett and Munger","text":"Stay inside your circle of competence; the edge matters more than the size.","pack":"buffett","theme":"t7","quote":"q1996"},"now":"Only companies in my lane, and a written reason for each one.","links":[["buffett","t7"],["munger","t8"],["lynch","t3"]]},{"id":"euphoria","y":[2021,2021],"kind":"kept","title":"Selling into the frenzy","facts":["In December 2021 I sold a big winner near the peak of the excitement. It had earned about 65% a year while I held it."],"rule":{"who":"Buffett","text":"A price that makes sense at one level stops making sense at another.","pack":"buffett","theme":"t3","quote":"q2016"},"now":"I write my selling zone down before I buy, so the crowd can't set it for me.","links":[["buffett","t3"],["buffett","t4"]]},{"id":"stuck","y":[2021,2025],"kind":"broke","title":"Holding on, and adding, while it stalled","facts":["For four years one stock was often more than half of my portfolio, at times 76%.","I kept adding as it fell. Over its whole life it earned about 4% a year. The fund earned about 15% a year over 2022 to 2025."],"rule":{"who":"Munger","text":"Our minds hate to change a conclusion once made, and we deny what hurts. He named these tendencies so we can catch them.","pack":"munger","theme":"t4","quote":null},"now":"A big position that stalls gets 18 months, then I change boats. I never average down on a falling thesis.","links":[["munger","t4"],["buffett","t13"],["lynch","t12"]]},{"id":"buffer","y":[2022,2023],"kind":"broke","title":"No cash cushion in a bad market","facts":["My living costs took about 7% of the portfolio in 2022 and 11% in 2023, sold near the lows.","The portfolio's value fell 48% from its September 2021 high, counting withdrawals; 40% on returns alone."],"rule":{"who":"Buffett","text":"Never put yourself where you can be forced to sell.","pack":"buffett","theme":"t6","quote":"q2023"},"now":"Keep two years of spending outside stocks, so I am never a forced seller.","links":[["buffett","t6"],["lynch","t2"]]},{"id":"nerve","y":[2023,2025],"kind":"kept","title":"Not giving up at the bottom","facts":["Down almost half from the high, I did not sell out.","I also stopped churning: trading fell from 5.5 times the portfolio a year to about 0.5 times.","It took 47 months on returns alone to get back above the old high."],"rule":{"who":"Munger","text":"Setbacks will come, some of them unfair; what you do next decides the result.","pack":"munger","theme":"t13","quote":null},"now":"When I'm down, I read more and trade less.","links":[["munger","t13"],["buffett","t4"]]},{"id":"winner","y":[2025,2026],"kind":"kept","title":"Letting a winner run","facts":["2025: +64.2% against the fund's +8.2%. 2026 so far: +99.8% against −0.6%.","One stock earned about 250% a year while I held it, and made about 44% of everything the portfolio earned since 2020."],"rule":{"who":"Buffett","text":"Mistakes fade; a few winners can keep growing for a very long time.","pack":"buffett","theme":"t13","quote":"q2024"},"now":"Sit when the thesis holds. The money is made by waiting.","links":[["buffett","t14"],["munger","t9"],["lynch","t10"]]},{"id":"churn2","y":[2025,2026],"kind":"broke","title":"The old trading habit came back","facts":["In the year to March 2026 I traded 3.1 times the portfolio, and this year is on pace for 2.8 times. My limit is twice."],"rule":{"who":"Buffett","text":"Activity is a cost, even when it feels like work.","pack":"buffett","theme":"t5","quote":null},"now":"Same limit, checked every month.","links":[["buffett","t5"],["lynch","t12"]]},{"id":"borrow","y":[2025,2026],"kind":"risk","title":"Borrowing to buy more","facts":["From September 2025 I borrowed money to add to stocks.","So far the borrowed money has grown about 63%, against interest of about 6% of it. But at one point it was 11% under water, and the repayments can only come from selling stock.","In a fall like 2022 I would be a forced seller."],"rule":{"who":"Buffett","text":"Credit is easy to get until the day it vanishes, and that is the day you need it.","pack":"buffett","theme":"t6","quote":"q2010"},"now":"Pay it down. No new borrowing to buy stocks.","links":[["buffett","t6"]]},{"id":"concentration","y":[2026,2026],"kind":"risk","title":"One stock is 69% of my portfolio","facts":["My top holding is about 69% of the portfolio and the top two about 98%.","My own rules say at most 30 to 35% in one idea and 60 to 65% in the top two."],"rule":{"who":"Munger, and Buffett","text":"Munger argued that a few great holdings can be rational. Buffett's first rule is never to risk a permanent loss. Both apply here, and they pull in opposite directions.","pack":"munger","theme":"t9","quote":"q-foundations1998"},"now":"Bring it back inside my limits, in steps, without selling in a panic.","links":[["munger","t9"],["buffett","t6"]]},{"id":"losers","y":[2020,2026],"kind":"kept","whole":true,"title":"Cutting losers early","facts":["Of 101 stocks I owned since 2020, 74 made money. Gains were 8.6 times the losses."],"rule":{"who":"My own rule","text":"Cut a loser within 45 days. This one is mine, not theirs.","pack":null,"theme":null,"quote":null},"now":"Keep cutting losers fast, and let the winners do the work.","links":[]}],"rulesNow":["Own 4 to 7 stocks, only in my lane: small, governance-clean, little-followed companies.","An unproven idea gets at most 30 to 35% of the portfolio; the top two at most 60 to 65%.","Trade at most twice the portfolio's value in a year.","Cut losers within 45 days. Nothing stuck for more than 18 months.","Sell at a price zone written down in advance, based on how big the business can get, never on the P/E alone.","Add when the thesis is confirmed. Never average down on a falling thesis.","Before every buy, check that the company's market value makes sense.","At results, try to prove the thesis wrong, not just judge the quarter.","Before every buy, a pre-mortem: if this halves in 18 months, what broke?","No new buying in a year when I'm in a big drawdown. Big decisions get a second opinion.","Check every number that matters, including the ones a computer gives me.","If my three-year return trails my yardstick fund three times in a row, hand the money to the fund.","Never be a forced seller: keep two years of spending outside stocks."],"rulesNote":"Two of these I am breaking right now: the size limits and the trading limit.","method":["Source: my own records up to the 13 Nov 2026 close. Percentages only, by choice: no amounts, no stock names.","Yearly returns are time-weighted (Modified Dietz, monthly from April 2020; yearly before that). The whole-career figure is cash-flow based (XIRR).","Yardstick: a widely held diversified equity fund, direct plan, growth option, calendar-year returns from two public sources.","Berkshire and the S&P 500: Buffett's 2024 letter. Berkshire's falls: his 2017 letter. Munger's partnership: Buffett's 1984 essay “The Superinvestors of Graham-and-Doddsville”."],"disclaimer":["This is a personal record, shared only for education. It is not investment, financial, legal or tax advice, and not a recommendation to buy, sell or hold anything.","The figures are self-reported, unaudited and before tax, and may contain errors. Past returns do not predict future ones.","Concentration and borrowing, both shown here, can cause large and permanent losses. They are described as risks, not suggestions.","Independent; not affiliated with or endorsed by Berkshire Hathaway, Warren Buffett, the Munger family or any fund or company. All trademarks belong to their owners."]},"timeline":{"start":1924,"end":2026,"asOf":"21 November 2026","people":[{"id":"M","name":"Charlie Munger","short":"Munger","by":1924,"bm":1,"bd":1,"died":[2023,11,28],"place":"Omaha, Nebraska","line":"Lawyer turned investor; Buffett's partner and Berkshire's vice chairman for 45 years."},{"id":"B","name":"Warren Buffett","short":"Buffett","by":1930,"bm":8,"bd":30,"died":null,"place":"Omaha, Nebraska","line":"Ran a partnership, then turned a failing textile mill into Berkshire Hathaway."},{"id":"L","name":"Peter Lynch","short":"Lynch","by":1944,"bm":1,"bd":19,"died":null,"place":"Newton, Massachusetts","line":"Caddie turned fund manager; ran Fidelity Magellan from 1977 to 1990."}],"stages":{"M":[{"a":1924,"b":1941,"l":"Omaha boyhood","d":"Grows up in Omaha, the son of a lawyer and grandson of a federal judge. As a teenager he works at Buffett & Son, the grocery owned by Warren Buffett's grandfather."},{"a":1941,"b":1943,"l":"Michigan","d":"Studies mathematics at the University of Michigan, then leaves a few days after his 19th birthday to join the war effort."},{"a":1943,"b":1946,"l":"Army Air Corps","d":"Trains as a weather forecaster, including at Caltech in Pasadena, and serves in Nome, Alaska."},{"a":1946,"b":1948,"l":"Harvard Law","d":"Admitted without a college degree; graduates magna cum laude, one of 12 in a class of 335."},{"a":1948,"b":1962,"l":"LA lawyer","d":"Practises law in Los Angeles. A hard decade at home: a divorce in 1953 and the death of his young son."},{"a":1962,"b":1978,"l":"Own firm + fund","d":"Founds the law firm now called Munger, Tolles & Olson and runs his partnership, Wheeler, Munger & Co. (1962-75). Stops practising law in 1965."},{"a":1978,"b":2023,"l":"Berkshire vice chair","d":"Buffett's partner for 45 years. Also chairs Wesco Financial (1984-2011) and Daily Journal (1977-2022) and sits on Costco's board from 1997."}],"B":[{"a":1930,"b":1942,"l":"Omaha boyhood","d":"Grows up in Omaha in the Depression, selling gum, Coke and magazines and reading every money book he can find."},{"a":1943,"b":1947,"l":"Teen in D.C.","d":"His father is in Congress, so the family lives in Washington. Paper routes, a pinball business and a small farm."},{"a":1947,"b":1950,"l":"Wharton, Nebraska","d":"Two years at Wharton, then a business degree from the University of Nebraska at 19."},{"a":1950,"b":1951,"l":"Columbia","d":"Studies under Benjamin Graham and David Dodd at Columbia Business School."},{"a":1951,"b":1954,"l":"Omaha broker","d":"Sells securities at his father's firm, Buffett-Falk & Co."},{"a":1954,"b":1956,"l":"Graham-Newman","d":"Works for Graham in New York until Graham retires."},{"a":1956,"b":1969,"l":"Partnership","d":"Runs the Buffett partnerships from Omaha: 29.5% a year before fees, against 7.4% for the Dow."},{"a":1970,"b":2025,"l":"Berkshire chair + CEO","d":"Chairman from 1970 (in control since 1965) and chief executive until the end of 2025."},{"a":2026,"b":2026,"l":"Chair, then emeritus","d":"Chairman while Greg Abel is CEO; chairman emeritus from September 2026."}],"L":[{"a":1944,"b":1961,"l":"Newton boyhood","d":"Grows up near Boston. His father dies when he is 10; from 11 he caddies at Brae Burn Country Club."},{"a":1961,"b":1965,"l":"Boston College","d":"On a caddie scholarship. Studies history, psychology and philosophy rather than business."},{"a":1966,"b":1969,"l":"Wharton + Army","d":"Fidelity summer intern (1966), Wharton MBA (1968), then two years in the Army, in Texas and Korea."},{"a":1969,"b":1977,"l":"Fidelity analyst","d":"Covers textiles, metals, mining and chemicals; director of research from 1974."},{"a":1977,"b":1990,"l":"Magellan","d":"Runs Fidelity Magellan from May 1977 to May 1990: about 29% a year, $18 million to $14 billion."},{"a":1990,"b":2026,"l":"Vice chair, author","d":"Vice chairman of Fidelity Management & Research, author of three books and a major giver in Boston."}]},"presidents":[{"a":[1923,8],"b":[1929,3],"n":"Calvin Coolidge","s":"Coolidge"},{"a":[1929,3],"b":[1933,3],"n":"Herbert Hoover","s":"Hoover"},{"a":[1933,3],"b":[1945,4],"n":"Franklin D. Roosevelt","s":"FDR"},{"a":[1945,4],"b":[1953,1],"n":"Harry S. Truman","s":"Truman"},{"a":[1953,1]
