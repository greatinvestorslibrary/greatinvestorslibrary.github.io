<style>
/* Mobile-first. One column, vertical scrolling only. Bottom tab bar on phones, top tabs on wide screens.
   Soft colour coding: mint = progress, lemon = their exact words and treasures, sky = questions to you, peach = your own notes, grey = reference. */
:root{
  --paper:#fbfbf7; --card:#ffffff; --ink:#1c2420; --muted:#5b6861; --rule:#e2e6df; --line-soft:rgba(0,0,0,.07);
  --accent:#1f5a3d; --on-accent:#ffffff; --accent-soft:#e4f1e8; --due:#a33b2b;
  --mint:#e6f4eb; --mint-ink:#1d5a3a;
  --lemon:#fff9da; --lemon-2:#fffcec; --lemon-line:#ecd977; --lemon-ink:#6a5300; --quote:#3b3210;
  --grey:#f2f3f0; --grey-2:#e9ebe6;
  --sky:#eaf3fc; --sky-line:#c5dcf2; --sky-ink:#1d4f7c;
  --peach:#fdf1e7; --peach-line:#f0cdb0; --peach-ink:#8a4a1c;
  --lilac:#f1edfa; --lilac-ink:#55408a;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111513; --card:#181e1b; --ink:#e7ece9; --muted:#9ba9a1; --rule:#2a332e; --line-soft:rgba(255,255,255,.08);
    --accent:#7cc39c; --on-accent:#0e2418; --accent-soft:#1c2b23; --due:#ef8a78;
    --mint:#1a2a21; --mint-ink:#9fd8b6; --lemon:#25220f; --lemon-2:#1d1b10; --lemon-line:#57501f; --lemon-ink:#ecd77a; --quote:#f1e4a6;
    --grey:#1c211e; --grey-2:#232a26; --sky:#15212c; --sky-line:#2a4157; --sky-ink:#9cc8f0;
    --peach:#2a1e16; --peach-line:#4f3726; --peach-ink:#f1b78c; --lilac:#211c2c; --lilac-ink:#c5b2f0; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111513; --card:#181e1b; --ink:#e7ece9; --muted:#9ba9a1; --rule:#2a332e; --line-soft:rgba(255,255,255,.08);
  --accent:#7cc39c; --on-accent:#0e2418; --accent-soft:#1c2b23; --due:#ef8a78;
  --mint:#1a2a21; --mint-ink:#9fd8b6; --lemon:#25220f; --lemon-2:#1d1b10; --lemon-line:#57501f; --lemon-ink:#ecd77a; --quote:#f1e4a6;
  --grey:#1c211e; --grey-2:#232a26; --sky:#15212c; --sky-line:#2a4157; --sky-ink:#9cc8f0;
  --peach:#2a1e16; --peach-line:#4f3726; --peach-ink:#f1b78c; --lilac:#211c2c; --lilac-ink:#c5b2f0; color-scheme: dark;
}
*{box-sizing:border-box}
html{font-size:calc(100% * var(--scale,1));-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
html,body{margin:0;max-width:100%}
body{overflow-x:hidden;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent}
img,svg,video,canvas,table,pre,iframe{max-width:100%}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---- header ---- */
header.top{background:var(--paper)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 4px;max-width:760px;margin:0 auto}
.brand h1{font-family:var(--display);font-weight:600;font-size:1.22rem;margin:0;line-height:1.2}
.home-link{text-decoration:none;color:inherit;min-width:0}
.save{font-size:.7rem;color:var(--muted);text-align:right;line-height:1.25;max-width:42%}
.switch{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;max-width:760px;margin:0 auto;padding:6px 16px 2px}
.switch a{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:12px;background:var(--grey);border:1px solid var(--rule);color:var(--ink);font-weight:600;font-size:.92rem;text-decoration:none;text-align:center;line-height:1.15;padding:2px 4px}
.switch a.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.switch a.soon{background:none;border-style:dashed;color:var(--muted);font-weight:500;font-size:.76rem;pointer-events:none}
.sub{max-width:760px;margin:0 auto;padding:4px 16px 6px;font-size:.76rem;color:var(--muted)}

/* ---- bottom tab bar (phones) ---- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--card);border-top:1px solid var(--rule);padding:4px 4px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(0,0,0,.07)}
nav.tabs a,nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:54px;min-width:0;background:none;border:0;border-radius:12px;color:var(--muted);font-size:.66rem;font-weight:600;text-decoration:none;cursor:pointer;padding:4px 0}
nav.tabs span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs svg circle{fill:currentColor;stroke:none}
nav.tabs .on{color:var(--accent);background:var(--accent-soft)}
main{max-width:760px;margin:0 auto;padding:10px 16px 28px}
footer{max-width:760px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom));font-size:.76rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-size:.86rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (min-width:760px){
  header.top{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--rule)}
  .switch{grid-template-columns:repeat(3,minmax(0,170px))}
  nav.tabs{position:static;display:flex;flex-wrap:wrap;gap:4px;max-width:760px;margin:0 auto;padding:6px 16px 10px;background:none;border:0;box-shadow:none}
  nav.tabs a,nav.tabs button{flex-direction:row;gap:6px;min-height:38px;padding:6px 14px;font-size:.88rem;border-radius:999px}
  nav.tabs svg{width:18px;height:18px}
  footer{padding-bottom:40px}
  .toast{bottom:20px}
}

/* ---- the More sheet ---- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card);border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto;overscroll-behavior:contain;box-shadow:0 -10px 30px rgba(0,0,0,.2);animation:sheetUp .22s ease both}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--rule);margin:2px auto 8px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:1.05rem}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
.setrow .row{gap:6px}
body.sheet-open{overflow:hidden}
@media (min-width:760px){ .sheet{left:50%;right:auto;bottom:auto;top:10vh;width:520px;margin-left:-260px;border-radius:18px;animation:fd .2s ease both} }

/* ---- type ---- */
h2{font-family:var(--display);font-weight:600;font-size:1.6rem;line-height:1.2;margin:.15em 0 .35em}
h3{font-family:var(--display);font-weight:600;font-size:1.2rem;line-height:1.3;margin:1.5em 0 .55em}
.lede{font-family:var(--display);font-style:italic;font-size:1.1rem;line-height:1.5;color:var(--muted);margin:0 0 1em}
.eyebrow{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-top:4px}
p{margin:.5em 0}
.muted{color:var(--muted)} .small{font-size:.86rem} .note{font-size:.82rem;color:var(--muted)}
.d{display:block}
.back{display:inline-block;font-size:.85rem;text-decoration:none;padding:6px 0;font-weight:600}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 7px;border-radius:999px;background:var(--mint);color:var(--mint-ink);font-family:var(--body);font-size:.74rem;font-weight:700;vertical-align:3px;margin-left:4px}
mark{background:var(--lemon-line);color:inherit;padding:0 2px;border-radius:2px}

/* ---- lists ---- */
ul.bl,ul.ticks,ul.todo{list-style:none;padding:0;margin:6px 0 10px;display:grid;gap:7px}
ul.bl li{position:relative;padding-left:20px}
ul.bl li::before{content:"";position:absolute;left:4px;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--accent)}
ul.ticks li{position:relative;padding-left:26px}
ul.ticks li::before{content:"✓";position:absolute;left:2px;top:0;color:var(--accent);font-weight:700}
ul.todo{counter-reset:td;gap:10px}
ul.todo li{position:relative;padding-left:34px;counter-increment:td}
ul.todo li::before{content:counter(td);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--card);border:1px solid var(--accent);color:var(--accent);font-size:.78rem;font-weight:700;display:grid;place-items:center}

/* ---- cards and colour boxes ---- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:14px 16px;margin:10px 0}
.card.mint{background:var(--mint);border-color:transparent}
.card.lemon{background:var(--lemon);border-color:var(--lemon-line)}
.card.sky{background:var(--sky);border-color:var(--sky-line)}
.card.grey{background:var(--grey);border-color:transparent}
.box-h{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.card.mint .box-h{color:var(--mint-ink)}
.hero{background:linear-gradient(150deg,var(--mint) 0%,var(--lemon) 100%);border-radius:20px;padding:18px 16px 16px;margin:6px 0 14px}
.hero h2{margin-top:0;font-size:1.55rem}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}

/* ---- buttons and chips ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:12px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:.92rem;text-decoration:none;text-align:center;line-height:1.25}
.btn.ghost{background:var(--card);color:var(--accent)}
.btn.big{width:100%;margin-top:16px;min-height:50px;font-size:1rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.row .btn{flex:1 1 auto}
.ab{display:inline-flex;align-items:center;gap:4px;min-height:36px;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.ab.on{background:var(--lemon);border-color:var(--lemon-line);color:var(--lemon-ink)}
.chip{display:inline-flex;align-items:center;min-height:28px;font-size:.76rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--mint);color:var(--mint-ink);text-decoration:none;margin:2px 4px 2px 0;line-height:1.2}
.chip.ok{background:var(--accent);color:var(--on-accent)}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--grey-2);color:var(--muted);text-decoration:none;white-space:nowrap}
.pill.done{background:var(--accent);color:var(--on-accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips button{min-height:40px;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.86rem;font-weight:600}
.chips button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tag{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;vertical-align:1px;white-space:nowrap}
.tag.syn{background:var(--mint);color:var(--mint-ink)}
.tag.wb{background:var(--lemon-line);color:var(--quote)}
.tag.mine{background:var(--peach);color:var(--peach-ink);border:1px solid var(--peach-line)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:.76rem;color:var(--muted);margin:4px 0 10px}
.legend span:not(.tag){margin-right:8px}

/* ---- ideas list ---- */
ul.ideas{list-style:none;margin:8px 0;padding:0;background:var(--card);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
ul.ideas li{position:relative;padding:12px 14px 10px 32px;border-top:1px solid var(--rule)}
ul.ideas li:first-child{border-top:0}
ul.ideas li:nth-child(even){background:var(--lemon-2)}
ul.ideas li::before{content:"";position:absolute;left:14px;top:1.18em;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.itx b{font-weight:600}
.imeta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 8px;margin-top:8px}
.iact{display:flex;gap:6px;margin-left:auto}

/* ---- quotes ---- */
blockquote.q{margin:12px 0;padding:14px 16px 12px;background:var(--lemon);border:1px solid var(--lemon-line);border-left:6px solid var(--lemon-line);border-radius:14px;font-family:var(--display);font-size:1.18rem;font-style:italic;line-height:1.45;color:var(--quote)}
blockquote.q cite{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--body);font-style:normal;font-size:.76rem;color:var(--muted);margin-top:10px}
blockquote.q cite a{font-weight:600}

/* ---- your turn: questions (sky) and notes (peach) ---- */
.ask{background:var(--sky);border:1px solid var(--sky-line);border-radius:16px;padding:12px 14px 6px;margin:10px 0}
.ask .box-h{color:var(--sky-ink)}
.minebox{background:var(--peach);border:1px solid var(--peach-line);border-radius:16px;padding:12px 14px 6px;margin:10px 0}
.minebox .box-h{color:var(--peach-ink)}
details.nb{border-top:1px solid var(--line-soft);padding:8px 0}
details.nb:first-of-type{border-top:0}
details.nb summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;min-height:40px}
details.nb summary::-webkit-details-marker{display:none}
.nbq{font-size:.95rem;font-weight:500;padding-top:4px}
.nbh{font-size:.76rem;font-weight:700;color:var(--accent);background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;white-space:nowrap}
details.nb textarea{margin-top:8px}
textarea,input[type=text],input[type=search],input[type=date],select{width:100%;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;font-size:1rem;min-height:44px}
textarea{min-height:96px;resize:vertical;line-height:1.45}
label.lbl{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:12px 0 4px}

/* ---- tables (fit the screen; 3+ columns stack on phones) ---- */
.tw{background:var(--card);border:1px solid var(--rule);border-radius:16px;overflow:hidden;margin:10px 0}
table.t{border-collapse:collapse;width:100%;font-size:.92rem}
table.t th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--grey-2);padding:9px 10px;font-weight:700}
table.t td{padding:10px;vertical-align:top;border-top:1px solid var(--rule);overflow-wrap:anywhere}
table.t tbody tr:nth-child(even) td{background:var(--lemon-2)}
table.t tr.now td{background:var(--mint)!important}
table.t ul.bl{margin:0;gap:4px}
table.kv th[scope=row]{width:32%;text-transform:none;letter-spacing:0;font-size:.8rem;color:var(--muted);background:var(--grey);border-top:1px solid var(--rule);vertical-align:top;padding:10px}
table.kv tr:first-child th,table.kv tr:first-child td{border-top:0}
table.gloss td:first-child{width:36%}
table.plan td:first-child,table.tl td:first-child{width:46px;white-space:nowrap}
table.plan td:last-child{width:64px;text-align:right}
table.units td:first-child{width:34%}
table.boxes td{text-align:left}
@media (max-width:600px){
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tr{border-top:1px solid var(--rule);padding:8px 0}
  table.stack tbody tr:first-child{border-top:0}
  table.stack tbody tr:nth-child(even){background:var(--lemon-2)}
  table.stack td,table.stack tbody tr:nth-child(even) td{border:0;padding:3px 14px;background:none}
  table.stack td::before{content:attr(data-label);display:block;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  table.stack td.lead::before{display:none}
  table.stack td.lead{padding-top:6px}
}

/* ---- library ---- */
.gem{background:var(--lemon);border:1px solid var(--lemon-line);border-radius:20px;padding:18px 16px;text-align:center;margin:12px 0}
.gem h3{margin:.2em 0 .2em}
.gem .chest{width:54px;height:54px;margin:0 auto;border-radius:16px;background:var(--card);border:1px solid var(--lemon-line);display:grid;place-items:center;font-size:1.6rem;color:var(--lemon-ink);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{transform:translateY(-3px)}}
.gem .btn{margin-top:8px}
.gem.open{text-align:left;animation:pop .35s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.gem-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gem-tx{font-size:1.05rem}
.invs{display:grid;gap:10px}
.inv{display:grid;grid-template-columns:50px 1fr;gap:12px;align-items:start;padding:14px;border:1px solid var(--rule);border-radius:16px;background:var(--card);text-decoration:none;color:inherit}
.inv .av{width:50px;height:50px;border-radius:50%;background:var(--mint);color:var(--mint-ink);display:grid;place-items:center;font-family:var(--display);font-size:1.25rem;font-weight:600}
.inv:nth-child(2) .av{background:var(--lemon);color:var(--lemon-ink)}
.inv-b{display:grid;gap:4px;min-width:0}
.inv-n{font-family:var(--display);font-size:1.2rem;font-weight:600;line-height:1.2}
.inv-k{display:flex;flex-wrap:wrap;gap:4px}
.inv-k span{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--grey-2);color:var(--muted)}
.inv.soon{opacity:.7;border-style:dashed}
.inv-b .pill{justify-self:start}
.who{background:var(--sky);border:1px solid var(--sky-line);border-radius:20px;padding:16px;margin:14px 0}
.who .box-h{color:var(--sky-ink)}
.who-q{font-family:var(--display);font-style:italic;font-size:1.2rem;line-height:1.45;margin:6px 0 8px}
.who .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who .opts button{min-height:48px;border-radius:12px;border:1px solid var(--sky-line);background:var(--card);font-weight:700;font-size:.95rem;cursor:pointer}
.who .opts button.right{background:var(--mint);border-color:var(--accent);color:var(--mint-ink)}
.who .opts button.wrong{background:var(--peach);border-color:var(--peach-line);color:var(--peach-ink)}
.who .opts button:disabled{cursor:default}
.who-a{font-weight:600;margin-top:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;gap:10px;align-items:center;min-height:62px;padding:10px 12px;border-radius:14px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.86rem;line-height:1.25}
.tile .ic{flex:none;width:30px;height:30px;border-radius:9px;background:var(--card);display:grid;place-items:center;font-size:1rem;color:var(--accent)}
.tile.t1{background:var(--mint)} .tile.t2{background:var(--lemon)} .tile.t3{background:var(--sky)} .tile.t4{background:var(--peach)} .tile.t5{background:var(--lilac)} .tile.t6{background:var(--grey)}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:.9rem}
label.chkstep{grid-template-columns:34px 1fr 28px;padding:12px;border:1px solid var(--rule);border-radius:14px;background:var(--card);cursor:pointer}
label.chkstep input{width:24px;height:24px;margin:3px 0 0;accent-color:var(--accent)}
label.chkstep.done{background:var(--mint);border-color:transparent}
label.chkstep.done .n{background:var(--card);color:var(--accent)}

/* ---- stats, week, plan ---- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stat{border-radius:16px;padding:12px 14px}
.stat:nth-child(1){background:var(--mint)} .stat:nth-child(2){background:var(--lemon)} .stat:nth-child(3){background:var(--sky)} .stat:nth-child(4){background:var(--lilac)}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.bar{display:block;height:6px;background:var(--grey-2);border-radius:3px;overflow:hidden;margin-top:8px}
.stat .bar{background:var(--line-soft)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.sec{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:12px 14px;margin:12px 0}
.sec-h{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:1.12rem;margin-bottom:6px}
.sn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--mint);color:var(--mint-ink);display:grid;place-items:center;font-family:var(--body);font-size:.85rem;font-weight:700}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--rule)}
.chk:first-child,.sec .note+.chk{border-top:0}
.chk input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
.chk label{flex:1;min-width:0;cursor:pointer}
.chk.big{background:var(--mint);border:0;border-radius:14px;padding:12px 14px;margin:10px 0;font-weight:600}
.yeargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.yeargrid.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr))}
.yeargrid a{display:flex;align-items:center;justify-content:center;min-height:42px;text-align:center;padding:4px;border:1px solid var(--rule);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--card);font-size:.88rem;font-variant-numeric:tabular-nums;line-height:1.2}
.yeargrid a.read{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tcards{display:grid;gap:8px}
.tcard{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:16px;border:1px solid var(--rule);background:var(--card);text-decoration:none;color:inherit;margin:6px 0}
.tcard .num{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:1.15rem;background:var(--mint);color:var(--mint-ink)}
.tcards .tcard:nth-child(4n+2) .num{background:var(--lemon);color:var(--lemon-ink)}
.tcards .tcard:nth-child(4n+3) .num{background:var(--sky);color:var(--sky-ink)}
.tcards .tcard:nth-child(4n) .num{background:var(--lilac);color:var(--lilac-ink)}
@media (min-width:640px){ .tcards{grid-template-columns:1fr 1fr} .tcards .tcard{margin:0} }
.pager{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0 4px}
.pager a{display:block;padding:10px 12px;border:1px solid var(--rule);border-radius:14px;background:var(--card);text-decoration:none;color:var(--ink);font-weight:600;font-size:.86rem;line-height:1.3}
.pager a.nx{text-align:right;background:var(--mint);border-color:transparent}
.pager small{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}

/* ---- flashcards ---- */
.flash{min-height:250px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:22px 18px;margin:12px 0;border-radius:20px;border:1px solid var(--rule);background:linear-gradient(180deg,var(--card),var(--grey))}
.flash .front{font-family:var(--display);font-size:1.35rem;line-height:1.35;margin-top:6px}
.flash .front.qf{font-style:italic;color:var(--quote)}
.flash .back{margin-top:16px;padding:14px;border-radius:14px;background:var(--mint);text-align:left}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.grades button{min-height:50px;border-radius:12px;border:1px solid var(--rule);font-weight:700;cursor:pointer;font-size:.95rem}
.grades .g0{background:var(--peach);color:var(--peach-ink);border-color:var(--peach-line)}
.grades .g1{background:var(--sky);color:var(--sky-ink);border-color:var(--sky-line)}
.grades .g2{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* ---- search, rules, handbook ---- */
.results{display:grid;gap:6px;margin-top:6px}
.res{display:block;padding:10px 12px;border:1px solid var(--rule);border-radius:12px;background:var(--card);text-decoration:none;color:var(--ink)}
.res:nth-child(even){background:var(--lemon-2)}
.card .res{border:0;border-top:1px solid var(--rule);border-radius:0;padding:10px 0;background:none}
.card .res:first-child{border-top:0}
.rule-item{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--lemon-line)}
.rule-item:first-child{border-top:0}
.rule-item input[type=checkbox]{width:22px;height:22px;margin-top:10px;accent-color:var(--accent)}
.rule-item textarea{min-height:0;padding:8px 10px}
.rmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.rbtns{display:flex;gap:6px;flex:none}
.hb h2{font-size:1.3rem} .hb ul{padding-left:18px}

/* ---- view fade ---- */
#app.fadein{animation:vfade .25s ease both}
@keyframes vfade{from{opacity:0;transform:translateY(4px)}}

/* ================= one colour family per section =================
   Library: slate and gold · Buffett: forest green · Munger: deep indigo · My journey: terracotta */
:root{ --c-buffett:#1f5a3d; --c-munger:#3b4796; --c-journey:#a84d26; --c-lib:#2f4a4a;
  --t-buffett:#e6f4eb; --t-munger:#eceefb; --t-journey:#fcefe6; }
:root[data-pack="library"]{ --accent:#2f4a4a; --accent-soft:#e7eeec; --mint:#edf3f0; --mint-ink:#2c4747; }
:root[data-pack="munger"]{ --paper:#fafafe; --accent:#3b4796; --accent-soft:#e9ebfa; --mint:#eceefb; --mint-ink:#33408a; }
:root[data-pack="journey"]{ --paper:#fdfaf6; --accent:#a84d26; --accent-soft:#fbe9df; --mint:#fcefe6; --mint-ink:#8f3f1c; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --c-buffett:#7cc39c; --c-munger:#a9b4f5; --c-journey:#f0a27b; --c-lib:#9fc4c0; --t-buffett:#1a2a21; --t-munger:#1d2034; --t-journey:#2c1f18; }
  :root:not([data-theme="light"])[data-pack="library"]{ --accent:#9fc4c0; --accent-soft:#1d2827; --mint:#1b2625; --mint-ink:#b6d6d2; --on-accent:#0f1d1c; }
  :root:not([data-theme="light"])[data-pack="munger"]{ --paper:#121320; --accent:#a9b4f5; --accent-soft:#1f2338; --mint:#1d2034; --mint-ink:#c3cbfa; --on-accent:#141a3d; }
  :root:not([data-theme="light"])[data-pack="journey"]{ --paper:#161210; --accent:#f0a27b; --accent-soft:#33221a; --mint:#2c1f18; --mint-ink:#f6c2a5; --on-accent:#3a1606; }
}
:root[data-theme="dark"]{ --c-buffett:#7cc39c; --c-munger:#a9b4f5; --c-journey:#f0a27b; --c-lib:#9fc4c0; --t-buffett:#1a2a21; --t-munger:#1d2034; --t-journey:#2c1f18; }
:root[data-theme="dark"][data-pack="library"]{ --accent:#9fc4c0; --accent-soft:#1d2827; --mint:#1b2625; --mint-ink:#b6d6d2; --on-accent:#0f1d1c; }
:root[data-theme="dark"][data-pack="munger"]{ --paper:#121320; --accent:#a9b4f5; --accent-soft:#1f2338; --mint:#1d2034; --mint-ink:#c3cbfa; --on-accent:#141a3d; }
:root[data-theme="dark"][data-pack="journey"]{ --paper:#161210; --accent:#f0a27b; --accent-soft:#33221a; --mint:#2c1f18; --mint-ink:#f6c2a5; --on-accent:#3a1606; }
body{transition:background-color .3s ease}
header.top{border-top:4px solid var(--accent)}
/* the switch: every section keeps its own colour */
.switch a.sw-buffett{--c:var(--c-buffett);--t:var(--t-buffett)} .switch a.sw-munger{--c:var(--c-munger);--t:var(--t-munger)} .switch a.sw-journey{--c:var(--c-journey);--t:var(--t-journey)}
.switch a{background:var(--t);border-color:transparent;color:var(--c)}
.switch a.on{background:var(--c);border-color:var(--c);color:var(--paper)}
:root[data-theme="dark"] .switch a.on{color:#111}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .switch a.on{color:#111} }
.inv{border-left:5px solid var(--c)} .inv-buffett{--c:var(--c-buffett)} .inv-munger{--c:var(--c-munger)} .inv.soon{--c:var(--rule)}
.inv-buffett .av{background:var(--t-buffett);color:var(--c-buffett)} .inv-munger .av{background:var(--t-munger);color:var(--c-munger)}
.inv-buffett .bar i{background:var(--c-buffett)} .inv-munger .bar i{background:var(--c-munger)}
.resume{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;padding:12px 14px;margin:0 0 12px;border-radius:16px;background:var(--card);border:1px solid var(--rule);text-decoration:none;color:var(--ink)}
.resume .small{grid-column:1} .resume b{grid-column:1;font-size:.95rem} .resume .arr{grid-column:2;grid-row:1/3;font-size:1.3rem;color:var(--accent)}

/* ================= my journey ================= */
.jcard{display:grid;gap:6px;margin:12px 0;padding:16px;border-radius:20px;text-decoration:none;color:var(--ink);background:linear-gradient(150deg,var(--t-journey),var(--lemon));border:1px solid var(--rule);border-left:5px solid var(--c-journey)}
.jcard .eyebrow{color:var(--c-journey)} .jcard .jt{font-family:var(--display);font-size:1.35rem;font-weight:600;line-height:1.2}
.jcard .go{font-weight:700;color:var(--c-journey);font-size:.9rem}
.jhero{background:linear-gradient(155deg,var(--t-journey) 0%,var(--lemon) 100%);border-radius:20px;padding:18px 16px 8px;margin:6px 0 14px}
.jhero h2{margin:.2em 0 .3em} .jhero p{margin:0 0 8px}
.jhero .stat{background:var(--card)!important}
.falls{display:grid;gap:10px;margin:8px 0}
.fall .fl{display:flex;justify-content:space-between;gap:10px;font-size:.88rem}
.fall .fl b{font-variant-numeric:tabular-nums}
.fall .fb{height:14px;border-radius:7px;background:var(--grey-2);overflow:hidden;margin-top:3px}
.fall .fb i{display:block;height:100%;border-radius:7px;animation:gx .9s cubic-bezier(.2,.7,.2,1) both;transform-origin:left center}
.fall.buffett .fb i{background:var(--c-buffett)} .fall.munger .fb i{background:var(--c-munger)} .fall.journey .fb i{background:var(--c-journey)}
.fall.journey .fl{font-weight:700;color:var(--c-journey)}
.jcta .row{margin-top:10px}
.jl{background:var(--card);border:1px solid var(--rule);border-left:6px solid var(--k);border-radius:16px;padding:12px 14px;margin:12px 0}
.jl.kept{--k:#2e8b57} .jl.broke{--k:#c0392b} .jl.risk{--k:#d4a017}
.jl.focus{box-shadow:0 0 0 3px var(--accent-soft)}
.jl h3{margin:.25em 0 .3em}
.jl-top{display:flex;align-items:center;gap:8px}
.jk{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--k,#888);color:#fff;font-weight:800;font-size:.8rem}
.kept .jk,.ylink.kept .jk{--k:#2e8b57;background:#2e8b57} .broke .jk,.ylink.broke .jk{background:#c0392b} .risk .jk,.ylink.risk .jk{background:#d4a017}
.jr{background:var(--grey);border-radius:12px;padding:10px 12px;margin:8px 0}
.jr p{margin:.2em 0 .5em}
.jq{font-family:var(--display);font-style:italic;color:var(--quote);background:var(--lemon);border-left:4px solid var(--lemon-line);border-radius:8px;padding:6px 10px}
.jq .small{font-family:var(--body);font-style:normal}
.jnow{background:var(--mint);border-radius:12px;padding:8px 12px;margin:6px 0 2px}
.jfocus{background:var(--accent-soft);border:0;margin-bottom:0;padding:8px 14px}
.ybars{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:10px 12px}
.ylegend{display:flex;align-items:center;gap:6px;font-size:.8rem;margin-bottom:6px;flex-wrap:wrap}
.ylegend .k{width:14px;height:10px;border-radius:3px;display:inline-block}
.k.me,.yb i.me{background:var(--c-journey)} .k.fund,.yb i.fund{background:#9aa5a0}
.yrow{display:grid;grid-template-columns:50px 1fr 66px;gap:8px;align-items:center;width:100%;min-height:46px;padding:4px 0;background:none;border:0;border-top:1px solid var(--rule);cursor:pointer;text-align:left;color:var(--ink)}
.yrow.open{background:var(--accent-soft);border-radius:10px}
.yl{font-weight:700;font-size:.84rem;padding-left:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.yb{position:relative;height:28px}
.yb .z{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:.35}
.yb i{position:absolute;height:11px;border-radius:3px;transform-origin:left center;animation:fd .6s ease both}
.yb i.me{top:2px} .yb i.fund{top:15px;opacity:.85}
.yv{text-align:right;line-height:1.1;font-variant-numeric:tabular-nums;padding-right:4px}
.yv b{display:block;font-size:.84rem;color:var(--c-journey)} .yv small{font-size:.72rem;color:var(--muted)}
.ydet{padding:6px 0 10px 52px;display:grid;gap:6px}
.ylink{display:flex;gap:8px;align-items:flex-start;text-decoration:none;color:var(--ink);font-size:.9rem;font-weight:600;line-height:1.3}
.jg .lm{stroke:var(--c-journey);stroke-width:3;fill:none} .jg .lf{stroke:#9aa5a0;stroke-width:2.2;fill:none;stroke-dasharray:6 4}
.jg .cm{fill:var(--c-journey)} .jg .cf{fill:#9aa5a0} .dg.jg text.tm{fill:var(--c-journey)}
table.score tr.sc-journey td{background:var(--t-journey)!important} table.score tr.sc-buffett td:first-child{border-left:4px solid var(--c-buffett)}
table.score tr.sc-munger td:first-child{border-left:4px solid var(--c-munger)} table.score tr.sc-journey td:first-child{border-left:4px solid var(--c-journey)}
table.score td:last-child{text-align:right;white-space:nowrap} table.score td:nth-child(2){font-size:.82rem;color:var(--muted)}
table.r12 tr.r12-behind td:last-child{color:#c0392b;font-weight:700} table.r12 tr.r12-ahead td:last-child{color:#2e8b57;font-weight:700}
table.r12 td:last-child{text-align:right;white-space:nowrap}
.jcall{background:var(--t-journey);border:1px solid var(--rule);border-left:5px solid var(--c-journey);border-radius:16px;padding:12px 14px;margin:14px 0;display:grid;gap:10px}
.jcall .box-h{color:var(--c-journey);margin:0}
ol.jrules{margin:0;padding-left:22px;display:grid;gap:10px}
ol.jrules li{padding-left:4px} ol.jrules li span{display:block;margin-bottom:4px}

/* ================= Peter Lynch: teal, field-notebook look ================= */
:root{ --c-lynch:#0b6b72; --t-lynch:#e1f2f2; }
:root[data-pack="library"]{ --accent:#3b4250; --accent-soft:#e8eaf0; --mint:#eef0f4; --mint-ink:#353c4a; }
:root[data-pack="lynch"]{ --paper:#f8fbfa; --accent:#0b6b72; --accent-soft:#dff0f0; --mint:#e1f2f2; --mint-ink:#0a5a60; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --c-lynch:#6fd0d4; --t-lynch:#14272a; }
  :root:not([data-theme="light"])[data-pack="library"]{ --accent:#b4bccb; --accent-soft:#22262e; --mint:#1e2128; --mint-ink:#cdd3df; --on-accent:#151820; }
  :root:not([data-theme="light"])[data-pack="lynch"]{ --paper:#0f1617; --accent:#6fd0d4; --accent-soft:#16292b; --mint:#14272a; --mint-ink:#a8e4e6; --on-accent:#062224; }
}
:root[data-theme="dark"]{ --c-lynch:#6fd0d4; --t-lynch:#14272a; }
:root[data-theme="dark"][data-pack="library"]{ --accent:#b4bccb; --accent-soft:#22262e; --mint:#1e2128; --mint-ink:#cdd3df; --on-accent:#151820; }
:root[data-theme="dark"][data-pack="lynch"]{ --paper:#0f1617; --accent:#6fd0d4; --accent-soft:#16292b; --mint:#14272a; --mint-ink:#a8e4e6; --on-accent:#062224; }
:root[data-pack="lynch"] body{background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);background-size:24px 24px}
.switch{grid-template-columns:repeat(4,minmax(0,1fr))}
.switch a{font-size:.86rem}
.switch a.sw-lynch{--c:var(--c-lynch);--t:var(--t-lynch)}
@media (min-width:760px){ .switch{grid-template-columns:repeat(4,minmax(0,150px))} }
.inv-lynch{--c:var(--c-lynch)} .inv-lynch .av{background:var(--t-lynch);color:var(--c-lynch)} .inv-lynch .bar i{background:var(--c-lynch)}
/* path */
.lcrumb{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0 10px}
.lcrumb a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.62rem;font-weight:700;text-align:center;line-height:1.1}
.lcrumb i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--rule);background:var(--card);font-size:.75rem}
.lcrumb a.past i{border-color:var(--accent);color:var(--accent)} .lcrumb a.on{color:var(--accent)} .lcrumb a.on i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lpath{position:relative;margin:10px 0}
.lpath::before{content:"";position:absolute;left:19px;top:20px;bottom:20px;width:3px;border-radius:2px;background:var(--accent);opacity:.35;transform-origin:top;animation:lgrow 1.2s ease both}
@keyframes lgrow{from{transform:scaleY(0)}}
.lstage{position:relative;display:grid;grid-template-columns:40px 1fr;gap:10px;margin-bottom:14px;animation:fd .5s ease both}
.lnode{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--display);font-size:1.2rem;font-weight:600;box-shadow:0 0 0 5px var(--paper)}
.lbody{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:10px 12px}
.lbody h3{margin:.1em 0 .2em}
.lbody .tcard{margin:8px 0;padding:10px 12px}
.ltools{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
/* notebook notes */
.lnotes{display:grid;gap:12px;margin:8px 0}
.lnote{background:var(--lemon);border:1px solid var(--lemon-line);border-radius:4px 4px 14px 4px;padding:12px 14px;transform:rotate(var(--r));box-shadow:0 3px 8px rgba(0,0,0,.08);background-image:repeating-linear-gradient(transparent 0 23px,var(--line-soft) 23px 24px)}
.lnote b{font-family:var(--display);font-size:1.05rem}
.lnote p{margin:.3em 0}
/* tools */
.ltool{background:var(--card);border:2px solid var(--accent);border-radius:18px;padding:12px 14px;margin:12px 0;box-shadow:0 4px 0 var(--accent-soft)}
.ltool-h{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;margin-bottom:10px}
.lic,.ltiles .ic{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:1.1rem}
.ltiles .tile{align-items:flex-start;min-height:84px}
.lprog{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.lcase,.lsay{font-family:var(--display);font-size:1.15rem;line-height:1.45;background:var(--grey);border-radius:12px;padding:12px 14px;margin:6px 0 10px}
.lsay{font-style:italic}
.lopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lopts button{min-height:46px;border-radius:12px;border:1px solid var(--rule);background:var(--card);font-weight:700;font-size:.9rem;cursor:pointer}
.lopts button.right{background:var(--mint);border-color:var(--accent);color:var(--mint-ink)}
.lopts button.wrong{background:var(--peach);border-color:var(--peach-line);color:var(--peach-ink)}
.lfb{border-radius:12px;padding:10px 12px;margin:10px 0}
.lfb.ok{background:var(--mint)} .lfb.no{background:var(--peach)}
.lfb .small{margin-top:6px}
.lscore{font-family:var(--display);font-size:1.4rem;margin:6px 0}
.lchecks{display:grid;gap:6px}
.lchecks button{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;text-align:left;min-height:44px;padding:6px 10px;border-radius:12px;border:1px solid var(--rule);background:var(--card);cursor:pointer;font-size:.88rem;line-height:1.3}
.lck{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--grey-2);font-size:.75rem;font-weight:800}
.lchecks button.on{background:var(--mint);border-color:var(--accent)} .lchecks button.on .lck{background:var(--accent);color:var(--on-accent)}
.lchecks.bad button.on{background:var(--peach);border-color:var(--peach-line)} .lchecks.bad button.on .lck{background:#c0392b;color:#fff}
.lmeter{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px;font-size:.85rem}
.lmeter b{font-family:var(--display);font-size:1.5rem} .lmeter b.warn{color:#c0392b}
.warnbar i{background:#c0392b!important}
.lnums{display:grid;gap:8px}
.lnum{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.9rem;font-weight:600}
.lstep{display:inline-flex;align-items:center;gap:6px}
.lstep button{width:40px;height:40px;border-radius:12px;border:1px solid var(--rule);background:var(--card);font-size:1.2rem;font-weight:700;cursor:pointer;color:var(--accent)}
.lstep button:disabled{opacity:.35;cursor:default}
.lstep input{width:76px;text-align:center;min-height:40px;padding:6px}
.lval{min-width:28px;text-align:center;font-family:var(--display);font-size:1.3rem}
.lpeg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 8px}
.lpeg .stat:nth-child(1){background:var(--mint)} .lpeg .stat:nth-child(2){background:var(--lemon)}
.lgauge{position:relative;margin:8px 0 26px}
.lgz{display:flex;height:14px;border-radius:7px;overflow:hidden}
.lgz i{display:block;height:100%} .lgz .z1{width:33.3%;background:var(--peach-line)} .lgz .z2{width:33.3%;background:var(--lemon-line)} .lgz .z3{flex:1;background:var(--accent)}
.lneedle{position:absolute;top:-6px;width:4px;height:26px;margin-left:-2px;border-radius:2px;background:var(--ink);transition:left .5s cubic-bezier(.2,.8,.3,1.2)}
.lgl{display:flex;justify-content:space-between;font-size:.66rem;color:var(--muted);margin-top:4px}
.lhint{background:var(--sky);border-radius:12px;padding:8px 12px;font-size:.88rem;margin:8px 0}
.lclock{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.lclock span{font-family:var(--display);font-size:2rem;font-variant-numeric:tabular-nums;min-width:86px}
.lclock span.run{color:var(--accent);animation:lpulse 1s ease-in-out infinite}
@keyframes lpulse{50%{opacity:.55}}
.lslots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.ls{display:grid;place-items:center;height:42px;border-radius:10px;font-weight:800;font-size:.9rem;animation:pop .3s ease both}
.ls.ten{background:var(--accent);color:var(--on-accent)} .ls.dbl{background:var(--mint);color:var(--mint-ink)} .ls.flat{background:var(--grey-2);color:var(--muted)} .ls.zero{background:var(--peach);color:var(--peach-ink);text-decoration:line-through}
.lparty .lguest{transition:transform .7s cubic-bezier(.2,.8,.3,1)}
.lstagebox{background:var(--grey);border-radius:12px;padding:10px 12px}
.lrecord{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.lrecord .stat{background:var(--mint)} .lrecord .stat:nth-child(2){background:var(--lemon)} .lrecord .stat:nth-child(3){background:var(--sky)} .lrecord .stat:nth-child(4){background:var(--lilac)}
.lrecord .stat b{font-size:1.3rem}

/* ---- diagrams ---- */
figure.dg{margin:12px 0;padding:14px 10px 8px;background:var(--card);border:1px solid var(--rule);border-radius:16px}
figure.dg svg{display:block;width:100%;max-width:520px;margin:0 auto;height:auto;overflow:visible}
figure.dg figcaption{font-size:.74rem;color:var(--muted);margin-top:8px;max-width:520px;margin-left:auto;margin-right:auto}
.dg text{fill:var(--ink);font-family:var(--body);font-size:14px}
.dg text.s{font-size:12px;fill:var(--muted)}
.dg text.s.w{fill:var(--paper)} .dg text.s.a{fill:var(--accent)}
.dg text.b{font-weight:600}
.dg text.dsp{font-family:var(--display);font-size:17px}
.dg text.w{fill:var(--paper)}
.dg text.a{fill:var(--accent)}
.dg .acc{fill:var(--accent)} .dg .soft{fill:var(--accent-soft)} .dg .ink{fill:var(--ink)} .dg .card{fill:var(--card)} .dg .bad{fill:var(--due)}
.dg .ln{stroke:var(--ink);fill:none;stroke-width:1.4} .dg .la{stroke:var(--accent);fill:none;stroke-width:2} .dg .lr{stroke:var(--rule);fill:none;stroke-width:1}
.dg .ol{stroke:var(--ink);stroke-width:1.2;fill:var(--card)}
.gx{transform-box:fill-box;transform-origin:left center;animation:gx .9s cubic-bezier(.2,.7,.2,1) both}
.gxr{transform-box:fill-box;transform-origin:right center;animation:gx .9s cubic-bezier(.2,.7,.2,1) both}
.gy{transform-box:fill-box;transform-origin:center bottom;animation:gy .9s cubic-bezier(.2,.7,.2,1) both}
.gyt{transform-box:fill-box;transform-origin:center top;animation:gy .9s cubic-bezier(.2,.7,.2,1) both}
.fd{animation:fd .7s ease both}
.pp{transform-box:fill-box;transform-origin:center;animation:pp .55s cubic-bezier(.2,.8,.3,1.3) both}
.dr{stroke-dasharray:1000;animation:dr 1.6s ease both}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes fd{from{opacity:0}}
@keyframes pp{from{transform:scale(.3);opacity:0}}
@keyframes dr{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
/* ---- tendencies explorer ---- */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:6px}
.tgrid button{display:grid;grid-template-columns:24px 1fr;gap:6px;align-items:start;text-align:left;min-height:46px;border:1px solid var(--sky-line);background:var(--card);border-radius:12px;padding:8px;cursor:pointer;font-size:.82rem;line-height:1.3;transition:background .15s,border-color .15s}
.tgrid button b{font-variant-numeric:tabular-nums;color:var(--accent)}
.tgrid button.on{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.tgrid button.on b{color:var(--paper)}
.meter{height:10px;background:var(--card);border-radius:5px;overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
.meter.hot i{background:var(--due)}
.verdict{font-weight:600}
.verdict.hot{color:var(--due)}
@media (prefers-reduced-motion: reduce){#app.fadein{animation:none}}

gba(200,215,255,.8) 0 1.3px,transparent 2.0px),radial-gradient(circle at 65px 446px,rgba(200,215,255,.8) 0 1.3px,transparent 2.0px),radial-gradient(circle at 384px 40px,rgba(200,215,255,.8) 0 1.3px,transparent 2.0px);background-size:100% 100%,100% 100%,100% 100%,100% 100%,240px 240px,240px 240px,240px 240px,240px 240px,240px 240px,240px 240px,240px 240px,240px 240px,240px 240px,240px 240px,240px 240px,240px 240px,240px 240px,240px 240px,240px 240px,240px 240px,520px 520px,520px 520px,520px 520px,520px 520px,520px 520px,520px 520px,520px 520px}

html:root[data-pack="timeline"] header.top{background:rgba(4,7,24,.95)}
html:root[data-pack="timeline"] nav.tabs{background:rgba(6,9,28,.95)}
html:root[data-pack="timeline"] .sheet{background:#0c1130}
html:root[data-pack="timeline"] h2,html:root[data-pack="timeline"] h3{color:#f4f1e6}
html:root[data-pack="timeline"] .card,html:root[data-pack="timeline"] .sec,html:root[data-pack="timeline"] .tw{background:var(--card)}
html:root[data-pack="timeline"] .tile{background:var(--card);border:1px solid var(--rule);color:var(--ink)}
html:root[data-pack="timeline"] .tile .ic{background:rgba(243,201,105,.12);color:var(--accent)}
html:root[data-pack="timeline"] .tile .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
html:root[data-pack="timeline"] .pager a{background:var(--card)}
html:root[data-pack="timeline"] select{background:#0e1434;color:var(--ink)}
/* five-way switch */
.switch{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.switch a{font-size:.76rem;padding:2px 3px}
@media (min-width:760px){ .switch{grid-template-columns:repeat(5,minmax(0,140px))} .switch a{font-size:.86rem} }
.switch a.sw-timeline{background:linear-gradient(135deg,#141a44,#33296a);border-color:#4a4190;color:#f6e7b6;letter-spacing:.01em}
.switch a.sw-timeline.on{background:linear-gradient(135deg,#f6d27a,#e8955a);border-color:#f3c969;color:#1c1505}
html:root[data-pack="timeline"] .switch a:not(.sw-timeline){background:rgba(255,255,255,.05);border-color:var(--rule);color:var(--ink)}
/* hero */
.tl-hero h2,.tl-yhero .ybig{background:linear-gradient(90deg,#fff3cf,#f3c969 55%,#ee9a63);-webkit-background-clip:text;background-clip:text;color:transparent}
.tl-hero h2{font-size:2rem;margin:.1em 0 .2em}
figure.tl-sky,figure.tl-gal,figure.tl-lives{margin:6px auto 4px;max-width:470px}
figure.tl-sky svg,figure.tl-gal svg,figure.tl-lives svg{display:block;width:100%;height:auto}
figure.tl-sky figcaption,figure.tl-gal figcaption,figure.tl-lives figcaption{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;font-size:.74rem;color:var(--muted);margin-top:4px}
.lg{display:inline-flex;align-items:center;gap:5px}.lg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.dM{background:var(--cM)}.dB{background:var(--cB)}.dL{background:var(--cL)}.dW{background:var(--cW)}
.tl-ctrl{display:flex;justify-content:center;align-items:center;gap:10px;margin:8px 0 4px}
.tl-ctrl .btn{min-width:118px}
input.tlrange{width:100%;accent-color:var(--accent);margin:6px 0 2px;min-height:34px}
.tjump{justify-content:center}
.chips.tjump button{min-height:36px;padding:4px 11px;font-size:.8rem;background:rgba(255,255,255,.05);color:var(--ink);border-color:var(--rule)}
.chips.tjump button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.agev{font-family:var(--display);font-size:1.3rem;min-width:84px;text-align:center}
/* sky svg */
svg.sky .ring,svg.gal .ring{fill:none;stroke:rgba(190,200,255,.13);stroke-dasharray:2 5}
svg.sky .rl,svg.gal .rl{font-size:8px;fill:rgba(200,210,255,.45);font-family:var(--body)}
svg.sky .tick{stroke:rgba(243,201,105,.35);stroke-width:1.2}
svg.sky .trf{fill:none;stroke-width:1;opacity:.16}
svg.sky .trl{fill:none;stroke-width:2.1;stroke-linecap:round}
svg.sky .tM,svg .arm.aM,svg .arm-g.aM{stroke:var(--cM)} svg.sky .tB,svg .arm.aB,svg .arm-g.aB{stroke:var(--cB)} svg.sky .tL,svg .arm.aL,svg .arm-g.aL{stroke:var(--cL)}
svg.sky .hand{stroke:url(#handG);stroke-width:2;stroke-linecap:round}
svg.sky .suny{font:700 10.5px var(--body);fill:#3a2405;text-anchor:middle;letter-spacing:-.02em}
svg.sky .sunglow{animation:sunp 4s ease-in-out infinite alternate;transform-origin:200px 200px}
@keyframes sunp{from{opacity:.65}to{opacity:1}}
svg .pl{transition:opacity .4s}
svg .pl .core{stroke:rgba(255,255,255,.85);stroke-width:1}
svg .pM .core{fill:var(--cM)} svg .pB .core{fill:var(--cB)} svg .pL .core{fill:var(--cL)}
svg .pl .halo{fill:#fff;opacity:.10}
svg .pl .pi{font:700 7.5px var(--body);fill:#0b1030;text-anchor:middle}
svg .pl .flash{fill:none;stroke:#fff;stroke-width:1.5;opacity:0}
svg .pl.born .flash{animation:flash 1.6s ease-out infinite}
@keyframes flash{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
svg .mem .mh{fill:rgba(170,180,255,.18)} svg .mem .ms{fill:#fff}
svg .mem{transition:opacity .5s}
svg .comet{opacity:0;transition:opacity .3s}
svg .comet.on{opacity:1}
svg .comet .ctail{stroke:url(#cometG);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:190;stroke-dashoffset:190}
svg .comet.on .ctail{animation:comet 2.2s ease-in infinite}
svg .comet .chead{fill:#fff;opacity:0}
svg .comet.on .chead{animation:chead 2.2s ease-in infinite}
@keyframes comet{0%{stroke-dashoffset:190}60%,100%{stroke-dashoffset:0}}
@keyframes chead{0%,50%{opacity:0}60%{opacity:1}100%{opacity:0}}
svg .cl{font:600 11px var(--body);fill:#ffc2b5}
/* galaxy */
svg.gal .arm{fill:none;stroke-width:1.6;stroke-linecap:round;opacity:.95}
svg.gal .arm-g{fill:none;stroke-width:7;opacity:.10;stroke-linecap:round}
svg.gal .gstar{fill:#fff;stroke-width:1}
svg.gal .sM{stroke:var(--cM)} svg.gal .sB{stroke:var(--cB)} svg.gal .sL{stroke:var(--cL)}
svg.gal .aname{font:600 9px var(--body)} svg.gal .nM{fill:var(--cM)} svg.gal .nB{fill:var(--cB)} svg.gal .nL{fill:var(--cL)}
svg.gal .agering{fill:none;stroke:var(--cW);stroke-width:1.4;stroke-dasharray:4 4;transition:r .25s}
svg.gal .gage{font:700 13px var(--display);fill:#3a2405;text-anchor:middle}
svg.gal .pl{transition:transform .25s,opacity .3s}
/* now card, stats, crossings */
.now{background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:12px 14px;margin:12px 0}
.now-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.now-y{font-family:var(--display);font-size:2rem;font-weight:600;color:var(--accent);line-height:1}
.nr{display:grid;grid-template-columns:14px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--rule)}
.nr:first-of-type{border-top:0}
.nr .dot,.lane .dot,.wr .dot,.lifeset .dot,.tp-h .dot{width:10px;height:10px;border-radius:50%;margin-top:.45em;display:inline-block;flex:none}
.aM .dot,.lM .dot,.dot.dM{background:var(--cM);box-shadow:0 0 8px var(--cM)} .aB .dot,.lB .dot,.dot.dB{background:var(--cB);box-shadow:0 0 8px var(--cB)}

.pt span{display:block;font-size:.9rem;color:var(--muted);line-height:1.4}

.new{margin:22px 0 6px;font-size:.95rem}
.hlinks{font-size:.85rem;color:var(--muted);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.hlinks a{color:var(--muted)}

/* avatars */
.ava{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;font-weight:700;font-size:.95rem;color:#fff;background:var(--cBuf);flex:none}
.ava.a-munger{background:var(--cMun)}.ava.a-lynch{background:var(--cLyn)}.ava.a-timeline{background:#151a3a;color:#f3c969;font-size:1.3rem}.ava.a-journey{background:var(--cJ)}.ava.a-bolton{background:var(--cBol)}.ava.a-smith{background:var(--cSmi)}.ava.a-keynes{background:var(--cKey)}.ava.a-lilu{background:var(--cLil)}.ava.a-duan{background:var(--cDua)}.ava.a-qiu{background:var(--cQiu)}.ava.a-zhanglei{background:var(--cZha)}
.ava.big{width:60px;height:60px;font-size:1.1rem}

/* ---- thin top bar with contents ---- */
.topbar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.topbar-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;min-height:52px;padding:0 12px}
.tback{text-decoration:none;font-weight:600;font-size:.95rem;padding:10px 6px}
.bt{text-align:center;font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbtn{border:1px solid var(--rule);background:var(--card);border-radius:18px;min-height:36px;padding:0 14px;font-size:.88rem;font-weight:600;cursor:pointer}
.cmenu{max-width:680px;margin:0 auto;padding:4px 12px 12px}
.cmenu ol{margin:0;padding:0;list-style:none;counter-reset:c}
.cmenu li{counter-increment:c}
.cmenu button{display:flex;gap:12px;width:100%;text-align:left;border:0;background:none;padding:11px 6px;border-top:1px solid var(--rule);font-size:.98rem;cursor:pointer;color:var(--ink)}
.cmenu button::before{content:counter(c);color:var(--muted);width:1.4em;text-align:right;flex:none}

/* ---- hero ---- */
.phero{padding:28px 0 6px}
.phero h1{font-size:2rem;margin:.35em 0 .15em}
.hook{font-size:1.08rem;color:var(--muted);margin:0 0 .8em}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;list-style:none;padding:0;margin:.4em 0 1em;font-size:.92rem;color:var(--muted)}
.facts b{color:var(--ink);font-size:1.05rem}
.how{background:var(--grey);border-radius:14px;padding:12px 16px;font-size:.95rem}
.how ol{margin:.35em 0 0;padding-left:1.25em}.how li{margin:.2em 0}
.rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.rec div{border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.rec b{display:block;font-family:var(--display);font-size:1.35rem;line-height:1.2}
.rec span{font-size:.82rem;color:var(--muted);line-height:1.35;display:block}

/* ---- sections ---- */
.psec{border-top:1px solid var(--rule);margin-top:34px;padding-top:24px;scroll-margin-top:60px}
.psh{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;margin-bottom:8px}
.psn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--rule);font-size:.8rem;font-weight:700;color:var(--muted);margin-top:4px}
.psh h2{font-size:1.5rem;margin:0}
.ssub{color:var(--muted);font-size:.95rem;margin:.2em 0 0}
.sb>p:first-child{margin-top:.4em}

/* ---- accordions ---- */
.accs{border-top:1px solid var(--rule);margin:10px 0}
details.acc{border-bottom:1px solid var(--rule);scroll-margin-top:60px}
details.acc>summary{list-style:none;display:grid;grid-template-columns:auto 1fr 18px;gap:12px;align-items:start;padding:14px 2px;cursor:pointer;min-height:52px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .no{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:8px;background:var(--grey);font-weight:700;font-size:.85rem;color:var(--muted);margin-top:1px}
details.acc>summary .st{min-width:0}
details.acc>summary .st b{display:block;font-size:1.02rem;line-height:1.35}
details.acc>summary .st span{display:block;font-size:.9rem;color:var(--muted);line-height:1.45;margin-top:2px}
details.acc>summary .chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:8px;transition:transform .2s}
details.acc[open]>summary .chev{transform:rotate(-135deg);margin-top:12px}
details.acc>summary:not(:has(.no)):not(:has(.yno)):not(:has(.dotl)){grid-template-columns:1fr 18px}
.accb{padding:0 2px 20px}
details.acc.mini{border:0;margin-top:12px}
details.acc.mini>summary{padding:10px 14px;background:var(--grey);border-radius:12px;min-height:44px}
details.acc.mini[open]>summary{border-radius:12px 12px 0 0}
details.acc.mini>.accb{padding:8px 0 4px}
details.acc.yr>summary{padding:10px 2px;min-height:44px}
.yno{font-family:var(--display);font-weight:600;font-size:1.15rem;min-width:44px}
.accs.yrs{margin-top:16px}
.dotl{display:inline-flex;width:28px;justify-content:center;padding-top:6px}

/* ---- content pieces ---- */
ul.plain,ul.plainl{padding-left:1.15em;margin:.5em 0}ul.plain li,ul.plainl li{margin:.35em 0}
ul.pairs,ul.lessons,ol.path,ol.mist,ol.tend,ol.test,ol.plan{padding-left:1.25em;margin:.6em 0}
ul.pairs li,ul.lessons li,ol.path li,ol.tend li,ol.test li{margin:.55em 0}
.src{font-size:.78rem;color:var(--muted);white-space:nowrap}
ol.mist{list-style:none;padding:0}
ol.mist li{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)}
ol.mist .yr{font-size:.8rem;color:var(--muted);padding-top:3px}
ol.mist b{display:block;line-height:1.4}ol.mist p{margin:.25em 0 0;color:var(--muted);font-size:.95rem}
.guard{display:block;font-size:.88rem;color:var(--accent)}
ol.plan li{margin:.7em 0}ol.plan li>span{display:block;font-size:.9rem}
.golink{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.golink.btnlink{display:block;margin:12px 0;font-size:.95rem}
.ideas-of .golink{margin-right:6px}
blockquote.qq{margin:16px 0;padding:2px 0 2px 16px;border-left:3px solid var(--accent)}
blockquote.qq p{font-family:var(--display);font-style:italic;font-size:1.12rem;line-height:1.5;margin:0}
blockquote.qq cite{display:block;font-style:normal;font-size:.8rem;color:var(--muted);margin-top:4px}
.pask{background:var(--grey);border-radius:12px;padding:10px 14px;margin:16px 0 4px;font-size:.95rem}
.pask ul{margin:.3em 0 0;padding-left:1.15em}
.story{font-size:.95rem}
dl.gloss{margin:.4em 0}dl.gloss dt{font-weight:600;margin-top:.9em}dl.gloss dd{margin:.15em 0 0;color:var(--muted)}
ul.life{list-style:none;padding:0;margin:0}ul.life li{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:5px 0;font-size:.93rem;border-bottom:1px solid var(--rule)}ul.life li span{color:var(--muted);font-weight:600}
.disc{background:var(--grey);border-radius:12px;padding:6px 14px;font-size:.85rem;color:var(--muted)}
.ltool.bare{border:0;box-shadow:none;padding:0;margin:0;background:none}
figure.dg{margin:8px 0 14px}
.btn{border-radius:22px}

/* ---- next page + footer ---- */
.nextp{display:grid;gap:10px;margin:40px 0 10px}
.nextp a{display:block;text-decoration:none;border:1px solid var(--rule);border-radius:14px;padding:12px 16px;font-weight:600;color:var(--ink)}
.nextp a small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.nextp a.ghost{border:0;color:var(--muted);padding:6px 4px;font-weight:400;font-size:.92rem}
.foot{font-size:.8rem;color:var(--muted);border-top:1px solid var(--rule);margin-top:20px;padding-top:14px}
.foot a{color:var(--muted)}
#toTop{position:fixed;right:16px;bottom:18px;z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:var(--card);color:var(--ink);font-size:1.1rem;box-shadow:0 2px 8px rgba(0,0,0,.15);opacity:0;pointer-events:none;transition:opacity .2s;cursor:pointer}
#toTop.show{opacity:1;pointer-events:auto}

/* ---- timeline page keeps its night sky ---- */
html:root[data-pack="timeline"] .topbar{background:rgba(4,7,24,.96)}
html:root[data-pack="timeline"] .cbtn,html:root[data-pack="timeline"] #toTop{background:rgba(16,22,52,.9)}
html:root[data-pack="timeline"] .how,html:root[data-pack="timeline"] details.acc>summary .no,html:root[data-pack="timeline"] details.acc.mini>summary,html:root[data-pack="timeline"] .disc{background:rgba(255,255,255,.06)}
html:root[data-pack="timeline"] .rec div{background:var(--card)}
html:root[data-pack="timeline"] h1,html:root[data-pack="timeline"] h2{color:#f4f1e6}
html:root[data-pack="timeline"] .accb .card{margin:8px 0}
@media (min-width:760px){ .home{padding-top:16vh} .phero h1{font-size:2.3rem} }
@media (prefers-color-scheme: light){ :root[data-pack="munger"],:root[data-pack="lynch"],:root[data-pack="bolton"],:root[data-pack="smith"],:root[data-pack="keynes"],:root[data-pack="journey"],:root[data-pack="home"]{--paper:#ffffff} }
:root[data-pack="lynch"] body{background-image:none}

/* ---- gentle page changes ---- */
#curtain{position:fixed;inset:0;z-index:200;pointer-events:none;opacity:0;transition:opacity .22s ease}
#curtain.on{opacity:1;transition-duration:.2s}
@keyframes v4out{to{opacity:0}}
@keyframes v4in{from{opacity:0;transform:translateY(12px)}}
::view-transition-old(root){animation:v4out .26s ease both}
::view-transition-new(root){animation:v4in .46s cubic-bezier(.2,.7,.2,1) .06s both}
/* going to or from the night sky: pass through a soft dusk rather than a flash */
html.vt-dusk::view-transition-group(root){background:#4a4e68}
html::view-transition-group(root){background:var(--paper)}
html:root[data-pack="timeline"] body{transition:background-color .4s ease}
@media (prefers-reduced-motion: reduce){ ::view-transition-old(root),::view-transition-new(root){animation:none} #curtain{transition:none} }
/* panels open softly */
details.acc.opening[open]>.accb{animation:accin .28s ease both}
@keyframes accin{from{opacity:0;transform:translateY(-4px)}}


/* system fonts only: nothing is loaded from other sites */
:root{--display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
::placeholder{color:#6b7177;opacity:1}
@media (prefers-color-scheme: dark){ ::placeholder{color:#a3aaa6} }
.foot .flinks{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
/* country row */
.ctry{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:28px 0 0}
.ctry button{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--rule);background:var(--card);color:var(--ink);font-size:.9rem;font-weight:600;cursor:pointer}

.ctry .soon{font-size:.82rem;color:var(--muted)}
.ctry+.picks{margin-top:14px}

/* ---- UK special sections ---- */
table.qtab{width:100%;border-collapse:collapse;font-size:.92rem}
table.qtab th,table.qtab td{padding:9px 8px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
table.qtab thead th{font-size:.78rem;color:var(--muted);font-weight:600}
.qctool{display:grid;gap:10px;margin:8px 0 14px}
.qcrow{display:grid;grid-template-columns:1fr 92px;gap:4px 10px;align-items:center}
.qcrow label{font-size:.9rem}
.qcrow input{width:100%;min-height:44px;border:1px solid var(--rule);border-radius:10px;padding:0 10px;font-size:16px;background:var(--card);color:var(--ink)}
.qcrow span{grid-column:1/-1;min-height:0}
.qc{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:10px}
.qc.ok2{background:var(--accent);color:var(--paper)}.qc.ok{background:var(--accent-soft);color:var(--accent)}.qc.no{background:var(--grey);color:var(--muted)}
.honest{margin:16px 0 4px;padding:12px 16px;border-left:3px solid var(--muted);background:var(--grey);border-radius:0 12px 12px 0}
.honest p{margin:.3em 0 0;font-size:.92rem}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.duo>div{border:1px solid var(--rule);border-radius:14px;padding:12px 12px 4px;background:var(--card)}
.duo>div.on{border-color:var(--accent);background:var(--accent-soft)}
.duo .dh{display:block;font-size:.92rem;margin-bottom:6px}
.duo dl{margin:0}.duo dt{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:8px}
.duo dd{margin:2px 0 8px;font-size:.9rem;line-height:1.4}

/* ---- at a glance card ---- */
.glance{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:start;margin:14px 0 16px;padding:14px;border:1px solid var(--rule);border-radius:16px;background:var(--card)}
.gl-ava{width:76px;height:96px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.5rem;letter-spacing:.02em}
.gl-ava.a-buffett{background:var(--cBuf)}.gl-ava.a-munger{background:var(--cMun)}.gl-ava.a-lynch{background:var(--cLyn)}.gl-ava.a-bolton{background:var(--cBol)}.gl-ava.a-smith{background:var(--cSmi)}.gl-ava.a-keynes{background:var(--cKey)}.gl-ava.a-lilu{background:var(--cLil)}.gl-ava.a-duan{background:var(--cDua)}.gl-ava.a-qiu{background:var(--cQiu)}.gl-ava.a-zhanglei{background:var(--cZha)}
.gl-h{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px}
.glance dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:.86rem;line-height:1.35}
.glance dt{color:var(--muted);font-weight:600}.glance dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:380px){ .glance dl{grid-template-columns:1fr;gap:0} .glance dd{margin-bottom:6px} }
@media (prefers-color-scheme: dark){ .gl-ava{color:#111} }
