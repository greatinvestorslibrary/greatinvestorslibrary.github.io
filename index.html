,"2022":[4.0,-18.1],"2023":[15.8,26.3],"2024":[25.5,25.0],"2025":[10.9,17.9]},"bpl":{"1957":[10.4,-8.4],"1958":[40.9,38.5],"1959":[25.9,20.0],"1960":[22.8,-6.2],"1961":[45.9,22.4],"1962":[13.9,-7.6],"1963":[38.7,20.6],"1964":[27.8,18.7],"1965":[47.2,14.2],"1966":[20.4,-15.6],"1967":[35.9,19.0],"1968":[58.8,7.7],"1969":[6.8,-11.6]},"wm":{"1962":[30.1,-7.6],"1963":[71.1,20.6],"1964":[49.7,18.7],"1965":[8.4,14.2],"1966":[12.4,-15.7],"1967":[56.2,19.0],"1968":[40.4,7.7],"1969":[28.3,-11.6],"1970":[-0.1,8.7],"1971":[25.4,9.8],"1972":[8.3,18.2],"1973":[-31.9,-13.1],"1974":[-31.5,-23.1],"1975":[73.2,44.4]},"longRun":[["29.5%","Buffett partnership a year, 1957-69 (Dow 7.4%)"],["19.8%","Munger partnership a year, 1962-75 (Dow 5.0%)"],["29.2%","Lynch's Magellan a year, 1977-90"],["19.7%","Berkshire shares a year, 1965-2025 (S&P 500 10.5%)"]],"eras":[{"n":1,"a":1924,"b":1929,"title":"The Roaring Twenties","tag":"A boom, a baby, a crash","intro":"Radio, cars and easy credit. Ordinary Americans discover the stock market, the first modern mutual fund opens in Boston, and Charlie Munger is born in Omaha. It ends in the crash of 1929.","where":{"M":"A small boy in Omaha.","B":"Not yet born.","L":"Not yet born."}},{"n":2,"a":1930,"b":1941,"title":"Depression childhoods","tag":"Hard times teach thrift","intro":"Banks fail, a quarter of workers lose their jobs and stocks lose most of their value. Washington answers with the New Deal and the SEC. Warren Buffett is born ten months after the crash. The decade ends with a world at war.","where":{"M":"An Omaha schoolboy, then a maths student in Michigan.","B":"An Omaha boy already selling things for profit.","L":"Not yet born."}},{"n":3,"a":1942,"b":1949,"title":"War and first trades","tag":"Uniforms, paper routes, a birth","intro":"America fights and wins a world war, then builds the post-war order. Buffett buys his first stock at 11, Munger forecasts weather for the Army and talks his way into Harvard Law, and Peter Lynch is born near Boston.","where":{"M":"Army weatherman, Harvard Law, then a young Los Angeles lawyer.","B":"A teenage businessman in Washington, then Wharton.","L":"A baby, then a small boy in Newton, Massachusetts."}},{"n":4,"a":1950,"b":1959,"title":"Students of Graham","tag":"A teacher, a stock, a meeting","intro":"A booming, confident America; the Dow finally regains its 1929 peak in 1954. Buffett learns from Benjamin Graham, works for him, then starts his own partnership. Lynch loses his father and starts caddying. In 1959 Buffett and Munger meet.","where":{"M":"A Los Angeles lawyer through a hard decade at home.","B":"Columbia, Omaha broker, Graham-Newman, then his own partnership.","L":"A boy caddying at a Boston-area golf club."}},{"n":5,"a":1960,"b":1969,"title":"The go-go years","tag":"Partnerships and a textile mill","intro":"Kennedy, Vietnam, civil rights and the Moon. Wall Street falls for fast-trading 'go-go' funds. Buffett buys a struggling textile mill called Berkshire Hathaway; Munger starts his own firm and fund; Lynch goes from college to Fidelity.","where":{"M":"Founds his law firm and runs his own investment partnership.","B":"Runs his partnership; takes control of Berkshire in 1965; closes the partnership in 1969.","L":"Boston College, a Fidelity internship, Wharton and the Army."}},{"n":6,"a":1970,"b":1979,"title":"The lost decade","tag":"Inflation, oil and bargains","intro":"Watergate, oil shocks and inflation. Stocks go nowhere for a decade and crash in 1973-74. Buffett buys See's Candies, the Washington Post and GEICO at bargain prices; Munger's fund is battered, then recovers; Lynch takes over a tiny fund called Magellan.","where":{"M":"Rides out a brutal 1973-74, winds up his fund and joins Berkshire as vice chairman in 1978.","B":"Runs Berkshire and buys great businesses cheaply.","L":"Fidelity analyst, research director, then Magellan's manager from 1977."}},{"n":7,"a":1980,"b":1989,"title":"The great bull begins","tag":"Volcker, Magellan, Black Monday","intro":"Paul Volcker breaks inflation with sky-high rates, and a great bull market begins in 1982. Magellan becomes the most famous fund in America. Berkshire buys Nebraska Furniture Mart and Coca-Cola. Black Monday tests everyone in 1987.","where":{"M":"Berkshire's vice chairman; also runs Wesco from 1984.","B":"Turns Berkshire into a conglomerate of great businesses.","L":"Builds Magellan from about $100 million to about $10 billion."}},{"n":8,"a":1990,"b":1999,"title":"The bubble decade","tag":"Retirement, rescue and a mania","intro":"The Cold War ends, the web arrives and tech stocks soar. Lynch quits at the top at 46. Buffett rescues Salomon and buys GEICO and General Re. Munger gives his most famous talks. By 1999 critics call Buffett out of touch.","where":{"M":"Gives his landmark talks on worldly wisdom and human misjudgment.","B":"Builds Berkshire's insurance empire and refuses to chase tech.","L":"Retires from Magellan, writes two more books and turns to giving."}},{"n":9,"a":2000,"b":2009,"title":"Bust, war and crisis","tag":"Two crashes in ten years","intro":"The dot-com bubble bursts, terrorists strike on 9/11, and in 2008 the financial system nearly collapses. Buffett warns about derivatives, pledges his fortune to charity and invests boldly in the panic, with Munger's China idea in the mix.","where":{"M":"Vice chairman and sage; his sayings become a best-selling book.","B":"Warns early, then invests heavily in the 2008 panic.","L":"Vice chairman at Fidelity and a full-time philanthropist."}},{"n":10,"a":2010,"b":2019,"title":"The long recovery","tag":"Giving, Apple and succession","intro":"A slow recovery, then a long bull market led by technology. Buffett launches the Giving Pledge, receives the Medal of Freedom, buys Apple and wins his famous bet against hedge funds. Berkshire starts preparing for life after its founders.","where":{"M":"In his 80s and 90s, still at Buffett's side and still giving big gifts.","B":"Buys huge businesses and Apple; names vice chairmen.","L":"Gives away money through the Lynch Foundation; loses his wife in 2015."}},{"n":11,"a":2020,"b":2026,"title":"Pandemic, AI and farewells","tag":"The end of an era","intro":"A pandemic crash, artificial intelligence, war and new tariffs. Munger dies in 2023, 34 days short of 100. Buffett hands the CEO job to Greg Abel and then the chair to his son Howard. Lynch, in his 80s, is still at Fidelity.","where":{"M":"Works into his late 90s; dies in November 2023.","B":"Steps back: CEO until 2025, chairman until September 2026.","L":"In his 80s, still meeting Fidelity's young analysts."}}],"years":{"1924":{"M":[{"t":"Born in Omaha, Nebraska. His father is a lawyer; his grandfather is a federal judge.","m":"Jan 1","b":1,"s":"wiki"}],"B":[],"L":[],"W":[{"t":"The first modern American mutual fund, Massachusetts Investors Trust, opens in Boston.","m":"Mar","b":1,"k":"mkt"},{"t":"Calvin Coolidge wins the presidential election.","m":"Nov","k":"pol"}]},"1925":{"M":[],"B":[],"L":[],"W":[{"t":"F. Scott Fitzgerald publishes The Great Gatsby.","m":"Apr","k":"cul"},{"t":"The Scopes trial in Tennessee puts the teaching of evolution on trial.","m":"Jul","k":"pol"}]},"1926":{"M":[],"B":[],"L":[],"W":[{"t":"NBC, the first national radio network, goes on the air.","m":"Nov","k":"tech"}]},"1927":{"M":[],"B":[],"L":[],"W":[{"t":"Charles Lindbergh flies solo and non-stop from New York to Paris.","m":"May","b":1,"k":"world"},{"t":"The Jazz Singer brings talking pictures to cinemas.","m":"Oct","k":"cul"}]},"1928":{"M":[],"B":[],"L":[],"W":[{"t":"Alexander Fleming discovers penicillin in London.","m":"Sep","k":"tech"},{"t":"Herbert Hoover is elected president. The same month, Mickey Mouse appears in Steamboat Willie.","m":"Nov","k":"pol"}]},"1929":{"M":[],"B":[],"L":[],"W":[{"t":"The Dow Jones Industrial Average peaks at about 381.","m":"Sep 3","k":"mkt"},{"t":"Wall Street crashes: Black Thursday, Black Monday and Black Tuesday (Oct 24-29). The Great Depression begins.","m":"Oct","b":1,"k":"mkt"}]},"1930":{"M":[],"B":[{"t":"Born in Omaha, Nebraska, ten months after the crash.","m":"Aug 30","b":1,"s":"wiki"}],"L":[],"W":[{"t":"The Smoot-Hawley Act raises tariffs on thousands of imports; other countries hit back.","m":"Jun","k":"pol"},{"t":"The Bank of United States fails as bank runs spread.","m":"Dec","k":"mkt"}]},"1931":{"M":[],"B":[{"t":"The bank where his father works fails. Howard Buffett starts his own small brokerage.","m":"Aug","s":"snow"}],"L":[],"W":[{"t":"The Empire State Building opens in New York.","m":"May","k":"cul"},{"t":"Stocks lose about 44% in the year, the worst calendar year on record.","k":"mkt"}]},"1932":{"M":[],"B":[],"L":[],"W":[{"t":"The Dow bottoms at 41, down 89% from its 1929 peak.","m":"Jul 8","b":1,"k":"mkt"},{"t":"Franklin D. Roosevelt wins the presidency in a landslide.","m":"Nov","k":"pol"}]},"1933":{"M":[],"B":[],"L":[],"W":[{"t":"Adolf Hitler becomes chancellor of Germany.","m":"Jan","k":"world"},{"t":"Roosevelt takes office, closes the banks for a 'bank holiday' and launches the New Deal.","m":"Mar","b":1,"k":"pol"},{"t":"The Securities Act and the Glass-Steagall Act pass; bank deposits become federally insured.","m":"May-Jun","k":"mkt"}]},"1934":{"M":[],"B":[],"L":[],"W":[{"t":"The Securities Exchange Act creates the SEC to police Wall Street. Joseph Kennedy is its first chairman.","m":"Jun","b":1,"k":"mkt"},{"t":"Benjamin Graham and David Dodd publish Security Analysis, the founding text of value investing.","b":1,"k":"mkt"}]},"1935":{"M":[],"B":[],"L":[],"W":[{"t":"The Social Security Act becomes law.","m":"Aug","k":"pol"}]},"1936":{"M":[],"B":[{"t":"At six, buys six-packs of Coca-Cola and resells the bottles one by one at a profit.","s":"snow"}],"L":[],"W":[{"t":"Jesse Owens wins four gold medals at the Berlin Olympics.","m":"Aug","k":"cul"},{"t":"Roosevelt wins a second term.","m":"Nov","k":"pol"}]},"1937":{"M":[],"B":[],"L":[],"W":[{"t":"The Golden Gate Bridge opens in San Francisco.","m":"May","k":"cul"},{"t":"A sharp new recession: stocks lose about 35% in the year.","k":"mkt"},{"t":"Disney's Snow White, the first full-length cel-animated feature, premieres.","m":"Dec","k":"cul"}]},"1938":{"M":[],"B":[],"L":[],"W":[{"t":"The Fair Labor Standards Act sets the first federal minimum wage.","m":"Jun","k":"pol"},{"t":"Orson Welles's War of the Worlds radio drama alarms listeners.","m":"Oct","k":"cul"}]},"1939":{"M":[],"B":[],"L":[],"W":[{"t":"Germany invades Poland. World War II begins in Europe.","m":"Sep 1","b":1,"k":"world"},{"t":"Gone with the Wind and The Wizard of Oz reach cinemas.","k":"cul"}]},"1940":{"M":[],"B":[{"t":"At 10, visits New York with his father and tours the New York Stock Exchange.","s":"wiki"},{"t":"As a boy he often chalks stock prices onto the blackboard at his father's brokerage office.","s":"bio"}],"L":[],"W":[{"t":"The Investment Company Act sets the rules for mutual funds.","k":"mkt"},{"t":"Roosevelt wins a third term.","m":"Nov","k":"pol"}]},"1941":{"M":[{"t":"Leaves Omaha for the University of Michigan to study mathematics.","b":1,"s":"bi"}],"B":[],"L":[],"W":[{"t":"Citizen Kane premieres.","m":"May","k":"cul"},{"t":"Japan attacks Pearl Harbor. The United States enters World War II.","m":"Dec 7","b":1,"k":"world"}]},"1942":{"M":[],"B":[{"t":"At 11, buys his first stock: three shares of Cities Service preferred at $38 (and three for his sister). They fall to $27; he sells at $40, then watches them climb past $200.","m":"Mar 11","b":1,"s":"time15"},{"t":"His father, Howard Buffett, is elected to Congress.","m":"Nov","s":"wiki"}],"L":[],"W":[{"t":"The Manhattan Project to build an atomic bomb begins.","k":"tech"},{"t":"Casablanca premieres.","m":"Nov","k":"cul"}]},"1943":{"M":[{"t":"A few days after turning 19, leaves college for the Army Air Corps. He trains as a weather forecaster and later serves in Nome, Alaska.","m":"Jan","b":1,"s":"wiki"}],"B":[{"t":"The family moves to Washington, D.C. He takes on several newspaper routes.","s":"wiki"}],"L":[],"W":[{"t":"Oklahoma! opens on Broadway.","m":"Mar","k":"cul"}]},"1944":{"M":[],"B":[{"t":"At 13, files his first tax return and deducts his bicycle and watch as business expenses: $35.","s":"wiki"}],"L":[{"t":"Peter Spencer Lynch is born in Newton, Massachusetts, near Boston.","m":"Jan 19","b":1,"s":"wiki"}],"W":[{"t":"D-Day: Allied troops land in Normandy.","m":"Jun 6","b":1,"k":"world"},{"t":"The Bretton Woods conference designs the post-war money system and creates the IMF and World Bank.","m":"Jul","k":"mkt"}]},"1945":{"M":[{"t":"Marries Nancy Huggins while training in California.","s":"wiki"}],"B":[{"t":"At 14, buys a 40-acre Nebraska farm with $1,200 of savings. With a friend, puts a $25 used pinball machine in a barbershop.","s":"wiki"}],"L":[],"W":[{"t":"Roosevelt dies. Harry Truman becomes president.","m":"Apr 12","k":"pol"},{"t":"Germany surrenders in May. After atomic bombs fall on Hiroshima and Nagasaki, Japan surrenders and World War II ends.","m":"May-Sep","b":1,"k":"world"},{"t":"The United Nations is founded.","m":"Oct","k":"world"}]},"1946":{"M":[{"t":"Out of the Army, talks his way into Harvard Law School without a college degree, helped by family friend Roscoe Pound, the former dean.","b":1,"s":"lowe"}],"B":[{"t":"At 15, earns more than $175 a month from his paper routes.","s":"wiki"}],"L":[],"W":[{"t":"ENIAC, an early electronic computer, is unveiled.","m":"Feb","k":"tech"},{"t":"It's a Wonderful Life premieres.","m":"Dec","k":"cul"}]},"1947":{"M":[],"B":[{"t":"Graduates from high school at 16, sells the pinball business for $1,200 and enters Wharton.","m":"Jun","s":"wiki"}],"L":[],"W":[{"t":"Jackie Robinson breaks baseball's colour line with the Brooklyn Dodgers.","m":"Apr","k":"cul"},{"t":"The Marshall Plan to rebuild Europe is announced.","m":"Jun","k":"pol"},{"t":"Bell Labs invents the transistor.","m":"Dec","b":1,"k":"tech"}]},"1948":{"M":[{"t":"Graduates from Harvard Law magna cum laude, one of 12 in a class of 335, an k":"pol"},{"t":"President Kennedy is assassinated in Dallas. Lyndon Johnson takes over.","m":"Nov 22","b":1,"k":"pol"}]},"1964":{"M":[],"B":[{"t":"Berkshire's boss, Seabury Stanton, offers slightly less for Buffett's shares than they had agreed. Angry, Buffett decides to buy control instead.","b":1,"s":"brk"}],"L":[],"W":[{"t":"The Beatles appear on The Ed Sullivan Show.","m":"Feb","k":"cul"},{"t":"The Civil Rights Act becomes law.","m":"Jul 2","b":1,"k":"pol"}]},"1965":{"M":[{"t":"Stops practising law to concentrate on investing.","s":"cnn"}],"B":[{"t":"Takes control of Berkshire Hathaway. Ken Chace runs the mills; Buffett runs the money.","m":"May","b":1,"s":"brk"}],"L":[{"t":"Graduates from Boston College, having studied history, psychology and philosophy rather than business.","b":1,"s":"wiki"}],"W":[{"t":"US combat troops land in Vietnam.","m":"Mar","k":"world"},{"t":"Medicare and Medicaid are created.","m":"Jul","k":"pol"}]},"1966":{"M":[{"t":"With Buffett and Sandy Gottesman, buys a Baltimore department store, Hochschild, Kohn, through a new company, Diversified Retailing. Buffett later calls it a mistake.","s":"brk"}],"B":[{"t":"Closes the partnership to new money. Buys about 5% of Walt Disney Productions and meets Walt Disney himself.","s":"wiki"}],"L":[{"t":"Wins a summer job at Fidelity, one of three picked from about 75 applicants. He had caddied for Fidelity's president, D. George Sullivan.","b":1,"s":"fortune"}],"W":[{"t":"The Dow nears 1,000, then stalls. It will not stay above 1,000 until 1982.","m":"Feb","k":"mkt"}]},"1967":{"M":[],"B":[{"t":"Berkshire buys National Indemnity, an Omaha insurer, for $8.6 million. Its 'float' becomes the engine of Berkshire's investing.","m":"Mar","b":1,"s":"brk"}],"L":[],"W":[{"t":"The first Super Bowl is played.","m":"Jan","k":"cul"},{"t":"Muriel Siebert becomes the first woman to own a seat on the New York Stock Exchange.","m":"Dec","k":"mkt"}]},"1968":{"M":[],"B":[{"t":"The partnership's best year ever: +58.8% aga ,"s":"brk"}],"L":[],"W":[{"t":"The Godfather premieres.","m":"Mar","k":"cul"},{"t":"Burglars break into the Watergate building.","m":"Jun","k":"pol"},{"t":"The Dow closes above 1,000 for the first time.","m":"Nov 14","b":1,"k":"mkt"}]},"1973":{"M":[{"t":"His partnership loses 31.9% while the Dow falls 13.1%.","b":1,"s":"super"}],"B":[{"t":"Buys about a tenth of The Washington Post Company for about $10.6 million and befriends its publisher, Katharine Graham.","b":1,"s":"wiki"}],"L":[],"W":[{"t":"The 1973-74 bear market begins.","m":"Jan","k":"mkt"},{"t":"The Arab oil embargo roughly quadruples the price of oil.","m":"Oct","b":1,"k":"world"},{"t":"The Chicago Board Options Exchange opens.","m":"Apr","k":"mkt"}]},"1974":{"M":[{"t":"His partnership loses another 31.5%. His investors' money is down by about half in two years.","b":1,"s":"super"}],"B":[{"t":"Berkshire's shares fall 48.7% this year. In Forbes he says bargains are everywhere: \"Now is the time to invest and get rich.\"","m":"Nov","b":1,"s":"forbes74"}],"L":[{"t":"Becomes Fidelity's director of research.","b":1,"s":"wiki"}],"W":[{"t":"Nixon resigns over Watergate. Gerald Ford becomes president.","m":"Aug 9","b":1,"k":"pol"},{"t":"The Dow bottoms near 578, down about 45% from its 1973 peak.","m":"Dec","k":"mkt"},{"t":"ERISA sets rules for private pension plans.","m":"Sep","k":"mkt"}]},"1975":{"M":[{"t":"His partnership rebounds 73.2%. Over 1962-75 it compounded 19.8% a year, against 5.0% for the Dow.","b":1,"s":"super"}],"B":[],"L":[],"W":[{"t":"'May Day': fixed brokerage commissions end and trading costs fall.","m":"May 1","k":"mkt"},{"t":"John Bogle founds Vanguard.","m":"May","b":1,"k":"mkt"},{"t":"Bill Gates and Paul Allen found Microsoft. Saigon falls on April 30.","m":"Apr","k":"tech"},{"t":"Jaws invents the summer blockbuster.","m":"Jun","k":"cul"}]},"1976":{"M":[{"t":"Winds up Wheeler, Munger & Co.","s":"wiki"}],"B":[{"t":"GEICO nears collapse. Buffett backs its new boss, Jack Byrne, and Berkshire buys a big stake, helping to rescue it.","b":1,"s":"brk"}],"L":[],"W":[{"t":"Steve Jobs and Steve Wozniak found Apple.","m":"Apr 1","k":"tech"},{"t":"America celebrates its 200th birthday.","m":"Jul 4","b":1,"k":"pol"},{"t":"Vanguard launches the first index fund for ordinary investors.","m":"Aug 31","b":1,"k":"mkt"},{"t":"Jimmy Carter is elected president.","m":"Nov","k":"pol"}]},"1977":{"M":[{"t":"Begins 45 years as chairman of Daily Journal Corp., the Los Angeles legal newspaper he bought into.","b":1,"s":"reuters"}],"B":[{"t":"Berkshire buys the Buffalo Evening News for $32.5 million. His 1977 letter is the first in Berkshire's online archive.","m":"Apr","s":"brk"}],"L":[{"t":"At 33, takes over Fidelity's small Magellan Fund, then about $18 million.","m":"May","b":1,"s":"wiki"}],"W":[{"t":"Star Wars premieres.","m":"May 25","b":1,"k":"cul"},{"t":"The Apple II goes on sale.","m":"Jun","k":"tech"}]},"1978":{"M":[{"t":"Becomes vice chairman of Berkshire Hathaway: the start of 45 years at Buffett's side.","b":1,"s":"reuters"},{"t":"In his 50s, a failed cataract operation costs him the sight of his left eye; the eye is later removed.","s":"inman"}],"B":[],"L":[],"W":[{"t":"The Revenue Act of 1978 creates the 401(k) retirement plan.","m":"Nov","k":"mkt"},{"t":"The Camp David Accords between Egypt and Israel.","m":"Sep","k":"world"}]},"1979":{"M":[],"B":[{"t":"Writes in Forbes that pension funds shunning stocks are paying a very high price for a cheery consensus. Berkshire's shares more than double this year.","m":"Aug","s":"forbes"}],"L":[],"W":[{"t":"Paul Volcker becomes Fed chairman to fight inflation.","m":"Aug","b":1,"k":"mkt"},{"t":"BusinessWeek's cover declares 'The Death of Equities'.","m":"Aug 13","b":1,"k":"mkt"},{"t":"The Three Mile Island nuclear accident.","m":"Mar","k":"world"},{"t":"The Iran hostage crisis begins.","m":"Nov","k":"world"}]},"1980":{"M":[],"B":[],"L":[],"W":[{"t":"Inflation peaks near 15%. By December the prime rate reaches 21.5%.","m":"Mar" :"Buys Dexter Shoe with Berkshire shares, a deal he later ranks among his worst. Forbes names him the richest American.","s":"brk"}],"L":[{"t":"Publishes Beating the Street, telling how he picked stocks at Magellan.","b":1,"s":"wiki"}],"W":[{"t":"The first US exchange-traded fund, the S&P 500 'Spider' (SPY), launches.","m":"Jan","b":1,"k":"mkt"},{"t":"A truck bomb explodes under the World Trade Center.","m":"Feb","k":"world"},{"t":"Jurassic Park premieres; Schindler's List follows in December.","m":"Jun","k":"cul"}]},"1994":{"M":[{"t":"At USC's business school, gives 'A Lesson on Elementary Worldly Wisdom': think with a latticework of models from many fields.","m":"Apr","b":1,"s":"pca"}],"B":[],"L":[{"t":"Writes the foreword to Robert Hagstrom's The Warren Buffett Way.","s":"wiley"}],"W":[{"t":"The Fed starts a run of surprise rate rises; bond prices tumble.","m":"Feb","k":"mkt"},{"t":"Jeff Bezos founds Amazon.","m":"Jul","k":"tech"},{"t":"Forrest Gump and The Shawshank Redemption reach cinemas.","k":"cul"}]},"1995":{"M":[{"t":"At Harvard, gives 'The Psychology of Human Misjudgment', his list of the mental tendencies that trip people up.","m":"Jun","b":1,"s":"wiki"}],"B":[{"t":"Agrees to buy the half of GEICO that Berkshire does not already own, for $2.3 billion.","m":"Aug","s":"brk"}],"L":[{"t":"Publishes Learn to Earn, a first investing book for teenagers and beginners.","s":"wiki"}],"W":[{"t":"Netscape's stock-market debut kicks off the internet boom.","m":"Aug 9","b":1,"k":"mkt"},{"t":"The Oklahoma City bombing.","m":"Apr 19","k":"world"},{"t":"Toy Story, the first fully computer-animated feature film.","m":"Nov","k":"cul"}]},"1996":{"M":[],"B":[{"t":"Creates cheaper Class B shares so small investors can buy Berkshire directly instead of through costly copycat funds.","m":"May","s":"brk"}],"L":[{"t":"Tells PBS Frontline that time spent forecasting the economy is mostly wasted.","s":"pbs96"}],"W":[{"t":"Greenspan asks whether 'irrational exuberance' has pushed prices too high.","m":"Dec 5","b":1,"k":"mkt"},{"t":"Clinton is re-elected.","m":"Nov","k":"pol"}]},"1997":{"M":[{"t":"Joins the board of Costco, a company he admires deeply.","s":"barchart"}],"B":[{"t":"Quietly buys about 130 million ounces of silver; the purchase is revealed in early 1998.","s":"brk"}],"L":[],"W":[{"t":"The Asian financial crisis starts in Thailand.","m":"Jul","k":"world"},{"t":"Amazon goes public; IBM's Deep Blue beats chess champion Garry Kasparov.","m":"May","k":"tech"},{"t":"The Dow drops 554 points and trading is halted early.","m":"Oct 27","k":"mkt"},{"t":"Titanic premieres and becomes the highest-grossing film yet.","m":"Dec 19","b":1,"k":"cul"}]},"1998":{"M":[],"B":[{"t":"Agrees to buy General Re for about $22 billion in Berkshire stock, his biggest deal so far. Also buys Executive Jet, now NetJets.","m":"Jun","b":1,"s":"brk"},{"t":"With AIG and Goldman Sachs, offers to buy the collapsing hedge fund Long-Term Capital Management. The offer is turned down.","m":"Sep","b":1,"s":"ap"}],"L":[],"W":[{"t":"Russia defaults on its debt.","m":"Aug 17","k":"world"},{"t":"The Fed brokers a bank rescue of Long-Term Capital Management.","m":"Sep 23","b":1,"k":"mkt"},{"t":"Google is founded.","m":"Sep","k":"tech"},{"t":"Saving Private Ryan premieres.","m":"Jul","k":"cul"},{"t":"Clinton is impeached by the House; the Senate acquits him in 1999.","m":"Dec","k":"pol"}]},"1999":{"M":[],"B":[{"t":"At Sun Valley, warns tech-loving executives that stock returns ahead will disappoint. Berkshire's shares fall 19.9% as the tech boom roars.","m":"Jul","b":1,"s":"fortune99"}],"L":[],"W":[{"t":"The Dow closes above 10,000 for the first time.","m":"Mar 29","k":"mkt"},{"t":"The euro is launched.","m":"Jan 1","k":"world"},{"t":"The Gramm-Leach-Bliley Act tears down the Glass-Steagall wall.","m":"Nov","k":"mkt"},{"t":"The Matrix premieres.","m":"Mar","k":"cul"}]},"2000":{"M":[{"t":"Janet Lowe's biography of him, Damn Right!, is published.","s":"lowe"}],"B":[{"t":"Proved right: Berkshire's shares rise 26.6% while the S&P 500 falls 9.1%. Buys MidAmerican Energy and Benjamin Moore and agrees to buy Johns Manville.","b":1,"s":"brk"}],"L":[{"t":"A new edition of One Up on Wall Street warns that very few dot-com investors \"benefit from the full ride.\"","m":"Apr","b":1,"s":"lynch89"}],"W":[{"t":"The Nasdaq peaks above 5,000. It will fall 78% by 2002.","m":"Mar 10","b":1,"k":"mkt"},{"t":"Vanguard's S&P 500 index fund overtakes Magellan as the world's largest mutual fund.","m":"Apr","k":"mkt"},{"t":"The Supreme Court settles the Bush-Gore election.","m":"Dec","k":"pol"}]},"2001":{"M":[],"B":[{"t":"Buys Shaw Industries, the carpet maker.","m":"Jan","s":"brk"}],"L":[],"W":[{"t":"Terrorists attack New York and Washington. The stock exchange stays shut until September 17.","m":"Sep 11","b":1,"k":"world"},{"t":"Enron files for bankruptcy.","m":"Dec 2","k":"mkt"},{"t":"Apple launches the iPod.","m":"Oct","k":"tech"}]},"2002":{"M":[],"B":[{"t":"Begins buying shares of PetroChina.","s":"brk"}],"L":[],"W":[{"t":"WorldCom collapses; Congress passes the Sarbanes-Oxley Act to tighten corporate accounting.","m":"Jul","k":"mkt"},{"t":"The bear market hits bottom: the S&P 500 is down about half from its 2000 peak.","m":"Oct 9","b":1,"k":"mkt"},{"t":"Euro notes and coins go into circulation.","m":"Jan","k":"world"}]},"2003":{"M":[{"t":"At UC Santa Barbara, takes academic economics to task for ignoring psychology and other fields.","m":"Oct","s":"pca"}],"B":[{"t":"In his letter for 2002, calls derivatives \"financial weapons of mass destruction.\" Buys Clayton Homes and McLane.","m":"Mar","b":1,"s":"brk"}],"L":[],"W":[{"t":"The Iraq War begins.","m":"Mar 20","k":"world"},{"t":"The space shuttle Columbia breaks up on re-entry.","m":"Feb 1","k":"world"},{"t":"The Human Genome Project is completed.","m":"Apr","k":"tech"}]},"2004":{"M":[{"t":"Gives Stanford Berkshire shares worth $43.5 million for graduate housing.","s":"wiki"}],"B":[{"t":"His wife, Susan Thompson Buffett, dies.","m":"Jul 29","b":1,"s":"wiki"}],"L":[],"W":[{"t":"Facebook is founded at Harvard.","m":"Feb","k":"tech"},{"t":"Google goes public.","m":"Aug 19","k":"mkt"},{"t":"The Indian Ocean tsunami kills about 230,000 people.","m":"Dec 26","k":"world"}]},"2005":{"M":[{"t":"Peter Kaufman publishes Poor Charlie's Almanack, a collection of his talks and wit.","b":1,"s":"caltech"}],"B":[],"L":[],"W":[{"t":"Hurricane Katrina devastates New Orleans.","m":"Aug","k":"world"},{"t":"YouTube is founded.","m":"Feb","k":"tech"}]},"2006":{"M":[],"B":[{"t":"Pledges most of his fortune to charity, mainly to the Bill & Melinda Gates Foundation, the biggest gift in history at the time.","m":"Jun 26","b":1,"s":"wiki"},{"t":"Marries Astrid Menks on his 76th birthday. Earlier, buys 80% of Israeli toolmaker Iscar for $4 billion.","m":"Aug 30","s":"wiki"}],"L":[],"W":[{"t":"Ben Bernanke becomes Fed chairman.","m":"Feb","k":"mkt"},{"t":"US house prices peak.","k":"mkt"},{"t":"Twitter is launched.","m":"Mar","k":"tech"}]},"2007":{"M":[],"B":[{"t":"Sells PetroChina for about $4 billion, builds a stake in the railroad Burlington Northern and agrees to buy Marmon. Takes up a $1 million bet that an S&P 500 index fund will beat a group of hedge funds over the 10 years from 2008.","s":"brk"}],"L":[],"W":[{"t":"Steve Jobs unveils the iPhone.","m":"Jan 9","b":1,"k":"tech"},{"t":"A French bank freezes funds holding US subprime loans; the credit crunch begins.","m":"Aug 9","k":"mkt"},{"t":"The Dow peaks above 14,000.","m":"Oct 9","k":"mkt"}]},"2008":{"M":[{"t":"His idea: Berkshire buys about 10% of Chinese carmaker and battery maker BYD for about $230 million.","m":"Sep","b":1,"s":"cnbc"}],"B":[{"t":"As Wall Street panics, invests $5 billion in Goldman Sachs and $3 billion in General Electric, then writes in The New York Times: \"Buy American. I Am.\"","m":"Sep-Oct","b":1,"s":"nyt"},{"t":"Forbes ranks him the richest person in the world.","m":"Mar","s":"forbes"}],"L":[],"W":[{"t":"JPMorgan rescues Bear Stearns.","m":"Mar","k":"mkt"},{"t":"Lehman Brothers goes bankrupt; the government rescues AIG.","m":"Sep 15","b":1,"k":"mkt"},{"t":"Congress passes the $700 billion TARP bailout.","m":"Oct 3","k":"mkt"},{"t":"Barack Obama is elected president.","m":"Nov 4","b":1,"k":"pol"},{"t":"Bernie Madoff is arrested.","m":"Dec 11","k":"mkt"}]},"2009":{"M":[{"t":"Near the market bottom, Daily Journal, which he chairs, buys shares in big US banks.","s":"dj"}],"B":[{"t":"Agrees to buy the rest of Burlington Northern Santa Fe, calling it an all-in bet on the US economy. The deal values the railroad at about $44 billion including debt.","m":"Nov 3","b":1,"s":"brk"}],"L":[],"W":[{"t":"The S&P 500 bottoms at 677, down about 57% from its 2007 peak.","m":"Mar 9","b":1,"k":"mkt"},{"t":"General Motors goes bankrupt.","m":"Jun 1","k":"mkt"},{"t":"Avatar premieres; it becomes the highest-grossing film ever.","m":"Dec","k":"cul"}]},"2010":{"M":[{"t":"His wife, Nancy, dies at 86.","m":"Feb 6","s":"wiki"}],"B":[{"t":"With Bill and Melinda Gates, launches the Giving Pledge, asking the very rich to give away most of their wealth.","m":"Jun","b":1,"s":"wiki"},{"t":"The Burlington Northern purchase closes; hires investment manager Todd Combs.","s":"brk"}],"L":[{"t":"The Lynch Foundation gives $20 million to create a leadership academy at Boston College.","s":"wiki"}],"W":[{"t":"The 'Flash Crash' knocks nearly 1,000 points off the Dow in minutes.","m":"May 6","k":"mkt"},{"t":"The Dodd-Frank Act reshapes financial regulation.","m":"Jul 21","k":"mkt"},{"t":"The Deepwater Horizon oil spill in the Gulf of Mexico.","m":"Apr 20","k":"world"}]},"2011":{"M":[{"t":"Wesco merges into Berkshire, ending his annual Wesco meetings in Pasadena.","s":"wiki"}],"B":[{"t":"Receives the Presidential Medal of Freedom from President Obama.","m":"Feb 15","b":1,"s":"wiki"},{"t":"Buys Lubrizol for about $9 billion and invests $5 billion in Bank of America. In The New York Times, argues that the super-rich should pay more tax.","m":"Mar-Aug","s":"brk"}],"L":[],"W":[{"t":"An earthquake and tsunami in Japan cause the Fukushima nuclear disaster.","m":"Mar 11","k":"world"},{"t":"S&P strips the United States of its AAA credit rating.","m":"Aug 5","b":1,"k":"mkt"},{"t":"Steve Jobs dies.","m":"Oct 5","k":"tech"}]},"2012":{"M":[],"B":[{"t":"Announces he has early-stage prostate cancer; he finishes radiation treatment that year.","m":"Apr","s":"wiki"}],"L":[],"W":[{"t":"Facebook goes public.","m":"May 18","k":"mkt"},{"t":"A software glitch costs Knight Capital $440 million in 45 minutes.","m":"Aug 1","k":"mkt"},{"t":"Hurricane Sandy shuts the stock market for two days.","m":"Oct 29-30","k":"mkt"},{"t":"Obama is re-elected.","m":"Nov","k":"pol"}]},"2013":{"M":[{"t":"Announces a $110 million gift to the University of Michigan.","m":"Apr","s":"wiki"}],"B":[{"t":"Teams up with 3G Capital to buy Heinz for about $23 billion.","m":"Feb","s":"brk"}],"L":[{"t":"The New York Times profiles him: once a money manager, now a full-time giver.","m":"Nov","s":"nyt13"}],"W":[{"t":"The S&P 500 closes at a record, finally above its 2007 peak.","m":"Mar 28","k":"mkt"},{"t":"The Wolf of Wall Street premieres.","m":"Dec","k":"cul"}]},"2014":{"M":[{"t":"Pledges $65 million to UC Santa Barbara's Kavli Institute for physics.","m":"Oct","s":"wiki"}],"B":[{"t":"Swaps Berkshire's Procter & Gamble shares for the Duracell battery business.","m":"Nov","s":"brk"}],"L":[],"W":[{"t":"Janet Yellen becomes the first woman to chair the Fed.","m":"Feb","k":"mkt"},{"t":"Alibaba raises $25 billion in the biggest share sale yet.","m":"Sep 19","k":"mkt"}]},"2015":{"M":[{"t":"For Berkshire's 50th anniversary, writes his own letter to shareholders for the first time, next to Buffett's.","m":"Feb","b":1,"s":"fortune"}],"B":[{"t":"Looks back on 50 years in his anniversary letter. Later, Kraft merges with Heinz and Berkshire agrees to buy Precision Castparts, one of its biggest deals ever.","m":"Feb","b":1,"s":"brk"}],"L":[{"t":"His wife, Carolyn, co-founder of the Lynch Foundation, dies at 69.","m":"Oct","s":"wiki"}],"W":[{"t":"China's stock market crashes.","m":"Jun-Aug","k":"mkt"},{"t":"The Fed raises rates for the first time since 2006.","m":"Dec 16","k":"mkt"},{"t":"The Big Short brings the 2008 crisis to cinemas.","m":"Dec","k":"cul"}]},"2016":{"M":[{"t":"Pledges $200 million to UC Santa Barbara for a huge student dormitory he designs himself.","m":"Mar","s":"wiki"}],"B":[{"t":"Berkshire reveals its first Apple shares. Apple later becomes its biggest stock holding.","m":"May","s":"brk"}],"L":[],"W":[{"t":"Donald Trump is elected president.","m":"Nov 8","b":1,"k":"pol"},{"t":"Britain votes to leave the European Union.","m":"Jun 23","k":"world"},{"t":"Google's AlphaGo beats Go champion Lee Sedol.","m":"Mar","k":"tech"}]},"2017":{"M":[],"B":[{"t":"Wins his 10-year, $1 million bet: the S&P 500 index fund beats the hand-picked hedge funds by a wide margin.","m":"Dec 31","b":1,"s":"brk"}],"L":[],"W":[{"t":"Bitcoin nears $20,000.","m":"Dec","k":"mkt"},{"t":"The Tax Cuts and Jobs Act cuts the corporate tax rate to 21%.","m":"Dec 22","k":"mkt"}]},"2018":{"M":[],"B":[{"t":"Makes Greg Abel and Ajit Jain vice chairmen, a clear step towards succession.","m":"Jan","s":"reuters"}],"L":[],"W":[{"t":"The Dow falls 1,175 points, its biggest point drop to that date.","m":"Feb 5","k":"mkt"},{"t":"Apple becomes the first US company worth $1 trillion.","m":"Aug 2","b":1,"k":"mkt"},{"t":"A Christmas Eve sell-off caps the worst December since 1931.","m":"Dec","k":"mkt"}]},"2019":{"M":[],"B":[{"t":"Admits Berkshire overpaid for Kraft Heinz after a $15.4 billion write-down. Commits $10 billion to help Occidental Petroleum buy Anadarko.","m":"Feb-Apr","s":"brk"}],"L":[],"W":[{"t":"Avengers: Endgame passes Avatar as the highest-grossing film.","m":"Jul","k":"cul"},{"t":"Saudi Aramco's share sale is the largest ever.","m":"Dec","k":"mkt"}]},"2020":{"M":[],"B":[{"t":"Holds the annual meeting in an empty arena, with Greg Abel beside him; Munger stays home in Los Angeles. Reveals Berkshire has sold all its airline shares.","m":"May 2","s":"cnbc"},{"t":"On his 90th birthday, reveals stakes of about 5% in each of five Japanese trading houses.","m":"Aug 30","b":1,"s":"cnbc"}],"L":[],"W":[{"t":"COVID-19: the S&P 500 falls 34% in 33 days, the fastest bear market ever. Trading halts four times in March.","m":"Feb-Mar","b":1,"k":"mkt"},{"t":"The $2.2 trillion CARES Act.","m":"Mar 27","k":"mkt"},{"t":"Joe Biden is elected president.","m":"Nov","k":"pol"}]},"2021":{"M":[{"t":"At the annual meeting, lets slip that Greg Abel will keep Berkshire's culture. Days later Buffett confirms Abel as his successor.","m":"May 1","b":1,"s":"cnbc"},{"t":"His windowless design for the Munger Hall dormitory sparks a public row.","m":"Oct","s":"wiki"}],"B":[],"L":[{"t":"At an MIT conference, calls Buffett the greatest investor of all time.","m":"Mar","s":"ritholtz"}],"W":[{"t":"Rioters storm the US Capitol.","m":"Jan 6","k":"pol"},{"t":"The GameStop short squeeze.","m":"Jan","k":"mkt"}]},"2022":{"M":[{"t":"Steps down as chairman of Daily Journal after 45 years, at 98.","m":"Mar","s":"reuters"}],"B":[{"t":"Buys big stakes in Occidental and Chevron and agrees to buy Alleghany for $11.6 billion. Berkshire's shares rise 4.0% while the S&P 500 falls 18.1%.","s":"brk"}],"L":[],"W":[{"t":"Russia invades Ukraine.","m":"Feb 24","b":1,"k":"world"},{"t":"The Fed starts its fastest rate rises since the 1980s.","m":"Mar","k":"mkt"},{"t":"The FTX crypto exchange collapses.","m":"Nov","k":"mkt"},{"t":"ChatGPT is released.","m":"Nov 30","b":1,"k":"tech"}]},"2023":{"M":[{"t":"Dies at 99 in a Santa Barbara hospital, 34 days before his 100th birthday. Buffett says Berkshire could not have been built without him.","m":"Nov 28","b":1,"s":"ap"}],"B":[{"t":"Visits Japan and raises Berkshire's stakes in the trading houses.","m":"Apr","s":"cnbc"}],"L":[{"t":"In interviews, talks about his biggest misses, like Apple, and says of rapid trading: \"That's not investing. That's gambling.\"","s":"yahoo23"}],"W":[{"t":"Silicon Valley Bank fails.","m":"Mar 10","k":"mkt"},{"t":"Nvidia passes $1 trillion in market value.","m":"May 30","k":"mkt"},{"t":"Oppenheimer and Barbie open on the same day.","m":"Jul","k":"cul"}]},"2024":{"M":[],"B":[{"t":"Opens his annual letter with a tribute: 'Charlie Munger - The Architect of Berkshire Hathaway'.","m":"Feb 24","b":1,"s":"brk"},{"t":"Berkshire becomes the first US company outside technology worth $1 trillion. During the year it sells much of its Apple stake.","m":"Aug 28","b":1,"s":"cnbc"}],"L":[{"t":"Turns 80.","m":"Jan 19"}],"W":[{"t":"US regulators approve spot bitcoin ETFs.","m":"Jan 10","k":"mkt"},{"t":"Japan's Nikkei finally passes its 1989 peak.","m":"Feb","k":"mkt"},{"t":"Donald Trump wins a second term.","m":"Nov 5","k":"pol"}]},"2025":{"M":[],"B":[{"t":"At his 60th annual meeting as CEO, warns that trade should not be used as a weapon, then surprises everyone: Greg Abel will become CEO at year-end. The board agrees the next day.","m":"May 3","b":1,"s":"ap"},{"t":"Berkshire agrees to buy OxyChem for $9.7 billion, probably his last big deal as CEO.","m":"Oct 2","s":"bloomberg"},{"t":"In a Thanksgiving letter, says he is \"going quiet\" and will no longer write the annual letter.","m":"Nov 10","b":1,"s":"fortune"}],"L":[{"t":"The Museum of American Finance gives him its Lifetime Achievement Award.","s":"moaf"}],"W":[{"t":"Trump begins his second term.","m":"Jan 20","k":"pol"},{"t":"A cheap Chinese AI model, DeepSeek, knocks about $590 billion off Nvidia in a day.","m":"Jan 27","k":"mkt"},{"t":"'Liberation Day' tariffs: the S&P 500 drops 10.5% in two days and nearly 20% from its peak before most tariffs are paused.","m":"Apr 2-9","b":1,"k":"mkt"},{"t":"Leo XIV becomes the first American pope.","m":"May 8","k":"world"},{"t":"Nvidia becomes the first company worth $5 trillion.","m":"Oct 29","k":"mkt"},{"t":"The longest government shutdown in US history: 43 days.","m":"Oct-Nov","k":"pol"}]},"2026":{"M":[{"t":"At the meeting, Berkshire retires a jersey for him too, with the number 45: his years as vice chairman.","m":"May 2","s":"fortune26"}],"B":[{"t":"Greg Abel becomes CEO. Buffett, 95, stays chairman and still comes to the office five days a week.","m":"Jan 1","b":1,"s":"yahoo26"},{"t":"For the first time in 60 years, the annual letter is not his: Abel writes it.","m":"Feb 28","s":"ap"},{"t":"Watches the annual meeting from the front row while Abel runs it. Berkshire retires a jersey for him with the number 60, his years as CEO.","m":"May 2","b":1,"s":"fortune26"},{"t":"At 96, steps down as chairman and becomes chairman emeritus. His son Howard, a director since 1993, becomes chairman.","m":"Sep 18","b":1,"s":"ap"},{"t":"In his Thanksgiving letter, gives about $5.5 billion of Berkshire shares to four family foundations and writes that kindness compounds.","m":"Nov 16","s":"fox"}],"L":[{"t":"Turns 82. Still vice chairman of Fidelity Management & Research, meeting its young analysts several times a year.","m":"Jan 19","s":"moaf"}],"W":[{"t":"The United States and Israel strike Iran. Oil heads towards $120 as the Strait of Hormuz closes.","m":"Feb 28","b":1,"k":"world"},{"t":"After a wobble, the S&P 500 hits new records, led by AI companies.","m":"Apr","k":"mkt"},{"t":"Kevin Warsh succeeds Jerome Powell as Fed chairman.","m":"May 22","k":"mkt"},{"t":"America turns 250.","m":"Jul 4","b":1,"k":"pol"},{"t":"The United States, Canada and Mexico host the FIFA World Cup.","m":"Jun-Jul","k":"cul"},{"t":"Americans vote in the midterm elections.","m":"Nov 3","k":"pol"}]}},"threads":{"1924":"The mutual fund is born in Boston the year Munger is born. Twenty years later Lynch is born near Boston; one day he will run the biggest fund of its kind.","1930":"Tariffs then and now: Smoot-Hawley deepened the slump. In 2025, new tariffs sent stocks down nearly 20%, and Buffett, born in 1930, warned against using trade as a weapon.","1934":"Graham and Dodd's book appears when Buffett is four. Sixteen years later he enrols at Columbia to learn from them in person.","1949":"The Intelligent Investor comes out. Within a year it changes Buffett's life.","1957":"The S&P 500 is born in the first full year of Buffett's partnership.","1959":"Lynch, 15, is carrying golf bags near Boston the year Buffett and Munger meet in Omaha.","1966":"Lynch walks into Fidelity as a summer intern the year Buffett closes his partnership to new money.","1972":"See's Candies is bought in January; in November the Dow passes 1,000. Lynch is a 28-year-old analyst.","1977":"Lynch takes over Magellan; Munger starts chairing Daily Journal; Buffett writes the first letter in Berkshire's online archive. All in one year.","1987":"All three in one storm: Buffett had just bought into Salomon, Munger was his vice chairman, and Lynch was on a golf trip in Ireland.","1990":"Lynch retires at 46. At 46, Buffett was rescuing GEICO and Munger was running his own fund.","2000":"The index fund overtakes Magellan, the fund Lynch built, just as the dot-com bubble bursts.","2008":"Munger's idea (BYD) and Buffett's nerve (Goldman Sachs, GE) in the same autumn.","2023":"Munger dies 34 days short of 100, after 64 years of friendship with Buffett.","2026":"For the first time since 1970, Buffett is neither CEO nor chairman of Berkshire."},"crossings":[{"y":1938,"who":"MB","lab":"1930s","t":"Same grocery, different years","d":"As a teenager Munger worked at Buffett & Son, the Omaha grocery owned by Warren's grandfather. Warren worked there too, later. They did not meet."},{"y":1957,"who":"MB","lab":"1957","t":"A doctor's hunch","d":"Dr. Edwin Davis invests $100,000 with Buffett because he reminds him of Charlie Munger. The Davises are determined to introduce them."},{"y":1959,"who":"MB","lab":"1959","t":"First meeting","d":"Back in Omaha after his father's death, Munger meets Buffett at a dinner arranged by the Davis family. Buffett knows at once he has found someone to learn from."},{"y":1960,"who":"MB","lab":"c. 1960","t":"Law as a hobby","d":"Buffett tells Munger that law is fine as a hobby, but he could do better. Two years later Munger starts his own fund."},{"y":1966,"who":"MB","lab":"1966","t":"Partners in a store","d":"With Sandy Gottesman they buy the Baltimore department store Hochschild, Kohn. It is a mistake, and an early lesson for both."},{"y":1972,"who":"MB","lab":"1972","t":"See's Candies","d":"Munger persuades Buffett to pay up for a great business. See's becomes the model for Berkshire's later buys."},{"y":1978,"who":"MB","lab":"1978","t":"Vice chairman","d":"Munger formally joins Berkshire as vice chairman: the start of 45 years side by side."},{"y":1984,"who":"MB","lab":"1984","t":"Superinvestors","d":"Buffett's famous Columbia talk uses Munger's partnership record as proof that Graham's way works."},{"y":1989,"who":"BL","lab":"1989","t":"The phone call","d":"Buffett phones Lynch at home to ask if he may quote One Up on Wall Street in his annual letter. Lynch's daughter takes the call."},{"y":1994,"who":"BL","lab":"1994","t":"The foreword","d":"Lynch writes the foreword to The Warren Buffett Way."},{"y":2008,"who":"MB","lab":"2008","t":"BYD","d":"Munger champions the Chinese carmaker BYD, and Berkshire buys about 10% of it."},{"y":2015,"who":"MB","lab":"2015","t":"Two letters","d":"For Berkshire's 50th anniversary each writes his own letter to shareholders, side by side."},{"y":2021,"who":"BL","lab":"2021","t":"The greatest","d":"Lynch calls Buffett the greatest investor of all time."},{"y":2021,"who":"MB","lab":"2021","t":"The slip","d":"Munger lets slip at the annual meeting that Greg Abel will keep the culture. Buffett confirms Abel as his successor."},{"y":2023,"who":"MB","lab":"2023","t":"Goodbye, Charlie","d":"Munger dies at 99. Buffett says Berkshire could not have been built to what it is without him."},{"y":2026,"who":"MB","lab":"2026","t":"Two jerseys","d":"Berkshire retires a '60' jersey for Buffett and a '45' jersey for Munger at the first meeting run by Greg Abel."}],"storms":[{"id":"1929","name":"The Great Crash","years":[1929,1932],"when":"Sep 1929 to Jul 1932","drop":89,"index":"Dow","what":"Wall Street crashes in October 1929 and keeps falling for almost three years. Banks fail and a quarter of workers lose their jobs.","M":"Aged 5 to 8 in Omaha.","B":"Born in August 1930, in the middle of it. In 1931 the bank where his father works fails.","L":"Not yet born."},{"id":"1937","name":"The 1937 relapse","years":[1937,1938],"when":"1937 to 1938","drop":null,"index":"","what":"Just as the economy recovers, a new recession hits. Stocks lose about 35% in 1937 alone.","M":"A 13-year-old in Omaha.","B":"Six or seven, already selling things for a profit.","L":"Not yet born."},{"id":"1962","name":"The Kennedy Slide","years":[1962,1962],"when":"Dec 1961 to Jun 1962","drop":null,"index":"","what":"A sharp fall in the first half of 1962, with a one-day crash on May 28.","M":"Starts his own fund this year and makes +30.1% while the Dow falls 7.6%.","B":"His partnership makes +13.9% against -7.6% for the Dow.","L":"18, at Boston College."},{"id":"1973","name":"The 1973-74 crash","years":[1973,1974],"when":"Jan 1973 to Oct 1974","drop":48,"index":"S&P 500","what":"Oil shock, inflation and Watergate. The 'Nifty Fifty' favourites collapse and the S&P 500 loses nearly half its value.","M":"His fund loses 31.9% and then 31.5%. He holds on, and in 1975 it rebounds 73.2%.","B":"Buys a stake in the Washington Post in 1973. Berkshire's shares fall 48.7% in 1974, yet he tells Forbes: \"Now is the time to invest and get rich.\"","L":"Becomes Fidelity's director of research in 1974."},{"id":"1980","name":"The Volcker squeeze","years":[1980,1982],"when":"1980 to Aug 1982","drop":null,"index":"","what":"The Fed pushes interest rates to record highs to kill inflation. Two recessions follow, then a great bull market starts in August 1982.","M":"Berkshire's vice chairman.","B":"Berkshire's shares rise 31.8% in 1981 while the S&P 500 falls 5%.","L":"Magellan opens to the public in 1981. Later he says: \"Nobody called me to tell me about the recession in 1980 and 1981.\""},{"id":"1987","name":"Black Monday","years":[1987,1987],"when":"19 Oct 1987","drop":23,"index":"Dow, one day","what":"The Dow falls 22.6% in a single day, still its worst day ever. Yet the S&P 500 ends the year slightly up.","M":"Berkshire's vice chairman. Berkshire ends 1987 up 4.6%.","B":"Had just invested $700 million in Salomon. Berkshire's shares drop from about $3,890 to $3,170 within days.","L":"On a golf trip in Ireland. Magellan loses about a third in two days; he cuts the trip short."},{"id":"1998","name":"LTCM and Russia","years":[1998,1998],"when":"Jul to Oct 1998","drop":19,"index":"S&P 500","what":"Russia defaults and the giant hedge fund Long-Term Capital Management nearly collapses. The Fed organises a rescue by Wall Street banks.","M":"Berkshire's vice chairman.","B":"Offers, with AIG and Goldman Sachs, to buy LTCM. The offer is turned down.","L":"Retired from fund management since 1990."},{"id":"2000","name":"The dot-com bust","years":[2000,2002],"when":"Mar 2000 to Oct 2002","drop":49,"index":"S&P 500 (Nasdaq -78%)","what":"The internet bubble bursts. The Nasdaq loses 78% and the S&P 500 about half.","M":"With Buffett, refuses to buy tech stocks he cannot value.","B":"Mocked in 1999 when Berkshire falls 19.9%; proved right in 2000 when it rises 26.6% as the market falls.","L":"Warns in a new edition of his book that very few dot-com investors \"benefit from the full ride.\""},{"id":"2008","name":"The financial crisis","years":[2007,2009],"when":"Oct 2007 to Mar 2009","drop":57,"index":"S&P 500","what":"Subprime loans go bad, Lehman Brothers fails and the financial system nearly freezes.","M":"Champions BYD; near the bottom, Daily Journal buys big-bank shares.","B":"Invests in Goldman Sachs and GE, writes \"Buy American. I Am.\" and agrees to buy Burlington Northern.","L":"Long retired from fund management; in his 60s, at Fidelity."},{"id":"2020","name":"The COVID crash","years":[2020,2020],"when":"19 Feb to 23 Mar 2020","drop":34,"index":"S&P 500","what":"A pandemic shuts the world. The fastest bear market ever, then a fast recovery.","M":"At 96, stays home from Berkshire's empty-arena meeting.","B":"Sells all of Berkshire's airline shares; later buys into five Japanese trading houses.","L":"In his 70s, at Fidelity."},{"id":"2022","name":"The inflation bear","years":[2022,2022],"when":"Jan to Oct 2022","drop":25,"index":"S&P 500","what":"Inflation returns and the Fed raises rates faster than at any time since the 1980s.","M":"Steps down as Daily Journal chairman at 98.","B":"Buys Occidental, Chevron and Alleghany. Berkshire's shares rise 4.0% as the S&P 500 falls 18.1%.","L":"Still at Fidelity, in his late 70s."},{"id":"2025","name":"The tariff shock","years":[2025,2025],"when":"19 Feb to 8 Apr 2025","drop":19,"index":"S&P 500","what":"Sweeping new tariffs send stocks down 10.5% in two days. Most are paused on April 9 and the market recovers to new records.","M":"Died in 2023.","B":"At his last meeting as CEO, says trade can be an act of war, then announces he will step down.","L":"Receives a lifetime achievement award at 81."}],"agePresets":[[11,"At 11, Buffett buys his first stock and Lynch starts carrying golf bags. Munger is an Omaha schoolboy."],[19,"At 19, Buffett reads The Intelligent Investor, Lynch buys Flying Tiger and Munger leaves college for the Army."],[25,"At 25, Buffett starts his partnership and Lynch joins Fidelity full time. Munger is a young Los Angeles lawyer."],[33,"At 33, Lynch takes over Magellan and Buffett buys into American Express after the salad-oil scandal."],[35,"At 35, Munger meets Buffett. In the year he turns 35, Buffett takes control of Berkshire."],[38,"At 38, Munger starts his own fund. In the year he turns 38, Buffett has his best partnership year."],[46,"At 46, Lynch const PACKS = D.packs;
const ORDER = ["buffett", "munger", "lynch"];
const SOON = [];
const DAY = 86400000;
const QWORD = {buffett:"Buffett", munger:"Munger", lynch:"Lynch"};

/* ---------------- state ---------------- */
function todayISO(){ return new Date().toISOString().slice(0,10); }
const DEFAULT = () => ({
  progress:{start:todayISO(), weeks:{}, letters:{}, path:{}, packs:{}},
  notes:{}, bookmarks:{}, cards:{},
  rules:D.checklistSeed.map((t,i)=>({id:"r"+(i+1),text:t,src:"Starter rule",on:false})),
});
const DOCS = ["progress","notes","bookmarks","cards","rules"];
let S = DEFAULT();
let store = {db:null, uid:null, mode:"local"};
function lsGet(){ try{ const v=localStorage.getItem("bls-state"); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(){ try{ localStorage.setItem("bls-state", JSON.stringify(S)); }catch(e){} }
function normalise(){ const p=S.progress; p.weeks=p.weeks||{}; p.letters=p.letters||{}; p.path=p.path||{}; p.packs=p.packs||{}; S.notes=S.notes||{}; S.bookmarks=S.bookmarks||{}; S.cards=S.cards||{}; S.rules=S.rules||[]; }
const local = lsGet(); if(local) S = Object.assign(DEFAULT(), local); normalise();

let UI = {scale:1, theme:"auto", welcomed:false};
try{ const u=localStorage.getItem("bls-ui"); if(u) UI=Object.assign(UI, JSON.parse(u)); }catch(e){}
function saveUI(){ try{ localStorage.setItem("bls-ui", JSON.stringify(UI)); }catch(e){} }
function applyUI(){
  document.documentElement.style.setProperty("--scale", UI.scale);
  if(UI.theme==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", UI.theme);
  
}
applyUI();

const pending = {}, writing = {};
function touch(doc){ lsSet(); setSave("Saving…"); clearTimeout(pending[doc]); pending[doc]=setTimeout(()=>flush(doc), 1200); }
async function flush(doc){
  if(!store.db || !store.uid){ setSave("Saved on this device"); return; }
  if(writing[doc]){ pending[doc]=setTimeout(()=>flush(doc), 600); return; }
  writing[doc]=true;
  try{ await store.db.doc("data/users/"+store.uid+"/"+doc).set({v:JSON.stringify(S[doc]), at:Date.now()}); setSave("Saved to your account"); }
  catch(e){
    if(e && e.code==="unavailable") setTimeout(()=>flush(doc), 1500);
    else if(e && e.code==="quota_exceeded") setSave("Account storage full — saved on this device only");
    else { store.db=null; setSave("Saved on this device"); }
  } finally { writing[doc]=false; }
}
function setSave(t){ const el=document.getElementById("saveState"); if(el) el.textContent=t; }
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const db = await window.claude.use("db"); const user = await window.claude.use("user");
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    store = {db, uid, mode:"account"};
    let found=false;
    for(const doc of DOCS){
      const snap = await db.doc("data/users/"+uid+"/"+doc).get();
      if(snap.exists){ found=true; try{ S[doc]=JSON.parse(snap.data().v); }catch(e){} }
    }
    normalise();
    if(!found){ for(const doc of DOCS) await flush(doc); }
    lsSet(); setSave(store.db?"Saved to your account":"Saved on this device"); render();
  }catch(e){ setSave("Saved on this device"); }
}

/* ---------------- pack context ---------------- */
let CUR = "buffett";
const P = () => PACKS[CUR];
function PR(){ if(CUR==="buffett") return S.progress; return S.progress.packs[CUR] || (S.progress.packs[CUR]={start:todayISO(), weeks:{}, letters:{}, path:{}}); }
function NK(k){ return CUR==="buffett" ? k : CUR+":"+k; }
function BK(id){ return CUR==="buffett" ? id : CUR+":"+id; }
function CK(id){ return CUR==="buffett" ? "c-"+id : CUR+":c-"+id; }
function inPack(cardId){ return CUR==="buffett" ? cardId.startsWith("c-") : cardId.startsWith(CUR+":"); }
function R(view){ return "#" + (CUR==="buffett" ? "" : CUR+"-") + view; }
function unitHref(key){ return R(P().unitRoute+"-"+key); }
function themeHref(num){ return R("theme-"+num); }
const IDX = {};
function idx(){ if(IDX[CUR]) return IDX[CUR]; const p=P();
  const o = {theme:Object.fromEntries(p.themes.map(t=>[t.id,t])), quote:Object.fromEntries(p.quotes.map(q=>[q.id,q])),
    mist:Object.fromEntries(p.mistakes.map(m=>[m.id,m])), unit:Object.fromEntries(p.units.map(u=>[u.key,u]))};
  return IDX[CUR]=o; }

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function strip(s){ return String(s).replace(/<[^>]*>/g,""); }
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("show"),1800); }
function weekNow(){ const s=new Date(PR().start+"T00:00:00"); const d=Math.floor((Date.now()-s)/DAY); return Math.min(12, Math.max(1, Math.floor(d/7)+1)); }
function synTag(){ return '<span class="tag syn" title="Written in our own words">Summary</span>'; }
function wordTag(pid){ return `<span class="tag wb">${QWORD[pid||CUR]}</span>`; }
function unitChip(key){ const u=idx().unit[key]; return u?u.chip:key; }
function unitLinks(n){ return n.units.length ? n.units.map(k=>`<a class="chip" href="${unitHref(k)}">${esc(unitChip(k))}</a>`).join("") : `<span class="chip">${esc(n.tags)}</span>`; }
function hrefFor(pid, view){ return "#" + (pid==="buffett" ? "" : pid+"-") + view; }
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function sentences(t){ return String(t).replace(/([.!?])\s+(?=[A-Z“"])/g,"$1\u0001").split("\u0001").filter(Boolean); }
function bl(items, cls="bl"){ return `<ul class="${cls}">${items.map(i=>`<li>${i}</li>`).join("")}</ul>`; }

/* one idea, as a bullet with its source chips and two actions */
function ideaItem(id){ const n=P().nuggets[id]; if(!n) return ""; const bm=!!S.bookmarks[BK(id)];
  return `<li class="idea"><div class="itx"><b>${esc(n.lead)}</b> ${esc(n.text)}</div>
  <div class="imeta"><span class="src">${unitLinks(n)}</span><span class="iact"><button class="ab ${bm?"on":""}" data-bm="${id}" aria-pressed="${bm}">${bm?"★ Saved":"☆ Save"}</button><button class="ab" data-addrule="${id}">＋ Rule</button></span></div></li>`; }
function ideas(ids){ return ids.length ? `<ul class="ideas">${ids.map(ideaItem).join("")}</ul>` : ""; }

function quoteBlock(qid){ const q=idx().quote[qid]; if(!q) return ""; const bm=!!S.bookmarks[BK(qid)]; const th=idx().theme[q.theme];
  return `<blockquote class="q"><span class="qt">“${esc(q.text)}”</span><cite>${wordTag()} <span>${esc(q.label)}</span> <a href="${themeHref(th.num)}">Ch. ${th.num}</a> <button class="ab ${bm?"on":""}" data-bm="${qid}" aria-pressed="${bm}">${bm?"★ Saved":"☆ Save"}</button></cite></blockquote>`; }

/* tables: 3+ columns stack into labelled cards on phones */
function tbl(head, rows, opt={}){ const stack = opt.stack ?? head.length>=3;
  return `<div class="tw"><table class="t${stack?" stack":""}${opt.cls?" "+opt.cls:""}">${opt.nohead?"":`<thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>`}<tbody>${
    rows.map(r=>`<tr${r.cls?` class="${r.cls}"`:""}>${(r.cells||r).map((c,i)=>`<td data-label="${esc(strip(head[i]||""))}"${i===0&&opt.lead?' class="lead"':""}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; }
function kv(rows){ return `<div class="tw"><table class="t kv"><tbody>${rows.map(([a,b])=>`<tr><th scope="row">${a}</th><td>${b}</td></tr>`).join("")}</tbody></table></div>`; }

/* note boxes: collapsed until you tap "Write", open when they hold text */
const OPEN = new Set(); let FOCUSNEXT = null;
function noteBox(key,label,ph){ const k=NK(key), v=S.notes[k]||"", has=!!v.trim(), open=has||OPEN.has(k);
  return `<details class="nb" data-nk="${esc(k)}" ${open?"open":""}><summary><span class="nbq">${esc(label)}</span><span class="nbh">${has?"✎ Edit":"✎ Write"}</span></summary><textarea id="n-${esc(k)}" data-note="${esc(k)}" placeholder="${esc(ph||"Your answer")}">${esc(v)}</textarea></details>`; }
function askBox(title, items){ return `<div class="ask"><div class="box-h">${esc(title)}</div>${items.join("")}</div>`; }
function mineBox(title, items){ return `<div class="minebox"><div class="box-h"><span class="tag mine">Mine</span> ${esc(title)}</div>${items.join("")}</div>`; }
function legend(){ return `<div class="legend">${synTag()}<span>our words</span>${wordTag()}<span>his exact words</span><span class="tag mine">Mine</span><span>your notes</span></div>`; }

/* ---------------- my journey: the builder's own record ---------------- */
const J = D.journey;
const KIND = {kept:["✓","Kept the rule"], broke:["✗","Broke the rule"], risk:["!","Risk I carry now"]};
const JF = {kind:"all", open:null, start:2015, end:"now"};

const IC_J = {
  story:'<svg viewBox="0 0 24 24"><path d="M4 19V5a1 1 0 0 1 1-1h10l5 5v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M14 4v5h5M8 13h8M8 17h5"/></svg>',

};
function jLink(view){ return "#journey"+(view?"-"+view:""); }
function lessonCard(L, focus){ const [ic,lab]=KIND[L.kind]; const r=L.rule;
  const q = r.quote ? (()=>{ const pk=PACKS[r.pack]; const qq=pk.quotes.find(x=>x.id===r.quote); return qq?`<p class="jq">“${esc(qq.text)}” <span class="small muted">${esc(pk.short)}, ${esc(qq.label)}</span></p>`:""; })() : "";
  const link = r.pack ? `<a class="chip" href="${hrefFor(r.pack,"theme-"+PACKS[r.pack].themes.find(t=>t.id===r.theme).num)}">${esc(PACKS[r.pack].short)} · Ch. ${PACKS[r.pack].themes.find(t=>t.id===r.theme).num}: ${esc(PACKS[r.pack].themes.find(t=>t.id===r.theme).title)}</a>` : "";
  return `<article class="jl ${L.kind}${focus?" focus":""}" id="jl-${L.id}">
    <div class="jl-top"><span class="jk">${ic}</span><span class="small"><b>${esc(lab)}</b> · ${L.y[0]===L.y[1]?L.y[0]:L.y[0]+" to "+L.y[1]}</span></div>
    <h3>${esc(L.title)}</h3>${bl(L.facts.map(esc))}
    <div class="jr"><div class="box-h">The rule · ${esc(r.who)}</div><p>${synTag()} ${esc(r.text)}</p>${q}${link}</div>
    <p class="jnow"><b>What I do now:</b> ${esc(L.now)}</p></article>`; }
function jHero(){ const h=J.hero; return `<div class="jhero"><span class="eyebrow">My journey · as of ${esc(J.asOf)}</span><h2>${esc(h.title)}</h2><p>${esc(h.sub)}</p>
  <div class="stats">${h.stats.map(([a,b])=>`<div class="stat"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("")}</div></div>`; }
function fallsChart(){ const max=60; return `<div class="falls">${J.falls.map(([l,v,who])=>`<div class="fall ${who}"><div class="fl"><span>${esc(l)}</span><b>−${Math.abs(v).toFixed(1)}%</b></div><div class="fb"><i style="width:${Math.abs(v)/max*100}%"></i></div></div>`).join("")}</div><p class="note">${esc(J.fallsNote)}</p>`; }
function vJourney(){ const kept=J.lessons.filter(l=>l.kind==="kept").length, broke=J.lessons.filter(l=>l.kind==="broke").length, risk=J.lessons.filter(l=>l.kind==="risk").length;
  return `${jHero()}
  <h3>The short version</h3><div class="card">${bl(J.story.map(esc))}</div>
  <h3>Even the legends fell this far</h3>${fallsChart()}
  <div class="card jcta"><b>${J.lessons.length} lessons, in order.</b> <span class="small muted">${kept} times I kept their rules, ${broke} times I broke them, and ${risk} risks I am carrying now.</span>
  <div class="row"><a class="btn" href="${jLink("lessons")}">Read the lessons</a><a class="btn ghost" href="${jLink("numbers")}">See all the numbers</a></div></div>
  <h3>Why I'm showing this</h3>${bl(["Saying “I learned from Buffett and Munger” means little without the receipts.","These are the receipts: what their rules did for me when I kept them, and what it cost when I didn't.","I am not a legend. If my mistakes save you one of yours, this page has done its job."])}
  ${jDisc()}`; }
function jDisc(){ return `<h3>Please read</h3><div class="card grey">${J.disclaimer.map(d=>`<p class="note">${esc(d)}</p>`).join("")}</div>`; }

/* year bars: me against my yardstick, tap a year for what happened */
function yearBars(){ const Z=24, S=0.74; const bar=(v,cls)=>{ const w=Math.abs(v)*S; return v>=0?`<i class="${cls}" style="left:${Z}%;width:${w}%"></i>`:`<i class="${cls}" style="left:${Z-w}%;width:${w}%"></i>`; };
  return `<div class="ybars"><div class="ylegend"><span class="k me"></span>Me <span class="k fund"></span>Yardstick fund <span class="small muted">· tap a year</span></div>
  ${J.years.map(([y,m,f,soft])=>{ const open=JF.open===y; const ls=J.lessons.filter(L=>!L.whole&&y>=L.y[0]&&y<=L.y[1]);
    return `<button class="yrow ${open?"open":""}" data-jy="${y}" aria-expanded="${open}"><span class="yl">${y===2026?"2026*":y}</span><span class="yb"><span class="z" style="left:${Z}%"></span>${bar(m,"me")}${bar(f,"fund")}</span><span class="yv"><b>${sgn(m)}${soft?"*":""}</b><small>${sgn(f)}</small></span></button>
    ${open?`<div class="ydet">${ls.length?ls.map(L=>`<a class="ylink ${L.kind}" href="${jLink("l-"+L.id)}"><span class="jk">${KIND[L.kind][0]}</span>${esc(L.title)}</a>`).join(""):'<span class="small muted">No lesson tagged to this year.</span>'}</div>`:""}`; }).join("")}
  <p class="note">2026 is the year so far, to ${esc(J.asOf)}. * marks a rougher figure. ${esc(J.first)}</p></div>`; }
function growthChart(){ const g=J.growth, W=400, H=210, L=30, B=24, max=9.5; const X=i=>L+i*(W-L-8)/(g.length-1), Y=v=>H-B-(v/max)*(H-B-12);
  const path=k=>g.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p[k]).toFixed(1)).join(" ");
  let b=""; [0,2,4,6,8].forEach(v=>{ b+=`<line x1="${L}" y1="${Y(v)}" x2="${W}" y2="${Y(v)}" class="lr"/>`+T(L-6,Y(v)+4,v?"×"+v:"0","s","end"); });
  g.forEach((p,i)=>{ if(i%2===0||i===g.length-1) b+=T(X(i),H-6,p[0]==="Nov 2026"?"Now":"’"+p[0].slice(2),"s","middle"); });
  b+=`<path d="${path(2)}" class="lf dr" pathLength="1000"/><path d="${path(1)}" class="lm dr" pathLength="1000" style="animation-delay:.3s"/>`;
  const e=g[g.length-1]; b+=`<circle cx="${X(g.length-1)}" cy="${Y(e[1])}" r="5" class="cm pp"/><circle cx="${X(g.length-1)}" cy="${Y(e[2])}" r="5" class="cf pp"/>`;
  b+=`<rect x="${L+6}" y="6" width="12" height="4" rx="2" class="cm"/>`+T(L+22,12,"Me ×"+e[1],"b tm")+`<rect x="${L+120}" y="6" width="12" height="4" rx="2" class="cf"/>`+T(L+136,12,"Fund ×"+e[2],"b");
  return `<figure class="dg jg"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Growth of 1 since December 2014: me ${e[1]} times, fund ${e[2]} times">${b}</svg><figcaption>Growth of 1 from the end of 2014, time-weighted. The fund led for most of the decade; my lead is all from 2025 and 2026.</figcaption></figure>`; }
function startTool(){ const ys=J.years; if(JF.end!=="now" && JF.start>2024) JF.start=2024;
  const i0=ys.findIndex(r=>r[0]===JF.start), i1=JF.end==="now"?ys.length-1:ys.findIndex(r=>r[0]===2024); let gm=1, gf=1; for(let i=i0;i<=i1;i++){ gm*=1+ys[i][1]/100; gf*=1+ys[i][2]/100; }
  const yrs=JF.end==="now"?(ys.length-1-i0)+317/365:(i1-i0+1), cm=(Math.pow(gm,1/yrs)-1)*100, cf=(Math.pow(gf,1/yrs)-1)*100, win=gm>gf;
  const starts=ys.filter(r=>JF.end==="now"?r[0]<2026:r[0]<=2024);
  return `<div class="card sky"><div class="box-h">Try it: pick a start and an end</div><p class="small" style="margin-top:0">If you had put money with me, or in the fund, at the start of…</p>
  <div class="chips">${starts.map(r=>`<button data-js="${r[0]}" class="${r[0]===JF.start?"on":""}">${r[0]}</button>`).join("")}</div>
  <p class="small" style="margin:6px 0 0">…and looked again at:</p>
  <div class="chips"><button data-je="2024" class="${JF.end!=="now"?"on":""}">End of 2024</button><button data-je="now" class="${JF.end==="now"?"on":""}">Now (${esc(J.asOf)})</button></div>
  ${tbl(["From "+JF.start+" to "+(JF.end==="now"?"now":"end 2024"),"Grew to","A year"],[[`<b>Me</b>`,"×"+gm.toFixed(2),cm.toFixed(1)+"%"],[`<b>Yardstick fund</b>`,"×"+gf.toFixed(2),cf.toFixed(1)+"%"]],{stack:false})}
  <p class="verdict">${win?(JF.end==="now"?"I'm ahead over this stretch, mostly because of 2025 and 2026.":"I'm ahead over this stretch."):"The fund is ahead over this stretch."}</p>
  <p class="note">Time-weighted, before tax, worked out from the yearly figures above.</p></div>`; }

  ${tbl(["Record","Period","A year"], J.score.map(([a,b,c,who])=>({cls:"sc-"+who, cells:[`<b>${esc(a)}</b>`,esc(b),`<b>${esc(c)}</b>`]})), {stack:false, cls:"score"})}

  ${tbl(["3 years to","Me","Fund",""], J.rule12.map(([w,m,f,s])=>({cls:"r12-"+s, cells:[`<b>${w}</b>`,mns(m)+"%",mns(f)+"%",s==="ahead"?"✓ ahead":s==="level"?"≈ level":"✗ behind"]})), {stack:false, cls:"r12"})}

  <h3>How these were worked out</h3>${bl(J.method.map(esc))}
  ${jDisc()}`; }

function jCallout(pack, tid){ const ls=J.lessons.filter(L=>L.links.some(([p,t])=>p===pack&&t===tid)); if(!ls.length) return "";
