"lead":"Size is an anchor.","text":"As capital grows, the list of ideas that can move the total shrinks. A small investor has a real edge here, and it erodes with every doubling.","co":[]},"t4n1":{"id":"t4n1","theme":"t4","tags":"1997","units":["1997"],"lead":"The hamburger quiz.","text":"If you will be eating burgers for life and do not raise cattle, you should want beef to get cheaper. If you will be a net buyer of shares for years, the same logic applies. Only someone about to sell gains from high prices.","co":[]},"t4n2":{"id":"t4n2","theme":"t4","tags":"2004","units":["2004"],"lead":"If you must time, time against the crowd.","text":"His advice to those who insist on timing: be cautious when others are eager, and eager only when others are afraid.","co":[]},"t4n3":{"id":"t4n3","theme":"t4","tags":"2016","units":["2016"],"lead":"Two kinds of fear.","text":"Fear across the market helps you, because it produces bargains. Fear inside you hurts you. An investor who keeps costs low and sits with large, soundly financed businesses will almost certainly do well.","co":[]},"t4n4":{"id":"t4n4","theme":"t4","tags":"2017","units":["2017"],"lead":"Berkshire itself has halved, more than once.","text":"He printed his own stock's four worst falls (chart below) as the case against borrowing to own shares. Nobody can say how far a price may drop in the short run, and debt forces a decision at the worst moment. Without debt, your mind stays clear.","co":[]},"t4n5":{"id":"t4n5","theme":"t4","tags":"2000","units":["2000"],"lead":"Cinderella at the ball.","text":"In a boom everyone plans to leave just before midnight. The trouble is that nobody in the ballroom can see a clock.","co":[]},"t4n6":{"id":"t4n6","theme":"t4","tags":"2000","units":["2000"],"lead":"Bubbles move wealth; they do not create it.","text":"A company that loses money over its lifetime has destroyed value, whatever its market value was at the peak. The gains of promoters came out of the pockets of late buyers.","co":[]},"t4n7":{"id":"t4n7","theme":"t4","tags":"2012","units":["2012"],"lead":"Being out is the bigger risk.","text":"The danger of sitting out of the game is far larger than the danger of staying in it. He does not step in and out on forecasts.","co":[]},"t4n8":{"id":"t4n8","theme":"t4","tags":"2008 · 2009","units":["2008","2009"],"lead":"Bad news is the buyer's friend.","text":"Pessimism lowers prices. Large opportunities are rare, and when one arrives he acts in size.","co":[]},"t4n9":{"id":"t4n9","theme":"t4","tags":"2013","units":["2013"],"lead":"Ignore the chatter.","text":"He spends no time on forecasts of the economy or the market, his own or anyone else's. Beyond the wasted hours, they crowd out the handful of facts about a business that decide the result.","co":[]},"t4n10":{"id":"t4n10","theme":"t4","tags":"2012","units":["2012"],"lead":"Expect to trail in a boom.","text":"A quality-first approach lags when markets roar and leads when they are flat or falling. Know this ahead of time so a strong year for others does not push you into changing method.","co":[]},"t5n1":{"id":"t5n1","theme":"t5","tags":"2005","units":["2005"],"lead":"Newton's fourth law.","text":"Newton gave physics three laws of motion and then lost a fortune in the South Sea Bubble. Buffett supplies the missing law: for investors as a group, the more they move, the less they keep.","co":[]},"t5n2":{"id":"t5n2","theme":"t5","tags":"2005","units":["2005"],"lead":"The Gotrocks family.","text":"Imagine one family owns every business in the country. Its wealth grows by what the businesses earn. Then helpers arrive: brokers to trade between cousins, managers to choose the brokers, consultants to choose the managers, and finally hedge funds with a share of profits. Each layer is paid out of the same earnings. He guessed these frictional costs might reach a fifth of all corporate profit.","co":[]},"t5n3":{"id":"t5n3","theme":"t5","tags":"2004","units":["2004"],"lead":"Three ways investors beat themselves.","text":"High costs from trading and fees. Decisions made on tips and fashion in place of valuation. And stop-start timing: getting in after a long rise and out after a long fall.","co":[]},"t5n4":{"id":"t5n4","theme":"t5","tags":"1997","units":["1997"],"lead":"Wait for the fat pitch.","text":"Ted Williams cut the strike zone into cells and swung only at balls in his best one. An investor has it easier, because there are no called strikes. Standing with the bat on your shoulder costs nothing.","co":[]},"t5n5":{"id":"t5n5","theme":"t5","tags":"1996","units":["1996"],"lead":"Doing nothing is a decision.","text":"When you own pieces of excellent businesses, inactivity is the intelligent course. Nobody sells a wonderful subsidiary because of a rate forecast, so why sell a minority stake in one?","co":[]},"t5n6":{"id":"t5n6","theme":"t5","tags":"1998","units":["1998"],"lead":"The movies would have paid better.","text":"After selling McDonald's and trimming other holdings, he told shareholders they would have done better had he spent market hours at the cinema.","co":["McDonald's"]},"t5n7":{"id":"t5n7","theme":"t5","tags":"1995 · 1998","units":["1995","1998"],"lead":"Lumpy beats smooth.","text":"He takes the higher, bumpier return over the lower, steadier one. Most managers choose the reverse because smooth is easier to explain.","co":[]},"t5n8":{"id":"t5n8","theme":"t5","tags":"2022","units":["2022"],"lead":"A dozen decisions.","text":"Looking back over 58 years he counted about twelve really good decisions, roughly one every five years. The record rests on those, plus avoiding ruin in between.","co":[]},"t5n9":{"id":"t5n9","theme":"t5","tags":"2016 · 2017","units":["2016","2017"],"lead":"The ten-year bet.","text":"A plain index fund against five funds-of-funds chosen by professionals, over 2008 to 2017. The index fund won by a wide margin (chart below). The managers were not stupid. Layers of fees were the difference.","co":[]},"t5n10":{"id":"t5n10","theme":"t5","tags":"2018","units":["2018"],"lead":"One per cent is not small.","text":"On his 77-year example, an annual fee of 1% would have cut the ending sum in half.","co":[]},"t5n11":{"id":"t5n11","theme":"t5","tags":"1998 · 2003","units":["1998","2003"],"lead":"Idle cash is the lesser evil.","text":"Cash earning little is uncomfortable. A purchase made to relieve the discomfort is worse.","co":[]},"t6n1":{"id":"t6n1","theme":"t6","tags":"2023","units":["2023"],"lead":"The one rule.","text":"Among everything that changed at Berkshire over six decades, he names one investment rule that has not and will not: do not put capital at risk of permanent loss.","co":[]},"t6n2":{"id":"t6n2","theme":"t6","tags":"2011 · 2014","units":["2011","2014"],"lead":"Volatility is not risk.","text":"Risk is the probability of ending your holding period with less purchasing power. Over a day or a year, shares are riskier than cash. Over decades, cash and bonds are the riskier choice. The horizon decides which is safe.","co":[]},"t6n3":{"id":"t6n3","theme":"t6","tags":"2014","units":["2014"],"lead":"Investors make shares risky themselves.","text":"By trading actively, trying to time moves, diversifying too little, paying high fees and borrowing. Each can turn a good long-run asset into a poor result.","co":[]},"t6n4":{"id":"t6n4","theme":"t6","tags":"2010","units":["2010"],"lead":"One zero is enough.","text":"A long run of fine numbers multiplied by a single zero is zero. Leverage wins most of the time, which is why it is addictive, and the rare loss is total.","co":[]},"t6n5":{"id":"t6n5","theme":"t6","tags":"2009 · 2010 · 2021","units":["2009","2010","2021"],"lead":"Never rely on strangers.","text":"Keep so much liquidity that any conceivable cash need is small beside it. This costs return in ordinary years. It buys sleep, survival and the means to purchase when others must sell.","co":[]},"t6n6":{"id":"t6n6","theme":"t6","tags":"2001","units":["2001"],"lead":"The tide.","text":"Only when conditions turn do you learn who was running without protection. Calm years hide weak practice.","co":[]},"t6n7":{"id":"t6n7","theme":"t6","tags":"2001","units":["2001"],"lead":"The Noah rule.","text":"He had foreseen the risk of a mega-catastrophe and done too little about it. Forecasting the flood earns nothing. The ark does.","co":[]},"t6n8":{"id":"t6n8","theme":"t6","tags":"2001","units":["2001"],"lead":"Exposure, not experience.","text":"Judge a risk by what could happen. A quiet record says little about a danger that has not struck yet.","co":[]},"t6n9":{"id":"t6n9","theme":"t6","tags":"2001 · 2005","units":["2001","2005"],"lead":"Look for hidden links.","text":"Many small, unrelated risks are safe to carry. One concentrated exposure, or several that turn out to move together, is not.","co":[]},"t6n10":{"id":"t6n10","theme":"t6","tags":"2008","units":["2008"],"lead":"History-fed formulas.","text":"Models built on past data give precise answers and false comfort when the conditions that produced the data have changed. He warns in particular against handing risk decisions to people with formulas.","co":[]},"t6n11":{"id":"t6n11","theme":"t6","tags":"2002 · 2003","units":["2002","2003"],"lead":"Derivatives.","text":"Hidden leverage, chains of counterparties, and profits booked on models years before any cash arrives. He wound down General Re's book and admitted he took too long.","co":["General Re"]},"t6n12":{"id":"t6n12","theme":"t6","tags":"2015","units":["2015"],"lead":"Small odds, long time.","text":"A one-in-thirty chance each year becomes about 97% over a century. A risk you would dismiss in any single year is close to certain across an investing life.","co":[]},"t6n13":{"id":"t6n13","theme":"t6","tags":"2003 · 2019 · 2020","units":["2003","2019","2020"],"lead":"Low rates are no excuse.","text":"When safe yields are poor, the temptation is to accept weaker credit or longer maturities. He holds Treasury bills and waits.","co":[]},"t7n1":{"id":"t7n1","theme":"t7","tags":"1996","units":["1996"],"lead":"Know the perimeter.","text":"The size of the circle matters little. Knowing where it ends matters a great deal. You only ever have to value the companies you choose to value.","co":[]},"t7n2":{"id":"t7n2","theme":"t7","tags":"1999","units":["1999"],"lead":"Why he skipped technology.","text":"He did not think the industry was bad. He could not tell which companies would hold a durable advantage ten years out. In 1999 that discipline cost him his worst year against the index, and he gave his own stock-picking a D. He kept the rule.","co":[]},"t7n3":{"id":"t7n3","theme":"t7","tags":"2009","units":["2009"],"lead":"Exciting is not the same as knowable.","text":"The first item on his list of things Berkshire does not do: buy into businesses whose future he cannot assess, however thrilling the product.","co":[]},"t7n4":{"id":"t7n4","theme":"t7","tags":"2004","units":["2004"],"lead":"Multiply the odds.","text":"A plan that needs several separate things to go right has a low chance of success even if each step looks likely. He learned it from a zinc-recovery project. Simple propositions survive contact with reality better.","co":[]},"t7n5":{"id":"t7n5","theme":"t7","tags":"1997 · 2013","units":["1997","2013"],"lead":"Passing is free.","text":"If you cannot make a rough estimate of earnings five years ahead, move on. Nobody can call you out for not swinging.","co":[]},"t7n6":{"id":"t7n6","theme":"t7","tags":"2013","units":["2013"],"lead":"Know-nothing can beat know-something.","text":"An investor who admits to knowing nothing about individual companies and buys a cheap index fund over time will beat most professionals. Trouble starts in between, with knowing a little and acting on a lot.","co":[]},"t7n7":{"id":"t7n7","theme":"t7","tags":"2020 · 2021","units":["2020","2021"],"lead":"The circle can grow, slowly.","text":"Apple entered the portfolio in 2016 and within five years was one of Berkshire's four giants. He treats it as a consumer franchise with loyal users and large buybacks, which is ground he knows.","co":["Apple"]},"t7n8":{"id":"t7n8","theme":"t7","tags":"2022","units":["2022"],"lead":"Keep learning.","text":"Among the Munger sayings he passed on: the world changes, and your views must change with it. Staying inside the circle does not mean freezing it.","co":[]},"t8n1":{"id":"t8n1","theme":"t8","tags":"2012","units":["2012"],"lead":"An order of preference.","text":"First, reinvest in existing businesses where that widens the moat. Second, buy other businesses. Third, repurchase shares when they sell well below value. Dividends come when none of these can earn a good return.","co":[]},"t8n2":{"id":"t8n2","theme":"t8","tags":"2012","units":["2012"],"lead":"Dividend or sell a little?","text":"He worked an example: owners who keep everything reinvested and sell a small slice each year can end with more cash and more capital than under a payout, provided retained money earns well. Each owner also sets his own level of income.","co":[]},"t8n3":{"id":"t8n3","theme":"t8","tags":"1999 · 2011 · 2016","units":["1999","2011","2016"],"lead":"Buybacks need two conditions.","text":"The company has more cash than the business needs, and the shares trade below a conservative estimate of value. With both, buying back is the surest use of money. Without the second, it destroys value for those who stay.","co":[]},"t8n4":{"id":"t8n4","theme":"t8","tags":"2011","units":["2011"],"lead":"The IBM paradox.","text":"If you own a company that keeps buying its own shares, and you are not selling, you should hope the price stays low for years. Each repurchase then lifts your share of the business by more.","co":["IBM"]},"t8n5":{"id":"t8n5","theme":"t8","tags":"2020 · 2021","units":["2020","2021"],"lead":"Ownership that grows by itself.","text":"Apple's repurchases raised Berkshire's percentage stake year after year without Berkshire buying a share.","co":["Apple"]},"t8n6":{"id":"t8n6","theme":"t8","tags":"1997 · 2005 · 2009","units":["1997","2005","2009"],"lead":"Issuing shares is selling the family silver.","text":"Paying for an acquisition with stock means handing over a slice of everything you already own. He paid for Dexter Shoe in shares; by 2007 those shares were worth $3.5 billion, for a purchase of about $400 million.","co":["Dexter Shoe"]},"t8n7":{"id":"t8n7","theme":"t8","tags":"2019","units":["2019"],"lead":"The 1924 insight.","text":"Edgar Lawrence Smith set out to show bonds beat shares and found the opposite, because companies keep part of their profit and compound it. Retained earnings are the engine. Everything else is commentary.","co":[]},"t8n8":{"id":"t8n8","theme":"t8","tags":"2018","units":["2018"],"lead":"Deferred tax is an interest-free loan.","text":"Tax owed on unrealised gains stays invested and working until the day you sell. Each sale ends that loan.","co":[]},"t8n9":{"id":"t8n9","theme":"t8","tags":"2005","units":["2005"],"lead":"Options that reward hoarding.","text":"A fixed-price option gains value when a manager simply retains earnings, with no skill involved. Watch how pay is set where profits pile up.","co":[]},"t9n1":{"id":"t9n1","theme":"t9","tags":"1995","units":["1995"],"lead":"The seller knows more.","text":"The seller picks the moment and writes the forecast. He treats sellers' projections as entertainment. Most acquisitions damage the buyer's shareholders.","co":[]},"t9n2":{"id":"t9n2","theme":"t9","tags":"1995","units":["1995"],"lead":"Compare with the stock market.","text":"Every proposed purchase has to beat the alternative of simply buying shares in the best listed companies. Many managements never run that comparison.","co":[]},"t9n3":{"id":"t9n3","theme":"t9","tags":"1999 · 2003 · 2008","units":["1999","2003","2008"],"lead":"His six filters.","text":"Large enough to matter. Consistent earning power already shown. Good returns on equity with little debt. Management in place. A simple business. A stated price. No turnarounds, no auctions, no hostile bids.","co":[]},"t9n4":{"id":"t9n4","theme":"t9","tags":"2000 · 2002 · 2008","units":["2000","2002","2008"],"lead":"Be the buyer of choice.","text":"Owners who care what happens to their company after the sale prefer a buyer with no exit plan and no debt-loading. That reputation took decades to build and wins deals money alone could not.","co":[]},"t9n5":{"id":"t9n5","theme":"t9","tags":"2017","units":["2017"],"lead":"The spreadsheet never disappoints.","text":"Once a chief executive wants a deal, the forecasts and the promised synergies will be found to support it. In 2017 he sat out because prices for decent businesses had reached records, pushed by cheap debt.","co":[]},"t9n6":{"id":"t9n6","theme":"t9","tags":"2009 · 2019","units":["2009","2019"],"lead":"Who is advising?","text":"An adviser paid only if the deal closes will favour closing. He proposed hiring a second adviser paid only if the deal fails.","co":[]},"t9n7":{"id":"t9n7","theme":"t9","tags":"2019","units":["2019"],"lead":"Like a marriage.","text":"Surprises arrive after the ceremony. Most of his have worked out, and the good ones grow to become most of the value while the poor ones shrink in importance.","co":[]},"t9n8":{"id":"t9n8","theme":"t9","tags":"2020","units":["2020"],"lead":"Overpaying, in his own words.","text":"The $11 billion after-tax write-down on Precision Castparts was his error alone. He was too hopeful about its normal level of profit and so paid too much. Nobody misled him.","co":["Precision Castparts"]},"t9n9":{"id":"t9n9","theme":"t9","tags":"1997 · 2003","units":["1997","2003"],"lead":"The handshake.","text":"Some of his best purchases closed after one meeting with no formal checks. That works only when you know exactly who you are dealing with.","co":[]},"t9n10":{"id":"t9n10","theme":"t9","tags":"2006","units":["2006"],"lead":"Tuck-ins under proven managers.","text":"Small additions to businesses run by tested people carry the least risk. They extend talent already proven.","co":[]},"t10n1":{"id":"t10n1","theme":"t10","tags":"2019","units":["2019"],"lead":"Three tests, in one sentence.","text":"Good returns on the tangible capital the business needs, managers who are both able and honest, and a sensible price.","co":[]},"t10n2":{"id":"t10n2","theme":"t10","tags":"1998","units":["1998"],"lead":"The hundred-year instruction.","text":"His managers are told to run the business as if they owned all of it, it were the only asset their family would ever have, and it could not be sold for a century.","co":[]},"t10n3":{"id":"t10n3","theme":"t10","tags":"2010","units":["2010"],"lead":"Choose carefully, then leave them alone.","text":"He hires with great care and manages very little. Capital allocation and the choice of chief executive stay at the centre. Everything else is delegated.","co":[]},"t10n4":{"id":"t10n4","theme":"t10","tags":"1996 · 1997 · 2006","units":["1996","1997","2006"],"lead":"Pay for what the manager controls.","text":"Bonuses tied to the results of the manager's own unit. A share price moves for reasons outside any one person's control and makes a poor yardstick.","co":[]},"t10n5":{"id":"t10n5","theme":"t10","tags":"1998 · 2001 · 2002","units":["1998","2001","2002"],"lead":"Options are a cost; bought shares are commitment.","text":"Accounting long treated options as free. He counts them as pay and deducts them when valuing a company. He prefers managers who buy shares with their own money and carry the downside too.","co":[]},"t10n6":{"id":"t10n6","theme":"t10","tags":"2000","units":["2000"],"lead":"Beware the chief executive who forecasts growth.","text":"Very few large companies sustain 15% a year. A leader who promises it will eventually be tempted to manufacture it.","co":[]},"t10n7":{"id":"t10n7","theme":"t10","tags":"2002 · 2016 · 2022","units":["2002","2016","2022"],"lead":"The company that always makes its number.","text":"Business is too uneven for that. Consistently meeting expectations is evidence of management of the figures.","co":[]},"t10n8":{"id":"t10n8","theme":"t10","tags":"2002 · 2003 · 2019","units":["2002","2003","2019"],"lead":"What a director is for.","text":"Business sense, an owner's outlook, and shares bought with personal money. When the fee is a large part of a director's income, independence is hard to keep. The core job is choosing and overseeing the chief executive.","co":[]},"t10n9":{"id":"t10n9","theme":"t10","tags":"2005","units":["2005"],"lead":"The ratchet.","text":"Pay committees compare with peers, nobody wants to be below average, and so the average climbs every year.","co":[]},"t10n10":{"id":"t10n10","theme":"t10","tags":"1995 · 2023","units":["1995","2023"],"lead":"Candour.","text":"Spin travels inward: tell the public a flattering story for long enough and you start to believe it. He writes each letter as he would want to be written to if a relative ran the business and he were the absent owner.","co":[]},"t10n11":{"id":"t10n11","theme":"t10","tags":"2024","units":["2024"],"lead":"No thumb-sucking.","text":"Munger's term for putting off the correction of a mistake. He calls delay the cardinal sin, worse than the original error. He adds that he never looks at where a candidate went to school.","co":[]},"t11n1":{"id":"t11n1","theme":"t11","tags":"2002","units":["2002"],"lead":"Depreciation is real.","text":"It is a worse cost than most, because the cash goes out first and the benefit arrives later. He is scathing about measures that leave it out.","co":[]},"t11n2":{"id":"t11n2","theme":"t11","tags":"2015 · 2016 · 2021","units":["2015","2016","2021"],"lead":"Adjusted earnings.","text":"Share-based pay is a cost. Restructuring that recurs every few years is a cost. Figures that strip them out flatter management.","co":[]},"t11n3":{"id":"t11n3","theme":"t11","tags":"2016 · 2018 · 2023","units":["2016","2018","2023"],"lead":"Standing still costs more than the books say.","text":"For capital-heavy businesses, real maintenance spending runs above the depreciation charge. Owner earnings are lower than reported profit.","co":[]},"t11n4":{"id":"t11n4","theme":"t11","tags":"1998","units":["1998"],"lead":"The big bath.","text":"Large one-time charges and reserves set up at acquisitions can be fed back into later years to smooth profit. He named the practice and declined to use it.","co":[]},"t11n5":{"id":"t11n5","theme":"t11","tags":"1999 · 2012","units":["1999","2012"],"lead":"Not all amortisation is a cost.","text":"Writing down software is a true expense. Writing down purchased customer lists or goodwill often is not, because the asset may be growing in value. Separate the two before judging earnings.","co":[]},"t11n6":{"id":"t11n6","theme":"t11","tags":"2003","units":["2003"],"lead":"The chosen base year.","text":"A growth table that starts in a terrible year or ends in a wonderful one can make ordinary performance look brilliant. Check the endpoints.","co":[]},"t11n7":{"id":"t11n7","theme":"t11","tags":"2017 · 2018 · 2019","units":["2017","2018","2019"],"lead":"Bottom-line noise.","text":"Since unrealised gains on shares began flowing through profit, reported net income swings wildly and says little. He directs readers to operating earnings.","co":[]},"t11n8":{"id":"t11n8","theme":"t11","tags":"2018","units":["2018"],"lead":"Book value retired.","text":"After three decades as his yardstick, he dropped book value. It understates operating businesses, and buybacks above book reduce it while raising value per share.","co":[]},"t11n9":{"id":"t11n9","theme":"t11","tags":"2002","units":["2002"],"lead":"Three warning signs.","text":"Weak accounting choices, footnotes you cannot follow, and management that broadcasts profit forecasts. If you cannot understand a note, he assumes that was intended.","co":[]},"t11n10":{"id":"t11n10","theme":"t11","tags":"1999 · 2001 · 2017","units":["1999","2001","2017"],"lead":"Self-graded exams.","text":"An insurer's profit depends on its own estimate of future claims. Such estimates are usually too low. The same caution applies to any business where today's profit rests on a guess about tomorrow's losses.","co":[]},"t11n11":{"id":"t11n11","theme":"t11","tags":"2002","units":["2002"],"lead":"Four questions for the auditor.","text":"He drafted them for audit committees. The first: had the auditor alone prepared these accounts, what would have been done differently?","co":[]},"t12n1":{"id":"t12n1","theme":"t12","tags":"1995 to 2024","units":["1995","2024"],"lead":"Float.","text":"Premiums arrive now and claims are paid later. Meanwhile the insurer invests money it holds and does not own. If premiums cover claims and expenses, the float is free, or better than free.","co":[]},"t12n2":{"id":"t12n2","theme":"t12","tags":"2002","units":["2002"],"lead":"Three questions about float.","text":"How much is there, what does it cost, and what is the long-run outlook for both? Size alone tells you nothing.","co":[]},"t12n3":{"id":"t12n3","theme":"t12","tags":"2011 · 2014","units":["2011","2014"],"lead":"Four disciplines.","text":"Understand every exposure. Assess the likelihood and cost of loss conservatively. Set a price that leaves a profit. Walk away if that price is not available.","co":[]},"t12n4":{"id":"t12n4","theme":"t12","tags":"2004 · 2012","units":["2004","2012"],"lead":"The fourth is where most fail.","text":"National Indemnity let its volume shrink for years when prices were poor, and promised no layoffs so that staff would not write bad business to keep their jobs. Most insurers cannot bear to watch competitors take the business.","co":["National Indemnity"]},"t12n5":{"id":"t12n5","theme":"t12","tags":"1995","units":["1995"],"lead":"Easy in, hard out.","text":"A badly priced contract takes a moment to sign and can take decades to pay for.","co":[]},"t12n6":{"id":"t12n6","theme":"t12","tags":"2005","units":["2005"],"lead":"Surprises go one way.","text":"In long-dated promises, bad surprises far outnumber good ones. Reserve and price with that in mind.","co":[]},"t12n7":{"id":"t12n7","theme":"t12","tags":"1996 · 1997","units":["1996","1997"],"lead":"Profit that is not profit yet.","text":"Under-priced catastrophe cover can look like easy money for years before one event takes it all back. Judge such a business over a long span.","co":[]},"t12n8":{"id":"t12n8","theme":"t12","tags":"2002","units":["2002"],"lead":"A weak reinsurer is no protection.","text":"Cheap cover from a party that may not pay is expensive. The same holds for any guarantee.","co":[]},"t12n9":{"id":"t12n9","theme":"t12","tags":"2012 to 2016","units":["2012","2016"],"lead":"A revolving fund.","text":"Accounts show float as a debt due. In practice it is replaced as it is paid out, so its economic burden is far lower than the stated figure, as long as underwriting holds.","co":[]},"t12n10":{"id":"t12n10","theme":"t12","tags":"2024","units":["2024"],"lead":"The long tail.","text":"The true cost of some policies is not known for decades. Optimism has no place in pricing them.","co":[]},"t14n1":{"id":"t14n1","theme":"t14","tags":"2011","units":["2011"],"lead":"Three kinds of asset.","text":"Claims on currency, such as deposits and bonds, look safe and lose purchasing power quietly. Assets that produce nothing depend on a later buyer paying more. Productive assets keep yielding whatever happens to the currency. He chooses the third by a wide margin.","co":[]},"t14n2":{"id":"t14n2","theme":"t14","tags":"2011","units":["2011"],"lead":"The gold cube.","text":"All the world's gold, about 170,000 tonnes, would make a cube 68 feet a side. At that year's price it equalled all the farmland in America plus sixteen Exxon Mobils, with about $1 trillion left over. A century on, the farms and companies will have produced enormous output. The cube will be the same cube.","co":["Exxon Mobil"]},"t14n3":{"id":"t14n3","theme":"t14","tags":"2018","units":["2018"],"lead":"The $114.75 example.","text":"His first share purchase, in 1942, cost $114.75. Put into a no-fee index fund with dividends reinvested, that sum would have reached $606,811 by early 2019. In gold it would have been about $4,200.","co":[]},"t14n4":{"id":"t14n4","theme":"t14","tags":"2011","units":["2011"],"lead":"What holds up in inflation.","text":"The ideal asset can raise its prices with the currency and needs little fresh capital to do so. Farms, property and businesses such as See's pass both tests.","co":["See's Candies"]},"t14n5":{"id":"t14n5","theme":"t14","tags":"2003 · 2024","units":["2003","2024"],"lead":"Cash: fortress, not home.","text":"He holds very large amounts of Treasury bills so that Berkshire can never be forced. In his last letter he also wrote that he will never prefer cash-equivalents to ownership of good businesses. Both statements hold together.","co":[]},"t14n6":{"id":"t14n6","theme":"t14","tags":"2015 · 2018 · 2020","units":["2015","2018","2020"],"lead":"The tailwind.","text":"Productivity gains have raised living standards for two centuries, and he expects that to continue. He says much of Berkshire's record came from this, as distinct from his own skill.","co":[]},"t14n7":{"id":"t14n7","theme":"t14","tags":"2020 to 2024","units":["2020","2024"],"lead":"Japan.","text":"Stakes in five trading houses, bought from 2019 and largely funded by borrowing in yen, so the currency risk is neutral. Simple businesses, low prices, sensible managements. The position was disclosed on his ninetieth birthday, a late lesson in looking abroad.","co":["Japanese trading houses"]}},"quotes":[{"id":"q2021","unit":"2021","label":"2021 letter","text":"Charlie and I are not stock-pickers; we are business-pickers.","theme":"t1"},{"id":"q2013","unit":"2013","label":"2013 letter","text":"Games are won by players who focus on the playing field","theme":"t1"},{"id":"q2008","unit":"2008","label":"2008 letter","text":"Price is what you pay; value is what you get.","theme":"t3"},{"id":"q1997","unit":"1997","label":"1997 letter","text":"nothing recedes like success","theme":"t3"},{"id":"q2004","unit":"2004","label":"2004 letter","text":"be fearful when others are greedy and greedy only when others are fearful","theme":"t4"},{"id":"q2000","unit":"2000","label":"2000 letter","text":"speculation is most dangerous when it looks easiest","theme":"t4"},{"id":"q2012","unit":"2012","label":"2012 letter","text":"We do better when the wind is in our face.","theme":"t4"},{"id":"q2009","unit":"2009","label":"2009 letter","text":"When it's raining gold, reach for a bucket, not a thimble.","theme":"t4"},{"id":"q2005","unit":"2005","label":"2005 letter","text":"For investors as a whole, returns decrease as motion increases.","theme":"t5"},{"id":"q1996","unit":"1996","label":"1996 letter","text":"don't even think about owning it for ten minutes","theme":"t5"},{"id":"q2017","unit":"2017","label":"2017 letter","text":"Performance comes, performance goes. Fees never falter.","theme":"t5"},{"id":"q1998","unit":"1998","label":"1998 letter","text":"we prefer a lumpy 15% return to a smooth 12%","theme":"t5"},{"id":"q2023","unit":"2023","label":"2023 letter","text":"Never risk permanent loss of capital.","theme":"t6"},{"id":"q2014","unit":"2014","label":"2014 letter","text":"Volatility is far from synonymous with risk.","theme":"t6"},{"id":"q2001","unit":"2001","label":"2001 letter","text":"Predicting rain doesn't count; building arks does.","theme":"t6"},{"id":"q2002","unit":"2002","label":"2002 letter","text":"derivatives are financial weapons of mass destruction","theme":"t6"},{"id":"q2010","unit":"2010","label":"2010 letter","text":"credit is like oxygen","theme":"t6"},{"id":"q1999","unit":"1999","label":"1999 letter","text":"Over time, bad relative numbers will produce unsatisfactory absolute results.","theme":"t7"},{"id":"q2016","unit":"2016","label":"2016 letter","text":"What is smart at one price is stupid at another.","theme":"t8"},{"id":"q2019","unit":"2019","label":"2019 letter","text":"Don't ask the barber whether you need a haircut.","theme":"t9"},{"id":"q1995","unit":"1995","label":"1995 letter","text":"A bad reinsurance contract is like hell","theme":"t12"},{"id":"q2011","unit":"2011","label":"2011 letter","text":"You can fondle the cube, but it will not respond.","theme":"t14"},{"id":"q2015","unit":"2015","label":"2015 letter","text":"The babies being born in America today are the luckiest crop in history.","theme":"t14"},{"id":"q2020","unit":"2020","label":"2020 letter","text":"Never bet against America.","theme":"t14"},{"id":"q2024","unit":"2024","label":"2024 letter","text":"Mistakes fade away; winners can forever blossom.","theme":"t13"},{"id":"q2022","unit":"2022","label":"2022 letter","text":"The weeds wither away in significance as the flowers bloom.","theme":"t13"}],"mistakes":[{"id":"m1","tags":"1995","units":["1995"],"did":"Sold his early GEICO stake; took Gillette preferred when the common was available.","lesson":"Selling a great business early is expensive. A clever structure earned less than plain ownership.","co":["GEICO","Gillette"]},{"id":"m2","tags":"1996","units":["1996"],"did":"USAir preferred shares.","lesson":"Seniority in the capital structure does not protect you when the business economics are broken.","co":["USAir"]},{"id":"m3","tags":"1998","units":["1998"],"did":"Sold McDonald's and trimmed other holdings.","lesson":"Activity cost money. Shareholders would have done better had he done nothing.","co":["McDonald's"]},{"id":"m4","tags":"1999","units":["1999"],"did":"Worst year against the index; graded his own stock-picking a D.","lesson":"Take the blame in plain words, and keep the method.","co":[]},{"id":"m5","tags":"2000 · 2007 · 2014","units":["2000","2007","2014"],"did":"Dexter Shoe: the moat vanished to imports, and he paid in Berkshire shares.","lesson":"Two errors at once: misjudged durability, and paid with a currency that became far more valuable.","co":["Dexter Shoe"]},{"id":"m6","tags":"2003 · 2004","units":["2003","2004"],"did":"Did not sell richly priced holdings in the bubble; too slow closing General Re's derivatives book.","lesson":"Talking about over-valuation is not acting on it. Exits get harder with delay.","co":["General Re"]},{"id":"m7","tags":"2008","units":["2008"],"did":"Bought ConocoPhillips near the top of the oil price; lost most of a stake in two Irish banks.","lesson":"A good company bought on a commodity peak is still a poor purchase.","co":["ConocoPhillips","Irish banks"]},{"id":"m8","tags":"2009","units":["2009"],"did":"A GEICO credit-card venture he pushed for.","lesson":"Staying inside the circle applies to the chairman's own ideas as well.","co":["GEICO"]},{"id":"m9","tags":"2011 · 2013","units":["2011","2013"],"did":"Energy Future Holdings bonds, bought without consulting Munger.","lesson":"A bet resting on one commodity price. Talk to your sceptic before, not after.","co":["Energy Future Holdings"]},{"id":"m10","tags":"2014","units":["2014"],"did":"Held Tesco after his doubts grew. Also retold 1964: took control of the textile mill out of pique over an eighth of a dollar.","lesson":"Sell when the thesis breaks. Pride is an expensive adviser.","co":["Tesco","Berkshire textile mill"]},{"id":"m11","tags":"2020","units":["2020"],"did":"Paid too much for Precision Castparts; $11 billion write-down.","lesson":"A wonderful business and able managers do not rescue an optimistic price.","co":["Precision Castparts"]},{"id":"m12","tags":"2023","units":["2023"],"did":"Misjudged regulatory returns in utilities; the railroad needs more capital than depreciation shows.","lesson":"Capital-heavy businesses are only as good as the return the system allows.","co":["BNSF (the railroad)","Utilities (BHE)"]},{"id":"m13","tags":"2024","units":["2024"],"did":"Errors in judging people, and delay in correcting them.","lesson":"A decent batting average is all one can hope for. The sin is waiting.","co":[]}],"tendencies":[],"plan":[{"n":1,"label":"A slice of a business","themes":["t1"],"units":["1996","2013","2021"],"extra":""},{"n":2,"label":"Moats","themes":["t2"],"units":["1995","2007"],"extra":""},{"n":3,"label":"Price and value","themes":["t3"],"units":["2000","2008"],"extra":""},{"n":4,"label":"Mr. Market","themes":["t4"],"units":["1997","2016"],"extra":""},{"n":5,"label":"Activity and patience","themes":["t5"],"units":["1998","2004","2005"],"extra":""},{"n":6,"label":"Risk and survival","themes":["t6"],"units":["2001","2010"],"extra":""},{"n":7,"label":"Circle of competence","themes":["t7"],"units":["1999","2009"],"extra":""},{"n":8,"label":"Capital allocation","themes":["t8"],"units":["2011","2012","2019"],"extra":""},{"n":9,"label":"Deals and managers","themes":["t9","t10"],"units":["2002","2003","2017"],"extra":""},{"n":10,"label":"Accounting and insurance","themes":["t11","t12"],"units":["2006","2015","2018"],"extra":""},{"n":11,"label":"Mistakes","themes":["t13"],"units":["2014","2020","2022"],"extra":""},{"n":12,"label":"The long view","themes":["t14"],"units":["2023","2024"],"extra":"Buffett's farewell note of November 2025 (optional)"}],"selftest":["Explain the three savings accounts, with a real company you know for each.","Why should a net buyer of shares want prices to fall?","State Aesop's three questions and apply them to one holding.","What is the difference between volatility and risk? Give the time horizon at which shares become the safer asset.","What two conditions make a buyback sensible?","Retell the Gotrocks story in one minute.","Name his four types of costly mistake.","Why does paying with shares magnify an acquisition error?","What are the four disciplines of underwriting, and which one do most firms fail?","How did Munger change his approach, and what are the limits of that change?","What did he change his mind about after 2009, and why?","Write one page, in his plain style, to the owners of your own portfolio about this year."],"sourcesNote":"Every idea in this section comes from the chairman's letters published in Berkshire Hathaway's annual reports for 1995 to 2024, read at berkshirehathaway.com/reports.html. Figures (See's, Coca-Cola, the ten-year bet, Berkshire's price falls, the gold cube, the $114.75 example, Precision Castparts) were checked against the letter of the year shown. The wording is the compiler's own throughout, apart from the short phrases marked as his, one per letter. The letters are Warren Buffett's copyright; read them in full, because a summary cannot carry his voice or his humour.","disclaimer":["For educational purposes only. This site is an independent study guide prepared solely for personal learning and general information. It is not investment, financial, legal, tax or accounting advice, and it is not a recommendation or solicitation to buy, sell or hold any security.","No reliance. Nothing here takes account of any reader's objectives, finances or circumstances. Investing involves risk, including loss of capital. Past performance, including any figures quoted here, does not guarantee future results. Consult a qualified, registered adviser before making any financial decision.","No warranty. The content is a paraphrase and interpretation of public documents and may contain errors or omissions. It is provided as is, without warranty of any kind, express or implied, as to accuracy, completeness or fitness for any purpose. Readers should verify everything against the original letters.","No liability. To the fullest extent permitted by law, the compiler and any distributor accept no liability for any loss or damage, direct or indirect, arising from use of or reliance on this site.","No affiliation. This site is not published, endorsed, sponsored or reviewed by Berkshire Hathaway Inc., Warren Buffett or any person or company mentioned. All names and trademarks belong to their owners. The shareholder letters are the copyright of their author; short phrases are quoted for purposes of study, criticism and review, with attribution, and readers are encouraged to read the full letters at berkshirehathaway.com.","Distribution. This site is free and may not be sold."],"big":{"changed":[["From bargains to quality.","He began by buying mediocre companies at very low prices. Munger moved him to excellent companies at fair prices. The shift happened before 1995, and he retells it in 2014 and 2023 as the decision that built Berkshire."],["From capital-light to capital-heavy.","See's was the ideal: high returns, little capital. By 2009 he had more cash than such businesses could absorb, so he bought a railroad and utilities and accepted moderate returns on very large sums."],["From avoiding technology to owning Apple.","In 1999 he would not buy what he could not forecast. From 2016 Apple became a core holding, seen as a consumer franchise."],["From book value to operating earnings.","Book value was his scorecard until 2018, when he retired it as no longer meaningful."],["From no buybacks to large ones.","Considered and not done in 1999. A price rule of 110% of book in 2011, raised to 120% in 2012, replaced by judgement in 2018, then used heavily in 2020 and 2021."],["From America only to abroad.","The first overseas acquisition came in 2006. The Japanese stakes followed from 2019."],["Towards index funds for others.","Hints in 1996, a clear statement in 2003, the instruction in his own will in 2013, and the ten-year bet as proof in 2016 and 2017."],["Towards open confession.","The later letters spend more space on his errors. In 2024 he counted how often he had used the words mistake and error."]],"constant":["A share is part of a business.","Price and value are different; insist on a margin between them.","Stay inside what you understand.","No leverage that could force your hand. Large cash reserves always.","Never issue shares for less than they are worth.","Trust able, honest managers and leave them alone.","Write to owners plainly, bad news first.","Costs and activity are the investor's enemy.","Patience: few decisions, held a long time."],"timeline":[[1996,"GEICO wholly owned"],[1998,"General Re bought"],[2000,"Bubble peaks"],[2002,"Derivatives warning"],[2006,"First deal abroad"],[2008,"Crisis"],[2010,"Railroad bought"],[2011,"First buyback rule"],[2016,"Apple enters"],[2018,"Book value retired"],[2020,"Japan stakes disclosed"],[2023,"Munger dies"]]},"about":"Only Warren Buffett's annual letters to Berkshire Hathaway shareholders, 1995 to 2024, starting from “To the Shareholders of Berkshire Hathaway Inc.” Nothing else is drawn on.","handbookTitle":"Buffett's letters, 1995 to 2024: a study handbook"},"munger":{"id":"munger","name":"Charlie Munger","short":"Munger","mono":"CM","ready":true,"crumb":"Charlie Munger · Talks & letters 1982–2014","what":"Talks and letters on thinking, living and investing, 1982 to 2014","unitTab":"Talks & letters","unitWord":"source","unitRoute":"source","unitsRoute":"sources","unitsTitle":"His talks and letters, 1982 to 2014","unitsLede":"Each source: what it is most worth reading for, its one short line, the ideas it contributes, and your own notes.","scope":"Munger wrote no yearly letter like Buffett's. This section uses the eleven talks collected in Poor Charlie's Almanack, his letters to Wesco Financial and Blue Chip Stamps shareholders, and his 2014 essay for Berkshire. Remarks reported from meetings are left out, because no official transcripts exist and many circulating quotes are wrong.","readHow":"The talks are free to read in the publisher's online edition of Poor Charlie's Almanack. The letters link to published copies.","start":{"lede":"Charlie Munger was Buffett's partner and Berkshire's vice chairman from 1978 until his death in November 2023, at 99. He trained as a lawyer, and his talks are as much about how to think and live as about money.","para":"This section covers the eleven talks in Poor Charlie's Almanack, his shareholder letters and his 2014 essay. Expect about an hour a week for twelve weeks: one theme here, then the talk or letter it draws on.","steps":[["Read the idea that underlies everything","<a href=\"#munger-theme-1\">Chapter 1: A latticework of models<\/a>. About ten minutes."],["Read your first talk","<a href=\"#munger-source-hs1986\">His 1986 graduation speech<\/a> is short, funny and a good way in. Read the summary here, then the talk itself."],["Try ten flashcards","<a href=\"#munger-cards\">Flashcards<\/a> include all 25 of his causes of misjudgment."],["Write your first rule","Tap “+ rule” beside any idea, or write one in <a href=\"#rules\">My investing rules<\/a>."]]},"glossary":[["Worldly wisdom","Practical judgment built from the big ideas of many fields, used together on real problems."],["Latticework of models","The connected set of those big ideas you think with. Facts are hung on it so they can be used."],["Man with a hammer","The error of forcing every problem into the one model you know."],["Inversion","Solving a problem backwards: ask what would cause failure, then avoid it."],["Circle of competence","The area where you really know enough to judge. Knowing its edge matters more than its size."],["Incentive-caused bias","Drifting towards conclusions that serve your own pay, often without noticing."],["Lollapalooza","An extreme result produced when several psychological forces push the same way at once."],["Too tough to understand","His third basket for ideas, beside yes and no. You never have to decide on those."],["Opportunity cost","Judging any use of money against the next-best use available."],["Febezzle","His word for wealth quietly lost to wasteful investment fees, modelled on Galbraith's 'bezzle'."]],"units":[{"key":"bluechip1982","chip":"1982 Blue Chip","tag":"Blue Chip 1982","title":"Letter to Blue Chip Stamps stockholders for 1982, signed by Munger as chairman, dated 17 February 1983","date":"","summary":"Writing to owners candidly, and how inflation sorts businesses.","year":1982,"link":"https://www.gurufocus.com/news/2135167/charlie-mungers-1982-letter-to-wesco-shareholders","linkLabel":"Letter text (published copy)","nuggets":["t10n9","t12n6","t12n7"],"mistakes":[],"quote":"q-bluechip1982"},{"key":"wesco1985","chip":"1985 Wesco","tag":"Wesco 1985","title":"Letter to Wesco Financial shareholders for 1985, dated 13 February 1986","date":"","summary":"A frank verdict on his own savings and loan business.","year":1985,"link":"https://www.gurufocus.com/news/2136293/charlie-mungers-1985-letter-to-wesco-shareholders","linkLabel":"Letter text (published copy)","nuggets":["t10n10","t10n11","t12n8"],"mistakes":[],"quote":null},{"key":"hs1986","chip":"1986 Harvard School","tag":"HS 1986","title":"Harvard School commencement, Los Angeles, 13 June 1986","date":"","summary":"Prescriptions for a miserable life, and the habit of inverting problems.","year":1986,"link":"https://stripe.press/poor-charlies-almanack/book","linkLabel":"Poor Charlie's Almanack online","nuggets":["t2n1","t2n2","t2n3","t5n1","t5n2","t6n1","t6n2","t7n4","t13n1"],"mistakes":[],"quote":"q-hs1986"},{"key":"usc1994","chip":"1994 USC","tag":"USC 1994","title":"A Lesson on Elementary, Worldly Wisdom","date":"USC Marshall School of Business, 14 April 1994","summary":"The latticework of models, great businesses, and few big bets.","year":1994,"link":"https://stripe.press/poor-charlies-almanack/book","linkLabel":"Poor Charlie's Almanack online","nuggets":["t1n1","t1n2","t1n8","t8n1","t9n1","t9n2","t9n3","t9n4","t9n5","t9n6","t9n11","t10n1","t10n2","t10n3","t10n4"],"mistakes":[],"quote":"q-usc1994"},{"key":"stanford1996","chip":"1996 Stanford","tag":"Stanford 1996","title":"Worldly Wisdom, Revisited, with questions from students","date":"Stanford Law School, 19 April 1996","summary":"Knowing what you know, three rules for a career, bearing hard times.","year":1996,"link":"https://stripe.press/poor-charlies-almanack/book","linkLabel":"Poor Charlie's Almanack online","nuggets":["t2n4","t3n5","t4n5","t5n10","t6n5","t8n2","t8n3","t8n4"],"mistakes":[],"quote":"q-stanford1996"},{"key":"practical1996","chip":"1996 Coca-Cola","tag":"Practical 1996","title":"Practical Thought about Practical Thought?","date":"An informal talk, 20 July 1996","summary":"The Coca-Cola thought experiment and his five helpful notions.","year":1996,"link":"https://stripe.press/poor-charlies-almanack/book","linkLabel":"Poor Charlie's Almanack online","nuggets":["t1n6","t1n7","t2n5","t2n6","t10n5","t10n6","t10n7","t10n8"],"mistakes":[],"quote":null},{"key":"wesco1996","chip":"1996 Wesco","tag":"Wesco 1996","title":"Letter to Wesco Financial shareholders for 1996","date":"","summary":"Super-cat reinsurance, lumpy results and conservative accounting.","year":1996,"link":"https://gurufocus.com/news/2136790/charlie-mungers-1996-letter-to-wesco-shareholders","linkLabel":"Letter text (published copy)","nuggets":["t9n10","t12n9"],"mistakes":[],"quote":"q-wesco1996"},{"key":"hls1998","chip":"1998 Harvard Law","tag":"HLS 1998","title":"Fiftieth reunion of the Harvard Law School class of 1948, 24 April 1998","date":"","summary":"Why professionals need the big ideas of many fields, taught as pilots are.","year":1998,"link":"https://stripe.press/poor-charlies-almanack/book","linkLabel":"Poor Charlie's Almanack online","nuggets":["t1n3","t1n4","t1n5","t7n10"],"mistakes":[],"quote":"q-hls1998"},{"key":"foundations1998","chip":"1998 Foundations","tag":"Foundations 1998","title":"Investment Practices of Leading Charitable Foundations","date":"Miramar Sheraton Hotel, Santa Monica, 14 October 1998","summary":"Layers of fees, indexing and concentration.","year":1998,"link":"https://stripe.press/poor-charlies-almanack/book","linkLabel":"Poor Charlie's Almanack online","nuggets":["t3n7","t8n7","t9n9","t11n1","t11n2","t11n3","t11n4","t11n5"],"mistakes":[],"quote":"q-foundations1998"},{"key":"roundtable2000","chip":"2000 Roundtable","tag":"Roundtable 2000","title":"Breakfast meeting of the Philanthropy Roundtable, 10 November 2000","date":"","summary":"Febezzlement, crowd folly and wealth effects.","year":2000,"link":"https://stripe.press/poor-charlies-almanack/book","linkLabel":"Poor Charlie's Almanack online","nuggets":["t4n6","t4n7","t11n6","t11n7","t11n8"],"mistakes":[],"quote":null},{"key":"scandal2000","chip":"2000 Scandal parable","tag":"Scandal 2000","title":"The Great Financial Scandal of 2003","date":"A fictional account written in summer 2000","summary":"How a sound company is ruined by accounting games.","year":2000,"link":"https://stripe.press/poor-charlies-almanack/book","linkLabel":"Poor Charlie's Almanack online","nuggets":["t3n10","t12n1","t12n2","t12n3","t12n4","t12n5"],"mistakes":[],"quote":"q-scandal2000"},{"key":"ucsb2003","chip":"2003 UCSB","tag":"UCSB 2003","title":"Academic Economics","date":"Herb Kay lecture, University of California, Santa Barbara, 3 October 2003","summary":"Physics envy, counting what can be counted, second-order effects.","year":2003,"link":"https://stripe.press/poor-charlies-almanack/book","linkLabel":"Poor Charlie's Almanack online","nuggets":["t1n9","t1n10","t1n11"],"mistakes":[],"quote":"q-ucsb2003"},{"key":"phm2005","chip":"2005 Misjudgment","tag":"PHM 2005","title":"The Psychology of Human Misjudgment","date":"Built from talks in 1992, 1994 and 1995; rewritten for the book in 2005","summary":"The 25 tendencies that lead sensible people into error.","year":2005,"link":"https://stripe.press/poor-charlies-almanack/book","linkLabel":"Poor Charlie's Almanack online","nuggets":["t3n1","t3n2","t3n3","t3n4","t3n6","t3n8","t4n1","t4n2","t4n3","t4n4","t5n4","t5n5","t5n6","t5n7","t6n8","t6n9","t6n10","t7n6","t7n7","t7n8","t7n9","t8n8","t8n9","t8n10","t8n11","t10n13","t13n4","t13n5"],"mistakes":[],"quote":"q-phm2005"},{"key":"wesco2006","chip":"2006 Wesco","tag":"Wesco 2006","title":"Letter to Wesco Financial shareholders for 2006, dated 27 February 2007","date":"","summary":"Plain talk about a weaker vehicle, and ignoring windfalls.","year":2006,"link":"https://www.gurufocus.com/news/2135591/charlie-mungers-2006-letter-to-wesco-shareholders","linkLabel":"Letter text (published copy)","nuggets":["t10n12","t12n10"],"mistakes":[],"quote":null},{"key":"usclaw2007","chip":"2007 USC Law","tag":"USC Law 2007","title":"USC Gould School of Law commencement, 13 May 2007","date":"","summary":"His fullest statement on how to live.","year":2007,"link":"https://stripe.press/poor-charlies-almanack/book","linkLabel":"Poor Charlie's Almanack online","nuggets":["t2n7","t3n9","t5n3","t5n8","t5n9","t6n3","t6n4","t6n6","t7n1","t7n2","t7n3","t7n5","t8n5","t8n6","t13n2","t13n3"],"mistakes":[],"quote":"q-usclaw2007"},{"key":"brk2014","chip":"2014 Berkshire","tag":"BRK 2014","title":"Vice Chairman's Thoughts, Past and Future","date":"Berkshire Hathaway annual report for 2014","summary":"What made Berkshire work, in his own account.","year":2014,"link":"https://www.berkshirehathaway.com/letters/letters.html","linkLabel":"Berkshire's letters page (choose 2014)","nuggets":["t9n12","t14n1","t14n2","t14n3","t14n4","t14n5","t14n6","t14n7","t14n8"],"mistakes":[],"quote":"q-brk2014"},{"key":"almanack","chip":"The book's account","tag":"Almanack","title":"Poor Charlie's Almanack: the editor's chapters","date":"Edited by Peter D. Kaufman; Stripe Press online edition","summary":"How he decided, in the book's own account.","year":2023,"link":"https://stripe.press/poor-charlies-almanack/book","linkLabel":"Poor Charlie's Almanack online","nuggets":["t2n8","t2n9","t6n7","t9n7","t9n8"],"mistakes":[],"quote":null}],"themes":[{"id":"t1","num":1,"title":"A latticework of models","idea":"Isolated facts do not stick and do not help. Hang them on a frame built from the big ideas of many fields, then use whichever ideas fit the problem.","nuggets":["t1n1","t1n2","t1n3","t1n4","t1n5","t1n6","t1n7","t1n8","t1n9","t1n10","t1n11"],"ask":["Which three disciplines outside your own work do you understand well enough to actually use?","Think of your last important decision. Which single model did you lean on, and what would a second model have told you?"],"table":null,"diagram":"lattice","after":2,"caption":"Illustrative. A few of the disciplines he drew on, each linked to the others."},{"id":"t2","num":2,"title":"Invert, always invert","idea":"Many problems that resist a direct attack give way when turned round. Ask what would guarantee failure, and then avoid it.","nuggets":["t2n1","t2n2","t2n3","t2n4","t2n5","t2n6","t2n7","t2n8","t2n9"],"ask":["Write down five sure ways to damage your finances over the next ten years. Are you doing a little of any of them now?","Pick one goal for this year. What three things would make it impossible, and which can you remove this month?"],"table":null,"diagram":"invert","after":4,"caption":"After HS 1986 and Practical 1996."},{"id":"t3","num":3,"title":"Incentives","idea":"To predict what people will do, look first at what they are rewarded for. He put this first in his list of 25 human tendencies.","nuggets":["t3n1","t3n2","t3n3","t3n4","t3n5","t3n6","t3n7","t3n8","t3n9","t3n10"],"ask":["In each relationship you have with an adviser, broker or fund, what exactly is the other side paid for?","Where in your own routine does the reward come before the hard part? How would Granny's rule change it?"],"table":null,"diagram":null,"after":0,"caption":""},{"id":"t4","num":4,"title":"The psychology of misjudgment","idea":"He built a list of 25 mental tendencies that lead sensible people into error, and used it as a checklist. The danger peaks when several act at once.","nuggets":["t4n1","t4n2","t4n3","t4n4","t4n5","t4n6","t4n7"],"ask":["Take one decision you made in the last year. Which of the 25 tendencies were acting on you?","Where have three or more tendencies been pushing you the same way at once?"],"table":"tendencies","diagram":"lolla","after":3,"caption":"Illustrative. Several tendencies pushing the same way produce an extreme result (PHM 2005)."},{"id":"t5","num":5,"title":"The inner life: envy, resentment, self-pity","idea":"Much of his life advice is about thoughts to refuse. A few emotions do more damage than bad luck, and they are under your control.","nuggets":["t5n1","t5n2","t5n3","t5n4","t5n5","t5n6","t5n7","t5n8","t5n9","t5n10"],"ask":["Whose success do you watch most closely? What does watching it do to your decisions?","Is there a grudge or a regret you replay? What would change if you put it down this week?"],"table":null,"diagram":null,"after":0,"caption":""},{"id":"t6","num":6,"title":"Reliability, trust and deserving","idea":"He thought most of what people want in life is earned by being someone others can rely on. Trust that is deserved is the strongest arrangement there is.","nuggets":["t6n1","t6n2","t6n3","t6n4","t6n5","t6n6","t6n7","t6n8","t6n9","t6n10"],"ask":["Who relies on you, and in what ways do you sometimes let them down?","Of the people you trust with money, which have earned it by their record, and which by a good first meeting?"],"table":null,"diagram":"web","after":6,"caption":"After USC Law 2007: a seamless web of deserved trust."},{"id":"t7","num":7,"title":"Learning for life","idea":"He saw lifelong learning as a duty, and as the main reason ordinary people overtake cleverer ones over a working life.","nuggets":["t7n1","t7n2","t7n3","t7n4","t7n5","t7n6","t7n7","t7n8","t7n9","t7n10"],"ask":["What did you learn this month that changed a view you held? If nothing, what does that tell you?","Which belief of yours most needs a Darwin list of facts against it?"],"table":null,"diagram":"wiser","after":1,"caption":"Illustrative. Small, steady gains in understanding add up over a working life (after USC Law 2007)."},{"id":"t8","num":8,"title":"Objectivity and the edge of what you know","idea":"Knowing the limits of your competence is worth more than its size. Self-regard and strong ideology are the usual ways people step over the edge without noticing.","nuggets":["t8n1","t8n2","t8n3","t8n4","t8n5","t8n6","t8n7","t8n8","t8n9","t8n10","t8n11"],"ask":["Which of your current views could you not argue against convincingly? Hold it more loosely.","Where is the edge of your circle? Name one thing you own that sits close to it."],"table":null,"diagram":"circle","after":1,"caption":"After USC 1994 and Stanford 1996: know where the edge of your circle is."},{"id":"t9","num":9,"title":"Investing: few, great, and then sit","idea":"The big money comes from a handful of great businesses, bought when the odds are clearly favourable, then held for a long time.","nuggets":["t9n1","t9n2","t9n3","t9n4","t9n5","t9n6","t9n7","t9n8","t9n9","t9n10","t9n11","t9n12"],"ask":["If you had only twenty slots for the rest of your life, which current holdings would earn one?","Where have you diversified into ideas you do not believe in strongly?"],"table":null,"diagram":"punch","after":3,"caption":"The thought experiment he relays in USC 1994. Three slots used, for illustration."},{"id":"t10","num":10,"title":"Business models, moats and scale","idea":"He studied why some businesses compound for a century while others never earn their keep, and taught it through plain examples.","nuggets":["t10n1","t10n2","t10n3","t10n4","t10n5","t10n6","t10n7","t10n8","t10n9","t10n10","t10n11","t10n12","t10n13"],"ask":["For each holding: when the industry adopts the next cost-saving technology, does the owner keep the saving or does the customer?","Which of your businesses is a commodity described in flattering words?"],"table":null,"diagram":"coke","after":6,"caption":"The arithmetic of the Coca-Cola thought experiment (Practical 1996): 2.92 trillion × 4¢ ≈ $117 billion."},{"id":"t11","num":11,"title":"Costs, consultants and febezzlement","idea":"Fees and frictional costs look small each year and become enormous over time. He attacked them with arithmetic and with a word he coined.","nuggets":["t11n1","t11n2","t11n3","t11n4","t11n5","t11n6","t11n7","t11n8"],"ask":["Add up every cost between your money and your businesses, including taxes from turnover. What share of your gains is it?","Which of those costs buys something you could not do yourself?"],"table":null,"diagram":"drag","after":3,"caption":"Illustrative. The 3% cost level is his estimate (Foundations 1998); the other figures are examples."},{"id":"t12","num":12,"title":"Accounting, honesty and candour","idea":"He wrote as a lawyer who distrusted flattering numbers. The test is always what an absent owner would want to be told.","nuggets":["t12n1","t12n2","t12n3","t12n4","t12n5","t12n6","t12n7","t12n8","t12n9","t12n10"],"ask":["In each company you own, which reported number depends most on management's own estimate?","Does the annual report read as if written for an absent owner, or for the share price?"],"table":null,"diagram":"dollops","after":3,"caption":"Illustrative, after Scandal 2000: moderate dollops are harder to notice than one large one."},{"id":"t13","num":13,"title":"Adversity, patience and hard work","idea":"Setbacks are certain, and many are unfair. What decides a life is the response to them, and the steady work done in between.","nuggets":["t13n1","t13n2","t13n3","t13n4","t13n5"],"ask":["Recall your worst year. What did you learn that a good year could not have taught you?","Which loss are you still refusing to accept, and what is that refusal costing?"],"table":null,"diagram":"setback","after":2,"caption":"Illustrative path. Setbacks are certain; what follows them decides the result."},{"id":"t14","num":14,"title":"The Berkshire system, in his words","idea":"In his 2014 essay, written directly to Berkshire shareholders for the first time, he explained why the company had worked.","nuggets":["t14n1","t14n2","t14n3","t14n4","t14n5","t14n6","t14n7","t14n8"],"ask":["Which of the companies you own gives managers real autonomy, and how do you know it is deserved?","How much unhurried time for reading and thinking do you protect each week?"],"table":null,"diagram":"hub","after":4,"caption":"After BRK 2014: a small head office and many subsidiaries run with wide autonomy."}],"nuggets":{"t1n1":{"id":"t1n1","theme":"t1","tags":"USC 1994","units":["usc1994"],"lead":"The frame comes first.","text":"If facts do not hang together on a latticework of theory, you cannot use them when you need them. Build a frame of models from several fields and attach your reading and experience to it.","co":[]},"t1n2":{"id":"t1n2","theme":"t1","tags":"USC 1994","units":["usc1994"],"lead":"The man with a hammer.","text":"A person who knows one model forces every problem into its shape. Narrow training makes this error common.","co":[]},"t1n3":{"id":"t1n3","theme":"t1","tags":"HLS 1998","units":["hls1998"],"lead":"Each field has a few big ideas.","text":"The truly big ideas in each discipline, learned in essence, carry most of the load. Learning those is far less work than mastering any one field.","co":[]},"t1n4":{"id":"t1n4","theme":"t1","tags":"HLS 1998","units":["hls1998"],"lead":"Learn it the way pilots do.","text":"Pilots get training wide enough to cover nearly everything useful, use checklists every time, and keep skills fresh in simulators. He wanted professionals educated the same way.","co":[]},"t1n5":{"id":"t1n5","theme":"t1","tags":"HLS 1998","units":["hls1998"],"lead":"Prefer the most basic explanation.","text":"Give priority to the explanation from the most fundamental discipline, and credit each idea to the field it came from.","co":[]},"t1n6":{"id":"t1n6","theme":"t1","tags":"Practical 1996","units":["practical1996"],"lead":"Be fluent with numbers.","text":"Numerical fluency was one of his five helpful notions. Arithmetic shows what a goal really requires.","co":[]},"t1n7":{"id":"t1n7","theme":"t1","tags":"Practical 1996","units":["practical1996"],"lead":"Big results have several causes.","text":"Expect extreme outcomes from combinations of factors acting together, not from one lever.","co":[]},"t1n8":{"id":"t1n8","theme":"t1","tags":"USC 1994","units":["usc1994"],"lead":"Simple maths on the odds.","text":"He judged bets with the elementary probability of Fermat and Pascal. Accounting helps as well, though it stops describing reality in some cases, such as a shrinking business.","co":[]},"t1n9":{"id":"t1n9","theme":"t1","tags":"UCSB 2003","units":["ucsb2003"],"lead":"Don't worship what can be counted.","text":"Almost everyone overweighs what can be numbered and neglects what cannot.","co":[]},"t1n10":{"id":"t1n10","theme":"t1","tags":"UCSB 2003","units":["ucsb2003"],"lead":"Physics envy.","text":"Hoping that economics will behave with the precision of physics gets clever people into terrible trouble.","co":[]},"t1n11":{"id":"t1n11","theme":"t1","tags":"UCSB 2003","units":["ucsb2003"],"lead":"And then what?","text":"Economics pays too little attention to second- and higher-order effects. Follow consequences further than the first step.","co":[]},"t2n1":{"id":"t2n1","theme":"t2","tags":"HS 1986","units":["hs1986"],"lead":"A graduation speech about misery.","text":"Asked to advise school leavers, he listed sure routes to a miserable life, adding his own to three that Johnny Carson had given years before. Avoiding them is most of the work.","co":[]},"t2n2":{"id":"t2n2","theme":"t2","tags":"HS 1986","units":["hs1986"],"lead":"The rustic's question.","text":"A countryman wished he knew where he was going to die, so he would never go there. Munger treats the joke as a serious method.","co":[]},"t2n3":{"id":"t2n3","theme":"t2","tags":"HS 1986","units":["hs1986"],"lead":"Jacobi's rule.","text":"The mathematician Carl Jacobi advised turning problems around. Munger points to Darwin and Einstein, who made breakthroughs by thinking in reverse.","co":[]},"t2n4":{"id":"t2n4","theme":"t2","tags":"Stanford 1996","units":["stanford1996"],"lead":"Forward and backward.","text":"Get the needed models into your head, then think each problem through both forward and backward.","co":[]},"t2n5":{"id":"t2n5","theme":"t2","tags":"Practical 1996","units":["practical1996"],"lead":"Decide the no-brainers first.","text":"Settle the big, obvious questions first. With those fixed, the rest of a problem often becomes simple.","co":[]},"t2n6":{"id":"t2n6","theme":"t2","tags":"Practical 1996","units":["practical1996"],"lead":"Think in reverse.","text":"When you cannot see how to reach a goal, ask what would make it impossible, and remove that.","co":[]},"t2n7":{"id":"t2n7","theme":"t2","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Twenty-one years later.","text":"He told law graduates the same thing: turn a problem around and you often think better.","co":[]},"t2n8":{"id":"t2n8","theme":"t2","tags":"Almanack","units":["almanack"],"lead":"What to avoid comes first.","text":"He usually decided what not to do before choosing what to do. Avoiding large errors beats occasional flashes of brilliance.","co":[]},"t2n9":{"id":"t2n9","theme":"t2","tags":"Almanack","units":["almanack"],"lead":"Three baskets.","text":"For investments he kept three baskets: yes, no, and too tough to understand. The third basket is large, and he felt no duty to empty it.","co":[]},"t3n1":{"id":"t3n1","theme":"t3","tags":"PHM 2005","units":["phm2005"],"lead":"The first tendency.","text":"People respond to rewards and punishments far more strongly than they expect, and their beliefs drift to fit what pays.","co":[]},"t3n2":{"id":"t3n2","theme":"t3","tags":"PHM 2005","units":["phm2005"],"lead":"Incentive-caused bias.","text":"Decent people reach conclusions that serve their own income, often without knowing it. Take special care with advice from anyone paid by the action they recommend.","co":[]},"t3n3":{"id":"t3n3","theme":"t3","tags":"PHM 2005","units":["phm2005"],"lead":"Pay for the result.","text":"His example: a delivery company's night shift ran slow until workers were paid per shift and could go home once all the planes were loaded. Pay for time and you get time.","co":[]},"t3n4":{"id":"t3n4","theme":"t3","tags":"PHM 2005","units":["phm2005"],"lead":"Controls are a kindness.","text":"He called the cash register a great moral instrument. Systems that make cheating hard keep honest people honest.","co":[]},"t3n5":{"id":"t3n5","theme":"t3","tags":"Stanford 1996","units":["stanford1996"],"lead":"Stop slop early.","text":"Small dishonesty that is tolerated spreads, and becomes very hard to reverse. Stop it at the start.","co":[]},"t3n6":{"id":"t3n6","theme":"t3","tags":"PHM 2005","units":["phm2005"],"lead":"Granny's rule.","text":"Make the pleasant thing the reward for doing the unpleasant thing first.","co":[]},"t3n7":{"id":"t3n7","theme":"t3","tags":"Foundations 1998","units":["foundations1998"],"lead":"Keep advisers working for you.","text":"Whoever pays the fees must control the advisers. Layers of consultants bring perverse incentives.","co":[]},"t3n8":{"id":"t3n8","theme":"t3","tags":"PHM 2005","units":["phm2005"],"lead":"Reasons work.","text":"People comply more when given reasons, even weak ones. Give real reasons, and test the reasons you are given.","co":[]},"t3n9":{"id":"t3n9","theme":"t3","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Choose your system.","text":"Avoid perverse incentive systems, and avoid working directly under someone you do not admire and do not want to be like.","co":[]},"t3n10":{"id":"t3n10","theme":"t3","tags":"Scandal 2000","units":["scandal2000"],"lead":"Systems before villains.","text":"He traced much corporate misconduct to standard incentive systems working on people below conscious awareness. Wrongdoing that is rewarded dies hard.","co":[]},"t4n1":{"id":"t4n1","theme":"t4","tags":"PHM 2005","units":["phm2005"],"lead":"Three talks became one.","text":"Talks given in 1992, 1994 and 1995 became one. He rewrote it for the book in 2005, at 81, from memory and without fresh research.","co":[]},"t4n2":{"id":"t4n2","theme":"t4","tags":"PHM 2005","units":["phm2005"],"lead":"Use it as a checklist.","text":"He ran through his own list, tendency by tendency, to explain events that puzzled him. Do the same before an important decision.","co":[]},"t4n3":{"id":"t4n3","theme":"t4","tags":"PHM 2005","units":["phm2005"],"lead":"Lollapalooza.","text":"Extreme outcomes come from several tendencies pushing the same way. One of his examples is an airliner evacuation test, run in a darkened hangar with older volunteers, that ended in many injuries.","co":[]},"t4n4":{"id":"t4n4","theme":"t4","tags":"PHM 2005","units":["phm2005"],"lead":"Authority can be fatal.","text":"People defer to whoever is in charge, even when that person is plainly wrong. In one of his examples, that deference ended in a plane crash.","co":[]},"t4n5":{"id":"t4n5","theme":"t4","tags":"Stanford 1996","units":["stanford1996"],"lead":"Know it; don't abuse it.","text":"Not everything you know about psychology should be used to manipulate people. Anyone who sees through it will hate you for it.","co":[]},"t4n6":{"id":"t4n6","theme":"t4","tags":"Roundtable 2000","units":["roundtable2000"],"lead":"Crowd folly.","text":"Under some conditions people behave like lemmings. He said this explains much foolish thinking, in markets as elsewhere.","co":[]},"t4n7":{"id":"t4n7","theme":"t4","tags":"Roundtable 2000","units":["roundtable2000"],"lead":"Priced like paintings.","text":"He described shares being valued partly like Rembrandt paintings: bought mostly because their prices had already risen so far.","co":[]},"t5n1":{"id":"t5n1","theme":"t5","tags":"HS 1986","units":["hs1986"],"lead":"Three from Carson.","text":"He began with Johnny Carson's prescriptions for misery: mood-altering chemicals, envy and resentment.","co":[]},"t5n2":{"id":"t5n2","theme":"t5","tags":"HS 1986","units":["hs1986"],"lead":"Resentment costs the carrier.","text":"He cites Disraeli, who learned to give up revenge as a motive, though he kept an outlet for resentment. A grudge mostly harms the person who carries it.","co":[]},"t5n3":{"id":"t5n3","theme":"t5","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Four to refuse.","text":"Envy, resentment, revenge and self-pity: he named them together as disastrous ways of thinking.","co":[]},"t5n4":{"id":"t5n4","theme":"t5","tags":"PHM 2005","units":["phm2005"],"lead":"Envy is everywhere.","text":"He said envy and jealousy are extreme in modern life. Expect them in others, and watch for them in yourself.","co":[]},"t5n5":{"id":"t5n5","theme":"t5","tags":"PHM 2005","units":["phm2005"],"lead":"Defer the reaction.","text":"The standard cure for overactive hostility is to train yourself to delay your response.","co":[]},"t5n6":{"id":"t5n6","theme":"t5","tags":"PHM 2005","units":["phm2005"],"lead":"Denial.","text":"The mind bends facts that are too painful to accept. Notice when you are doing it.","co":[]},"t5n7":{"id":"t5n7","theme":"t5","tags":"PHM 2005","units":["phm2005"],"lead":"Light stress, heavy stress.","text":"Light stress can slightly improve performance; heavy stress causes dysfunction. Make big decisions when calm.","co":[]},"t5n8":{"id":"t5n8","theme":"t5","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Being right can cost you.","text":"You can cause great offence by being right in a way that makes someone lose face in front of others.","co":[]},"t5n9":{"id":"t5n9","theme":"t5","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Avoid intense ideology.","text":"He warned that extremely intense ideology clouds the mind.","co":[]},"t5n10":{"id":"t5n10","theme":"t5","tags":"Stanford 1996","units":["stanford1996"],"lead":"How to bear hard times.","text":"Have low expectations, keep a sense of humour, and surround yourself with the love of friends and family.","co":[]},"t6n1":{"id":"t6n1","theme":"t6","tags":"HS 1986","units":["hs1986"],"lead":"Be reliable.","text":"First on his own list of routes to misery was being unreliable: not faithfully doing what you have promised. He said it can outweigh all your other virtues combined.","co":[]},"t6n2":{"id":"t6n2","theme":"t6","tags":"HS 1986","units":["hs1986"],"lead":"Learnable by almost anyone.","text":"In a 2006 note he repeated that reliability is essential for progress in life, and that almost anyone can learn it to great advantage.","co":[]},"t6n3":{"id":"t6n3","theme":"t6","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Deserve what you want.","text":"The safest way to try to get what you want is to try to deserve it.","co":[]},"t6n4":{"id":"t6n4","theme":"t6","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Admiration-based love.","text":"He thought no love is so right as love grounded in admiration, and that it should extend to the instructive dead.","co":[]},"t6n5":{"id":"t6n5","theme":"t6","tags":"Stanford 1996","units":["stanford1996"],"lead":"Three rules for a career.","text":"Sell only what you would buy yourself. Work only for people you respect and admire. Work only with people you enjoy.","co":[]},"t6n6":{"id":"t6n6","theme":"t6","tags":"USC Law 2007","units":["usclaw2007"],"lead":"A seamless web of deserved trust.","text":"In your own life, what you want to maximise is trust that has been earned, all the way round.","co":[]},"t6n7":{"id":"t6n7","theme":"t6","tags":"Almanack","units":["almanack"],"lead":"Choose clients like friends.","text":"A rule from his years as a lawyer, and one that applies to partners, managers and investments too.","co":[]},"t6n8":{"id":"t6n8","theme":"t6","tags":"PHM 2005","units":["phm2005"],"lead":"Liking distorts.","text":"We overlook the faults of people and things we love. Love admirable people, and still check their work.","co":[]},"t6n9":{"id":"t6n9","theme":"t6","tags":"PHM 2005","units":["phm2005"],"lead":"Records over impressions.","text":"A face-to-face meeting carries too much weight. Underweigh the impression and overweigh the past record.","co":[]},"t6n10":{"id":"t6n10","theme":"t6","tags":"PHM 2005","units":["phm2005"],"lead":"Fairness matters.","text":"People react strongly when they are treated unfairly. Arrangements that feel unfair breed resentment that outlasts the gain.","co":[]},"t7n1":{"id":"t7n1","theme":"t7","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Learning machines.","text":"He kept seeing people rise who were not always the smartest, but who kept learning. They went to bed each night a little wiser than they were that morning.","co":[]},"t7n2":{"id":"t7n2","theme":"t7","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Wisdom is a moral duty.","text":"He held that acquiring wisdom is an obligation, not a hobby.","co":[]},"t7n3":{"id":"t7n3","theme":"t7","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Skills expire.","text":"Without lifetime learning you will not do well. Berkshire's skills from one decade would not have carried it through the next.","co":["Berkshire Hathaway"]},"t7n4":{"id":"t7n4","theme":"t7","tags":"HS 1986","units":["hs1986"],"lead":"Learn from other people's mistakes.","text":"Learning everything from your own experience was on his list of routes to misery. The errors of others are cheaper teachers.","co":[]},"t7n5":{"id":"t7n5","theme":"t7","tags":"USC Law 2007","units":["usclaw2007"],"lead":"The instructive dead.","text":"Admire and learn from the great minds of the past. He counted them among the right objects of love.","co":[]},"t7n6":{"id":"t7n6","theme":"t7","tags":"PHM 2005","units":["phm2005"],"lead":"Keep curiosity alive.","text":"Curiosity drives learning and protects against many other errors.","co":[]},"t7n7":{"id":"t7n7","theme":"t7","tags":"PHM 2005","units":["phm2005"],"lead":"Use it or lose it.","text":"Skills fade without practice. Skills practised to fluency last much longer.","co":[]},"t7n8":{"id":"t7n8","theme":"t7","tags":"PHM 2005","units":["phm2005"],"lead":"Learning gets harder with age.","text":"Ageing makes new, complex skills harder to acquire. Keep learning and practising, and learn the difficult things while you can.","co":[]},"t7n9":{"id":"t7n9","theme":"t7","tags":"PHM 2005","units":["phm2005"],"lead":"Hunt for disconfirming evidence.","text":"Darwin trained himself early to weigh seriously any evidence against his own hypotheses. Do the same with your beliefs.","co":[]},"t7n10":{"id":"t7n10","theme":"t7","tags":"HLS 1998","units":["hls1998"],"lead":"Maintain what you know.","text":"Pilots are made to practise in simulators so skills do not decay. Schedule your own refreshers.","co":[]},"t8n1":{"id":"t8n1","theme":"t8","tags":"USC 1994","units":["usc1994"],"lead":"Circle of competence.","text":"Everyone has a circle of competence. Play where you have an edge, and stay out of games where others clearly have it.","co":[]},"t8n2":{"id":"t8n2","theme":"t8","tags":"Stanford 1996","units":["stanford1996"],"lead":"Know what you don't know.","text":"Know what you know and what you do not. When you lack competence, say so.","co":[]},"t8n3":{"id":"t8n3","theme":"t8","tags":"Stanford 1996","units":["stanford1996"],"lead":"Use your advantages.","text":"Work out where your talents lie and use them. Berkshire avoided high technology partly because it had no edge there.","co":["Berkshire Hathaway"]},"t8n4":{"id":"t8n4","theme":"t8","tags":"Stanford 1996","units":["stanford1996"],"lead":"Change your mind.","text":"He said he and Buffett were very good at changing their prior conclusions.","co":[]},"t8n5":{"id":"t8n5","theme":"t8","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Earn the right to an opinion.","text":"He did not feel entitled to an opinion until he could state the arguments against it better than its supporters could.","co":[]},"t8n6":{"id":"t8n6","theme":"t8","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Self-serving bias.","text":"It is in everyone. Use routines and checklists to keep yourself objective.","co":[]},"t8n7":{"id":"t8n7","theme":"t8","tags":"Foundations 1998","units":["foundations1998"],"lead":"Don't fool yourself.","text":"He quoted Feynman: the first principle is not to fool yourself, and you are the easiest person to fool.","co":[]},"t8n8":{"id":"t8n8","theme":"t8","tags":"PHM 2005","units":["phm2005"],"lead":"Don't rush to decide.","text":"Uncertainty is uncomfortable, so the mind grabs an ans
