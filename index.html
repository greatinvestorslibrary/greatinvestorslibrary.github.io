 to book value and to sales are the most scientific measures, and the easiest to learn.","co":[]},"t1n3":{"id":"t1n3","theme":"t1","tags":"Book, 2014","units":["book"],"lead":"Quality is hard.","text":"Few people can spot a truly great company before the market does, and many once-great companies lost their edge.","co":[]},"t1n4":{"id":"t1n4","theme":"t1","tags":"Book, 2014","units":["book"],"lead":"Good industry, good company, good price.","text":"His whole approach: find good companies in good industries, then wait for a good price.","co":[]},"t1n5":{"id":"t1n5","theme":"t1","tags":"Book, 2014","units":["book"],"lead":"Simple tools.","text":"Porter's five forces for the industry, DuPont analysis for how profits are made, and comparisons with peers and history for the price.","co":[]},"t2n1":{"id":"t2n1","theme":"t2","tags":"Book, 2014","units":["book"],"lead":"Buy cheap to sell cheap.","text":"He borrows a retailer's rule, Sam Walton's: you can only sell cheaply if you buy cheaply. In investing, buying cheaply matters even more.","co":[]},"t2n2":{"id":"t2n2","theme":"t2","tags":"Book, 2014","units":["book"],"lead":"Ordinary but cheap.","text":"An ordinary company bought at a low enough price can still give a fine return.","co":[]},"t2n3":{"id":"t2n3","theme":"t2","tags":"Book, 2014","units":["book"],"lead":"Few true greats.","text":"He reckoned that among about 2,500 Chinese listed companies perhaps ten were truly great, so most of the time price must do the work.","co":[]},"t2n4":{"id":"t2n4","theme":"t2","tags":"Book, 2014","units":["book"],"lead":"Wary of the next great thing.","text":"He is suspicious of stories about the next great company, and admits he struggles even to pay a fair price for great ones.","co":[]},"t3n1":{"id":"t3n1","theme":"t3","tags":"Book, 2014","units":["book"],"lead":"Two tests.","text":"A company with a real edge does something it can repeat again and again, and something others cannot copy.","co":[]},"t3n2":{"id":"t3n2","theme":"t3","tags":"Lecture, 2017","units":["moon"],"lead":"Concentration is not enough.","text":"He cares less about how few rivals there are than about the bargaining power and irreplaceability that brings.","co":[]},"t3n3":{"id":"t3n3","theme":"t3","tags":"Lecture, 2017","units":["moon"],"lead":"Easy money versus hard work.","text":"That power is the dividing line between businesses that earn easily and those that work hard for little.","co":[]},"t3n4":{"id":"t3n4","theme":"t3","tags":"Book, 2014","units":["book"],"lead":"Where it comes from.","text":"Scarce resources, a strong brand, patents, a dominant position or a licence: in the end each shows up as pricing power.","co":[]},"t4n1":{"id":"t4n1","theme":"t4","tags":"Lecture, 2017","units":["moon"],"lead":"Best to worst.","text":"One dominant firm is best; then one leader with a few strong rivals; then two or three equals; worst is a sky full of small competitors.","co":[]},"t4n2":{"id":"t4n2","theme":"t4","tags":"Lecture, 2017","units":["moon"],"lead":"Define the sky.","text":"The skill is drawing the right boundary: which firms are real rivals and which belong to a different sky.","co":[]},"t4n3":{"id":"t4n3","theme":"t4","tags":"Lecture, 2017","units":["moon"],"lead":"Watch for invaders.","text":"Firms from other industries can enter any sky.","co":[]},"t4n4":{"id":"t4n4","theme":"t4","tags":"Lecture, 2017","units":["moon"],"lead":"A rising moon.","text":"The prize is a company whose pricing power the market has not yet noticed.","co":[]},"t4n5":{"id":"t4n5","theme":"t4","tags":"Lecture, 2017","units":["moon"],"lead":"Right track, wrong horse.","text":"Investors often pick the right industry but the wrong company.","co":[]},"t5n1":{"id":"t5n1","theme":"t5","tags":"Book, 2014 · Lecture, 2017","units":["book","moon"],"lead":"Wait for the winner.","text":"In a crowded industry it is hard to know whom to back, however fast it grows. Wait until the fighting ends and a winner emerges.","co":[]},"t5n2":{"id":"t5n2","theme":"t5","tags":"Article","units":["tech"],"lead":"Fast change destroys moats.","text":"In fast-moving technology, rivals simply build a new castle elsewhere. Televisions went through tubes, projection, LCD, plasma, LED and 3D in a few years; air conditioners changed far less.","co":[]},"t5n3":{"id":"t5n3","theme":"t5","tags":"Article","units":["tech"],"lead":"A formula for a century.","text":"Coca-Cola's formula has hardly changed in a hundred years, and China too has traditional products that last for centuries.","co":[]},"t5n4":{"id":"t5n4","theme":"t5","tags":"Article","units":["tech"],"lead":"Scandals help leaders.","text":"After food scandals, industry sales recovered within months and the big brands gained share, as buyers trusted known names.","co":[]},"t6n1":{"id":"t6n1","theme":"t6","tags":"Article","units":["tech"],"lead":"Twice a year.","text":"Every January and July he adds up the industry weights of all fund companies, then grows cautious on the crowded industries and more hopeful on the shunned ones.","co":[]},"t6n2":{"id":"t6n2","theme":"t6","tags":"Profile, 2015","units":["prof"],"lead":"He has seen manias.","text":"He lived through the 1992 rush for share certificates and the late-1990s Nasdaq boom and crash.","co":[]},"t6n3":{"id":"t6n3","theme":"t6","tags":"Letter, 2022","units":["l22"],"lead":"Out of the crowded trade.","text":"In 2020–21 he stayed out of the crowded trade in richly valued favourite shares, which then fell about 40% from early 2021.","co":[]},"t6n4":{"id":"t6n4","theme":"t6","tags":"Book, 2014","units":["book"],"lead":"Beware value traps.","text":"His book warns that some cheap shares stay cheap for good reasons, and describes the kinds most likely to become traps.","co":[]},"t7n1":{"id":"t7n1","theme":"t7","tags":"Book, 2014","units":["book"],"lead":"Two different things.","text":"Winning a bet and betting right are not the same: a good process can give poor results for a while, and a bad one can get lucky.","co":[]},"t7n2":{"id":"t7n2","theme":"t7","tags":"Book, 2014","units":["book"],"lead":"Five to ten years.","text":"A sound method gives good results with high probability over five to ten years, not six months.","co":[]},"t7n3":{"id":"t7n3","theme":"t7","tags":"Book, 2014","units":["book"],"lead":"Six or seven in ten.","text":"He reckons a sound method beats the market in about six or seven years out of ten, a poor one in three or four.","co":[]},"t7n4":{"id":"t7n4","theme":"t7","tags":"Book, 2014","units":["book"],"lead":"Why it keeps working.","text":"Citing Joel Greenblatt: value investing works over time precisely because it doesn't work every year.","co":[]},"t7n5":{"id":"t7n5","theme":"t7","tags":"Book, 2014","units":["book"],"lead":"Don't keep switching.","text":"Investors who keep changing methods tend to fail; successful ones stick with one.","co":[]},"t8n1":{"id":"t8n1","theme":"t8","tags":"Interviews, 2018–19","units":["int"],"lead":"Three priorities.","text":"In 2017 he wrote to all staff: when growth clashes with compliance, compliance wins; when the firm's interest clashes with clients', clients win; when size clashes with results, results win.","co":[]},"t8n2":{"id":"t8n2","theme":"t8","tags":"Interviews, 2018–19","units":["int"],"lead":"Patient money.","text":"Many Gaoyi funds lock investors in for two or three years, some for five or eight, because stable money lets managers think long term.","co":[]},"t8n3":{"id":"t8n3","theme":"t8","tags":"Interviews, 2018–19","units":["int"],"lead":"A home for managers.","text":"He built Gaoyi to handle everything except investing, so its managers can concentrate on picking shares.","co":[]},"t8n4":{"id":"t8n4","theme":"t8","tags":"Interviews, 2018–19","units":["int"],"lead":"Shaped in America.","text":"His first job was as a strategist and quantitative analyst; his approach took shape during six years at Wedge Capital.","co":[]},"t9n1":{"id":"t9n1","theme":"t9","tags":"Profile, 2015","units":["prof"],"lead":"First money in 1992.","text":"At 19 he queued overnight for share subscription certificates and made his first stock market gains.","co":[]},"t9n2":{"id":"t9n2","theme":"t9","tags":"Book, 2014","units":["book"],"lead":"Many methods tried.","text":"Tips, charts, quant trading, concentrated picking, growth investing: he tried them all, and concluded that for most people only value investing can be learned and used.","co":[]},"t9n3":{"id":"t9n3","theme":"t9","tags":"Profile, 2015","units":["prof"],"lead":"Six strong years.","text":"The 2015 profile credits him with six strong years at China Southern, using value methods in China's A-share market.","co":[]},"t9n4":{"id":"t9n4","theme":"t9","tags":"Profile, 2015","units":["prof"],"lead":"The traits behind it.","text":"The same profile sums up his habits: independent judgement, faith in common sense, a contrarian streak and patience for delayed rewards.","co":[]},"t9n5":{"id":"t9n5","theme":"t9","tags":"Book, 2018","units":["book2"],"lead":"Simple, not easy.","text":"The point of the sequel: the principles are simple; holding to them, and applying them flexibly in a noisy market full of traps, is not.","co":[]},"t9n6":{"id":"t9n6","theme":"t9","tags":"Interviews, 2018–19","units":["int"],"lead":"Always learning.","text":"He enjoys investing as a search for the truth, with new industries to learn every year.","co":[]},"t10n1":{"id":"t10n1","theme":"t10","tags":"Letter, 2022","units":["l22"],"lead":"Three lessons.","text":"Too much in Hong Kong shares, cutting holdings too early in 2020, and too little attention to policy, especially the regulation of internet companies.","co":[]},"t10n2":{"id":"t10n2","theme":"t10","tags":"Letter, 2022","units":["l22"],"lead":"Buying too soon.","text":"After China's internet shares halved in late 2021 he added more, and they fell further.","co":[]},"t10n3":{"id":"t10n3","theme":"t10","tags":"Letter, 2022","units":["l22"],"lead":"Look up at the sky.","text":"His conclusion: keep your eyes on the road, but look up at the sky too, meaning watch policy as well as companies.","co":[]},"t10n4":{"id":"t10n4","theme":"t10","tags":"Letter, 2022","units":["l22"],"lead":"Still a value investor.","text":"He kept his faith in low valuations and his refusal to chase crowded favourites.","co":[]}},"quotes":[{"id":"q-book","unit":"book","label":"“Cheapness is the hard truth.” A principle from his 2014 book (our translation)","text":"便宜才是硬道理","theme":"t2"},{"id":"q-moon","unit":"moon","label":"“Pricing power is the core competitive advantage.” Gaoli lecture, 2017 (our translation)","text":"定价权是核心竞争力","theme":"t3"},{"id":"q-l22","unit":"l22","label":"“Don't only look down at the road; look up at the sky too.” Letter to investors, 2022 (our translation)","text":"不只是低头看路，也要抬头看天","theme":"t10"}],"mistakes":[],"tendencies":[],"plan":[{"n":1,"label":"Three questions","themes":["t1"],"units":["book"],"extra":""},{"n":2,"label":"Cheapness is the hard truth","themes":["t2"],"units":["book"],"extra":""},{"n":3,"label":"Pricing power is the core advantage","themes":["t3"],"units":["moon"],"extra":""},{"n":4,"label":"Count the moons, not the stars","themes":["t4"],"units":["moon"],"extra":""},{"n":5,"label":"Win first, then fight","themes":["t5"],"units":["tech"],"extra":""},{"n":6,"label":"Take what others discard","themes":["t6"],"units":["prof"],"extra":""},{"n":7,"label":"A lucky win is not a right bet","themes":["t7"],"units":["book"],"extra":""},{"n":8,"label":"Clients first","themes":["t8"],"units":["int"],"extra":""},{"n":9,"label":"Value investing works in China","themes":["t9"],"units":["book2"],"extra":""},{"n":10,"label":"Even legends stumble","themes":["t10"],"units":["l22"],"extra":""}],"selftest":["What are his three questions, and which does he find hardest?","Why does he put so much weight on a low price?","What are his two tests of a real competitive edge?","Rank the four kinds of industry structure from best to worst.","What does 'win first, then fight' mean for an investor?","Why are televisions a poorer business than air conditioners, in his view?","What is the difference between winning a bet and betting right?","What three priorities did he set for Gaoyi in 2017?","Which three mistakes did he review in 2022?","What does 'look up at the sky' mean?"],"disclaimer":["For education only. Nothing here is investment, financial, legal or tax advice, or a recommendation to buy, sell or hold any security.","Records and figures come from the published sources named on this page and may be revised; check the originals before relying on them.","Accuracy is not guaranteed and errors are possible; treat the original sources as correct. No liability is accepted for any loss arising from use of this material. Past results do not predict future ones.","Independent and unaffiliated: not endorsed by Qiu Guolu, Gaoyi Asset Management, China Southern Asset Management, Wedge Capital, the publishers, the publications quoted or any company named. All trademarks and copyrights belong to their owners."],"big":{"timeline":[[1992,"Aged 19 and studying finance at Xiamen University, makes his first stock market money queuing overnight for share subscription certificates"],[1999,"Joins Wedge Capital in the United States, where his approach takes shape over six years; becomes a partner"],[2005,"Leaves Wedge to start out on his own in hedge funds"],[2008,"Returns to China in the depths of the financial crisis to run investment at China Southern Asset Management"],[2014,"Leaves China Southern; publishes The Simplest Things in Investing in October; founds Gaoyi Asset Management"],[2015,"Gaoyi launches its first fund in February"],[2017,"Writes to all staff: compliance first, clients first, results before size; lectures at the Gaoli institute on counting moons"],[2018,"Publishes The Not-So-Simple Things in Investing with four Gaoyi colleagues"],[2021,"Gaoyi passes 100 billion yuan under management"],[2022,"Writes to investors after two hard years, reviewing three mistakes"]],"map":[["Cheapness is the hard truth","Even an ordinary company can pay well if bought cheaply enough."],["Pricing power is the core advantage","Do what you can repeat, and what others cannot copy."],["Win first, then fight","Wait until an industry's battle is over, then back the winner."],["Take what others discard","Go where the crowd is not, and find out why it left."],["Count the moons, not the stars","Prefer industries with one or two dominant firms to crowded ones."],["Process over outcome","A lucky win is not a right bet. Judge a method over five to ten years."]]},"record":[["3 questions","why is it cheap, why is it good, why now: his whole method"],["about 10","truly great companies, by his count, among roughly 2,500 then listed in China; so price must do much of the work"],["6 or 7 in 10","years in which, he reckons, a sound method beats the market; a poor one manages 3 or 4"],["¥100bn+","managed by Gaoyi, the firm he founded, by early 2021"]],"special":"cn","sp":[{"k":"checks","title":"Three questions, eight checks","items":["Cheap: low against its own history and its peers, on more than one measure","Good: it does something it can repeat, and others cannot copy","Good: its industry has one or two clear leaders, and it is one of them","Good: its products don't change every two or three years","Good: I know how it makes its profits, and its strategy fits","Now: the crowd is avoiding it, not chasing it","Now: the industry's battle is over, and I am buying the winner","I will judge this decision over five to ten years, not six months"],"verdicts":["Pick one company and tick what is true of it today.","Every box ticked. Ask once more why it is cheap, then decide.","Promising. Check whether the unticked boxes hide a value trap.","Too many gaps. On his method, wait or walk away."],"note":"Our study questions, drawn from his book and lectures; not a recommendation."},{"k":"ol","id":"sp-moons","title":"Count the moons: industries from best to worst","items":[["One moon.","A single dominant firm."],["A moon with bright stars.","One leader and a few strong rivals."],["Two or three moons.","A handful of equals."],["A sky full of stars.","Many small firms fighting on price."]],"note":"From his 2017 lecture. The hard part is defining the sky: which firms truly compete with each other."},{"k":"ol","title":"His four principles","items":[["Cheapness is the hard truth.",""],["Pricing power is the core advantage.",""],["Win first, then fight.",""],["Take what others discard.",""]],"note":"Our translations of the four principles in his book."}]},"zhanglei":{"id":"zhanglei","name":"Zhang Lei","short":"Zhang","mono":"ZL","country":"china","ready":true,"what":"His book, talks and tribute on long-term investing and backing great people","crumb":"Zhang Lei · 11 sources","handbookTitle":"Zhang Lei: a study handbook","unitTab":"Sources","unitWord":"source","unitRoute":"source","unitsRoute":"sources","scope":"His main work is the book Value: My Thoughts on Investing (2020), in Chinese. In English there are reports of his talks, a few interviews and his tribute to Swensen. Hillhouse's returns are private, so we show only figures others have published. This page includes an honest note on a 2023 investigation into a Hillhouse unit.","readHow":"Start with his tribute to David Swensen, free in English and a five-minute read, then the CFA Institute report of his 2018 talk. If you read Chinese, the book Value is the fullest account.","sourcesNote":"Sources: his book Value (2020) and its preface, notes from his Columbia Business School lecture (2015), CFA Institute's report of his 2018 talk, his 2021 tribute to David Swensen, Yale Daily News, Bloomberg (2020), Qiu Guolu's review of his book (2020), and press reports on Gree and LONGi. Lessons are in our own words; exact quotes are short and checked.","start":{"lede":"Zhang Lei learned investing as an intern under David Swensen at Yale's endowment, then founded Hillhouse in 2005 with $20 million from Yale. He backed Tencent early, put $300 million into JD.com in 2010, and built one of Asia's largest investment firms. His creed: think long term, research deeply, back entrepreneurs with great vision, and be a friend of time.","para":"This page draws on his book Value (2020), notes from his Columbia lecture (2015), CFA Institute's report of his 2018 talk, his tribute to David Swensen (2021), and press reports. About an hour a week for ten weeks: one idea here, then the source it comes from.","steps":[]},"glossary":[["Endowment","A fund given to a university or charity and invested so it can pay for its work for ever."],["Fiduciary","Someone trusted to act in another person's interest, before their own."],["Private equity","Buying stakes in companies, often unlisted, usually with a view to improving them."],["Venture capital","Investing in young companies in return for a stake."],["Take-private","Buying all the shares of a listed company so it leaves the stock market."],["Dynamic moat","A competitive edge that a company keeps renewing through innovation, rather than a fixed advantage."],["First principles","Reasoning from what a thing fundamentally is, rather than by comparison with something else."],["Disclosure threshold","The shareholding, 5% in China, above which an investor must announce changes in its stake."],["Securities lending","Lending shares to another investor for a fee, to be returned later."]],"units":[{"key":"value","chip":"Book, 2020","tag":"Book, 2020","title":"Value: My Thoughts on Investing","date":"Zhejiang Education Publishing House and Cheers Publishing, September 2020 (价值：我对投资的思考). In Chinese.","summary":"His life, his idea of long-termism, how Hillhouse researches and backs companies, his four signs of a great entrepreneur, and more than ten case studies.","year":2020,"link":"https://book.douban.com/subject/35188914/","linkLabel":"The book on Douban (Chinese)","nuggets":["t1n4","t1n5","t3n2","t6n2","t8n1","t8n2"],"mistakes":[],"quote":null},{"key":"pref","chip":"Preface, 2020","tag":"Preface, 2020","title":"Preface to Value: long-termism","date":"Published by Yicai, September 2020.","summary":"In his own words: why long-termism is the compass for investors, companies and society, and what a dynamic moat is.","year":2020,"link":"https://www.yicai.com/news/100751845.html","linkLabel":"Read the preface (Chinese)","nuggets":["t1n1","t6n1"],"mistakes":[],"quote":null},{"key":"ent","chip":"Excerpt, 2020","tag":"Excerpt, 2020","title":"Investing and entrepreneurship both need long-termism","date":"Excerpt from Value, published by 36Kr, September 2020.","summary":"Why choosing entrepreneurs with great vision is central, and his four-part definition of that vision.","year":2020,"link":"https://www.36kr.com/p/852939339586439","linkLabel":"Read the excerpt (Chinese)","nuggets":["t5n1","t5n2","t5n3","t5n4"],"mistakes":[],"quote":null},{"key":"col","chip":"Lecture, 2015","tag":"Lecture, 2015","title":"Lecture at Columbia Business School","date":"2015; notes by an attendee, published by GuruFocus, July 2015 (a summary, not his own text).","summary":"Why a long horizon is an edge from the start, deep research and few bets, the generalist team, and the qualities he hires for.","year":2015,"link":"https://www.gurufocus.com/news/349678/notes-from-hillhouse-capitals-lei-zhangs-lecture-at-columbia-business-school","linkLabel":"Read the notes","nuggets":["t1n2","t3n1","t3n3","t4n3","t4n5","t6n3","t7n3"],"mistakes":[],"quote":null},{"key":"cfa","chip":"CFA Institute, 2018","tag":"CFA Institute, 2018","title":"Lei Zhang on Hillhouse Capital's success equation","date":"CFA Institute Enterprising Investor blog, 14 May 2018, reporting his talk at the CFA Institute Annual Conference in Hong Kong.","summary":"People first, asking basic questions, a long view that lets exits look after themselves, and using technology to improve good companies.","year":2018,"link":"https://blogs.cfainstitute.org/blog/2018/05/14/lei-zhang-on-hillhouse-capitals-success-equation/","linkLabel":"Read the report","nuggets":["t3n4","t4n1","t4n2","t6n4","t7n1","t7n2"],"mistakes":[],"quote":"q-cfa"},{"key":"swen","chip":"Tribute, 2021","tag":"Tribute, 2021","title":"Remembering my legendary mentor David Swensen","date":"Written by Zhang Lei, Caixin Global, 9 May 2021.","summary":"His internship, what Swensen taught him about being a fiduciary and building an organisation with a soul, and why Yale backed him.","year":2021,"link":"https://www.caixinglobal.com/2021-05-09/obituary-remembering-my-legendary-mentor-david-swensen-101708563.html","linkLabel":"Read the tribute","nuggets":["t2n1","t2n2","t2n3","t2n4","t2n5","t4n4","t5n4","t8n3","t8n4"],"mistakes":[],"quote":"q-swen"},{"key":"ydn","chip":"Yale Daily News","tag":"Yale Daily News","title":"Profile of Lei Zhang, Yale trustee","date":"Yale Daily News profile by Serena Cho.","summary":"His Yale years, Hillhouse's name and its $20m start, his gifts to Yale, and what he says Yale taught him about investing.","year":null,"link":"https://yaledailynews.com/?p=152260","linkLabel":"Read the profile","nuggets":["t1n3","t8n3"],"mistakes":[],"quote":"q-ydn"},{"key":"bloom","chip":"Bloomberg, 2020","tag":"Bloomberg, 2020","title":"Yale's $2.4 billion profit machine Hillhouse is ready to reload","date":"Bloomberg, via BNN Bloomberg, 27 April 2020.","summary":"How much Hillhouse made for Yale, according to David Swensen, and why other endowments back Zhang personally.","year":2020,"link":"https://www.bnnbloomberg.ca/yale-s-2-4-billion-profit-machine-hillhouse-ready-to-reload-1.1427668","linkLabel":"Read the report","nuggets":["t9n4"],"mistakes":[],"quote":null},{"key":"qiu","chip":"Review, 2020","tag":"Review, 2020","title":"Practising value investing: a review of Value","date":"By Qiu Guolu, China Securities Journal, 21 September 2020.","summary":"A fellow investor on what is new in his approach: research ahead of the crowd, as in biotech, and large, patient bets such as JD.com.","year":2020,"link":"https://cs.com.cn/xwzx/jr/202009/t20200921_6096372.html","linkLabel":"Read the review (Chinese)","nuggets":["t3n5","t6n3","t7n4"],"mistakes":[],"quote":null},{"key":"gree","chip":"Caixin, 2019–26","tag":"Caixin, 2019–26","title":"Hillhouse and Gree Electric","date":"Caixin Global, October 2019 and February 2026.","summary":"How a Hillhouse fund won 15% of Gree in 2019, and its first planned sale of shares in 2026 with the stake below its purchase price.","year":2026,"link":"https://www.caixinglobal.com/2026-02-27/hillhouse-to-cut-gree-stake-in-first-move-since-landmark-buyout-102417309.html","linkLabel":"Read the 2026 report","nuggets":["t9n1","t9n2","t9n3"],"mistakes":[],"quote":null},{"key":"longi","chip":"News, 2023–24","tag":"News, 2023–24","title":"The HHLR investigation over LONGi shares","date":"Yicai Global, November 2023; Yicai, April 2024.","summary":"Why China's securities regulator investigated a Hillhouse unit's LONGi shares, and how the unit responded.","year":2024,"link":"https://yicaiglobal.com/news/hillhouse-unit-is-probed-by-chinese-regulators-for-allegedly-breaking-bourse-rules","linkLabel":"Read the report","nuggets":["t10n1","t10n2","t10n3","t10n4"],"mistakes":[],"quote":null}],"themes":[{"id":"t1","num":1,"title":"Long-termism","idea":"Put your time and conviction into things that create value over many years. A long horizon is an edge from the starting line.","nuggets":["t1n1","t1n2","t1n3","t1n4","t1n5"],"ask":["Which of your holdings will be more valuable in ten years, and why?","What short-term worry has pushed you off a long-term plan?"],"table":null,"tool":null,"stories":[],"diagram":"time","after":0,"caption":"In the short run prices wander around value; over the long run value creation shows through."},{"id":"t2","num":2,"title":"Swensen's lessons","idea":"David Swensen was his first teacher. He learned what it means to be a fiduciary, to think truly long term, and to build an organisation with a soul.","nuggets":["t2n1","t2n2","t2n3","t2n4","t2n5"],"ask":["Who was your first real teacher in money matters? What did they teach you?","What would an organisation with a soul look like in your own work?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t3","num":3,"title":"Research is the base","idea":"Deep research comes first, and few bets. Understand real businesses the way a field researcher studies a village.","nuggets":["t3n1","t3n2","t3n3","t3n4","t3n5"],"ask":["What could you learn about a company by visiting its shops or talking to its customers?","What basic question about your biggest holding can you not answer?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t4","num":4,"title":"People first","idea":"Hillhouse's growth came mainly from people: the managers it hires and the entrepreneurs it backs.","nuggets":["t4n1","t4n2","t4n3","t4n4","t4n5"],"ask":["Whose judgement would you trust with your savings, and why?","How can you tell if a company's managers are aligned with customers?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t5","num":5,"title":"Backing great vision","idea":"He looks for entrepreneurs with great vision, which he defines in four parts.","nuggets":["t5n1","t5n2","t5n3","t5n4"],"ask":["Which founder you admire thinks twenty years ahead? How can you tell?","Is vision without execution worth anything?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t6","num":6,"title":"Moats must keep moving","idea":"Static moats erode. The lasting edge belongs to companies that keep innovating and rebuilding their advantage.","nuggets":["t6n1","t6n2","t6n3","t6n4"],"ask":["Which company you know has rebuilt its edge more than once?","What could make today's strongest moat useless?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t7","num":7,"title":"Create value, don't just find it","idea":"Hillhouse tries to help good companies get better, rather than planning the exit first.","nuggets":["t7n1","t7n2","t7n3","t7n4"],"ask":["How could an owner help a company you know get better?","Why might planning the exit first harm a company?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t8","num":8,"title":"Fire cannot burn it","idea":"As a student he decided that what fire can burn, money and houses, matters least. What lasts is knowledge, ability and values.","nuggets":["t8n1","t8n2","t8n3","t8n4"],"ask":["What do you own that fire cannot burn?","What belief of yours have you never tested from first principles?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t9","num":9,"title":"Patience with big bets","idea":"Long-term bets can stay underwater for years. Gree shows both the patience and the risk.","nuggets":["t9n1","t9n2","t9n3","t9n4"],"ask":["How long would you wait for a big bet to come good?","Why does borrowing make patience harder?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""},{"id":"t10","num":10,"title":"The LONGi investigation","idea":"In 2023 China's securities regulator investigated a Hillhouse unit over undisclosed share sales. Here are the facts, so you can judge for yourself.","nuggets":["t10n1","t10n2","t10n3","t10n4"],"ask":["Why do rules require large shareholders to announce their sales?","How would you weigh a firm-level lapse against a long record?"],"table":null,"tool":null,"stories":[],"diagram":null,"after":0,"caption":""}],"nuggets":{"t1n1":{"id":"t1n1","theme":"t1","tags":"Preface, 2020","units":["pref"],"lead":"His compass.","text":"Long-termism means putting time and conviction into things that keep creating value, learning the most effective ways of thinking, and always seeking the truth.","co":[]},"t1n2":{"id":"t1n2","theme":"t1","tags":"Lecture, 2015","units":["col"],"lead":"An edge from the start.","text":"A long horizon gives you an advantage before you begin, because so few investors can afford to wait.","co":[]},"t1n3":{"id":"t1n3","theme":"t1","tags":"Yale Daily News","units":["ydn"],"lead":"Not about the shortest path.","text":"Yale taught him that investing is not a race for quick returns but working with the best people to build lasting organisations.","co":[]},"t1n4":{"id":"t1n4","theme":"t1","tags":"Book, 2020","units":["value"],"lead":"Holding long is a result.","text":"Long holding periods are the result of backing companies that keep creating value, not a goal in themselves.","co":[]},"t1n5":{"id":"t1n5","theme":"t1","tags":"Book, 2020","units":["value"],"lead":"A friend of time.","text":"He sums up his approach in three phrases: long-termism, walking with people of great vision, and being a friend of time.","co":[]},"t2n1":{"id":"t2n1","theme":"t2","tags":"Tribute, 2021","units":["swen"],"lead":"A student who couldn't pay.","text":"Short of money for his second year at Yale, he got an internship in Swensen's office. His first task was translating Swensen's book into Chinese.","co":[]},"t2n2":{"id":"t2n2","theme":"t2","tags":"Tribute, 2021","units":["swen"],"lead":"Hundreds of basic questions.","text":"Swensen answered hundreds of his questions, on the trading floor and over squash and softball.","co":[]},"t2n3":{"id":"t2n3","theme":"t2","tags":"Tribute, 2021","units":["swen"],"lead":"Fiduciary.","text":"Swensen showed him what a fiduciary is: someone who puts the interests of those who trust him first. He struggled to find a Chinese word for it.","co":[]},"t2n4":{"id":"t2n4","theme":"t2","tags":"Tribute, 2021","units":["swen"],"lead":"A bet on a person.","text":"Yale backed him when he was 32 and had never managed a portfolio. Swensen's reason: work with the right people and good things tend to follow.","co":[]},"t2n5":{"id":"t2n5","theme":"t2","tags":"Tribute, 2021","units":["swen"],"lead":"A soul.","text":"Swensen spoke of organisations with a soul, driven by a mission. Zhang came to believe such teams innovate more and last longer.","co":[]},"t3n1":{"id":"t3n1","theme":"t3","tags":"Lecture, 2015","units":["col"],"lead":"Few, deep bets.","text":"Make deep fundamental research the basis of every decision, and place a few bets rather than chase many ideas.","co":[]},"t3n2":{"id":"t3n2","theme":"t3","tags":"Book, 2020","units":["value"],"lead":"Like fieldwork.","text":"Value investing is not maths on paper. Like a sociologist doing fieldwork, you must see how people really live and buy.","co":[]},"t3n3":{"id":"t3n3","theme":"t3","tags":"Lecture, 2015","units":["col"],"lead":"Generalists.","text":"His team works as generalists, and he counts himself one of the analysts.","co":[]},"t3n4":{"id":"t3n4","theme":"t3","tags":"CFA Institute, 2018","units":["cfa"],"lead":"Ask the basic questions.","text":"Success comes down to stripping an investment to its most basic questions.","co":[]},"t3n5":{"id":"t3n5","theme":"t3","tags":"Review, 2020","units":["qiu"],"lead":"Ahead of the crowd.","text":"Qiu Guolu recalls Zhang convening top scientists in 2015 on cancer immunotherapy, before most Chinese investors knew the field, and backing BeiGene in eight rounds.","co":[]},"t4n1":{"id":"t4n1","theme":"t4","tags":"CFA Institute, 2018","units":["cfa"],"lead":"Owners aligned with customers.","text":"Before investing, find out whether owners, directors and managers are long-term, intelligent and aligned with their customers' needs.","co":[]},"t4n2":{"id":"t4n2","theme":"t4","tags":"CFA Institute, 2018","units":["cfa"],"lead":"Who he hires.","text":"Intelligence, independent thinking and honesty count for more than experience or background.","co":[]},"t4n3":{"id":"t4n3","theme":"t4","tags":"Lecture, 2015","units":["col"],"lead":"Three intellectual habits.","text":"Curiosity, independence and honesty, plus empathy: qualities he looks for in people.","co":[]},"t4n4":{"id":"t4n4","theme":"t4","tags":"Tribute, 2021","units":["swen"],"lead":"Quality time with quality people.","text":"Swensen's reason for backing him became Hillhouse's motto: spend quality time with quality people.","co":[]},"t4n5":{"id":"t4n5","theme":"t4","tags":"Lecture, 2015","units":["col"],"lead":"Entrepreneurs who invest.","text":"He describes Hillhouse as entrepreneurs who happen to be investors.","co":[]},"t5n1":{"id":"t5n1","theme":"t5","tags":"Excerpt, 2020","units":["ent"],"lead":"Four signs.","text":"Long-term thinking amid uncertainty; deep insight into the industry; focused execution; and strong empathy that brings people and resources together.","co":[]},"t5n2":{"id":"t5n2","theme":"t5","tags":"Excerpt, 2020","units":["ent"],"lead":"The secret handshake.","text":"He calls great vision Hillhouse's secret handshake with companies: founders who want to build something great make the best partners.","co":[]},"t5n3":{"id":"t5n3","theme":"t5","tags":"Excerpt, 2020","units":["ent"],"lead":"Ten or twenty years.","text":"Good entrepreneurs see ten or twenty years ahead, sometimes beyond their own lives.","co":[]},"t5n4":{"id":"t5n4","theme":"t5","tags":"Tribute, 2021 · Excerpt, 2020","units":["swen","ent"],"lead":"Choose the person, then the project.","text":"When Swensen backed him, it was a bet on a person. Zhang applies the same logic to founders.","co":[]},"t6n1":{"id":"t6n1","theme":"t6","tags":"Preface, 2020","units":["pref"],"lead":"A dynamic moat.","text":"Long-termism helps companies escape zero-sum games and keep rebuilding a dynamic moat through constant innovation.","co":[]},"t6n2":{"id":"t6n2","theme":"t6","tags":"Book, 2020","units":["value"],"lead":"Value investing evolves.","text":"As markets grow more efficient, deeply undervalued companies become rare. Investors must find new, forward-looking drivers of value.","co":[]},"t6n3":{"id":"t6n3","theme":"t6","tags":"Lecture, 2015 · Review, 2020","units":["col","qiu"],"lead":"Invest in change.","text":"He looks for industries being changed by technology and new ways of doing business.","co":[]},"t6n4":{"id":"t6n4","theme":"t6","tags":"CFA Institute, 2018","units":["cfa"],"lead":"Technology and tradition.","text":"He invests in both new technology and traditional industries, public or private, large or small.","co":[]},"t7n1":{"id":"t7n1","theme":"t7","tags":"CFA Institute, 2018","units":["cfa"],"lead":"The exit looks after itself.","text":"Unlike buyout firms that plan the exit first and lean on debt and cost cuts, he backs good people and solid cash flow and lets the exit take care of itself.","co":[]},"t7n2":{"id":"t7n2","theme":"t7","tags":"CFA Institute, 2018","units":["cfa"],"lead":"Belle.","text":"In 2017 Hillhouse led the $6.8 billion purchase of the shoe retailer Belle, aiming to use technology for online sales, stock control and better service in shops.","co":[]},"t7n3":{"id":"t7n3","theme":"t7","tags":"Lecture, 2015","units":["col"],"lead":"Not the format, the substance.","text":"With freedom to invest in public shares, venture and private equity, he focuses on the substance of a deal, not its form.","co":[]},"t7n4":{"id":"t7n4","theme":"t7","tags":"Review, 2020","units":["qiu"],"lead":"Go big when you know.","text":"In 2010 he put $300 million into JD.com in one go, backed by years of studying retail around the world.","co":[]},"t8n1":{"id":"t8n1","theme":"t8","tags":"Book, 2020","units":["value"],"lead":"Three fires.","text":"Things fire can burn, such as money and houses, are not what matters. What matters is what fire cannot burn: knowledge, ability and values.","co":[]},"t8n2":{"id":"t8n2","theme":"t8","tags":"Book, 2020","units":["value"],"lead":"First principles.","text":"Don't reason by analogy. Peel back the surface to see what a thing really is, then build up from there.","co":[]},"t8n3":{"id":"t8n3","theme":"t8","tags":"Yale Daily News · Tribute, 2021","units":["ydn","swen"],"lead":"Education never ends.","text":"He has given generously to Yale and, inspired by Swensen, founded an institute to teach long-term investing.","co":[]},"t8n4":{"id":"t8n4","theme":"t8","tags":"Tribute, 2021","units":["swen"],"lead":"A teacher's example.","text":"Swensen saw teaching as one of his most important duties; Zhang took that as the clearest sign of a long-term mind.","co":[]},"t9n1":{"id":"t9n1","theme":"t9","tags":"Caixin, 2019–26","units":["gree"],"lead":"Gree.","text":"In 2019 a Hillhouse fund paid 41.66 billion yuan, partly borrowed, for 15% of Gree Electric and became its biggest shareholder.","co":[]},"t9n2":{"id":"t9n2","theme":"t9","tags":"Caixin, 2019–26","units":["gree"],"lead":"Still underwater.","text":"By early 2026 Gree's shares were nearly 20% below the purchase price, a paper loss partly offset by about 15 billion yuan of dividends.","co":[]},"t9n3":{"id":"t9n3","theme":"t9","tags":"Caixin, 2019–26","units":["gree"],"lead":"Debt has a cost.","text":"In 2026 Hillhouse planned to sell about 2% of Gree to repay bank loans from the deal.","co":[]},"t9n4":{"id":"t9n4","theme":"t9","tags":"Bloomberg, 2020","units":["bloom"],"lead":"Yale's gain.","text":"By 2020, Swensen said, Hillhouse had made about $2.4 billion of gains for Yale.","co":[]},"t10n1":{"id":"t10n1","theme":"t10","tags":"News, 2023–24","units":["longi"],"lead":"What happened.","text":"HHLR, Hillhouse's public-markets unit, owned 5.85% of the solar company LONGi. In March 2023 it lent out shares, taking its stake below 5%, the level above which sales must be announced.","co":[]},"t10n2":{"id":"t10n2","theme":"t10","tags":"News, 2023–24","units":["longi"],"lead":"The gap.","text":"When the loan ended, its stake was only 4.98%, implying it had sold about 0.9% of the company without an announcement.","co":[]},"t10n3":{"id":"t10n3","theme":"t10","tags":"News, 2023–24","units":["longi"],"lead":"The probe.","text":"In November 2023 the regulator opened an investigation for suspected breaches of share-transfer rules, and the exchanges soon closed the loophole.","co":[]},"t10n4":{"id":"t10n4","theme":"t10","tags":"News, 2023–24","units":["longi"],"lead":"The response.","text":"In April 2024 HHLR began buying the shares back, promising to hand any gain to LONGi. We have found no published final penalty decision.","co":[]}},"quotes":[{"id":"q-ydn","unit":"ydn","label":"Email to Yale Daily News","text":"investing is not about chasing the shortest path to returns","theme":"t1"},{"id":"q-swen","unit":"swen","label":"Hillhouse's motto, in his tribute to Swensen, 2021","text":"Spend quality time with quality people.","theme":"t4"},{"id":"q-cfa","unit":"cfa","label":"As reported by CFA Institute, 2018","text":"Success ultimately comes down to asking the basic questions","theme":"t3"}],"mistakes":[],"tendencies":[],"plan":[{"n":1,"label":"Long-termism","themes":["t1"],"units":["pref"],"extra":""},{"n":2,"label":"Swensen's lessons","themes":["t2"],"units":["swen"],"extra":""},{"n":3,"label":"Research is the base","themes":["t3"],"units":["col"],"extra":""},{"n":4,"label":"People first","themes":["t4"],"units":["cfa"],"extra":""},{"n":5,"label":"Backing great vision","themes":["t5"],"units":["ent"],"extra":""},{"n":6,"label":"Moats must keep moving","themes":["t6"],"units":["pref"],"extra":""},{"n":7,"label":"Create value, don't just find it","themes":["t7"],"units":["cfa"],"extra":""},{"n":8,"label":"Fire cannot burn it","themes":["t8"],"units":["value"],"extra":""},{"n":9,"label":"Patience with big bets","themes":["t9"],"units":["gree"],"extra":""},{"n":10,"label":"The LONGi investigation","themes":["t10"],"units":["longi"],"extra":""}],"selftest":["What does he mean by long-termism, and why is a long horizon an edge?","Name three things Swensen taught him.","Why did Yale back him in 2005?","How does he compare value investing to fieldwork?","What qualities does he look for in people?","What are his four signs of an entrepreneur with great vision?","What is a dynamic moat?","How does Hillhouse differ from buyout firms that plan the exit first?","What are the 'three fires'?","What happened in the 2023 LONGi investigation, and how did the unit respond?"],"disclaimer":["For education only. Nothing here is investment, financial, legal or tax advice, or a recommendation to buy, sell or hold any security.","Records and figures come from the published sources named on this page and may be revised; check the originals before relying on them.","Accuracy is not guaranteed and errors are possible; treat the original sources as correct. No liability is accepted for any loss arising from use of this material. Past results do not predict future ones.","Independent and unaffiliated: not endorsed by Zhang Lei, Hillhouse, HHLR, Yale University, CFA Institute, Caixin, the publishers, Gree Electric, LONGi or any company named. All trademarks and copyrights belong to their owners."],"big":{"timeline":[[1972,"Born in Zhumadian, Henan province"],[1994,"Graduates in economics from Renmin University, which he attended on a scholarship"],[1999,"Goes to Yale; takes David Swensen's class and becomes an intern at Yale's investments office"],[2002,"Yale MBA and MA in international relations; his first internship task was translating Swensen's book into Chinese"],[2005,"Founds Hillhouse in June with $20 million from Yale; one of its first investments is Tencent"],[2010,"Invests $300 million in JD.com; pledges $8,888,888 to the Yale School of Management, then its largest gift from an alumnus"],[2016,"Joins the Yale Corporation, the university's board"],[2017,"Leads the $6.8 billion purchase of the shoe retailer Belle, taking it off the stock market"],[2019,"A Hillhouse fund buys 15% of Gree Electric, the air-conditioner maker, for 41.66 billion yuan"],[2020,"Publishes his book Value"],[2021,"Swensen dies; Zhang writes a tribute to his first teacher"],[2023,"China's securities regulator opens an investigation into HHLR, a Hillhouse unit, over sales of LONGi shares"],[2024,"HHLR buys back the LONGi shares, promising any gain to LONGi"],[2026,"Hillhouse plans its first sale of Gree shares, to repay loans from the 2019 deal"]],"map":[["Long-termism","Put time and conviction into things that create value over many years."],["Research is the base","Understand real businesses like a field researcher, not only from accounts."],["Back people with great vision","Long-term, deep insight, focused execution, strong empathy."],["Moats must keep moving","A lasting edge comes from a company that keeps innovating."],["Create value, don't just find it","Help good companies get better, with technology and patience."],["Be a friend of time","Choose things that grow more valuable as time passes."]]},"record":[["$20m","Yale's seed money when he founded Hillhouse in 2005"],["$2.4bn","gains Hillhouse had made for Yale by 2020, according to David Swensen"],["$300m","invested in JD.com in 2010, in one go"],["¥41.66bn","paid in 2019 for 15% of Gree Electric; the shares were still below that price in early 2026"]],"special":"cn","sp":[{"k":"ol","title":"Four signs of an entrepreneur with great vision","items":[["Long-termism:","seeking the long run amid uncertainty."],["Deep insight:","into the industry, spotting key trends through constant innovation."],["Focused execution:","doing things to the highest standard."],["Strong empathy:","bringing people and resources together to make ideas real."]],"note":"From his book Value (2020), in our words."},{"k":"ol","title":"What he looks for in people","items":[["Curiosity.",""],["Independence of mind.",""],["Intellectual honesty.",""],["Empathy.",""],["Long-term and aligned with customers,","for the owners and managers he backs."]],"note":"From notes of his 2015 Columbia lecture and CFA Institute's report of his 2018 talk."},{"k":"honest","id":"sp-honest","text":"In November 2023 China's securities regulator opened an investigation into HHLR, the public-markets unit of Hillhouse. HHLR owned 5.85% of the solar company LONGi. In March 2023 it lent out shares, taking its stake below 5%, the level above which sales must be announced; when the loan ended its stake was only 4.98%, implying it had sold about 0.9% of the company without an announcement. In April 2024 HHLR began buying the shares back and promised to hand any gain to LONGi. The case concerned the rules on announcing share sales; we have seen no allegation that clients' money was misused, and we have found no published final penalty decision. We include Zhang Lei for his long record and ideas, and state this plainly so you can judge for yourself."}]}},"checklistSeed":["Has anything changed in the business, or only in the price?","Would I make this trade if the market were closed for the next three years?","Is this inside my circle? Can I state the moat in two sentences?","What is my range of value, and where is today's price within it?","What will tax and costs take out of this trade, in money terms?","What will I own instead, and is it clearly better after those costs?","Am I acting because I am bored, anxious, or reacting to someone else's gain?","Have I slept on it for at least a week?"],"journey":{"asOf":"13 Nov 2026","hero":{"title":"Thirteen years, two teachers","sub":"I built this library. This is my own record as an investor, shown only in percentages: where I followed Buffett and Munger, where I didn't, and what each choice cost or earned.","stats":[["24.1%","a year, Jul 2013 to Nov 2026"],["−40%","my worst fall, 2021 to 2025"],["4 of 11","full years I beat my yardstick fund"],["35%","of all I earned went on living costs"]]},"story":["In 2015 I left my job. Since then this portfolio has paid my living costs.","For ten years, 2015 to 2024, I earned 10.6% a year. The diversified fund I use as my yardstick earned 18.3%. Berkshire's share price earned 11.7%, in dollars.","By my own rule, I should have handed my money to that fund in 2020. I didn't.","From the 2021 high my portfolio fell 40% on returns alone, and took almost four years to recover.","Then one winner I let run changed the picture: up 64% in 2025 and 100% so far in 2026.","Today one stock is about 69% of my portfolio. That breaks my own rules, and it is my biggest risk."],"falls":[["Berkshire, 1973 to 1975",-59.1,"buffett"],["Berkshire, October 1987",-37.1,"buffett"],["Berkshire, 1998 to 2000",-48.9,"buffett"],["Berkshire, 2008 to 2009",-50.7,"buffett"],["Munger's partnership, 1973 to 1974",-53.4,"munger"],["My portfolio, 2021 to 2025",-40.1,"journey"]],"fallsNote":"Berkshire's falls are in its share price, from Buffett's 2017 letter. Munger's partnership fell 31.9% in 1973 and 31.5% in 1974, about 53% over the two years. Mine is the fall in my returns, leaving out money I took out; counting withdrawals, the portfolio's value fell 48%.","score":[["Me, whole career (cash-flow based)","Jul 2013 to Nov 2026","24.1%","journey"],["Me","2015 to 2024","10.6%","journey"],["My yardstick fund","2015 to 2024","18.3%","fund"],["Berkshire share price (US$)","2015 to 2024","11.7%","buffett"],["S&P 500 with dividends (US$)","2015 to 2024","13.1%","index"],["Berkshire share price (US$)","1965 to 2024","19.9%","buffett"],["Munger's partnership (US$, before fees)","1962 to 1975","19.8%","munger"]],"caveats":["Not a fair race. The currencies, sizes, eras and lengths differ. Munger's record runs 14 years and Berkshire's 60; mine is 13.","My figures are worked out from my own records. They are unaudited and before tax. Years before 2020 rest on year-end values, so they are rougher.","My whole-career figure counts the timing of money in and out (XIRR). The yearly figures are time-weighted, so money I took out does not count against them.","Over 2015 to 2024 even Berkshire's share price trailed the S&P 500. Most of my lead today comes from one stock, in 2025 and 2026."],"years":[[2015,31.7,9.5,false],[2016,-8.5,4.11,false],[2017,45.8,30.47,false],[2018,0.6,0.22,false],[2019,-6.9,14.93,false],[2020,46.6,33.28,true],[2021,38.7,46.76,false],[2022,-29.6,-6.29,false],[2023,23.9,37.92,false],[2024,-6.4,24.43,false],[2025,64.2,8.22,false],[2026,99.8,-0.65,false]],"first":"Jul 2013 to Dec 2014 (17 months): +98.0%. No yardstick figure for this stretch.","growth":[["2014",1,1],["2015",1.32,1.09],["2016",1.21,1.14],["2017",1.76,1.49],["2018",1.77,1.49],["2019",1.65,1.71],["2020",2.41,2.28],["2021",3.35,3.35],["2022",2.36,3.14],["2023",2.92,4.33],["2024",2.73,5.39],["2025",4.49,5.83],["Nov 2026",8.96,5.79]],"rule12":[["2017",20,14,"ahead"],["2018",10,11,"behind"],["2019",13,15,"behind"],["2020",11,15,"behind"],["2021",24,31,"behind"],["2022",16,22,"behind"],["2023",6,24,"behind"],["2024",-8,17,"behind"],["2025",23,23,"level"],["Nov 2026",46,11,"ahead"]],"facts":[["Whole career, cash-flow based","24.1% a year, Jul 2013 to Nov 2026"],["Since the April 2020 rebuild","31.8% a year"],["Best 12 months","+114.7%, to Nov 2026"],["Worst fall","−40% on returns alone; −48% in value, counting withdrawals"],["Time below the old high","47 months on returns alone; 57 in value"],["Value today plus all I took out","7.1 times the money I put in"],["Share of all earnings spent on living costs","35%"],["Stocks owned since 2020 that made money","74 of 101; gains were 8.6 times the losses"]],"lessons":[{"id":"drift","y":[2016,2019],"kind":"broke","title":"Four years that went nowhere","facts":["My returns: −8.5%, +45.8%, +0.6%, −6.9%. The fund: +4.1%, +30.5%, +0.2%, +14.9%.","In three of those years my living costs took more out than the portfolio made.","My own rule says: if my three-year return trails the fund three times in a row, hand the money to the fund. That happened at the end of 2020, and the run lasted seven windows. I didn't hand over."],"rule":{"who":"Buffett","text":"Most investors do better in a low-cost index fund than by picking stocks, and fees and activity eat returns.","pack":"buffett","theme":"t5","quote":"q2017"},"now":"I check the rule every year, and I publish it here so I can't quietly forget it.","links":[["buffett","t5"]]},{"id":"covid","y":[2020,2020],"kind":"kept","title":"Buying when others froze","facts":["I had sold down as the market fell in February and March 2020. Straight after the crash, I put almost all of the portfolio back into stocks over three days, 7 to 9 April.","2020 ended +46.6% against the fund's +33.3% (my figure is rough: there is a gap in my records from January to March)."],"rule":{"who":"Buffett","text":"Be greedy when others are fearful.","pack":"buffett","theme":"t4","quote":"q2004"},"now":"The decision my whole record rests on. When everyone freezes, I look harder, not away.","links":[["buffett","t4"],["munger","t13"]]},{"id":"churn","y":[2020,2023],"kind":"broke","title":"Trading far too much","facts":["From April 2020 to March 2023 I traded five to seven times the portfolio's value every year. My own limit is twice.","Brokerage and trading taxes since 2020 have cost about 4% of everything the portfolio earned."],"rule":{"who":"Buffett","text":"For investors as a whole, the more they move, the less they keep.","pack":"buffett","theme":"t5","quote":"q2005"},"now":"Trading at most twice the portfolio's value a year.","links":[["buffett","t5"],["munger","t11"]]},{"id":"circle","y":[2021,2022],"kind":"broke","title":"Buying a story outside my circle","facts":["In 2021 I bought a basket of hyped new listings. It was a story, not my lane of small, clean, little-followed companies.","Two of them lost money while I held them, at −19% and −83% a year."],"rule":{"who":"Buffett and Munger","text":"Stay inside your circle of competence; the edge matters more than the size.","pack":"buffett","theme":"t7","quote":"q1996"},"now":"Only companies in my lane, and a written reason for each one.","links":[["buffett","t7"],["munger","t8"],["lynch","t3"]]},{"id":"euphoria","y":[2021,2021],"kind":"kept","title":"Selling into the frenzy","facts":["In December 2021 I sold a big winner near the peak of the excitement. It had earned about 65% a year while I held it."],"rule":{"who":"Buffett","text":"A price that makes sense at one level stops making sense at another.","pack":"buffett","theme":"t3","quote":"q2016"},"now":"I write my selling zone down before I buy, so the crowd can't set it for me.","links":[["buffett","t3"],["buffett","t4"]]},{"id":"stuck","y":[2021,2025],"kind":"broke","title":"Holding on, and adding, while it stalled","facts":["For four years one stock was often more than half of my portfolio, at times 76%.","I kept adding as it fell. Over its whole life it earned about 4% a year. The fund earned about 15% a year over 2022 to 2025."],"rule":{"who":"Munger","text":"Our minds hate to change a conclusion once made, and we deny what hurts. He named these tendencies so we can catch them.","pack":"munger","theme":"t4","quote":null},"now":"A big position that stalls gets 18 months, then I change boats. I never average down on a falling thesis.","links":[["munger","t4"],["buffett","t13"],["lynch","t12"]]},{"id":"buffer","y":[2022,2023],"kind":"broke","title":"No cash cushion in a bad market","facts":["My living costs took about 7% of the portfolio in 2022 and 11% in 2023, sold near the lows.","The portfolio's value fell 48% from its September 2021 high, counting withdrawals; 40% on returns alone."],"rule":{"who":"Buffett","text":"Never put yourself where you can be forced to sell.","pack":"buffett","theme":"t6","quote":"q2023"},"now":"Keep two years of spending outside stocks, so I am never a forced seller.","links":[["buffett","t6"],["lynch","t2"]]},{"id":"nerve","y":[2023,2025],"kind":"kept","title":"Not giving up at the bottom","facts":["Down almost half from the high, I did not sell out.","I also stopped churning: trading fell from 5.5 times the portfolio a year to about 0.5 times.","It took 47 months on returns alone to get back above the old high."],"rule":{"who":"Munger","text":"Setbacks will come, some of them unfair; what you do next decides the result.","pack":"munger","theme":"t13","quote":null},"now":"When I'm down, I read more and trade less.","links":[["munger","t13"],["buffett","t4"]]},{"id":"winner","y":[2025,2026],"kind":"kept","title":"Letting a winner run","facts":["2025: +64.2% against the fund's +8.2%. 2026 so far: +99.8% against −0.6%.","One stock earned about 250% a year while I held it, and made about 44% of everything the portfolio earned since 2020."],"rule":{"who":"Buffett","text":"Mistakes fade; a few winners can keep growing for a very long time.","pack":"buffett","theme":"t13","quote":"q2024"},"now":"Sit when the thesis holds. The money is made by waiting.","links":[["buffett","t14"],["munger","t9"],["lynch","t10"]]},{"id":"churn2","y":[2025,2026],"kind":"broke","title":"The old trading habit came back","facts":["In the year to March 2026 I traded 3.1 times the portfolio, and this year is on pace for 2.8 times. My limit is twice."],"rule":{"who":"Buffett","text":"Activity is a cost, even when it feels like work.","pack":"buffett","theme":"t5","quote":null},"now":"Same limit, checked every month.","links":[["buffett","t5"],["lynch","t12"]]},{"id":"borrow","y":[2025,2026],"kind":"risk","title":"Borrowing to buy more","facts":["From September 2025 I borrowed money to add to stocks.","So far the borrowed money has grown about 63%, against interest of about 6% of it. But at one point it was 11% under water, and the repayments can only come from selling stock.","In a fall like 2022 I would be a forced seller."],"rule":{"who":"Buffett","text":"Credit is easy to get until the day it vanishes, and that is the day you need it.","pack":"buffett","theme":"t6","quote":"q2010"},"now":"Pay it down. No new borrowing to buy stocks.","links":[["buffett","t6"]]},{"id":"concentration","y":[2026,2026],"kind":"risk","title":"One stock is 69% of my portfolio","facts":["My top holding is about 69% of the portfolio and the top two about 98%.","My own rules say at most 30 to 35% in one idea and 60 to 65% in the top two."],"rule":{"who":"Munger, and Buffett","text":"Munger argued that a few great holdings can be rational. Buffett's first rule is never to risk a permanent loss. Both apply here, and they pull in opposite directions.","pack":"munger","theme":"t9","quote":"q-foundations1998"},"now":"Bring it back inside my limits, in steps, without selling in a panic.","links":[["munger","t9"],["buffett","t6"]]},{"id":"losers","y":[2020,2026],"kind":"kept","whole":true,"title":"Cutting losers early","facts":["Of 101 stocks I owned since 2020, 74 made money. Gains were 8.6 times the losses."],"rule":{"who":"My own rule","text":"Cut a loser within 45 days. This one is mine, not theirs.","pack":null,"theme":null,"quote":null},"now":"Keep cutting losers fast, and let the winners do the work.","links":[]}],"rulesNow":["Own 4 to 7 stocks, only in my lane: small, governance-clean, little-followed companies.","An unproven idea gets at most 30 to 35% of the portfolio; the top two at most 60 to 65%.","Trade at most twice the portfolio's value in a year.","Cut losers within 45 days. Nothing stuck for more than 18 months.","Sell at a price zone written down in advance, based on how big the business can get, never on the P/E alone.","Add when the thesis is confirmed. Never average down on a falling thesis.","Before every buy, check that the company's market value makes sense.","At results, try to prove the thesis wrong, not just judge the quarter.","Before every buy, a pre-mortem: if this halves in 18 months, what broke?","No new buying in a year when I'm in a big drawdown. Big decisions get a second opinion.","Check every number that matters, including the ones a computer gives me.","If my three-year return trails my yardstick fund three times in a row, hand the money to the fund.","Never be a forced seller: keep two years of spending outside stocks."],"rulesNote":"Two of these I am breaking right now: the size limits and the trading limit.","method":["Source: my own records up to the 13 Nov 2026 close. Percentages only, by choice: no amounts, no stock names.","Yearly returns are time-weighted (Modified Dietz, monthly from April 2020; yearly before that). The whole-career fi  graduates magna cum laude, one of 12 in a class of 335."},{"a":1948,"b":1962,"l":"LA lawyer","d":"Practises law in Los Angeles. A hard decade at home: a divorce in 1953 and the death of his young son."},{"a":1962,"b":1978,"l":"Own firm + fund","d":"Founds the law firm now called Munger, Tolles & Olson and runs his partnership, Wheeler, Munger & Co. (1962-75). Stops practising law in 1965."},{"a":1978,"b":2023,"l":"Berkshire vice chair","d":"Buffett's partner for 45 years. Also chairs Wesco Financial (1984-2011) and Daily Journal (1977-2022) and sits on Costco's board from 1997."}],"B":[{"a":1930,"b":1942,"l":"Omaha boyhood","d":"Grows up in Omaha in the Depression, selling gum, Coke and magazines and reading every money book he can find."},{"a":1943,"b":1947,"l":"Teen in D.C.","d":"His father is in Congress, so the family lives in Washington. Paper routes, a pinball business and a small farm."},{"a":1947,"b":1950,"l":"Wharton, Nebraska","d":"Two years at Wharton, then a business degree from the University of Nebraska at 19."},{"a":1950,"b":1951,"l":"Columbia","d":"Studies under Benjamin Graham and David Dodd at Columbia Business School."},{"a":1951,"b":1954,"l":"Omaha broker","d":"Sells securities at his father's firm, Buffett-Falk & Co."},{"a":1954,"b":1956,"l":"Graham-Newman","d":"Works for Graham in New York until Graham retires."},{"a":1956,"b":1969,"l":"Partnership","d":"Runs the Buffett partnerships from Omaha: 29.5% a year before fees, against 7.4% for the Dow."},{"a":1970,"b":2025,"l":"Berkshire chair + CEO","d":"Chairman from 1970 (in control since 1965) and chief executive until the end of 2025."},{"a":2026,"b":2026,"l":"Chair, then emeritus","d":"Chairman while Greg Abel is CEO; chairman emeritus from September 2026."}],"L":[{"a":1944,"b":1961,"l":"Newton boyhood","d":"Grows up near Boston. His father dies when he is 10; from 11 he caddies at Brae Burn Country Club."},{"a":1961,"b":1965,"l":"Boston College","d":"On a caddie scholarship. Studies history,
