wer early. Slow down before a big decision.","co":[]},"t8n9":{"id":"t8n9","theme":"t8","tags":"PHM 2005","units":["phm2005"],"lead":"Overoptimism.","text":"People expect better outcomes than the odds support. The antidote is habitual use of simple probability.","co":[]},"t8n10":{"id":"t8n10","theme":"t8","tags":"PHM 2005","units":["phm2005"],"lead":"Vivid is not important.","text":"What comes to mind easily gets too much weight. Look for the evidence that is dull but large.","co":[]},"t8n11":{"id":"t8n11","theme":"t8","tags":"PHM 2005","units":["phm2005"],"lead":"Crowds and authority.","text":"People copy others and defer to authority, most of all when confused or rushed. Those are the moments to slow down.","co":[]},"t9n1":{"id":"t9n1","theme":"t9","tags":"USC 1994","units":["usc1994"],"lead":"The great businesses did it.","text":"He said the great bulk of their money came from the great businesses.","co":[]},"t9n2":{"id":"t9n2","theme":"t9","tags":"USC 1994","units":["usc1994"],"lead":"Bet heavily when the odds are clear.","text":"The wise ones bet heavily when the world offers them the opportunity. The rest of the time, they wait.","co":[]},"t9n3":{"id":"t9n3","theme":"t9","tags":"USC 1994","units":["usc1994"],"lead":"Twenty punches.","text":"Imagine a ticket with only 20 slots for every investment you will ever make. You would think hard and bet big on each one.","co":[]},"t9n4":{"id":"t9n4","theme":"t9","tags":"USC 1994","units":["usc1994"],"lead":"Quality compounds.","text":"Over long periods a share earns roughly what the business earns. A business earning 18% on capital for 20 or 30 years gives a fine result even bought at an expensive-looking price.","co":[]},"t9n5":{"id":"t9n5","theme":"t9","tags":"USC 1994","units":["usc1994"],"lead":"Taxes favour sitting.","text":"The way income tax works alone gives a large edge to holding for a long time.","co":[]},"t9n6":{"id":"t9n6","theme":"t9","tags":"USC 1994","units":["usc1994"],"lead":"The industry adds nothing, net.","text":"The investment management business as a whole adds no value for all its clients combined. A select few managers can.","co":[]},"t9n7":{"id":"t9n7","theme":"t9","tags":"Almanack","units":["almanack"],"lead":"Opportunity cost.","text":"Judge every use of money against the next-best use available.","co":[]},"t9n8":{"id":"t9n8","theme":"t9","tags":"Almanack","units":["almanack"],"lead":"Resist the urge to act.","text":"Patience means resisting the natural human bias to do something.","co":[]},"t9n9":{"id":"t9n9","theme":"t9","tags":"Foundations 1998","units":["foundations1998"],"lead":"Concentration can be rational.","text":"Someone with nearly all their wealth held long-term in three fine companies is securely rich. Heavy concentration can be a rational choice.","co":[]},"t9n10":{"id":"t9n10","theme":"t9","tags":"Wesco 1996","units":["wesco1996"],"lead":"Lumpy results are the price.","text":"In super-cat reinsurance, huge swings in annual results, including some very unpleasant years, are inevitable. Judge it over many years.","co":[]},"t9n11":{"id":"t9n11","theme":"t9","tags":"USC 1994","units":["usc1994"],"lead":"Need less.","text":"In a 2006 note he worried about institutions imitating Harvard and Yale's investing out of envy, and favoured reducing one's perceived needs over taking more risk.","co":["Harvard and Yale endowments"]},"t9n12":{"id":"t9n12","theme":"t9","tags":"BRK 2014","units":["brk2014"],"lead":"Omissions cost most.","text":"Among Berkshire's mistakes he named the failure to buy Walmart early.","co":["Walmart","Berkshire Hathaway"]},"t10n1":{"id":"t10n1","theme":"t10","tags":"USC 1994","units":["usc1994"],"lead":"Scale isn't enough.","text":"Sears's advantages of scale did not stop it losing heavily to Walmart. Bureaucracy did Sears terrible damage.","co":["Sears","Walmart"]},"t10n2":{"id":"t10n2","theme":"t10","tags":"USC 1994","units":["usc1994"],"lead":"Who keeps the gain?","text":"In a commodity business, the advantages of great improvements flow through to customers, not to owners.","co":[]},"t10n3":{"id":"t10n3","theme":"t10","tags":"USC 1994","units":["usc1994"],"lead":"Razor and blades.","text":"Gillette began selling blades in multiple packages, with the razor handle a one-time purchase. Repeat purchases built the business.","co":["Gillette"]},"t10n4":{"id":"t10n4","theme":"t10","tags":"USC 1994","units":["usc1994"],"lead":"A gem under the mess.","text":"GEICO had a magnificent business submerged in a mess, but still working. Clearing the mess released its value.","co":["GEICO"]},"t10n5":{"id":"t10n5","theme":"t10","tags":"Practical 1996","units":["practical1996"],"lead":"Coca-Cola from scratch.","text":"It is 1884 in Atlanta. You have $2 million and must build a business worth $2 trillion. How would you do it?","co":["Coca-Cola"]},"t10n6":{"id":"t10n6","theme":"t10","tags":"Practical 1996","units":["practical1996"],"lead":"Start from the arithmetic.","text":"He set the target first: 2.92 trillion eight-ounce servings in 2034. Netting 4¢ a serving would earn $117 billion. The numbers show what the business must become.","co":[]},"t10n7":{"id":"t10n7","theme":"t10","tags":"Practical 1996","units":["practical1996"],"lead":"Many factors at once.","text":"A strong trademark, Pavlovian conditioning, social proof and being always available, all working together.","co":[]},"t10n8":{"id":"t10n8","theme":"t10","tags":"Practical 1996","units":["practical1996"],"lead":"Owners can wreck a brand.","text":"With New Coke, the company's own executives came to the brink of destroying the most valuable trademark in the world.","co":["Coca-Cola"]},"t10n9":{"id":"t10n9","theme":"t10","tags":"Blue Chip 1982","units":["bluechip1982"],"lead":"Inflation sorts businesses.","text":"Some businesses produce little cash even when volume holds steady. Borrowing short and lending long, the savings and loan model, can stop working and go into reverse.","co":["Savings and loans"]},"t10n10":{"id":"t10n10","theme":"t10","tags":"Wesco 1985","units":["wesco1985"],"lead":"No jewel.","text":"He told owners plainly that his savings and loan, as it then had to be run, was no jewel. Careful operators in that business earned very modest returns.","co":["Savings and loans"]},"t10n11":{"id":"t10n11","theme":"t10","tags":"Wesco 1985","units":["wesco1985"],"lead":"Owners and managers.","text":"In that industry, managers were mostly not owners, and their rewards were tied to size and recent numbers.","co":[]},"t10n12":{"id":"t10n12","theme":"t10","tags":"Wesco 2006","units":["wesco2006"],"lead":"A weaker vehicle, said plainly.","text":"Each dollar of Wesco's book value, he wrote, gave much less intrinsic value than a dollar at Berkshire.","co":["Berkshire Hathaway","Wesco Financial"]},"t10n13":{"id":"t10n13","theme":"t10","tags":"PHM 2005","units":["phm2005"],"lead":"Respect rivals you dislike.","text":"People underrate both the competence and the morals of competitors they dislike.","co":[]},"t11n1":{"id":"t11n1","theme":"t11","tags":"Foundations 1998","units":["foundations1998"],"lead":"Layers of consultants.","text":"Large institutions hired consultants to choose managers, adding layers with perverse incentives and little clear benefit.","co":[]},"t11n2":{"id":"t11n2","theme":"t11","tags":"Foundations 1998","units":["foundations1998"],"lead":"Three per cent a year.","text":"Counting every layer, total investment costs could easily reach 3% of a foundation's net worth each year.","co":[]},"t11n3":{"id":"t11n3","theme":"t11","tags":"Foundations 1998","units":["foundations1998"],"lead":"Half must be below the median.","text":"After the croupiers' take, exactly half of investors get a below-median result. Yet nearly every expert says he is above average.","co":[]},"t11n4":{"id":"t11n4","theme":"t11","tags":"Foundations 1998","units":["foundations1998"],"lead":"Leverage plus overconfidence.","text":"Long-Term Capital Management collapsed through overconfidence in its highly leveraged methods.","co":["Long-Term Capital Management"]},"t11n5":{"id":"t11n5","theme":"t11","tags":"Foundations 1998","units":["foundations1998"],"lead":"Indexing for the average foundation.","text":"He judged indexing a wiser choice for the average foundation than what it was doing.","co":[]},"t11n6":{"id":"t11n6","theme":"t11","tags":"Roundtable 2000","units":["roundtable2000"],"lead":"Febezzle.","text":"The economist J. K. Galbraith wrote of the 'bezzle', wealth that has been embezzled but not yet missed. Munger coined 'febezzle' for wealth quietly lost to wasteful investment fees.","co":[]},"t11n7":{"id":"t11n7","theme":"t11","tags":"Roundtable 2000","units":["roundtable2000"],"lead":"Switching is expensive.","text":"Constantly pulling money from lagging managers is folly. He put investors' real performance lag at over 5% of assets a year.","co":[]},"t11n8":{"id":"t11n8","theme":"t11","tags":"Roundtable 2000","units":["roundtable2000"],"lead":"Wealth effects.","text":"Rising share prices make people feel and spend as if richer, which he warned could produce much mischief.","co":[]},"t12n1":{"id":"t12n1","theme":"t12","tags":"Scandal 2000","units":["scandal2000"],"lead":"A parable written in 2000.","text":"He imagined Quant Tech, a prosperous company whose founder died in 1982, and traced how the managers who followed him ruined it by chasing reported earnings.","co":["Quant Tech (fictional)"]},"t12n2":{"id":"t12n2","theme":"t12","tags":"Scandal 2000","units":["scandal2000"],"lead":"Options counted as free.","text":"Because share options were not counted as a cost, managers could add phony earnings to real ones.","co":[]},"t12n3":{"id":"t12n3","theme":"t12","tags":"Scandal 2000","units":["scandal2000"],"lead":"Dollops.","text":"A moderate dollop of phony earnings each year is less likely to be noticed than one large one.","co":[]},"t12n4":{"id":"t12n4","theme":"t12","tags":"Scandal 2000","units":["scandal2000"],"lead":"A chain letter inside.","text":"Inflated earnings brought a Ponzi or chain-letter effect into the share price, rewarding present holders at later buyers' expense.","co":[]},"t12n5":{"id":"t12n5","theme":"t12","tags":"Scandal 2000","units":["scandal2000"],"lead":"Professions pay the bill.","text":"After the scandal, the public turned hard against the professions that had made it possible.","co":[]},"t12n6":{"id":"t12n6","theme":"t12","tags":"Blue Chip 1982","units":["bluechip1982"],"lead":"Write for the absent owner.","text":"Each year they tried to tell shareholders what they would want to be told if the roles were reversed.","co":[]},"t12n7":{"id":"t12n7","theme":"t12","tags":"Blue Chip 1982","units":["bluechip1982"],"lead":"Repeat what matters.","text":"Repetition is right where facts stay true and analytically important over many years.","co":[]},"t12n8":{"id":"t12n8","theme":"t12","tags":"Wesco 1985","units":["wesco1985"],"lead":"Flag the unusual.","text":"He labelled a large gain as highly unusual and not likely to recur.","co":[]},"t12n9":{"id":"t12n9","theme":"t12","tags":"Wesco 1996","units":["wesco1996"],"lead":"Book profit when it is earned.","text":"Super-cat underwriting profit was recognised only after the contracts expired.","co":[]},"t12n10":{"id":"t12n10","theme":"t12","tags":"Wesco 2006","units":["wesco2006"],"lead":"Ignore the windfall.","text":"He told owners to ignore a large non-cash investment gain when judging the year's earnings.","co":[]},"t13n1":{"id":"t13n1","theme":"t13","tags":"HS 1986","units":["hs1986"],"lead":"Don't stay down.","text":"Staying down after a setback was on his list of routes to misery.","co":[]},"t13n2":{"id":"t13n2","theme":"t13","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Unfair blows will come.","text":"Life is very likely to deliver terrible, unfair blows. Some people recover and others do not. He cited Epictetus on using each setback well.","co":[]},"t13n3":{"id":"t13n3","theme":"t13","tags":"USC Law 2007","units":["usclaw2007"],"lead":"Assiduity.","text":"He liked the word because it meant sitting down and staying there until the job is done.","co":[]},"t13n4":{"id":"t13n4","theme":"t13","tags":"PHM 2005","units":["phm2005"],"lead":"Losses bite harder.","text":"Losses and near misses provoke outsized reactions. The most addictive forms of gambling are built on near misses.","co":[]},"t13n5":{"id":"t13n5","theme":"t13","tags":"PHM 2005","units":["phm2005"],"lead":"Small steps go unnoticed.","text":"Change that arrives in small steps escapes notice, because each step is a small contrast with the last.","co":[]},"t14n1":{"id":"t14n1","theme":"t14","tags":"BRK 2014","units":["brk2014"],"lead":"Four causes.","text":"He credited the constructive peculiarities of Buffett, the constructive peculiarities of the Berkshire system, good luck, and the intense devotion of some shareholders and admirers.","co":["Berkshire Hathaway"]},"t14n2":{"id":"t14n2","theme":"t14","tags":"BRK 2014","units":["brk2014"],"lead":"Focus, kept for 50 years.","text":"Buffett's decision to limit himself to a few kinds of activity, and keep at them for 50 years, worked like a lollapalooza. Munger compared it to Roger Federer's tennis.","co":[]},"t14n3":{"id":"t14n3","theme":"t14","tags":"BRK 2014","units":["brk2014"],"lead":"Each company keeps its own systems.","text":"There is no group-wide personnel, stock option, incentive or retirement system. Subsidiaries run their own.","co":[]},"t14n4":{"id":"t14n4","theme":"t14","tags":"BRK 2014","units":["brk2014"],"lead":"Keep head office small.","text":"Buffett set out to minimise the bad effects that almost always come from a large bureaucracy at headquarters.","co":[]},"t14n5":{"id":"t14n5","theme":"t14","tags":"BRK 2014","units":["brk2014"],"lead":"Win/win.","text":"He wanted win/win results everywhere, for instance gaining loyalty by giving it.","co":[]},"t14n6":{"id":"t14n6","theme":"t14","tags":"BRK 2014","units":["brk2014"],"lead":"A narrow job at the top.","text":"The chairman keeps few tasks: managing nearly all the security investments, writing a long, useful letter as he would want it as a passive shareholder, answering questions for hours, and admiring what others achieve.","co":[]},"t14n7":{"id":"t14n7","theme":"t14","tags":"BRK 2014","units":["brk2014"],"lead":"Rare elsewhere.","text":"No other large company he knew had half these elements. Most have heavy bureaucracy and chief executives who arrive at about 59 and are soon retired by an age limit.","co":[]},"t14n8":{"id":"t14n8","theme":"t14","tags":"BRK 2014","units":["brk2014"],"lead":"Successors.","text":"He named Ajit Jain and Greg Abel as proven performers.","co":[]}},"quotes":[{"id":"q-usc1994","unit":"usc1994","label":"USC 1994","text":"To the man with only a hammer, every problem looks like a nail.","theme":"t1"},{"id":"q-hls1998","unit":"hls1998","label":"HLS 1998","text":"Broadscale problems, by definition, cross many academic disciplines.","theme":"t1"},{"id":"q-hs1986","unit":"hs1986","label":"HS 1986, quoting Jacobi","text":"Invert, always invert.","theme":"t2"},{"id":"q-phm2005","unit":"phm2005","label":"PHM 2005","text":"Incentives are superpowers.","theme":"t3"},{"id":"q-usclaw2007","unit":"usclaw2007","label":"USC Law 2007","text":"Generally speaking, envy, resentment, revenge, and self-pity are disastrous modes of thought.","theme":"t5"},{"id":"q-stanford1996","unit":"stanford1996","label":"Stanford 1996","text":"Don't sell anything you wouldn't buy yourself.","theme":"t6"},{"id":"q-ucsb2003","unit":"ucsb2003","label":"UCSB 2003, explaining why, with no economics training, he would lecture economists","text":"The answer is I have a black belt in chutzpah.","theme":"t8"},{"id":"q-foundations1998","unit":"foundations1998","label":"Foundations 1998, on the view that wide diversification is a must","text":"I think the orthodox view is grossly mistaken.","theme":"t9"},{"id":"q-wesco1996","unit":"wesco1996","label":"Wesco 1996","text":"super-cat reinsurance is not for the faint of heart","theme":"t9"},{"id":"q-scandal2000","unit":"scandal2000","label":"Scandal 2000, the old saying he applies to compliant accountants","text":"Whose bread I eat, his song I sing.","theme":"t12"},{"id":"q-bluechip1982","unit":"bluechip1982","label":"Blue Chip 1982","text":"if the roles were reversed and we were passive investors","theme":"t12"},{"id":"q-brk2014","unit":"brk2014","label":"BRK 2014","text":"the weirdly intense, contagious devotion of some shareholders","theme":"t14"}],"mistakes":[],"tendencies":[{"n":1,"name":"Reward- and punishment-superresponse","what":"Incentives move people more than they expect.","guard":"Get incentives right; distrust paid advice."},{"n":2,"name":"Liking/loving","what":"We favour those we like and overlook their faults.","guard":"Admire the right people; see them clearly."},{"n":3,"name":"Disliking/hating","what":"We ignore the merits of those we dislike.","guard":"Judge disliked rivals fairly."},{"n":4,"name":"Doubt-avoidance","what":"We rush to any answer to end uncertainty.","guard":"Slow down; hear both sides."},{"n":5,"name":"Inconsistency-avoidance","what":"We cling to past conclusions and habits.","guard":"Seek evidence against yourself; stop bad habits early."},{"n":6,"name":"Curiosity","what":"The urge to know, mostly a help.","guard":"Feed it for life."},{"n":7,"name":"Kantian fairness","what":"We expect fair treatment and resent its absence.","guard":"Design arrangements that feel fair."},{"n":8,"name":"Envy/jealousy","what":"Others' gains provoke conflict.","guard":"Name it in yourself; allow for it in others."},{"n":9,"name":"Reciprocation","what":"We return favours and hostility automatically.","guard":"Delay angry replies; refuse gifts that buy judgment."},{"n":10,"name":"Influence-from-mere-association","what":"We credit or blame whatever sits near an outcome.","guard":"Check past wins for luck; welcome bad news."},{"n":11,"name":"Simple, pain-avoiding psychological denial","what":"We bend facts that hurt.","guard":"Face reality; avoid habits that feed denial."},{"n":12,"name":"Excessive self-regard","what":"We overrate ourselves and what is ours.","guard":"Trust records over impressions."},{"n":13,"name":"Overoptimism","what":"We expect better than the odds.","guard":"Use simple probability."},{"n":14,"name":"Deprival-superreaction","what":"Losses and near misses hurt far more than gains please.","guard":"Watch for irrational fights over small losses."},{"n":15,"name":"Social-proof","what":"We copy others, most of all when confused.","guard":"Be wary when everyone agrees and you are rushed."},{"n":16,"name":"Contrast-misreaction","what":"We judge by nearby comparisons.","guard":"Measure against absolute worth."},{"n":17,"name":"Stress-influence","what":"Heavy stress distorts thinking.","guard":"Decide big things when calm."},{"n":18,"name":"Availability-misweighing","what":"Vivid, recent facts get too much weight.","guard":"Use a checklist; seek the dull, large facts."},{"n":19,"name":"Use-it-or-lose-it","what":"Unpractised skills fade.","guard":"Practise to fluency."},{"n":20,"name":"Drug-misinfluence","what":"Chemicals distort judgment.","guard":"Avoid them."},{"n":21,"name":"Senescence-misinfluence","what":"Age makes new complex skills harder.","guard":"Keep learning; learn hard things early."},{"n":22,"name":"Authority-misinfluence","what":"We obey authority even when it is wrong.","guard":"Choose leaders carefully; question orders."},{"n":23,"name":"Twaddle","what":"Empty talk crowds out real work.","guard":"Keep it away from serious tasks."},{"n":24,"name":"Reason-respecting","what":"We comply when given reasons, even weak ones.","guard":"Give real reasons; test the reasons you are given."},{"n":25,"name":"Lollapalooza","what":"Several tendencies acting together cause extreme results.","guard":"Look for confluences, the source of most disasters."}],"plan":[{"n":1,"label":"Latticework","themes":["t1"],"units":["usc1994"],"extra":""},{"n":2,"label":"Invert","themes":["t2"],"units":["hs1986"],"extra":""},{"n":3,"label":"Incentives","themes":["t3"],"units":["phm2005"],"extra":"In the misjudgment talk, read tendencies 1 to 12."},{"n":4,"label":"Misjudgment","themes":["t4"],"units":["phm2005"],"extra":"In the misjudgment talk, read tendencies 13 to 25."},{"n":5,"label":"The inner life","themes":["t5"],"units":["usclaw2007"],"extra":""},{"n":6,"label":"Reliability and trust","themes":["t6"],"units":["stanford1996"],"extra":""},{"n":7,"label":"Learning for life","themes":["t7"],"units":["hls1998"],"extra":""},{"n":8,"label":"Objectivity","themes":["t8"],"units":["ucsb2003"],"extra":""},{"n":9,"label":"Investing","themes":["t9"],"units":["almanack","wesco1996"],"extra":""},{"n":10,"label":"Business models","themes":["t10"],"units":["practical1996","bluechip1982","wesco1985"],"extra":""},{"n":11,"label":"Costs and accounting","themes":["t11","t12"],"units":["foundations1998","roundtable2000","scandal2000"],"extra":""},{"n":12,"label":"Adversity; Berkshire","themes":["t13","t14"],"units":["brk2014","wesco2006"],"extra":""}],"selftest":["Explain the latticework idea to a teenager, with one example.","Use inversion on a real problem: list how to fail, then the plan.","Name five of the 25 tendencies and give a recent example of each.","What is lollapalooza, and why is it the most dangerous tendency?","Which four modes of thought did he call disastrous, and why?","State his three rules for a career.","Why do learning machines overtake cleverer people?","What is the twenty-slot ticket, and what does it change?","Why do improvements in a commodity business often fail to help its owners?","What is febezzlement? Give an example from your own costs.","What made Berkshire's system work, in his four causes?","Write one page, in his blunt style, of advice to your younger self."],"sourcesNote":"The talks are read from Poor Charlie's Almanack, the collection of Munger's talks edited by Peter D. Kaufman, in the Stripe Press edition, which the publisher has put online in ful
